# cargo-nextest configuration.
#
# Three jobs, and deliberately nothing else:
#
#   1. Keep the slow marks visible to the end of the run. Locally a slow test
#      is annotated, not terminated; the CI profile terminates at measured
#      bounds (each derived from recorded runs below) so a hung test releases
#      its runner instead of holding it to the job timeout.
#   2. Bound the two known co-scheduling hazards — the fault-matrix chunk tests,
#      which each fork real `cargo` invocations of their own, and the suites
#      that share a single Postgres database or MinIO bucket.
#   3. Give CI a profile that finishes the whole run rather than stopping at
#      the first failure, and that refuses to launder a flaky pass into a
#      green run.
#
# Everything else stays at nextest's defaults on purpose.

# Suites that talk to the one Postgres database / MinIO bucket that a run
# stands up. They are not isolated from each other: the `lash-internal-postgres-store`
# binaries below truncate every `lash_*` table on the configured database, the
# `lash-sim` cross-backend differential compares against those same tables, and
# the `lash-internal-s3-store` MinIO tests share one bucket. Today they interlock by
# hand, holding a session-level Postgres advisory lock
# (`SHARED_DATABASE_LOCK_KEY`) across process boundaries, which under
# process-per-test means every waiter burns a test slot doing nothing but
# blocking. `max-threads = 1` makes that serialization the runner's job, so
# the slots stay free for the rest of the workspace.
#
# Scope note, so the group is not mistaken for a CI win it does not currently
# deliver: every nextest call site today runs service-less (the workspace job in
# `.github/workflows/ci.yml` and `scripts/push-gate.sh`, which unsets
# `LASH_POSTGRES_DATABASE_URL` outright), so these tests all self-skip and the
# group does nothing there. The jobs that do have services — `Test Postgres
# store`, `Test S3 store` — run `cargo test`, not nextest. The group pays off
# for a developer running the workspace with a database URL set, and is the
# shape those service jobs need the day they move to nextest.
#
# Deliberately NOT in this group: `lash-sim`'s Postgres-backed unit tests
# (`crates/lash-sim/src/postgres_test_isolation.rs`) and anything else built on
# `IsolatedDatabase`, plus the three `lash-internal-postgres-store` binaries excluded by
# name below — those provision a database or a UUID-named scratch schema per
# test (`crates/lash-postgres-store/tests/schema_drift/harness.rs`) and have
# nothing to serialize against. Serializing them was measured at 7.7s -> 31.0s
# for zero isolation gain.
[test-groups.docker-services]
max-threads = 1

# Two chunk tests still overlap their real-cargo probes, preserving the measured
# shard win, while bounding contention on their shared CARGO_TARGET_DIR.
[test-groups.fault-matrix-real-cargo]
max-threads = 2

[profile.default]
# Report-only, and at nextest's own 60s slow mark: raising the period would buy
# quieter output by making the 60-120s band invisible, which is the band worth
# seeing. Nothing is killed either way — there is no `terminate-after` here —
# so the only thing this profile changes is that the slow marks survive to the
# end-of-run summary rather than scrolling past mid-run.
final-status-level = "slow"

# Each fault-matrix chunk test spawns real `cargo test -p ... -- --list`
# probes. The chunks usefully overlap, but all share one CARGO_TARGET_DIR, so
# cap the group at two rather than reserving the whole runner for a cheap fake
# gate test or letting all five contend on Cargo's build lock at once.
[[profile.default.overrides]]
filter = '''
  package(lash-internal-core)
  & test(/runtime::tests::runtime_scenarios::fault_matrix::durable_fault_matrix_real_cargo_filters_chunk_.*/)
'''
test-group = "fault-matrix-real-cargo"

# Membership of the shared-service group, narrowed to the binaries that
# actually contend: unit tests which never open a connection stay parallel, and
# so do the integration binaries that provision their own scratch schema.
[[profile.default.overrides]]
filter = '''
    (
      package(lash-internal-postgres-store) & kind(test)
      & !(
          binary(schema_drift)
        + binary(preflight_durable_walk)
        + binary(preflight_schema_status)
      )
    )
  + (package(lash-sim) & binary(cross_backend_store_differential))
  + (package(lash-runtime) & test(agent_scenarios::process_parent_atomicity::))
  + (package(lash-internal-s3-store) & test(minio))
'''
test-group = "docker-services"

[profile.ci]
# The per-push profile. Only the Cargo-owned heavy set is excluded here: the
# five fault-matrix chunk tests, each a 3-9 minute serial run that forks real
# `cargo` invocations of its own, run by the trunk-only `Test heavy suites` CI
# job under `profile.ci-heavy`. The lash-sim runner/minimizer fixture cases are
# no longer excluded: they are deterministic compute, so the Bazel partition
# executes them as cached actions on every trusted event and hiding them here
# would leave the Cargo path (untrusted forks) with no run of them at all. The
# trybuild `ui` binary is excluded WITHOUT a heavy-side run: the
# `Seal-test the API surface` step in the test-doc job already runs the same
# suite on every push, so a workspace-side run would be a second report of the
# same defect. Keep this expression and the `ci-heavy` default-filter exact
# complements over the heavy set.
#
# Trusted main CI runs this profile only for the agent-workbench binary, whose
# Node.js browser projection gate keeps it Cargo-owned
# (`tools/bazel/workbench_nextest_filter.txt`). Fork and Dependabot pull
# requests omit that expression and therefore retain this profile's
# full-workspace behavior.
default-filter = '''
  not (
      (
        package(lash-internal-core)
        & test(/runtime::tests::runtime_scenarios::fault_matrix::durable_fault_matrix_real_cargo_filters_chunk_.*/)
      )
    + (package(lash-runtime) & binary(ui))
  )
'''
# One failing test must never hide the rest of the suite (the alpha.82 lesson,
# recorded at the workspace invocation in ci.yml). The job passes `--no-fail-fast`
# explicitly and keep doing so; this makes the same answer the profile's
# default, so a CI nextest call that forgets the flag still reports in full.
fail-fast = false
# A test that only passes on retry is still a defect. Nothing in this file sets
# `retries`, so this is a standing guard rather than a counterweight: should a
# retry ever be added here, it must first earn a `.github/test-quarantines.json`
# entry (ADR 0008), and even then a flaky outcome fails the run.
flaky-result = "fail"

# CI bounds an ordinary test at five minutes: the baseline P99 was 1.209s and
# the slowest completed non-special test was 42.729s. A slow test is still a
# failure when this bound is reached; termination releases the workspace job.
# Keep the local default report-only so developers retain the full diagnostic
# run for tests whose cost depends on a warm or service-backed workspace.
slow-timeout = { period = "300s", terminate-after = 1 }

# The Unicode RGI tests are the longest ordinary tests (66.525s, 130.957s),
# so start them with the long tail while leaving the five-minute default
# termination bound intact.
[[profile.ci.overrides]]
filter = '''
  package(lash-regress)
  & binary(unicodesets)
  & test(/unicode_sets_rgi_emoji_.*/)
'''
priority = 97

# Generated simulation/minimizer cases: completed cold-run times were 182-418s,
# above the five-minute ordinary bound. They reach this profile only on the
# untrusted Cargo path (a fork or Dependabot pull request); trusted events run
# them as `//crates/lash-sim:lash-sim__unit_test`. Start them with the long tail
# and allow the measured 418.254s while still terminating a pathological run.
[[profile.ci.overrides]]
filter = '''
  package(lash-sim)
  & (
      test(runner::tests::generated_sim_profile_writes_trace_replay_and_provider_artifacts)
    + test(/minimize::tests::/)
  )
'''
priority = 98
slow-timeout = { period = "600s", terminate-after = 1 }

# The trunk-only heavy profile: the exact complement of `profile.ci`'s
# default-filter, minus the trybuild `ui` binary (whose per-push gate is the
# test-doc seal step, not this job). Run by the `Test heavy suites` job in
# `.github/workflows/ci.yml` on push and workflow_dispatch. Same failure
# semantics as `ci`: report the whole run, and a flaky pass is a failure.
#
# These five cases are the only tests Cargo still owns for their own sake: each
# forks a real `cargo test ... -- --list` against the workspace to prove the
# confidence gate's name filters still select tests, which is a claim about
# Cargo's selection and cannot be proved without Cargo. The Bazel label
# `//crates/lash-core:lash-core__unit_test` skips them by name for the same
# reason (see tools/bazel/generate_build_files.py).
[profile.ci-heavy]
fail-fast = false
flaky-result = "fail"
final-status-level = "slow"
default-filter = '''
  package(lash-internal-core)
  & test(/runtime::tests::runtime_scenarios::fault_matrix::durable_fault_matrix_real_cargo_filters_chunk_.*/)
'''

# Start the nested-Cargo fault probes first. Isolated runs measured 205-219s;
# a cold full-workspace run reached 1320s under nested-Cargo contention, so
# retain a 1500s ceiling without changing their existing two-thread group.
[[profile.ci-heavy.overrides]]
filter = '''
  package(lash-internal-core)
  & test(/runtime::tests::runtime_scenarios::fault_matrix::durable_fault_matrix_real_cargo_filters_chunk_.*/)
'''
priority = 100
slow-timeout = { period = "300s", terminate-after = 5 }
