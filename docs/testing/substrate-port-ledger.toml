# The substrate port ledger (ADR 0132 §14, FIG-5179).
#
# BEGIN SUMMARY (scripts/check-substrate-port-ledger.py --write-summary)
# 595 rows over 414 files, 2097 laws.
# By class: mechanical 104, semantic 99, delete 359, replace 33.
# By lane: L1b 11, L9b 61, L9c 90, L9d 53, L9e 72, L9f 22, L9g 64, L9h 30, L11 12, L8 1, L10a 179.
# By status: todo 584, ported 0, deleted 11.
#
# New laws owed (replace rows), by owning lane:
# - L8: runbooks/restate-postgres-workers/tests/process_operations_replacement.rs
#   a process's start key, feed and plugin state survive a node kill and resume on another node (lash-postgres-workers)
# - L9c: crates/lash-restate-test/tests/one_driver.rs
#   a host's send leaves the engine the only driver, an empty commit finishes the work without another admission, and inputs on both sides of it each run once
# - L9c: crates/lash-restate-test/tests/run_close.rs
#   the next run is admitted while the previous run's close is owed, and a close crashed after the next admission converges once
# - L9c: crates/lash-restate-test/tests/session_send.rs
#   session sends: an idle send is admitted at once, busy sends answer in arrival order, at most one drive is queued, withdraw-while-queued differs from cancel-while-running, and dropping a handle stops nothing
# - L9c: crates/lash-restate-test/tests/session_shifts.rs
#   a session actor runs every open item once, in arrival order and one at a time; a repeated request id is one drive; a crash at any commit label consumes each item once
# - L9c: crates/lash-restate/src/tests/otel_laws.rs::golden_tree_survives_replay_and_redrive
#   a turn's span tree is the golden tree after a kill and resume on another node
# - L9c: crates/lash-restate/src/tests/remote_turn_cancel.rs
#   a remote after-step stop waits for the turn's committed boundary
# - L9c: crates/lash-restate/src/tests/run_control_witnesses.rs::a_handle_naming_another_sessions_run_is_refused_for_good_with_its_code
#   a run handle naming another session's run is refused for good with its code
# - L9c: crates/lash-restate/src/tests/run_coordinator_on_the_double.rs
#   the RunCoordinator's round laws on phase rows: every admitted body enters before any completes, a committed final drains every lower rank first at every cut, a cancel during backoff starts no next body, the stream publishes only after presentation acceptance, admission ignores live isolation drift, Once never repeats, Repeatable admits only bounded ordinals after a known failure or slice timeout, and a current Once vetoes without upgrading stored Once
# - L9c: crates/lash-restate/src/tests/run_coordinator_on_the_double/aggregate.rs
#   aggregate rounds (all, race, any, settled) keep operand order, aliases and distinct rejections; a race returns before its inline loser and keeps it unconsumed; only logical closing cancels losers
# - L9c: crates/lash-restate/src/tests/run_coordinator_on_the_double/cold_selection.rs
#   a round resumed cold decides its durable attempts in acknowledgement order, and a served result wins over a fresh choice
# - L9c: crates/lash-restate/src/tests/singleton_tool_run_on_the_double.rs
#   a singleton tool run records its tool in the operation run, its logical receipts follow the recorded admission and protected presentation, cancelled spending calls keep their provider results, and an undeclared outcome is refused before anything it declared is realized
# - L9c: crates/lash-restate/src/tests/sync_hooks_retryable_faults.rs
#   an environment sync or assistant hook whose store call meets a transient fault retries the phase without recording it; a deterministic refusal is the phase's recorded outcome
# - L9c: crates/lash-restate/src/tests/turn_cancel_modes.rs
#   stop modes over a waiting turn: after-step lets a sleep, event wait or process await finish, immediate aborts it at wake, and escalating a deferred stop aborts the wait; the conformance turn_runner_tests re-instantiate (L9g)
# - L9d: crates/lash-restate-test/tests/admission_invariant.rs
#   a process whose verdict or start admission invariant fails ends Failed, typed
# - L9d: crates/lash-restate-test/tests/crash_windows/attachment_delivery.rs
#   a process start-input acquisition fault retries the same registered process, and a permanent incompatibility stays distinct from a gone source
# - L9d: crates/lash-restate-test/tests/crash_windows/journal_settlement_cleanup.rs
#   an artifact cleanup awaited by an unsettled run, process or session operation is retained until it settles and then released
# - L9d: crates/lash-restate-test/tests/process_successor_after_prune.rs
#   a process started with the start key of a pruned process is a new process with its own lifecycle
# - L9d: crates/lash-restate-test/tests/resource_capacity.rs
#   process and session lifecycles release their native resources when they end
# - L9d: crates/lash-restate/src/tests/declared_start_run_drain_on_the_double.rs::slow_or_timed_out_ordinary_work_is_never_rerun_as_a_process
#   ordinary tool work that is slow or timed out is never re-run as a process
# - L9d: crates/lash-restate/src/tests/declared_start_run_drain_on_the_double/terminal_failure.rs
#   a child run's failure reaches its awaiting parent as typed output
# - L9d: crates/lash-restate/src/tests/durable_wait_source_seal.rs::l02_l12_process_terminal_source_keeps_material_after_producer_pruning
#   a process-terminal wait source keeps its outcome after its producer is pruned
# - L9d: crates/lash-restate/src/tests/process_session_turn_laws.rs
#   a session-turn process (subagent) crashed at create, acceptance or final commit resumes once from its recorded creation config, keeps its durable rows when cancelled, and a child panic is typed while the parent lives
# - L9d: crates/lash-restate/src/tests/process_signal_admission.rs
#   a duplicate signal delivered after its wait advanced never resolves the next wait, and a signal resent with a changed payload is refused before resolution
# - L9d: crates/lash-restate/src/tests/process_source_wait_end.rs
#   a cancelled process source detaches without ending the process or accepting a late result, and a process result is held by its source until the logical run retires
# - L9d: crates/lash-restate/src/tests/process_start_store_refusals.rs
#   a typed store refusal at a process start's claim or settlement is the start's recorded outcome, and a transient store fault retries without being recorded
# - L9d: crates/lash-restate/src/tests/process_workflow.rs::opaque_process_infrastructure_failure_does_not_become_terminal_process_truth
#   an opaque infrastructure failure in a process activation is retried and never becomes the process's terminal
# - L9d: crates/lash-restate/src/tests/run_control_witnesses/process_run.rs
#   a live process keeps its child run, and a run admitted ahead of its own, until it is terminal; a terminal process releases them
# - L9d: crates/lash-restate/src/tests/store_fault_journaling.rs
#   a process step whose append or read meets a transient store fault is retried and never recorded as its answer; a typed refusal is its recorded answer
# - L9e: crates/lash-restate-test/tests/crash_windows/worker_crashes.rs
#   a VM worker crash during source analysis or compilation is never recorded as the cell's failure
# - L9e: crates/lash-restate-test/tests/crash_windows/worker_verdicts.rs
#   a refused cell reservation is never the cell's recorded result, and a spent worker CPU budget is never the process's terminal
# - L9e: crates/lash-restate/src/tests/process_recovery.rs
#   a process resumed on another node after its worker and registry reopen keeps its snapshot plugin options, lashlang admission codes and trigger binding, and a TypeScript artifact runs to its terminal
# - L9e: crates/lash-restate/src/tests/tool_context_conformance.rs
#   every registered first-party tool succeeds in every tool context (inline, cell, process) on the durable engine
# END SUMMARY
#
# Every test that uses the Restate server double (`lash_restate_test`), every
# Cargo.toml that depends on it and every test of the Restate crates has a row
# here: what it asserts, which lane ports or deletes it, and the written
# disposition of every law that is not ported. The Restate crates and the
# double are deleted (L10a); the laws recorded here are what the L9 lanes
# re-implement on the durable harness (lash-durable-test).
# scripts/check-substrate-port-ledger.py keeps it complete; `--final` proves
# nothing is left.
#
# A row is one test file (`test = "*"`), or one test function of a file whose
# tests differ in class; a function row overrides its file row for that test
# and the file row's laws leave it out.
#
# Fields:
# - path, test: the file, and "*" or the test function.
# - area: the domain the laws belong to; "support" rows hold no laws of their
#   own and stand for the tests that reach the double through them.
# - needs: what the durable harness must run: turn, round, wait, process,
#   cell, multinode.
# - class: mechanical (only the constructor and imports change), semantic
#   (Restate controls map onto the harness: a journal-point, BeforeRunResult,
#   AfterRunResult or server crash becomes a FaultStore cut at a commit label
#   or a SimNodes kill and resume; virtual time becomes SimClock; a forced-replay
#   leg becomes a kill-and-resume leg), delete (the subject is removed
#   machinery) or replace (a domain law whose only home is a deleted crate).
# - lane: who ports or deletes it. L1b deleted the SQLite multi-file layout's
#   own tests (FIG-5195). First matching rule: crates/lash-sim -> L9f;
#   conformance instantiation sites -> L9g; examples, lash-perf and the E2E
#   runner -> L9h; lash-upgrade-harness -> L11; the Restate runbook -> L8 for
#   its live rows, L10a for the rest; rows that need cells -> L9e; processes
#   -> L9d; other mechanical rows -> L9b, the rest -> L9c. The Restate crates'
#   own tests and every Cargo.toml dependency go to L10a, except their
#   conformance sites (L9g) and replace rows, which go to the lane that owns
#   the new law's area.
# - laws: the test names (macro-generated tests by their law function), or
#   the lash-conformance macros a site instantiates.
# - disposition: "port" for mechanical and semantic rows; for delete rows
#   "subject-deleted" or "covered-by:<law>"; for replace rows "owed" until the
#   new law exists, then "replaced-by:<new law path>". A <law> is a
#   repository path (with ::name), "planned:<ID>" from [planned] below, or
#   "row:<path>::<test>", another row whose laws (or owed law) cover it.
# - status: todo, ported or deleted. A lane that finishes a row sets ported
#   (the laws run on the durable harness) or deleted (with its disposition).
# - owed: the new law a replace row owes. note: why, where it helps.
#
# Removed machinery whose tests are deleted, not ported: journal indices and
# protocol messages, replay counts and journal epochs, generation lanes,
# segment cuts and hand-over, idempotent sends, Restate parks and pauses, the
# effect-seam wrappers, the determinism sentinel, the live Restate tier and
# the double itself.
#
# Scope: direct users only. A test file that reaches the double only through
# a support row's module has no row of its own; a lane that deletes such a
# file adds its row first.

