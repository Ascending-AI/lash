[package]
name = "agent-workbench"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
rust-version.workspace = true
publish = false

[lints]
workspace = true

# cargo-shear resolves `use` statements per crate directory and cannot see
# `examples/shared/ndjson.rs`, which `src/main.rs` pulls in with `#[path]`;
# that file is the only user of `bytes` here.
[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = "0.8"
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
chrono-tz = { workspace = true }
croner = { workspace = true }
dotenvy = "0.15"
futures-util = { workspace = true }
lash = { workspace = true, features = ["rlm", "restate", "sqlite", "postgres", "mcp", "subagents", "http-transport", "openai"] }
# Opt-in provider wire test fixtures; never selected by the teaching host.
lash-sim = { path = "../../crates/lash-sim", optional = true }
percent-encoding = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls", "http2"] }
rmcp = { workspace = true, features = ["elicitation", "macros", "server", "transport-io", "transport-streamable-http-server"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tracing-subscriber = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
http = "1"
http-body-util = { version = "0.1", features = ["channel"] }
lash = { workspace = true, features = ["rlm", "testing", "typescript"] }
# `testing` is a facade dev feature on purpose: it arms the loud assertions that
# turn an accidentally-exhausted Lashlang execution bound into a test failure.
# The judged host must not carry them — see `[profile.judged]` in the workspace
# manifest and the build-geometry rule in `runbooks/RULES.md`.
lash-restate-test = { workspace = true }
lash-sim = { path = "../../crates/lash-sim" }
sqlx = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
provider-wire-fixtures = ["dep:lash-sim"]
e2e-tools = ["lash/testing"]
