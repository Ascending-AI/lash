[package]
name = "docs-snippets"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false
description = "Executable sources for the Rust code blocks in docs/*.html. cargo test runs every core-building snippet; scripts/lint_docs.py fails when the HTML drifts from these files."

[features]
default = []

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
lash = { workspace = true, features = ["rlm", "otel-trace"] }
lash-remote-protocol = { workspace = true, features = ["core-conversions"] }
lash-restate = { workspace = true }
lash-plugin-mcp = { workspace = true, features = ["lashlang"] }
lash-postgres-store = { workspace = true }
lash-protocol-standard = { workspace = true }
lash-provider-openai = { workspace = true }
lash-s3-store = { workspace = true }
lash-sqlite-store = { workspace = true }
lash-subagents = { workspace = true }
lash-typescript = { workspace = true }
lashlang = { workspace = true }
rmp-serde = { workspace = true }
schemars = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
lash = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
