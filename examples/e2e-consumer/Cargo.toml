[package]
name = "e2e-consumer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Executing external Lash consumer for real-host contract acceptance"

[lints]
workspace = true

[dependencies]
lash = { workspace = true, features = ["sqlite", "postgres", "testing", "otel-trace", "rlm"] }
anyhow = { workspace = true }
axum = "0.8"
chrono = { workspace = true }
futures-util = { workspace = true }
opentelemetry_sdk = { version = "0.33", features = ["metrics"] }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
