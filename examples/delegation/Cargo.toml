[package]
name = "delegation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "A host-written delegation tool on the lash facade alone: spawn a child session with explicit creation input, run it, and route its result back to the parent turn."

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
lash = { workspace = true, features = ["rlm"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
lash = { workspace = true, features = ["rlm", "testing", "typescript"] }
tokio = { workspace = true, features = ["macros", "rt"] }
