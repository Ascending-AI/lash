[package]
name = "mcp-events"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "MCP event subscriptions on the lash facade alone: a host enables one server's events, subscribes a session, and every new event durably starts one turn."

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
lash = { workspace = true, features = ["mcp"] }
serde_json = { workspace = true }

[dev-dependencies]
lash = { workspace = true, features = ["mcp", "sqlite", "testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
