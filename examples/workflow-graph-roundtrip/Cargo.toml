[package]
name = "workflow-graph-roundtrip"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
axum = "0.8"
lash = { workspace = true, features = ["rlm", "typescript", "restate", "sqlite"] }
restate-sdk = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
thiserror = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
lash-restate-test = { workspace = true }
lash = { workspace = true, features = ["testing"] }
