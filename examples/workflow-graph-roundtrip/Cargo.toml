[package]
name = "workflow-graph-roundtrip"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
workflow-corpus = { path = "../workflows" }
anyhow = { workspace = true }
axum = "0.8"
chrono = { workspace = true }
lash = { workspace = true, features = ["codemode", "typescript", "python", "sqlite", "dialect-typescript", "dialect-python", "workflow-authoring"] }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
reqwest = { workspace = true, features = ["json", "rustls"] }
lash = { workspace = true, features = ["testing"] }
