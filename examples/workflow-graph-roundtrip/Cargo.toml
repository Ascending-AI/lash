[package]
name = "workflow-graph-roundtrip"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
axum = "0.8"
chrono = { workspace = true }
lash = { workspace = true, features = ["codemode", "typescript", "sqlite", "dialect-typescript"] }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
reqwest = { workspace = true, features = ["json", "rustls"] }
lash = { workspace = true, features = ["testing"] }
lash-kernel-dialect = { workspace = true }
lash-kernel-doc = { workspace = true }
lash-dialect-typescript = { workspace = true }
lash-dialect-python = { workspace = true }
lash-vm-worker = { workspace = true, features = ["dialect-typescript", "dialect-python"] }
swc_common = { workspace = true }
swc_ecma_ast = { workspace = true, features = ["serde-impl"] }
swc_ecma_parser = { workspace = true }
ruff_python_ast = { workspace = true }
ruff_python_parser = { workspace = true }
ruff_text_size = { workspace = true }
