<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lash · Workflow editor</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/editor.css" />
  </head>
  <body>
    <header>
      <a
        class="brand"
        href="/"
        aria-label="Lash workflows"
        >lash<span>✳</span></a
      ><span class="slash">/</span>
      <div class="workflow-name">
        <span class="eyebrow">PERSONAL WORKSPACE</span>
        <h1>Workflow editor</h1>
      </div>
      <span class="saved" id="revision">Connecting…</span
      ><button id="source-button" class="quiet" aria-label="Edit source">
        Edit source</button
      ><button id="run" class="primary" data-write>
        ▶ &nbsp; Run workflow
      </button>
    </header>
    <nav class="viewbar">
      <select id="example" aria-label="Example workflow"></select>
      <div class="segmented" role="group" aria-label="Source dialect">
        <button id="dialect-typescript" aria-pressed="true">TypeScript</button
        ><button id="dialect-python" aria-pressed="false">Python</button>
      </div>
      <select id="scope" aria-label="Canvas scope"></select>
      <div class="segmented layout-toggle" role="group" aria-label="Layout">
        <button data-layout="graph" aria-pressed="false">Graph</button
        ><button data-layout="split" aria-pressed="true">Split</button
        ><button data-layout="code" aria-pressed="false">Code</button>
      </div>
      <button id="history-button" class="quiet" aria-pressed="false">
        Trace</button
      ><span class="mock"><i></i> Mock connections</span>
    </nav>
    <main id="workspace" class="workspace" data-layout="split">
      <section class="canvas-area">
        <div
          id="viewport"
          class="viewport"
          aria-label="Workflow canvas"
          tabindex="0"
        >
          <div id="stage">
            <div id="scene">
              <svg id="wires" aria-hidden="true"></svg>
              <div id="flow"></div>
            </div>
          </div>
        </div>
        <div class="canvas-caption">
          <span class="eyebrow">WORKFLOW</span>
          <p>Connect values. Configure each step.</p>
          <span id="node-count"></span>
          <div class="canvas-legend">
            <span>Data</span><span>Execution order</span>
          </div>
        </div>
        <div class="canvas-tools">
          <button id="zoom-out" aria-label="Zoom out">−</button
          ><span id="zoom-label">100%</span
          ><button id="zoom-in" aria-label="Zoom in">+</button
          ><span class="tool-rule"></span
          ><button id="fit" aria-label="Fit workflow">Fit</button>
        </div>
        <button id="add-step" class="add-step" data-write>
          + &nbsp; Add step
        </button>
        <aside id="node-panel" hidden aria-label="Node settings">
          <div class="panel-top">
            <span id="panel-kicker" class="eyebrow">STEP SETTINGS</span
            ><button
              id="close-panel"
              class="quiet"
              aria-label="Close node settings"
            >
              ×
            </button>
          </div>
          <div id="node-form"></div>
        </aside>
        <div id="result" class="result" role="status" aria-live="polite"></div>
        <section id="trace" class="trace" hidden aria-label="Run trace">
          <div class="trace-top">
            <button id="trace-toggle" class="quiet" aria-expanded="true">
              Run trace</button
            ><span class="pill" id="run-status">Not started</span
            ><button id="approve" hidden>Approve request</button>
            <div class="scrubber">
              <button id="replay-back" class="quiet" aria-label="Step back">
                ‹</button
              ><input
                id="replay"
                type="range"
                min="0"
                max="0"
                value="0"
                disabled
                aria-label="Replay the run's path"
              /><button
                id="replay-forward"
                class="quiet"
                aria-label="Step forward"
              >
                ›</button
              ><span id="replay-label"></span>
            </div>
            <button id="clear-run" class="quiet">Clear run</button>
          </div>
          <div class="trace-body">
            <table>
              <thead>
                <tr>
                  <th>Time</th>
                  <th>Step</th>
                  <th>Tool</th>
                  <th>Result</th>
                  <th>Duration</th>
                </tr>
              </thead>
              <tbody id="trace-rows"></tbody>
            </table>
          </div>
        </section>
      </section>
      <div
        id="divider"
        class="divider-handle"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize graph and code"
        tabindex="0"
      ></div>
      <section id="code-pane" class="code-pane-area" aria-label="Workflow code">
        <div class="code-top">
          <div class="segmented" role="group" aria-label="Code view">
            <button data-code="source" aria-pressed="false">Source</button
            ><button data-code="printed" aria-pressed="false">
              Printed</button
            ><button data-code="kernel" aria-pressed="true">Kernel</button>
          </div>
          <span id="code-note" class="code-note"></span>
        </div>
        <div id="code-view" class="code-view" tabindex="0"></div>
      </section>
    </main>
    <dialog id="source-editor">
      <div class="dialog-top">
        <div><h2>Edit source</h2><p class="help">Rename, change code or declarations, then re-import the whole source.</p></div>
        <button data-close="source-editor" aria-label="Close source editor">×</button>
      </div>
      <section class="source-panel">
        <div class="button-row">
          <label for="source-kind">Source form</label><select id="source-kind"><option value="authored">Workflow module</option><option value="printed">Printed document</option></select>
          <label for="source-dialect">Language</label><select id="source-dialect"><option value="typescript">TypeScript</option><option value="python">Python</option></select>
        </div>
        <textarea id="source" aria-label="TypeScript source" spellcheck="false" wrap="off"></textarea>
        <div id="source-actions" class="button-row entry-row">
          <label for="entry">Entry function</label><input id="entry" value="demo" />
          <button id="import" data-write>Import TypeScript</button>
        </div>
      </section>
    </dialog>
    <dialog id="corpus-case" aria-labelledby="corpus-title">
      <div class="dialog-top"><h2 id="corpus-title">Corpus case</h2><button data-close="corpus-case" aria-label="Close corpus case">×</button></div>
      <p id="corpus-note" class="help"></p>
      <pre id="corpus-source" class="code-fragment"></pre>
      <pre id="corpus-witness" class="code-fragment"></pre>
    </dialog>
    <span id="admission" hidden></span>
    <script type="module" src="/editor.js"></script>
  </body>
</html>
