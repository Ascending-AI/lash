# Exclusions, admission floors and retired hash-domain reservations.
# All versioned surfaces declare version_surface and version_guard at their
# source constants; format_manifest names a facade variant or engine:<id>.

[[excluded_class]]
suffix = "_FAMILY_VERSION"
reason = "hash-domain family tag: an identity-preimage component, not a durable format stamp"

# Constants whose names look like versions but version nothing durable,
# and admission floors or aliases of a registered writer version. A floor that
# names its surface with `floor_of` is reset with it at the release cut.
[[unregistered]]
constant = "OLDEST_SUPPORTED_SESSION_STATE_VERSION"
constant_path = "crates/lash-core-store/src/store/state_version.rs"
reason = "lower bound of the admission window for the registered CURRENT_SESSION_STATE_VERSION, not a format of its own"
floor_of = "CURRENT_SESSION_STATE_VERSION"

[[unregistered]]
constant = "MIN_SUPPORTED_SCHEMA_VERSION"
constant_path = "crates/lash-postgres-store/src/lib.rs"
reason = "lower bound of the planner's window under the registered POSTGRES_SCHEMA_VERSION, not a format of its own"

[[unregistered]]
constant = "PROCESS_CURSOR_UNROUTED_EPOCH"
constant_path = "crates/lash-sansio/src/process_cursor.rs"
reason = "the reserved publisher-epoch value of a cursor minted with no live route; an epoch names a publisher lifetime, not a format"

[[unregistered]]
constant = "SCHEMA_VERSION"
constant_path = "crates/lash-postgres-store/src/lib.rs"
reason = "the registered POSTGRES_SCHEMA_VERSION in the stamp column's type: an alias, not a number of its own"

[[unregistered]]
constant = "APP_VERSION"
constant_path = "crates/lash-perf/src/main.rs"
reason = "mirrors the package version"

[[unregistered]]
constant = "LASHLANG_COMPILER_VERSION"
constant_path = "crates/lashlang/src/artifact.rs"
reason = "mirrors the package version"

[[unregistered]]
constant = "HISTORY_RECORD_VERSION"
constant_path = "crates/lash-perf/src/runtime_perf/duration_trend.rs"
reason = "versions lash-perf's own benchmark history records, developer tooling rather than state a lash build writes"

[[unregistered]]
constant = "MCP_PROTOCOL_VERSION"
constant_path = "crates/lash-plugin-mcp/src/host.rs"
reason = "pins an upstream protocol"

[[unregistered]]
constant = "ANTHROPIC_VERSION"
constant_path = "crates/lash-provider-anthropic/src/policy.rs"
reason = "pins an upstream protocol"

[[unregistered]]
constant = "CODE_ASSIST_API_VERSION"
constant_path = "crates/lash-provider-google/src/config.rs"
reason = "pins an upstream protocol"

[[unregistered]]
constant = "GENERATOR_VERSION"
constant_path = "crates/lash-sim/src/generator.rs"
reason = "versions a generated test artifact"

[[unregistered]]
constant = "SOURCE_CACHE_VERSION"
constant_path = "crates/lashlang/src/runtime/cache.rs"
reason = "identifies a process-local cache rather than a serialized shape"

[[unregistered]]
constant = "ERROR_VERSION"
constant_path = "crates/lash-core-execution/src/plugin/actions.rs"
reason = "plugin-owned per-operation error codec version supplied by each PluginOperation implementation, not a lash surface counter"

[[unregistered]]
constant = "ERROR_VERSION"
constant_path = "crates/lash-conformance/src/conformance/frame_open_redrive/host_commands.rs"
reason = "test-only operation error codec versions for the frame-open redrive conformance laws"

[[unregistered]]
constant = "ERROR_VERSION"
constant_path = "crates/lash-conformance/src/conformance/shift_admission.rs"
reason = "test-only operation error codec version for the shift-admission conformance laws"

[[unregistered]]
constant = "MIN_SUPPORTED_WORKER_PROTOCOL_VERSION"
constant_path = "crates/lash-vm-protocol/src/version.rs"
reason = "lower read bound for WORKER_PROTOCOL_VERSION, not a separately written format"

# BLAKE3 hash domains that are permanently reserved but no longer used: a
# retired name must never identify another format. The domains in use are the
# `lash*/vN` identity constants the release inventory resolves;
# `python3 scripts/release_baseline.py tables --write` generates
# crates/lash-sansio/src/blake3_domains.rs from both, and the release reset
# appends the names it supersedes here.

[[retired_hash_domain]]
name = "lash-tool-schema-cache/v2"
reason = "FIG-4663: admitted schemas own compiled validators, replacing the schema hash cache"

[[retired_hash_domain]]
name = "lash-process-env/v4"
reason = "superseded process-environment identity"

[[retired_hash_domain]]
name = "lash-process-env/v5"
reason = "superseded process-environment identity"

[[retired_hash_domain]]
