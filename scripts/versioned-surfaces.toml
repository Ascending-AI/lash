# ADR 0105 section 12 (FIG-3600 S5). Both handlers' requests carry the
# generation of the commands their journals lead with, and each handler
# refuses any other generation, terminally, before it journals anything. Any
# change to the request shapes, the handlers' leading commands or their order,
# or the keys they address bumps this constant. The kernel's recorded bodies
# are guarded by EFFECT_JOURNAL_VERSION. The generation sentinel's name and
# output are guarded; the drain generation's value is not (the engine's
# RestateConfig hands it in from formats::build_generation, and the sentinel's
# journal shape does not depend on it).
