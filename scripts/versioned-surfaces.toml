# The attempt capture rides `RuntimeEffectOutcome::ToolAttempt` — including the
# ungrouped arm — and is restored into the dispatch buffers when a recorded
# attempt replays, so a field added, retired or retyped changes what a replay
# can restore of what the attempt committed. It is guarded separately from the
# settlement because the two carriers move for different reasons, and it names
# the full serialized closure for the same reason the settlement does: the
# capture's `PluginMessage` rows reach the entire message/attachment/causal
# leaf set, and its `usage` list carries `ToolUsageDelta`/`TokenUsage` with no
# discriminant of their own.
[[surface.guard]]
