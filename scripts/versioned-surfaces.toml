# Versioned wire/persistence surface inventory for check_version_bumps.py.
#
# A `file` guard compares the complete file and may require literal
# `must_cover` markers. `rust_items` compares only the named Rust
# declarations/functions (comments and formatting are ignored).
# `rust_serde_shapes` compares every Serde-derived struct/enum in the matched
# source files and requires explicit `must_cover` anchors so detection cannot
# silently lose headline shapes. The latter intentionally fails closed for a
# few private helper carriers: changing one requires the family bump even if it
# later proves not to cross the boundary. Whole-file guards such as PostgreSQL's
# schema.sql inherently cover every table in that authoritative schema file.
#
# A surface's diagnostic key is `<constant_path>:<constant>`; use that key with
# `--surface` when constants such as SCHEMA_VERSION are not globally unique.
#
# Adding an entry here does not by itself excuse the bump its shape change
# would owe. A registration -- an entry whose constant arrives with it, over a
# shape that moves in the same change -- is burned one at a time into
# REGISTRATION_BASELINES in check_version_bumps.py, pinned to the surface key
# and to the exact guarded bytes enrolled. Registering without one fails, and
# names the fingerprint to burn.
#
# This check is deliberately CI-only, unlike the sibling PostgreSQL-payload and
# durable-read fixture checkers: its merge-base guarantee requires a current
# fetched target branch. PR protection must require an up-to-date merge ref or
# merge queue so independently landed version bumps cannot be hidden by a stale
# merge-base.

[[surface]]
constant = "REMOTE_PROTOCOL_VERSION"
constant_path = "crates/lash-remote-protocol/src/lib.rs"
description = "JSON wire structs and enums exchanged by Lash remote peers"

[[surface.guard]]
kind = "rust_serde_shapes"
paths = ["crates/lash-remote-protocol/src/*.rs"]
must_cover = ["RemoteLlmRequest", "RemoteProcessInput", "RemoteTurnEvent"]

[[surface]]
constant = "SCHEMA_VERSION"
constant_path = "crates/lash-postgres-store/src/lib.rs"
description = "PostgreSQL tables, indexes, constraints, and persisted column shapes"

# PostgreSQL's schema is intentionally a whole-file guard: schema.sql is the
# authoritative shape, so even a comment-only edit fails closed.
[[surface.guard]]
kind = "file"
paths = ["crates/lash-postgres-store/schema.sql"]
must_cover = [
  "CREATE TABLE IF NOT EXISTS lash_schema_versions",
  "CREATE TABLE IF NOT EXISTS lash_blobs",
  "CREATE TABLE IF NOT EXISTS lash_sessions",
  "CREATE TABLE IF NOT EXISTS lash_graph_nodes",
  "CREATE TABLE IF NOT EXISTS lash_session_meta",
  "CREATE TABLE IF NOT EXISTS lash_runtime_turn_commits",
  "CREATE TABLE IF NOT EXISTS lash_session_execution_leases",
  "CREATE TABLE IF NOT EXISTS lash_queued_work_batches",
  "CREATE TABLE IF NOT EXISTS lash_pending_turn_inputs",
  "CREATE TABLE IF NOT EXISTS lash_attachment_manifest",
  "CREATE TABLE IF NOT EXISTS lash_processes",
  "CREATE TABLE IF NOT EXISTS lash_process_events",
  "CREATE TABLE IF NOT EXISTS lash_process_wake_deliveries",
  "CREATE TABLE IF NOT EXISTS lash_trigger_subscriptions",
  "CREATE TABLE IF NOT EXISTS lash_trigger_occurrences",
  "CREATE TABLE IF NOT EXISTS lash_trigger_deliveries",
  "CREATE TABLE IF NOT EXISTS lash_runtime_effect_replay",
  "CREATE TABLE IF NOT EXISTS lash_await_event_waits",
  "CREATE TABLE IF NOT EXISTS lash_lashlang_artifacts",
]

