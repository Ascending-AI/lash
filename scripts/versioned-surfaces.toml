# The writers above spell a builtin call generically -- `write_expr` emits the
# atom `builtin-call`, the name, and the arguments -- so the vocabulary those
# names are resolved against is invisible to them. That vocabulary is this
# table: the linker admits a call by it, the compiler picks the intrinsic by it,
# and the runtime renders arity diagnostics from it. Adding, removing, renaming
# or re-arity-ing an entry therefore changes what a module ref MEANS without
# changing a byte any other guard on this surface projects, and the semantic
# hash is the fence that catches it: it is the first atom of every module-ref
# hash input (crates/lashlang/src/artifact_dialect.rs), so moving it re-mints
# every published ref and an artifact minted under the old vocabulary stops
# matching. That is the fail-closed behaviour a vocabulary change needs, and it
# is why `__typescript_*` intrinsics -- which source can never spell, so no
# front-end diagnostic covers them -- belong here rather than nowhere.
#
# Stated boundary rather than claimed coverage: this projects the table, so a
# name/arity edit fails closed. Changing what an already-listed builtin DOES,
# with its name and arity untouched, is a behaviour change no textual guard over
# a registry can see; that reading stays with the author.
[[surface.guard]]
kind = "rust_items"
paths = ["crates/lashlang/src/builtins.rs"]
symbols = ["SOURCE_BUILTINS", "TYPESCRIPT_BUILTINS", "Builtin", "Arity"]

# Sweep exclusions: APP_VERSION and LASHLANG_COMPILER_VERSION mirror package
# versions; MCP_PROTOCOL_VERSION, ANTHROPIC_VERSION, and CODE_ASSIST_API_VERSION
# pin upstream protocols; GENERATOR_VERSION versions a generated test artifact;
# SOURCE_CACHE_VERSION identifies a process-local cache rather than a serialized
# shape. LASHLANG_SEMANTIC_HASH_VERSION and LASHLANG_VM_ABI_VERSION are not
# exclusions: they are identity strings rather than counters, and both are
# registered surfaces above under an explicit `version_regex`.
# TOOL_INTENT_PROTOCOL_V3 is a permanently named v3 discriminator, not a mutable
# current-version constant: each protocol version keeps its own named constant
# and the predecessors are refused by number, never rewritten in place.

[[surface]]
constant = "NATIVE_DRIVER_STATE_VERSION"
constant_path = "crates/lash-protocol-rlm/src/native/state.rs"
description = "native RLM parked driver state"

[[surface.guard]]
kind = "rust_serde_shapes"
paths = ["crates/lash-protocol-rlm/src/native/state.rs"]
must_cover = ["RlmDriverState", "Envelope"]

[[surface]]
constant = "NATIVE_TRANSPORT_VERSION"
constant_path = "crates/lash-protocol-rlm/src/native/transport.rs"
description = "native RLM durable provider call and repair envelopes"

[[surface.guard]]
kind = "rust_serde_shapes"
paths = ["crates/lash-protocol-rlm/src/native/transport.rs"]
must_cover = ["Envelope", "Transport"]

[[surface]]
constant = "CURRENT_SESSION_STATE_VERSION"
constant_path = "crates/lash-core-store/src/store/state_version.rs"
description = "complete session continuation generation including mediated plugin state"

[[surface.guard]]
kind = "rust_items"
paths = ["crates/lash-core-store/src/plugin_state.rs"]
symbols = ["PluginState", "PluginNamespaceState"]

[[surface]]
constant = "DURABLE_READ_FIXTURE_SCHEMA_VERSION"
constant_path = "crates/lash-core/tests/support/durable_read_fixture.rs"
description = "checked-in durable-read fixture databases, dumps, and expectations"

# The fixtures are the authoritative bytes a durable-read regression replays,
# so this is a whole-file guard over the entire tree: the SQLite databases, the
# PostgreSQL dump, the per-backend version manifests, and the expectations. Four
# of the guarded files are binary SQLite databases; the `SQLite format 3` marker
# below pins that they really are in the signature, so a later narrowing of
# `paths` fails rather than quietly dropping the files a schema change rewrites.
[[surface.guard]]
kind = "file"
paths = ["fixtures/durable-read/*"]
must_cover = [
  "SQLite format 3",
  "PostgreSQL database dump",
  "\"fixture_schema_version\"",
  "\"durable_core\"",
]
