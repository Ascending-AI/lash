manifest = "Bytecode"

# The Lashlang runtime's two durable byte formats -- the canonical snapshot and
# the VM continuation -- share one leaf family: the heap. Both encode a heap
# error's brand as `error_kind`, and Serde writes that enum BY NAME, so a
# variant added to `ErrorKind` reaches an N-1 reader as an unknown variant
# during deserialization, before either format's `version` field is ever
# compared. The reader then reports a corrupt payload instead of a version
# boundary, which is why the heap files are guarded under both fences rather
# than under whichever one happens to hold the enum.
#
# The heap guard is a whole-module sweep, not a file list: the parent `heap.rs`
# and `heap/*.rs` together are where the wire-visible leaves live (`ErrorKind`,
# `HeapId`), and a Serde carrier added to any of them later is picked up without
# anyone remembering to extend this entry. The parent module is named
# explicitly because the glob does not reach it, and it already holds the heap's
# own wire types.
#
# Stated boundary rather than claimed coverage: `ImageValue` is persisted
# through a hand-written `impl Serialize`/`impl Deserialize` pair that no
# declaration projection can see, so it is guarded by `rust_items` on its
# declaration. That pair mirrors the struct field for field, so any field the
# wire gains or loses is also a declaration edit; a rewrite of the key names
# inside the impl alone is not visible here. The same holds for the
# `serialize_with` helpers in continuation.rs: the wire structs they write
# (`HeapWire`, `ValueWire`, and friends) are swept, the functions are not. The
# canonical MessagePack writer in state/canonical_messagepack.rs is likewise an
# encoder, deliberately not guarded whole -- under a forward-only fence a
# spurious bump makes older binaries refuse payloads they could have read.
[[surface]]
constant = "LASHLANG_SNAPSHOT_VERSION"
constant_path = "crates/lashlang/src/runtime/state.rs"
upgrade = "migrate"
description = "canonical MessagePack Lashlang snapshot: globals, heap, and value leaves, whole or as a durable header and per-root fragments"
manifest = "LashlangSnapshot"

[[surface]]
constant = "VM_CONTINUATION_FORMAT_VERSION"
constant_path = "crates/lashlang/src/runtime/vm/continuation.rs"
upgrade = "drain"
description = "durable Lashlang VM continuation: frames, heap restore wire, and value leaves"
manifest = "VmContinuation"

# The ability boundary is the VM's other contract, and it is not a durable one.
# An `AbilityOp` is minted by the VM at dispatch, handed to a host bridge, and
# dropped inside one `perform`; it reaches no bytecode, no continuation and no
# snapshot. What moves when its vocabulary moves is which host bridge can serve
# a program this VM compiled -- which is what `LASHLANG_VM_ABI_VERSION` names
# ("the Lashlang VM ABI this build implements", `lash::formats`, probe
# `NotPersisted`), and what `CompiledProcessCacheKey` compares before it reuses
# a compiled process (crates/lashlang/src/runtime/cache.rs).
#
# It is therefore the only honest owner of the three candidates. A bump of
# BYTECODE_FORMAT_VERSION or VM_CONTINUATION_FORMAT_VERSION would publish a
# false incompatibility: both fail closed on stored bytes an ability change
# cannot have touched, so a deployment would refuse parked segments it could
# still have read. Bytecode is not sufficient either -- #1529 deleted the
# `Cancel`, `StartProcess` and `SignalRun` abilities and bumped only the
# bytecode, which happened to move for its own reasons; `ResourceOperation`
# becoming `Box<ResourceOperation>` in the same change moved no constant at all.
#
# Stated boundary rather than claimed coverage: `Value` and `ExecutionHostError`
# ride inside these ops and are guarded under the snapshot and continuation
# surfaces, where a change to either already fails closed. They are not repeated
# here, so one change still owes one bump; what this surface adds is the ability
# vocabulary itself, which no other guard sees. `rust_items` does not follow
# type references, so the leaves host.rs declares are named one by one.
[[surface]]
constant = "LASHLANG_VM_ABI_VERSION"
constant_path = "crates/lashlang/src/artifact.rs"
upgrade = "drain"
version_regex = '\bLASHLANG_VM_ABI_VERSION\b\s*:\s*&str\s*=\s*"lashlang-vm-abi-v([0-9]+)"'
description = "in-process VM-to-host ability contract: the ops a compiled program performs and the results a host returns"
manifest = "VmAbi"

