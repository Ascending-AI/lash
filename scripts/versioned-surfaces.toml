# Sweep exclusions: APP_VERSION and LASHLANG_COMPILER_VERSION mirror package
# versions; MCP_PROTOCOL_VERSION, ANTHROPIC_VERSION, and CODE_ASSIST_API_VERSION
# pin upstream protocols; DURABLE_READ_FIXTURE_SCHEMA_VERSION and GENERATOR_VERSION
# version generated/test artifacts; LASHLANG_SEMANTIC_HASH_VERSION,
# LASHLANG_VM_ABI_VERSION, and SOURCE_CACHE_VERSION identify hashes/caches rather
# than serialized shapes. TOOL_INTENT_PROTOCOL_V1 is a permanently named v1
# discriminator, not a mutable current-version constant.
