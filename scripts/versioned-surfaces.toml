constant_path = "crates/lash-remote-protocol/src/lib.rs"
upgrade = "coexist"
description = "JSON wire structs and enums exchanged by Lash remote peers"
outside_manifest = "wire protocol: gates a live remote peer, not bytes a store parks"

[[surface.guard]]
kind = "rust_serde_shapes"
paths = ["crates/lash-remote-protocol/src/*.rs"]
must_cover = ["RemoteLlmRequest", "RemoteProcessInput", "RemoteTurnEvent", "RemoteTurnReport"]

