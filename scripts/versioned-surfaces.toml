# The registry of versioned formats: every durable format version this
# repository writes, and every other version-shaped constant, is accounted for
# here and nowhere else. scripts/check_format_registry.py holds it exhaustive:
#
# - every `*_VERSION` / `*_EPOCH` constant in non-test Rust under crates/ and
#   examples/ is a [[surface]] below, a member of an [[excluded_class]], or an
#   [[unregistered]] entry that says why it versions no durable format;
# - every [[surface]] names its row in the format manifest
#   (`manifest = "<DurableFormat variant>"`, crates/lash/src/formats.rs), states
#   why it is outside it (`outside_manifest = "<reason>"`), or is covered by an
#   excluded class; and every manifest row is claimed by exactly one surface.
#
# The manifest re-exports the constants rather than copying them, so this file
# never repeats a version number; it only says which constants exist and what
# they version.

