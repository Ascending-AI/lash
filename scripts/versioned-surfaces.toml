# The writers above spell a builtin call generically -- `write_expr` emits the
# atom `builtin-call`, the name, and the arguments -- so the vocabulary those
# names are resolved against is invisible to them. That vocabulary is this
# table: the linker admits a call by it, the compiler picks the intrinsic by it,
# and the runtime renders arity diagnostics from it. Adding, removing, renaming
# or re-arity-ing an entry therefore changes what a module ref MEANS without
# changing a byte any other guard on this surface projects, and the semantic
# hash is the fence that catches it: it is the first atom of every module-ref
# hash input (crates/lashlang/src/artifact_dialect.rs), so moving it re-mints
# every published ref and an artifact minted under the old vocabulary stops
# matching. That is the fail-closed behaviour a vocabulary change needs, and it
# is why `__typescript_*` intrinsics -- which source can never spell, so no
# front-end diagnostic covers them -- belong here rather than nowhere.
#
# Stated boundary rather than claimed coverage: this projects the table, so a
# name/arity edit fails closed. Changing what an already-listed builtin DOES,
# with its name and arity untouched, is a behaviour change no textual guard over
# a registry can see; that reading stays with the author.
[[surface.guard]]
kind = "rust_items"
paths = ["crates/lashlang/src/builtins.rs"]
symbols = ["SOURCE_BUILTINS", "TYPESCRIPT_BUILTINS", "Builtin", "Arity"]

# The item guards above project how an artifact is encoded; they say nothing
# about what a front end chooses to encode. The TypeScript lowerer decides
# that: a lowering change re-keys what unchanged source means -- and so the
# module-ref preimage -- while touching no item any symbol-named guard
# projects, which is how FIG-3728/FIG-3745 first landed without the bump.
# `ast_roles.rs` sits beside it because the structural roles the lowerer marks
# a program with are part of what the IR means, not only how it serializes.
# Both legs are whole-file on purpose: a lowering edit with no vocabulary,
# shape or writer change still fires, and a provably comment-only move takes
# the checker's ordinary justify path.
[[surface.guard]]
kind = "file"
paths = ["crates/lash-typescript/src/lower/**", "crates/lashlang/src/ast_roles.rs"]
must_cover = ["impl Lowerer", "CollectionTransformParts"]

