# still recover a typed meaning from is guarded here, down to the leaves that
# are genuinely opaque bytes. A file whose every Serde carrier belongs to the
# body's family is swept whole and fails closed on a carrier added later; a
# file that also holds transient stream, prompt, or driver types is named
# declaration by declaration.
#
# `SessionPolicy` is the exception and its guard is a whole-file one: the
# policy is persisted through a hand-written `impl Serialize`/`impl
# Deserialize` pair, and no symbol projection here can see an impl block --
# `rust_items` and `rust_serde_shapes` both match declarations only. That pair
# therefore lives alone in session_model/session_policy_serde.rs, and the file
# is guarded whole with `must_cover` markers asserting both impls still exist
# under those names. Guarding the file that holds only the encoding, rather
# than the module that also holds the runtime session types, is what keeps the
# guard from firing on unrelated edits -- a spurious bump is not free here,
# because under the forward-only fence it makes older binaries refuse rows they
# could have read.
#
# What that buys: any edit to the encoder or to the wire struct inside it
# demands a bump, and a rename of either impl trips the marker rather than
# passing silently. What it cannot see is the `SessionPolicy` declaration
# itself, which stays in session_model/mod.rs -- and does not need to be seen,
# because the hand-written encoder is the policy's complete durable projection.
# A field added to the struct is absent from the wire until this file names it,
