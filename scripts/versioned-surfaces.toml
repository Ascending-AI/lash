[[surface]]
constant = "EFFECT_JOURNAL_VERSION"
constant_path = "crates/lash-restate/src/controller/effect_journal.rs"
upgrade = "drain"
description = "Restate effect journal: every recorded effect's `lash:{replay_key}` ctx.run entry (the canonical envelope, the outcome and its error, the give-up entry) and its position"
manifest = "engine:restate.effect_journal"

# Hash-domain family tags. A `*_FAMILY_VERSION` names the preimage family
# inside a content-addressed key, fingerprint, or retry identity; it is an
# identity component, not a format stamp a reader compares. A moved tag mints
# different identities for the same inputs, and where it is stored at all it is
# stored as part of such an identity or uniqueness key, compared for equality,
# never read back as "this was written by version N". Families whose preimage
# carries a guarded shape are registered surfaces above so their bumps stay
# checked; the class exclusion covers the unguarded remainder for the sweep and
# every family for the manifest, which reports formats a probe or an operator
# compares.
[[excluded_class]]
suffix = "_FAMILY_VERSION"
reason = "hash-domain family tag: an identity-preimage component, not a durable format stamp"

# Durable formats without their own guarded surface, and constants whose names
# look like versions but version nothing durable. TOOL_INTENT_PROTOCOL_V3 sits
# outside the swept name pattern by design: it is a permanently named v3
# discriminator, not a mutable current-version constant, and predecessors are
# refused by number rather than rewritten in place.
[[unregistered]]
constant = "OLDEST_SUPPORTED_SESSION_STATE_VERSION"
constant_path = "crates/lash-core-store/src/store/state_version.rs"
reason = "lower bound of the admission window for the registered CURRENT_SESSION_STATE_VERSION, not a format of its own"

