description = "the semantic settlement a tool child of a durable effect group carries on its outcome (ADR 0099 sections 6 and 13)"

# The settlement is journaled inside a `ToolInvocation` outcome and read back
# by a replay, so a field added, retired or retyped anywhere in its serialized
# closure changes what an opener can reconstruct of what its child produced.
# The guard names every type the settlement's fields reach — intent outcomes,
# usage deltas, possession, trigger receipts, checkpoint messages, and the
# projected model return's full message/attachment/causal subtree — because a
# `rust_items` guard projects only the declarations it lists and nothing their
# payloads reach. `FlatPart`/`FlatPartRef` are named because `Part` serializes
# through them; a field added there without a `Part` decl change would
# otherwise leave the signature byte-identical.
[[surface.guard]]
