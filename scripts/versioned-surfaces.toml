# Every SQLite catalog is created with `CREATE INDEX IF NOT EXISTS` and open runs
# the whole schema text, so adding a non-unique index is not a compatibility
# boundary: it reaches an existing file on its next open, and a file that already
# has it stays readable by a binary without it. Those statements are therefore
# elided from the guarded signature and an index-only addition ships without a
# version bump. Everything else in the schema -- tables, columns, constraints, a
# unique index -- still demands one.
[[surface]]
constant = "SCHEMA_VERSION"
constant_path = "crates/lash-sqlite-store/src/schema.rs"
description = "SQLite session-store tables, columns, constraints, and unique indexes"

[[surface.guard]]
kind = "rust_items"
paths = ["crates/lash-sqlite-store/src/schema.rs"]
symbols = ["SCHEMA"]
elide = "sql_idempotent_index"

