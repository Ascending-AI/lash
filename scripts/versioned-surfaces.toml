# The registry of versioned formats: every durable format version this
# repository writes, and every other version-shaped constant, is accounted for
# here and nowhere else. scripts/check_format_registry.py holds it exhaustive:
#
# - every `*_VERSION` / `*_EPOCH` constant in non-test Rust under crates/ and
#   examples/ is a [[surface]] below, a member of an [[excluded_class]], or an
#   [[unregistered]] entry that says why it versions no durable format;
# - every [[surface]] names its row in the format manifest
#   (`manifest = "<DurableFormat variant>"`, crates/lash/src/formats.rs), states
#   why it is outside it (`outside_manifest = "<reason>"`), or is covered by an
#   excluded class; and every manifest row is claimed by exactly one surface.
#
# The manifest re-exports the constants rather than copying them, so this file
# never repeats a version number; it only says which constants exist and what
# they version. The rest of this header is about the bump check.
#
# Versioned wire/persistence surface inventory for check_version_bumps.py.
#
# A `file` guard compares the complete file and may require literal
# `must_cover` markers. `rust_items` compares only the named Rust
# declarations/functions (comments and formatting are ignored).
# `rust_serde_shapes` compares every Serde-derived struct/enum in the matched
# source files and requires explicit `must_cover` anchors so detection cannot
# silently lose headline shapes. The latter intentionally fails closed for a
# few private helper carriers: changing one requires the family bump even if it
# later proves not to cross the boundary. Whole-file guards such as PostgreSQL's
# schema.sql inherently cover every table in that authoritative schema file.
#
# A surface's diagnostic key is `<constant_path>:<constant>`; use that key with
# `--surface` when constants such as SCHEMA_VERSION are not globally unique.
#
# Adding an entry here does not by itself excuse the bump its shape change
# would owe. A registration -- an entry whose constant arrives with it, over a
# shape that moves in the same change -- is burned one at a time into
# REGISTRATION_BASELINES in check_version_bumps.py, pinned to the surface key
# and to the exact guarded bytes enrolled. Registering without one fails, and
# names the fingerprint to burn.
#
# This check is deliberately CI-only, unlike the sibling PostgreSQL-payload
# checker: its merge-base guarantee requires a current fetched target branch. PR
# protection must require an up-to-date merge ref or merge queue so
# independently landed version bumps cannot be hidden by a stale merge-base.
#
# The bump requirement is PAUSED until the lash 1.0 cut: pre-1.0 nothing is in
# production and the 1.0 clean slate resets every stored format, so the bump
# protects nothing while every PR takes "main+1" and collides with the others
# (FIG-3660). tools/release-mode.toml carries `pre_release = true`; while it
# holds, every durable-format bump gate reports "paused pre-1.0" and exits 0.
# Set it false at the 1.0 cut, under the post-1.0 migration policy (ADR 0106).

[[surface]]
