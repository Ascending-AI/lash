# ADR 0105 section 12. Every entry a recorded effect journals is stamped with
# the generation that wrote it, and the controller refuses an entry stamped
# with any other generation, or none, as a parked replay divergence before the
# replay acts on it. Any change that moves the bytes a recorded effect
# journals, or the position of a recorded effect in the journal, bumps this
# constant. The guards project the entry shapes, the envelope and outcome
# vocabulary, and the error an outcome carries. Leaf payloads reached through
# an outcome (model responses, tool records, process events) are guarded by
# their own surfaces; a change there that moves recorded effect bytes bumps
# this constant as well.
[[surface.guard]]
kind = "rust_serde_shapes"
paths = ["crates/lash-restate/src/controller/effect_journal.rs"]
must_cover = ["RecordedRuntimeEffect", "GaveUpEntry", "Stamped", "FrontierMark"]

