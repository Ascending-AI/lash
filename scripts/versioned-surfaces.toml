[[surface]]
constant = "BYTECODE_FORMAT_VERSION"
constant_path = "crates/lashlang/src/lib.rs"
upgrade = "coexist"
description = "compiled Lashlang instruction and durable VM-continuation contract"
manifest = "Bytecode"

# `Instruction` is only the outer half of the instruction stream's vocabulary.
# `Instruction::Intrinsic(IntrinsicOp)` carries no discriminant of its own, so
# every builtin the VM dispatches directly is an `IntrinsicOp` arm and nothing
# else; `Instruction::Binary(BinaryOp)` and its three siblings are the same
# shape for operators. An arm added to, removed from, or re-payloaded in any of
# them changes what identical source compiles to -- which is the event this
# constant names -- while `Instruction`'s own text, and therefore the whole
# guard, stays byte-identical. Deleting the TypeScript process special forms in
# #1529 moved this constant for its own reasons; nothing would have required it.
#
# The list is the type closure of `Instruction`'s payloads, walked rather than
# recalled: `Instruction` reaches `IntrinsicOp` and the four operator enums,
# `IntrinsicOp` reaches `JavaScriptUriCodec` and `BinaryOp`, and those five
# leaves reach nothing further. `rust_items` does not follow type references, so
# each is named. The operator enums live in ast.rs and belong here rather than
# on the semantic-hash surface: `write_binary_op` spells every operator as its
# own atom (crates/lashlang/src/artifact_write_helpers.rs), so a new operator
# already mints a distinct module ref and re-minting the published ones would
# be the false incompatibility, whereas the compiled stream is where an operator
# edit actually lands.
#
# Stated boundary rather than claimed coverage: the `Chunk` side tables an
# operand indexes (`resource_operation_batches`, `assign_paths`,
# `format_templates`, `functions`) are reached by index, not by type, and the
# lowering that decides how many instructions a construct emits is reached by
# neither. Both stay with the author, as they do for `Instruction` itself. What
# this adds is the vocabulary encoded IN the stream, which no other guard sees.
[[surface.guard]]
kind = "rust_items"
paths = ["crates/lashlang/src/runtime/instruction.rs"]
symbols = ["Instruction", "IntrinsicOp", "JavaScriptUriCodec"]

[[surface.guard]]
kind = "rust_items"
paths = ["crates/lashlang/src/ast.rs"]
symbols = ["BinaryOp", "JavaScriptBinaryOp", "JavaScriptUnaryOp", "UnaryOp"]

[[surface.guard]]
kind = "rust_serde_shapes"
paths = ["crates/lashlang/src/runtime/vm/continuation.rs"]
must_cover = ["VmContinuation"]

# FIG-3571: the one compile entry assembles what compiles -- which program of
# the artifact becomes `main`, which spans and execution context it compiles
# under -- and stamps the executable identity the program runs as. An edit to
# either changes what identical input compiles to without touching
# `Instruction`, and the executable identity every parked run is fenced by
# moves only with this constant.
[[surface.guard]]
kind = "rust_items"
paths = ["crates/lashlang/src/runtime/entry_points.rs"]
symbols = ["compile", "compile_main"]

# The Lashlang runtime's two durable byte formats -- the canonical snapshot and
# the VM continuation -- share one leaf family: the heap. Both encode a heap
# error's brand as `error_kind`, and Serde writes that enum BY NAME, so a
# variant added to `ErrorKind` reaches an N-1 reader as an unknown variant
# during deserialization, before either format's `version` field is ever
# compared. The reader then reports a corrupt payload instead of a version
# boundary, which is why the heap files are guarded under both fences rather
# than under whichever one happens to hold the enum.
#
# The heap guard is a whole-module sweep, not a file list: the parent `heap.rs`
# and `heap/*.rs` together are where the wire-visible leaves live (`ErrorKind`,
# `HeapId`), and a Serde carrier added to any of them later is picked up without
# anyone remembering to extend this entry. The parent module is named
# explicitly because the glob does not reach it, and it already holds the heap's
# own wire types.
#
# Stated boundary rather than claimed coverage: `ImageValue` is persisted
# through a hand-written `impl Serialize`/`impl Deserialize` pair that no
# declaration projection can see, so it is guarded by `rust_items` on its
# declaration. That pair mirrors the struct field for field, so any field the
# wire gains or loses is also a declaration edit; a rewrite of the key names
# inside the impl alone is not visible here. The same holds for the
# `serialize_with` helpers in continuation.rs: the wire structs they write
# (`HeapWire`, `ValueWire`, and friends) are swept, the functions are not. The
# canonical MessagePack writer in state/canonical_messagepack.rs is likewise an
# encoder, deliberately not guarded whole -- under a forward-only fence a
# spurious bump makes older binaries refuse payloads they could have read.
[[surface]]
constant = "LASHLANG_SNAPSHOT_VERSION"
constant_path = "crates/lashlang/src/runtime/state.rs"
upgrade = "migrate"
description = "canonical MessagePack Lashlang snapshot: globals, heap, and value leaves, whole or as a durable header and per-root fragments"
manifest = "LashlangSnapshot"

# Every Serde carrier in the state module belongs to the canonical snapshot
# family, so state.rs and its submodules are swept whole and fail closed on a
# carrier added later -- including one relocated out of state.rs into
# state/wire.rs or state/canonical_wire.rs, which today hold only encoder
# functions and would otherwise leave the fence silently.
[[surface.guard]]
kind = "rust_serde_shapes"
paths = [
  "crates/lashlang/src/runtime/state.rs",
  "crates/lashlang/src/runtime/state/*.rs",
]
must_cover = [
  "CanonicalSnapshot",
  "CanonicalHeap",
  "CanonicalHeapObject",
  "CanonicalValue",
]

# The canonical projected carrier is the one shape BOTH durable writers share,
# so it is relocated out of state.rs into its own file and guarded by both
# surfaces. A field added here changes the snapshot bytes and the continuation
# JSON at once; neither fence may go blind to it.
[[surface.guard]]
kind = "rust_serde_shapes"
paths = ["crates/lashlang/src/runtime/projected_wire.rs"]
must_cover = [
  "CanonicalProjectedValue",
  "CanonicalJsonValue",
  "CanonicalJsonField",
]

[[surface.guard]]
kind = "rust_serde_shapes"
paths = [
  "crates/lashlang/src/runtime/heap.rs",
  "crates/lashlang/src/runtime/heap/*.rs",
]
must_cover = ["ErrorKind", "HeapId"]

[[surface.guard]]
kind = "rust_items"
paths = ["crates/lashlang/src/runtime/value.rs"]
symbols = ["ImageValue", "ResourceHandle"]

