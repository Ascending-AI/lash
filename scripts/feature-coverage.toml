[[lane]]
name = "runtime-features"
features = [
  "lash-runtime/rlm:on",
  "lash-runtime/rlm:off",
  "lash-runtime/testing:on",
  "lash-runtime/testing:off",
  "lash-runtime/sqlite:on",
  "lash-runtime/sqlite:off",
  "lash-runtime/postgres:on",
  "lash-runtime/postgres:off",
  "lash-runtime/s3:on",
  "lash-runtime/s3:off",
  "lash-runtime/restate:on",
  "lash-runtime/restate:off",
  "lash-runtime/openai:on",
  "lash-runtime/openai:off",
  "lash-runtime/anthropic:on",
  "lash-runtime/anthropic:off",
  "lash-runtime/google:on",
  "lash-runtime/google:off",
  "lash-runtime/mcp:on",
  "lash-runtime/mcp:off",
  "lash-runtime/subagents:on",
  "lash-runtime/subagents:off",
  "lash-runtime/typescript:on",
  "lash-runtime/typescript:off",
  "lash-runtime/http-transport:on",
  "lash-runtime/http-transport:off",
]
commands = [
  ["cargo", "check", "-p", "lash-runtime", "--lib", "--no-default-features", "--locked"],
  ["cargo", "check", "-p", "lash-runtime", "--lib", "--no-default-features", "--features", "rlm", "--locked"],
  ["cargo", "check", "-p", "lash-runtime", "--lib", "--no-default-features", "--features", "testing", "--locked"],
  ["cargo", "check", "-p", "lash-runtime", "--tests", "--no-default-features", "--features", "testing", "--locked"],
  ["cargo", "check", "-p", "lash-runtime", "--tests", "--no-default-features", "--locked"],
  ["cargo", "check", "-p", "lash-runtime", "--tests", "--no-default-features", "--features", "rlm", "--locked"],
  # Executed, not just compiled: the default build's own test suite is the
  # evidence that the feature-gated arms did not take the default behaviour
  # with them. This was the `default-off-tests` leg of the retired
  # `Runtime feature boundary` matrix.
  ["cargo", "test", "-p", "lash-runtime", "--no-default-features", "--locked"],
  # The Restate host at its release resolution (FIG-3610). The `--all-targets`
  # restate command below unifies the dev-dependency `lash-core/testing` into
  # lash-restate, so it cannot see a testing-gated path that the release
  # worker build, which has no dev-dependencies, refuses. It precedes that command: the generator keys optional-dependency
  # activations by package and features alone, so a library variant emitted
  # after a `--all-targets` command of the same features would inherit its
  # dev-dependency edges.
  ["cargo", "check", "-p", "lash-runtime", "--lib", "--no-default-features", "--features", "restate", "--locked"],
  # ADR 0079 host-wired extension features. Each gates one `lash::<name>`
  # module in the library and one `#[cfg]` block in
  # `tests/integration/facade_inventory.rs`, so the ON witness has to compile both
  # contexts: `--all-targets` is the single command that does. The two
  # `--no-default-features` commands above are the shared OFF witness for
  # both contexts.
  ["cargo", "check", "-p", "lash-runtime", "--all-targets", "--no-default-features", "--features", "sqlite", "--locked"],
  ["cargo", "check", "-p", "lash-runtime", "--all-targets", "--no-default-features", "--features", "postgres", "--locked"],
  ["cargo", "check", "-p", "lash-runtime", "--all-targets", "--no-default-features", "--features", "s3", "--locked"],
  ["cargo", "check", "-p", "lash-runtime", "--all-targets", "--no-default-features", "--features", "restate", "--locked"],
  ["cargo", "check", "-p", "lash-runtime", "--all-targets", "--no-default-features", "--features", "openai", "--locked"],
  ["cargo", "check", "-p", "lash-runtime", "--all-targets", "--no-default-features", "--features", "anthropic", "--locked"],
  ["cargo", "check", "-p", "lash-runtime", "--all-targets", "--no-default-features", "--features", "google", "--locked"],
  ["cargo", "check", "-p", "lash-runtime", "--all-targets", "--no-default-features", "--features", "mcp", "--locked"],
  ["cargo", "check", "-p", "lash-runtime", "--all-targets", "--no-default-features", "--features", "subagents", "--locked"],
  ["cargo", "check", "-p", "lash-runtime", "--all-targets", "--no-default-features", "--features", "typescript", "--locked"],
  ["cargo", "check", "-p", "lash-runtime", "--all-targets", "--no-default-features", "--features", "http-transport", "--locked"],
  # The figments facade request (FIG-4423): `rlm,testing` in one resolution,
  # which compiles the `lash-seam-proof-worker` bin too and pairs the
  # `lash-vm-worker?/testing` forward with the worker's own
  # `lash-vm-client/testing` forward -- a testing worker with a testing
  # client, the pairing FIG-4409's invariant checks.
  ["cargo", "check", "-p", "lash-runtime", "--all-targets", "--no-default-features", "--features", "rlm,testing", "--locked"],
]

# The exact facade combination Figments builds lash-runtime with. A compile
# break that only shows under `otel-trace` in this resolution
# (`lash-internal-core-execution`'s intent_executor.rs) once reached main and
# blocked Figments' re-pin: the per-feature lanes each leave one of these
# features off. The lane owns no coverage rows -- every feature it combines
# already has its ON/OFF witnesses in the `runtime-features` and
# `otel-feature-chain` lanes, and a coverage row's exact-ON command could not
# carry the seven-feature set anyway.
[[lane]]
name = "figments-facade"
features = []
commands = [
  ["cargo", "check", "-p", "lash-runtime", "--lib", "--no-default-features", "--features", "rlm,postgres,restate,openai,typescript,testing,otel-trace", "--locked"],
  ["cargo", "check", "-p", "lash-runtime", "--tests", "--no-default-features", "--features", "rlm,postgres,restate,openai,typescript,testing,otel-trace", "--locked"],
]

