[[proxy_witness]]
feature = "lash-internal-core-store/otel-trace"
dependency = "lash-trace/otel"
command = ["cargo", "test", "-p", "lash-internal-core-store", "--no-default-features", "--features", "lash-trace/otel", "--locked"]

[[lane]]
name = "perf-dhat-heap"
features = [
  "lash-perf/dhat-heap:on",
  "lash-perf/dhat-heap:off",
]
commands = [
  ["cargo", "check", "-p", "lash-perf", "--all-targets", "--no-default-features", "--locked"],
  ["cargo", "check", "-p", "lash-perf", "--all-targets", "--no-default-features", "--features", "dhat-heap", "--locked"],
]

[[lane]]
name = "regress-stable-features"
features = [
  "lash-regress/std:on",
  "lash-regress/std:off",
  "lash-regress/backend-pikevm:on",
  "lash-regress/backend-pikevm:off",
  "lash-regress/index-positions:on",
  "lash-regress/index-positions:off",
  "lash-regress/prohibit-unsafe:on",
  "lash-regress/prohibit-unsafe:off",
  "lash-regress/utf16:on",
  "lash-regress/utf16:off",
]
commands = [
  ["cargo", "check", "-p", "lash-regress", "--lib", "--no-default-features", "--locked"],
  ["cargo", "check", "-p", "lash-regress", "--lib", "--no-default-features", "--features", "std", "--locked"],
  ["cargo", "check", "-p", "lash-regress", "--lib", "--no-default-features", "--features", "backend-pikevm", "--locked"],
  ["cargo", "check", "-p", "lash-regress", "--lib", "--no-default-features", "--features", "index-positions", "--locked"],
  ["cargo", "check", "-p", "lash-regress", "--lib", "--no-default-features", "--features", "prohibit-unsafe", "--locked"],
  ["cargo", "check", "-p", "lash-regress", "--lib", "--no-default-features", "--features", "utf16", "--locked"],
  ["cargo", "test", "-p", "lash-regress", "--no-default-features", "--features", "backend-pikevm,std,index-positions,utf16", "--locked"],
  ["cargo", "test", "-p", "lash-regress", "--no-default-features", "--features", "backend-pikevm,std,prohibit-unsafe,utf16", "--locked"],
]

[[lane]]
name = "host-features"
features = [
  "agent-service/restate:on",
  "agent-service/restate:off",
  "agent-workbench/provider-wire-fixtures:on",
  "agent-workbench/provider-wire-fixtures:off",
  "slack-clone/e2e:on",
  "slack-clone/e2e:off",
  "slack-clone/live-e2e:on",
  "slack-clone/live-e2e:off",
]
commands = [
  ["cargo", "check", "-p", "agent-service", "--all-targets", "--no-default-features", "--locked"],
  ["cargo", "check", "-p", "agent-service", "--all-targets", "--no-default-features", "--features", "restate", "--locked"],
  ["cargo", "check", "-p", "agent-workbench", "--all-targets", "--no-default-features", "--locked"],
  ["cargo", "check", "-p", "agent-workbench", "--all-targets", "--no-default-features", "--features", "provider-wire-fixtures", "--locked"],
  ["cargo", "check", "-p", "slack-clone", "--all-targets", "--no-default-features", "--locked"],
  ["cargo", "check", "-p", "slack-clone", "--all-targets", "--no-default-features", "--features", "e2e", "--locked"],
  ["cargo", "check", "-p", "slack-clone", "--all-targets", "--no-default-features", "--features", "live-e2e", "--locked"],
]
