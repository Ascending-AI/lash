schema = 1
# The store backends lash-runtime wires are optional `[dependencies]` entries
# now (ADR 0079 extension features), so no feature forward leaves the normal
# dependency graph.
non_normal_forwards = []

# Explicit `default` declarations are exercised by the ordinary workspace
# all-targets graph. Packages with no `[features].default` entry do not acquire
# a synthetic row here.
[baseline]
command = ["cargo", "check", "--workspace", "--all-targets", "--locked"]
features = [
  "agent-workbench/default",
  "lash-internal-core/default",
  "lash-internal-core-effect/default",
  "lash-internal-core-execution/default",
  "lash-internal-core-store/default",
  "lash-internal-core-worker/default",
  "lash-internal-core-ids/default",
  "lash-internal-core-llm/default",
  "lash-internal-llm-tools/default",
  "lash-internal-plugin-mcp/default",
  "lash-internal-plugin-process-controls/default",
  "lash-internal-postgres-store/default",
  "lash-internal-protocol-rlm/default",
  "lash-internal-protocol-standard/default",
  "lash-internal-provider-anthropic/default",
  "lash-internal-provider-google/default",
  "lash-internal-provider-openai/default",
  "lash-internal-remote-protocol/default",
  "lash-internal-sansio/default",
  "lash-internal-store-sql/default",
  "lash-internal-sqlite-store/default",
  "lash-internal-tool-support/default",
  "lash-internal-trace/default",
  "lash-perf/default",
  "lash-regress/default",
  "lash-runtime/default",
]

