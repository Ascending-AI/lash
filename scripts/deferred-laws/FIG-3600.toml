# Deferred conformance laws (FIG-3472), sharded so two changes never queue on
# one file. The checker merges every `*.toml` in `scripts/deferred-laws/`; a
# new deferred invocation adds a shard named for the recipe that runs it, or
# for the ticket that brings a parked invocation back (`FIG-<n>.toml`).
#
# A row whose recipe is "parked" runs nowhere yet: it must name the `ticket`
# (FIG-n) that brings the invocation back and the `reason` it is parked, and
# no other row may carry either field.

[[deferred]]
file = "crates/lash-restate/src/tests/turn_laws_on_the_double.rs"
claimant = "lash_restate::tests::turn_laws_on_the_double"
suite = "direct_turn_acceptance_tests"
recipe = "parked"
ticket = "FIG-3600"
reason = "the laws drive stream_turn on a runtime over the deployment effect host, which refuses effects outside a handler (RestateEffectHostRequiresHandlerScope); S5a-q3 or S8 brings back a handler-bound direct-turn path"

