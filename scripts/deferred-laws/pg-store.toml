# PostgreSQL ingress laws use Restate's recording controller and run only
# with the pg-store service leg. The dev partition has no PostgreSQL service.

[[deferred]]
file = "crates/lash-restate/src/tests/postgres_ingress.rs"
claimant = "lash_restate::tests::postgres_ingress::direct_turn_acceptance"
suite = "direct_turn_acceptance_tests"
recipe = "pg-store"
ci_job = "postgres-store"
ci_step_name = "Test Postgres store (conformance and attempt atomicity)"
receipt_artifact = "bazel-testlogs/crates/lash-restate/lash-restate__unit_test/test.outputs/law-receipts.txt"

[[deferred]]
file = "crates/lash-restate/src/tests/postgres_ingress.rs"
claimant = "lash_restate::tests::postgres_ingress::cancelled_turn_withheld_input"
suite = "cancelled_turn_withheld_input_tests"
recipe = "pg-store"
ci_job = "postgres-store"
ci_step_name = "Test Postgres store (conformance and attempt atomicity)"
receipt_artifact = "bazel-testlogs/crates/lash-restate/lash-restate__unit_test/test.outputs/law-receipts.txt"
