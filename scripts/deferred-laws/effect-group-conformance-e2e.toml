# Deferred conformance laws (FIG-3472), sharded so two changes never queue on
# one file. The checker merges every `*.toml` in `scripts/deferred-laws/`; a
# new deferred invocation adds a shard named for the recipe that runs it, or
# for the ticket that brings a parked invocation back (`FIG-<n>.toml`).
#
# One [[deferred]] row per `#[ignore]`d `*_tests!` invocation, naming the
# recipe that runs it, the CI job and matrix entry that carry the recipe, and
# the artifact the lane's receipts land in. The census fails both ways: an
# ignored invocation with no row is an unchecked exemption, and a row naming
# no real ignored invocation is stale.
#
# A row whose recipe is "parked" runs nowhere yet: it must name the `ticket`
# (FIG-n) that brings the invocation back and the `reason` it is parked, and
# no other row may carry either field.

[[deferred]]
file = "crates/lash-restate/src/tests/conformance_and_poison.rs"
claimant = "lash_restate::tests::conformance_and_poison"
suite = "effect_group_host_tests"
recipe = "effect-group-conformance-e2e"
ci_job = "functional-e2e"
ci_matrix_name = "effect-group-conformance"
receipt_artifact = "target/functional-e2e-artifacts/effect-group-conformance/law-receipts.txt"

