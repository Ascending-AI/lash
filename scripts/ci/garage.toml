# The single-node Garage lash's S3 test service runs (scripts/ci/s3-service.sh).
# It is the configuration figments runs Garage with (k8s/helm/dev-infra
# templates/garage.yaml): one node, SQLite metadata, no replication.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1
rpc_bind_addr = "127.0.0.1:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "us-east-1"
api_bind_addr = "0.0.0.0:3900"

[admin]
api_bind_addr = "0.0.0.0:3903"
