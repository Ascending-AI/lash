cwd = "crates/lash"
filters = [
  "tests::response_phase_replay::live_",
  "tests::recorded_execution_controls::live_a_recorded_budget_bounds_every_root_after_a_deployment_restart",
  "tests::send_handle::pins::live_",
]
endpoints = ["RR"]
shards = 1
timeout_seconds = 240

# A session drive on a draining build hands over to the newest build after
# its current root (FIG-4639): build N and build N+1 are two deployments over
# one store set, so two endpoint binds per shard. The PostgreSQL legs run
