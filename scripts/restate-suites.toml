# The real-server Restate suites (FIG-3666), run by `scripts/ci/restate_suite.py`
# beside a pinned `restate-server`: one server per shard, shared by the tests
# it runs, isolated by unique keys and never reset.
#
# A suite names the Bazel label of its test binary (built on the shared pool),
# the directory its tests run in, the `#[ignore]`d tests it runs (libtest name
# filters; the runner asks for ignored tests only), and the loopback endpoints
# each shard binds: every name in `endpoints` becomes `<NAME>_BIND` and
# `<NAME>_URL` on a free port of the shard's own.
#
# Servers run with retries on a short bounded schedule: long enough that the
# laws which crash a handler attempt on purpose still see the redelivery they
# exercise, short enough that a permanently failing invocation is killed in
# about half a minute instead of retrying for most of an hour.
#
# Two legs. `live` is Restate's defaults. `replay` sets the invoker's
# inactivity timeout to zero, so every await suspends and every resumption
# replays the journal from the start. `scripts/restate-divergences/<ticket>.toml`
# holds back the laws that do not yet hold under replay, one file per ticket
# that brings them back (the list only shrinks), so two divergences never
# queue on this file; the runner refuses an entry that names no test, runs a
# held law on the replay leg and fails if it passes, and `--include-divergent`
# runs them as ordinary gating tests.
# A leg table may carry `report_only = "<reason>"`: its failures are printed
# and annotated but do not fail the run, and the reason says why it does not
# gate yet.

[suites.effect-group]
label = "//crates/lash-restate:lash-restate__unit_test"
cwd = "crates/lash-restate"
filters = ["live_effect_group_sdk_preconditions", "tests::conformance_and_poison::"]
endpoints = ["EG_RESTATE_ENDPOINT", "EG0_RESTATE_ENDPOINT"]
shards = 3
# The barrier law drives width-64 tool groups (ADR 0116 §7.1) through five
# producers; on the live leg it runs about 170 s.
timeout_seconds = 360

[suites.effect-group.replay]
# Every replay failure gates the suite. Remaining held-back laws have their
# own ticket and reason in scripts/restate-divergences/.

[suites.agent-workbench]
label = "//examples/agent-workbench:agent-workbench__unit_test"
cwd = "examples/agent-workbench"
filters = ["live_restate_"]
# Spawned by its parent test with the environment it needs; run directly it
# panics before reaching Restate.
skips = ["live_restate_participant_protocol_crash_child"]
endpoints = ["AGENT_WORKBENCH_E2E_ENDPOINT", "AGENT_WORKBENCH_E2E_POSTGRES_ENDPOINT"]
shards = 3
timeout_seconds = 300
# A law that passes while a background task panicked fails.
panic_gate = true

# The replay leg's held-back laws live in scripts/restate-divergences/
# (FIG-3540). The process drive's own divergence (3e, a
# LashProcessWorkflow journal mismatch) is fixed by FIG-3673 and is not held.

[suites.agent-workbench.env]
# `scripts/agent-workbench-restate-e2e.sh` runs the suite inside
# `scripts/ci/with-service.sh pg16`, whose server carries one database per
# slot; each shard takes its own, and its own Restate trust domain.
AGENT_WORKBENCH_E2E_DATABASE_URL = "{AGENT_WORKBENCH_E2E_POSTGRES_BASE_URL}/lash_slot_{shard}"
RESTATE_AUTHORITY_ID = "agent-workbench-e2e:{AGENT_WORKBENCH_E2E_RUN_ID}:{shard}"

# The server double's own laws against the real server: the deployment
# routing and pinning the double models (FIG-3795 part B), checked so the
# double cannot drift. Two endpoint binds per shard: the test registers
# build N and build N+1 side by side.
[suites.server-double]
label = "//crates/lash-restate-test:server_semantics__test"
cwd = "crates/lash-restate-test"
filters = ["live_restate_"]
endpoints = ["DEP_A", "DEP_B"]
shards = 1
timeout_seconds = 120

# Deployment namespaces against the real server (FIG-3898): two cores in
# distinct namespaces share the server without cross-talk, and a registration
# over another deployment's names is refused. Two endpoint binds per shard, one
# per core.
[suites.namespaces]
label = "//crates/lash-restate-test:namespaces__test"
cwd = "crates/lash-restate-test"
filters = ["live_restate_"]
endpoints = ["NS_A", "NS_B"]
shards = 1
timeout_seconds = 180

# Deployment loss during process handover, presentation persistence, and the
# 13-cut group close/retirement matrix. One endpoint bind per shard: each law
# brings its backends up one after another on it.
[suites.crash-windows]
label = "//crates/lash-restate-test:crash_windows__test"
cwd = "crates/lash-restate-test"
filters = ["live_restate_"]
endpoints = ["CW"]
shards = 1
timeout_seconds = 600

[suites.root-control]
label = "//crates/lash-restate:lash-restate__unit_test"
cwd = "crates/lash-restate"
filters = ["tests::root_control_witnesses::live_"]
endpoints = ["EG_RESTATE_ENDPOINT", "EG0_RESTATE_ENDPOINT"]
shards = 1
timeout_seconds = 240

[suites.session-driver]
label = "//crates/lash-restate-test:session_driver__test"
cwd = "crates/lash-restate-test"
filters = ["live_restate_drive_continuation_crash_redrives_one_successor"]
endpoints = ["CW"]
shards = 1
timeout_seconds = 240

# A host that reaches its session inside its journal (FIG-4277): its session
# deleted while it was parked and its deployment killed, the host replays the
# journal it recorded and answers. One endpoint bind per shard.
[suites.host-send-wait]
label = "//crates/lash-restate-test:host_send_wait__test"
cwd = "crates/lash-restate-test"
filters = ["live_restate_"]
endpoints = ["HSW"]
shards = 1
timeout_seconds = 420

# The load delete's cleanup replays its recorded listing after a child appears.
[suites.workload-delete]
label = "//runbooks/restate-postgres-workers:restate-postgres-workers__unit_test"
cwd = "runbooks/restate-postgres-workers"
filters = ["load::worker::cleanup_tests::live_restate_"]
endpoints = ["WDP"]
shards = 1
timeout_seconds = 180

[suites.public-process-command]
label = "//crates/lash:integration__test"
cwd = "crates/lash"
filters = ["public_process_command_replay::live_"]
endpoints = ["PC"]
shards = 1
timeout_seconds = 180

[suites.remote-cancellation]
label = "//crates/lash-restate:lash-restate__unit_test"
cwd = "crates/lash-restate"
filters = ["tests::remote_turn_cancel::live_remote_after_step_waits_for_committed_boundary"]
endpoints = ["EG_RESTATE_ENDPOINT"]
shards = 1
timeout_seconds = 180

[suites.process-await]
label = "//crates/lash-restate:lash-restate__unit_test"
cwd = "crates/lash-restate"
filters = ["tests::process_terminal_await::live_"]
endpoints = ["PA"]
shards = 1
timeout_seconds = 180

[suites.process-await.live.server_env]
# The laws prune after the await and resume a suspended handler's journal.
RESTATE_WORKER__INVOKER__INACTIVITY_TIMEOUT = "100ms"

[suites.attachment-attach]
label = "//crates/lash-restate:lash-restate__unit_test"
cwd = "crates/lash-restate"
filters = ["tests::attachment_attach_redrive::live_restate_"]
endpoints = ["AA"]
shards = 1
timeout_seconds = 120

# Live replay eviction returns a snapshot gap on native Restate with both SQL stores.
[suites.live-replay-bounds]
label = "//crates/lash:facade_host_wrappers__test"
cwd = "crates/lash"
filters = ["live_replay_bounds::eviction_recovers_the_facade_on_native_restate_"]
endpoints = ["REPLAY_BOUNDS"]
shards = 1
timeout_seconds = 120

[suites.json-decode]
label = "//crates/lash-restate:lash-restate__unit_test"
cwd = "crates/lash-restate"
filters = ["tests::json_decode_ingress::live_call_decode_refuses_before_writes_on_sqlite_and_postgres"]
endpoints = ["JSON_MEM", "JSON_FILE", "JSON_PG"]
shards = 1
timeout_seconds = 120

[suites.replay-after-advance]
# The replay-after-advance laws' live legs (FIG-4324, ADR 0105 §11): each
# family records in a handler, advances the store, stops serving and serves
# again so the journal replays.
label = "//crates/lash:replay_after_advance__test"
cwd = "crates/lash"
filters = ["live_sqlite_memory::"]
# Held for its ticket like its double legs; FIG-4351 removes the skip.
skips = ["live_sqlite_memory::session_signal_replay_after_compaction_returns_recorded_event"]
endpoints = ["RAA_RESTATE_ENDPOINT"]
shards = 1
timeout_seconds = 180
