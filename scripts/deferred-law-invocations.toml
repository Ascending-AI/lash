# Deferred conformance laws (FIG-3472). One [[deferred]] row per `#[ignore]`d
# `*_tests!` invocation, naming the recipe that runs it, the CI job and matrix
# entry that carry the recipe, and the artifact the lane's receipts land in.
# The census fails both ways: an ignored invocation with no row is an
# unchecked exemption, and a row naming no real ignored invocation is stale.
#
# A row whose recipe is "parked" runs nowhere yet: it must name the `ticket`
# (FIG-n) that brings the invocation back and the `reason` it is parked, and
# no other row may carry either field.

