# The prose upgrade path each versioned durable surface takes after the
# clean-slate release: ADR 0106 section 2. The `upgrade` enum itself lives on
# the surface's `[[surface]]` (or `[[unregistered]]`) entry in
# `scripts/versioned-surfaces.toml` — the registry is the one place a policy
# value is written, so a policy cannot drift between two TOML declarations.
# This file carries the `note` beside it: the mechanism and the reason a
# reviewer reads at upgrade time.
#
# `scripts/check_upgrade_paths.py` holds this file honest against the
# registry: every `[[surface]]` and every `[[unregistered]]` entry that
# carries a policy appears here exactly once, every entry names a constant the
# registry knows, and no entry may restate `upgrade` — that value is read from
# the registry.
#
# upgrade = "migrate": forward migration. Schemas take expand/contract DDL, and
#   payloads go through an upcaster chain on read.
# upgrade = "drain":   a journal or in-flight record only its own generation G
#   can replay; the old deployment stays registered until drain_status(G) reads
#   drained.
# upgrade = "coexist": both versions live during the roll window: content
#   addresses, idempotency keys, namespaced object state, and negotiated wire
#   versions.

