# The upgrade path each versioned durable surface takes after the clean-slate
# release: ADR 0106 section 2. `scripts/check_upgrade_paths.py` holds this file
# exhaustive against the `[[surface]]` registry in `scripts/versioned-surfaces.toml`:
# every registered surface constant appears here exactly once, and every entry
# names a constant the registry knows (a surface, or an [[unregistered]] entry
# the ADR still names a law for).
#
# upgrade = "migrate": forward migration. Schemas take expand/contract DDL, and
#   payloads go through an upcaster chain on read.
# upgrade = "drain":   a journal or in-flight record only its own generation G
#   can replay; the old deployment stays registered until drain_status(G) reads
#   drained.
# upgrade = "coexist": both versions live during the roll window: content
#   addresses, idempotency keys, namespaced object state, and negotiated wire
#   versions.

