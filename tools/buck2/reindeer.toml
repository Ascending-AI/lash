# Reindeer is an ahead-of-time projection of Cargo.lock. Buck2 action
# execution does not run Cargo or access the network. The repository driver
# does run locked Cargo metadata and Reindeer before a build to verify that
# this checked-in projection still matches the source manifests.
# Reindeer requires every local workspace package to be beneath its root even
# when include_workspace_members is false. Make the repository that root; the
# generated BUCK file still lives in third-party/rust and only external crates
# are emitted. Vendored sources consequently live in repository-root vendor/.
manifest_path = "../../third-party/Cargo.toml"
third_party_dir = "../.."
fixups_dir = "fixups"
vendor = true
# `sync.py` derives this standalone manifest from Cargo's locked workspace
# resolution.  It names every resolved external identity directly, with the
# exact feature union Cargo selected, and adds only the already-locked
# feature-lane extras.  Source Cargo manifests remain the canonical first-
# party graph and are never rewritten for Buck2.
precise_srcs = false
include_top_level = false
include_workspace_members = false
cargo_env = true

[cargo]
bindeps = true

[platform.linux-x86_64]
target = "x86_64-unknown-linux-gnu"
execution-platform = true

[buck]
file_name = "third-party/rust/BUCK"
platform_compatibility_on_all_targets = true
rust_library = "third_party_rust_library"
rust_binary = "third_party_rust_binary"
cxx_library = "third_party_rust_cxx_library"
prebuilt_cxx_library = "third_party_rust_prebuilt_cxx_library"
buildscript_genrule = "third_party_buildscript_run"

buckfile_imports = """
load("@prelude//rust:cargo_package.bzl", "cargo")
load(
    "@root//tools/buck2:third_party.bzl",
    "third_party_buildscript_run",
    "third_party_rust_binary",
    "third_party_rust_cxx_library",
    "third_party_rust_library",
    "third_party_rust_prebuilt_cxx_library",
)
"""
