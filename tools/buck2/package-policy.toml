# Per-package Buck2 policy: the facts `tools/buck2/generate_model.py`
# cannot read from `cargo metadata`, stated once as data instead of as
# `package == ...` branches in the generator.
#
# A `[[rule]]` selects labels by Cargo package name, target kind and target
# name, and contributes to every label it selects:
#
#   packages      Cargo package names (required).
#   kinds         Target kinds: lib, unit-test, bin, bin-unit-test, test,
#                 example, bench. Omitted means every kind. A `bin-unit-test`
#                 also inherits the compile data of its `bin` target.
#   targets       Glob patterns over the Cargo target name. A unit test is
#                 named after its library. Omitted means every target.
#
#   tags, reason  Test-policy tags (`manual`, `dev-deferred`, `pr-deferred`,
#                 `cargo-*`) and the reason recorded in target-inventory.json.
#   compile_data  Labels the compile needs beyond the package's own sources.
#   data          Labels the test needs at run time.
#   env           Test environment.
#   serial        Run libtest one case at a time (`RUST_TEST_THREADS=1`). Cargo
#                 nextest isolates every case in its own process, so the
#                 constraint has no nextest encoding; Buck2 runs a binary's
#                 cases in one process and needs it said.
#   args          libtest arguments.
#   bin_env       Env var -> a Cargo binary of the same package, passed as its
#                 runfiles path and added to the test's data.
#   shards        Buck2 test shards; a feature-lane variant inherits them.
#   timeout       Buck2 test timeout (unit tests); a feature-lane variant
#                 inherits it.
#
# Rules apply in file order; list values accumulate in that order.

# --- Test partition policy ---------------------------------------------------

[[rule]]
packages = ["lash-internal-s3-store"]
kinds = ["unit-test", "bin", "bin-unit-test", "test", "example", "bench"]
tags = ["manual", "cargo-service-gate"]
reason = "proves nothing without a live S3 server; the service job executes this label uncached against a real service"

# Each test action of this package starts the pinned PostgreSQL 18
# (`native//:postgres`) on its own loopback, applies the published schema and
# runs against it (`tools/buck2/postgres_action_runner.py`). The server is a
# declared input, so these run on the pool and their verdicts are cached. A
# run that is handed `LASH_POSTGRES_DATABASE_URL` uses that server instead,
# locally and uncached.
[[rule]]
packages = ["lash-internal-postgres-store"]
kinds = ["unit-test", "bin", "bin-unit-test", "test", "example", "bench"]
tags = ["hermetic-postgres"]

# V0's vertical crash proof (FIG-5170), L3's turn phases (FIG-5172) and the
# trigger start proof (FIG-5175) run their matrices on SQLite memory, SQLite
# file and PostgreSQL, and L11's drain by release (FIG-5187) on SQLite memory
# and PostgreSQL; the tool-semantics laws (FIG-5210), the core node's
# process laws (FIG-5216), the cell restore laws (FIG-5224) and the tool
# activity laws (FIG-5251), the after-turn laws (FIG-5283), the checkpoint
# mail laws (FIG-5293, FIG-5294), the committed-turn read laws (FIG-5297),
# the plugin state storage laws (FIG-5301), the config-change observer laws
# (FIG-5333), and the cell process handle, standard turn outcome, tool
# surface, recorded behaviour, attachment referrer and frame switch laws
# (FIG-5310) and the turn trace-scope laws (FIG-5363) run on all three tiers,
# the process lifecycle event laws (FIG-5372) on SQLite memory and
# PostgreSQL, and the pool-width laws (FIG-5237) on
# PostgreSQL. Each PostgreSQL leg gets a server of its own.
[[rule]]
packages = ["lash-internal-durable-test"]
kinds = ["test"]
# All remaining tiered laws and frame crash proofs also have PG legs (FIG-5380).
targets = ["vertical_crash_proof", "turn_phases", "drain_by_release", "tool_batches", "tool_call_identity", "tool_crash_laws", "tool_group_pool_width", "cell_restore_laws", "core_node_processes", "declared_start", "declared_start_crash_laws", "process_tool_calls", "process_tool_call_crash_laws", "tool_activity", "session_send", "after_turn_crash_laws", "steering_crash_laws", "committed_turns", "plugin_state_storage_laws", "config_change_observer_laws", "cell_process_handles", "standard_turn_outcomes", "tool_surface_laws", "recorded_behaviour_laws", "attachment_referrer_laws", "frame_switch_laws", "turn_trace_scope_laws", "process_lifecycle_events", "context_budget_warning", "first_party_tools", "frame_switch_crash_proof", "one_slot_process_await", "open_session_commands", "pressure_frame_crash_proof", "rlm_execution_documents", "rlm_session_globals", "turn_execution_state", "turn_terminal_refusals", "worker_crashes", "live_stream_takeover", "live_fault_park", "deleted_session_crash_laws", "turn_callback_crash_laws"]
tags = ["hermetic-postgres"]

# The declared-start crash laws (FIG-5216) are five matrices and two single
# cuts per tier; one matrix ran 152 s on SQLite memory and 295 s on a SQLite
# file, so the binary is sharded and given the long bound. The process
# tool-call matrix ran 89 s on a SQLite file; its three tiers would pass the
# default bound together.
[[rule]]
packages = ["lash-internal-durable-test"]
kinds = ["test"]
targets = ["declared_start_crash_laws", "process_tool_call_crash_laws"]
shards = 8
timeout = "long"

# A matrix admits four isolated cells at a time (FIG-5278). Libtest runs
# one law at a time within an action, so concurrent laws cannot multiply
# that action's CPU reservation.
[[rule]]
packages = ["lash-internal-durable-test"]
kinds = ["test"]
targets = ["cell_restore_laws", "child_turn_crash_proof", "declared_start_crash_laws", "drain_by_release", "frame_switch_crash_proof", "plugin_state_storage_laws", "pressure_frame_crash_proof", "process_crash_proof", "process_step_crash_proof", "process_tool_call_crash_laws", "round_crash_matrix", "tool_crash_laws", "tool_group_pool_width", "turn_phases", "turn_round_crash_matrix", "vertical_crash_proof"]
serial = true

[[rule]]
packages = ["lash-internal-durable-test"]
kinds = ["unit-test"]
serial = true

# The simulation host owns environment configuration for its matrices.
[[rule]]
packages = ["lash-sim"]
kinds = ["test"]
targets = ["crash_matrix"]
serial = true
env = { LASH_MATRIX_THREADS = "4" }

# The cell restore and tool crash laws (FIG-5249) are fifteen matrices and
# single cuts each over three tiers: unloaded, one binary ran 129-142 s and
# its slowest law 37-60 s, and on a loaded pool a binary passed the default
# bound. The turn phase matrices ran 56 s unloaded and timed out on main, and
# the whole binary's 33 laws ran 173 s, so its shards went from two to six
# (FIG-5280). The shards spread the laws over separate actions; the bound is
# unchanged.
[[rule]]
packages = ["lash-internal-durable-test"]
kinds = ["test"]
targets = ["cell_restore_laws", "tool_crash_laws"]
shards = 4

[[rule]]
packages = ["lash-internal-durable-test"]
kinds = ["test"]
targets = ["turn_phases"]
shards = 6

# The plugin-state target's six matrices used one serial action: its two
# PostgreSQL laws alone took 225 s before the 300 s action timed out on
# SQLite (FIG-5427). Spread whole laws over shards, retaining the bound.
[[rule]]
packages = ["lash-internal-durable-test"]
kinds = ["test"]
targets = ["plugin_state_storage_laws"]
shards = 6

# All nine pressure/frame laws passed in 295 s, but the action including
# its fixture work exhausted the unchanged 300 s bound (FIG-5427).
[[rule]]
packages = ["lash-internal-durable-test"]
kinds = ["test"]
targets = ["pressure_frame_crash_proof"]
shards = 4

# The remaining long poles of the durable-test run (FIG-5280): whole,
# vertical_crash_proof's 16 laws ran 156 s, declared_start's 24 ran 137 s,
# frame_switch_crash_proof's 4 ran 143 s and tool_batches' 21 ran 105 s, all
# on two CPUs. Each shard action is bounded by its slowest law instead; the
# bound is unchanged.
[[rule]]
packages = ["lash-internal-durable-test"]
kinds = ["test"]
targets = ["vertical_crash_proof", "declared_start", "frame_switch_crash_proof"]
shards = 4

[[rule]]
packages = ["lash-internal-durable-test"]
kinds = ["test"]
targets = ["tool_batches"]
shards = 3

# The lash-postgres-workers runbook's harness (FIG-5199) owns its PostgreSQL server, so a
# case can stop and restart it: the pinned tree, and the NSS wrapper `initdb`
# needs on the pool, are data named to the test by path. Every case but the
# restart also runs over one SQLite file (FIG-5422). Its cases boot node
# processes and wait out real leases (four of them a 15 s TTL), so they run one
# at a time and stay out of the developer loop.
[[rule]]
packages = ["lash-internal-postgres-workers"]
kinds = ["test"]
targets = ["failover"]
tags = ["dev-deferred"]
reason = "thirteen multi-process failover cases, seven over a private PostgreSQL server and six over one SQLite file, four of which wait out a 15 s node lease; about two minutes serially"
data = ["native//:postgres", "native//:nss_wrapper"]
env = { LASH_WORKERS_POSTGRES = "$(location native//:postgres)", LASH_WORKERS_NSS_WRAPPER = "$(location native//:nss_wrapper)" }
serial = true

# The lash-facade-failover runbook (FIG-5193) runs the six turn and node cases with
# facade-host nodes, so it owns its server the same way (the same pinned tree,
# named the same way, so `with-service.sh pg17` hands it the 17 tree too) and
# runs the same way.
[[rule]]
packages = ["lash-facade-failover"]
kinds = ["test"]
targets = ["failover"]
tags = ["dev-deferred"]
reason = "six multi-process failover cases of facade-host nodes over a private PostgreSQL server, two of which wait out a 15 s node lease; about two minutes serially"
data = ["native//:postgres", "native//:nss_wrapper"]
env = { LASH_WORKERS_POSTGRES = "$(location native//:postgres)", LASH_WORKERS_NSS_WRAPPER = "$(location native//:nss_wrapper)" }
serial = true

# The PostgreSQL job's long poles (FIG-3572): serially the conformance binary
# ran 441-578 s and the integration binary 122-140 s of a 610-940 s step.
# Each shard's action has a server of its own, so shards run in parallel
# without sharing the tables `reset()` truncates. Against one external server
# `tools/buck2/postgres_slot_runner.sh` gives each a database instead.
[[rule]]
packages = ["lash-internal-postgres-store"]
kinds = ["test"]
targets = ["conformance"]
shards = 6

[[rule]]
packages = ["lash-internal-postgres-store"]
kinds = ["test"]
targets = ["integration"]
shards = 2

# The RLM unit action exceeded the 900 s Bazel timeout when run whole
# (FIG-4407). Keep the full suite in CI and distribute its cases across
# independent actions through rules_rust's libtest sharding wrapper.
[[rule]]
packages = ["lash-internal-protocol-rlm"]
kinds = ["unit-test"]
shards = 8

# The lash unit suite's 702 run cases add up to about 1120 s on four test
# threads; whole, it ran 299 s and then hit the 300 s watchdog with a store-fault
# sweep still running (FIG-5146).
[[rule]]
packages = ["lash-runtime"]
kinds = ["unit-test"]
shards = 4

[[rule]]
packages = ["lash-runtime"]
kinds = ["test"]
targets = ["ui"]
tags = ["manual", "cargo-trybuild"]
reason = "uses trybuild and its Cargo-managed compiler fixture cache"

[[rule]]
packages = ["workflow-graph-roundtrip"]
kinds = ["test"]
tags = ["manual", "cargo-frontend-assets"]
reason = "uses the Cargo-owned generated frontend asset workflow"

# This binary carries the generated-simulation and minimizer fixture replays
# (measured 182-418 s each under Cargo). The whole binary ran 227-300 s on the
# pool, which straddles Buck2's default `medium` 300 s bound; `long` is 900 s.
[[rule]]
packages = ["lash-sim"]
kinds = ["unit-test"]
tags = ["dev-deferred"]
reason = "the generated-profile, minimizer and replay-artifact cases run 109--213 s, and the serial-lane determinism sweep is bounded to 4 of its 20 seeds per run (LASH_SIM_SERIAL_LANE_SEEDS) after measuring ~74--118 s at all twenty; too slow for the developer loop, still in the PR Buck2 partition"
shards = 8
timeout = "long"





[[rule]]
packages = ["lash-regress"]
kinds = ["test"]
targets = ["unicodesets"]
tags = ["pr-deferred"]
reason = "RGI Unicode suites are too slow for the PR Buck2 partition; they run on lash-regress diffs and on trunk"

# --- Library and unit-test compile inputs -----------------------------------

[[rule]]
packages = ["lash-perf"]
kinds = ["lib"]
compile_data = ["//:perf_guard_budgets", "//:perf_duration_level_shifts"]

[[rule]]
packages = ["lash-internal-sansio"]
kinds = ["unit-test"]
compile_data = ["//:workspace_rust_sources"]


# This instrumentation binary shares process-global counters.
[[rule]]
packages = ["lash-perf"]
kinds = ["unit-test"]
compile_data = ["//:perf_guard_budgets", "//:perf_duration_level_shifts"]
serial = true

# The Node session oracle (FIG-3599) runs the dialect's session corpora through
# the RLM executor; the corpora, their Node answers and the census the
# session generator (FIG-3608) draws rejected cells from live with the dialect.
[[rule]]
packages = ["lash-internal-protocol-rlm"]
kinds = ["unit-test"]
compile_data = ["//crates/lash-dialect-typescript:session_oracle_corpus", "//:Cargo.toml"]

# Numeric conformance cases are compiled into their owning unit laws.
[[rule]]
packages = ["lash-kernel-lib"]
kinds = ["unit-test"]
compile_data = ["//crates/lash-kernel-lib:package_files"]

# --- Binary and integration-test support -------------------------------------

# The checked-in workspace fact that replaces a nested `cargo metadata` call
# in the dependency-direction test.
[[rule]]
packages = ["lash-internal-core"]
kinds = ["bin", "test", "example", "bench"]
targets = ["integration_boundary"]
data = ["//tools/buck2:target_inventory"]

# The dialect printer law embeds the complete document corpus.
[[rule]]
packages = ["lash-dialect-typescript"]
kinds = ["unit-test"]
compile_data = ["//crates/lash-kernel-conformance:package_files", "//crates/lash-kernel-lib:package_files"]

# Test262 on the kernel reads the vendored corpus.
[[rule]]
packages = ["lash-dialect-typescript"]
kinds = ["bin", "test", "example", "bench"]
targets = ["test262_kernel"]
data = ["//crates/lash-dialect-typescript:test262_corpus"]
# Forty libtest laws partition the recorded corpus. Run each in its own
# action so the full Test262 census cannot monopolize a package batch.
shards = 40

# These carry the relocated suites that assert over captured `tracing` events.
# Capture installs a scoped default subscriber, so other cases in the same
# libtest process must not emit concurrently.
[[rule]]
packages = ["lash-internal-core"]
kinds = ["bin", "test", "example", "bench"]
targets = ["runtime_turns", "runtime_observability"]
serial = true

# The warning-capture contract installs a scoped tracing subscriber.
[[rule]]
packages = ["lash-internal-sqlite-store"]
kinds = ["bin", "test", "example", "bench"]
targets = ["integration"]
serial = true

[[rule]]
packages = ["agent-workbench", "e2e-consumer", "toolbench", "workflow-graph-roundtrip", "rlm-smoke-host"]
kinds = ["bin", "test", "example", "bench"]
compile_data = ["//examples:shared_rust_sources"]



# The schema agreement tests compile the published trace record and graph
# snapshot schemas in and validate real serialized records against them.
[[rule]]
packages = ["lash-internal-trace"]
kinds = ["bin", "test", "example", "bench"]
targets = ["schema"]
compile_data = ["//:host_schemas"]

[[rule]]
packages = ["lash-internal-postgres-store", "lash-internal-sqlite-store"]
kinds = ["bin", "test", "example", "bench"]
targets = ["durable_read_fixture"]
compile_data = ["//crates/lash-core:durable_read_fixture_source"]

# Architecture lints that read sibling crates' sources at run time. A library's
# runfiles carry only its declared non-Rust inputs, so a test that scans
# another crate's sources names that crate's `rust_sources` filegroup.
[[rule]]
packages = ["lash-internal-core"]
kinds = ["bin", "test", "example", "bench"]
targets = ["runtime_effect", "runtime_scenarios"]
data = ["//crates/lash-core-execution:rust_sources"]

[[rule]]
packages = ["lash-runtime"]
kinds = ["bin", "test", "example", "bench"]
targets = ["integration"]
data = [
  "//crates/lash-sansio:rust_sources",
  "//crates/lash-tool-support:rust_sources",
  "//crates/lash-trace:rust_sources",
]

# The fault-matrix routing probes execute the real scripts/confidence-gate.sh
# against a recording `cargo`. The five `..._real_cargo_filters_chunk_*` cases
# each fork a real `cargo test ... -- --list` against the workspace to prove
# the gate's name filters still select tests. That is a claim about Cargo's own
# selection, so it cannot be proved inside a hermetic action; the trunk-only
# `Test heavy suites` job (nextest `profile.ci-heavy`) owns them. Excluded by
# name here so the label is honest about what it executed.
[[rule]]
packages = ["lash-internal-core"]
kinds = ["bin", "test", "example", "bench"]
targets = ["runtime_scenarios"]
data = ["//:confidence_gate_scripts"]
args = ["--skip=runtime::tests::runtime_scenarios::fault_matrix::durable_fault_matrix_real_cargo_filters_chunk_"]

[[rule]]
packages = ["lash-sim"]
kinds = ["test"]
compile_data = [
  "//crates/lash-postgres-store:package_files",
  "//crates/lash-sqlite-store:package_files",
]

# The crash matrix (FIG-5184) cuts every case at every commit label, mode and
# seed; whole, its ten cases ran past the 300 s bound on four test threads.
# The shards keep every cell and spread the cases over separate actions. At
# four shards, two ran 45-100 s unloaded and past 300 s on a loaded pool
# (FIG-5249).
[[rule]]
packages = ["lash-sim"]
kinds = ["test"]
targets = ["crash_matrix"]
shards = 8

# Its completeness gates read the real store trait definitions with
# `include_str!`.
[[rule]]
packages = ["lash-sim"]
kinds = ["bin", "test", "example", "bench"]
targets = ["cross_backend_store_differential"]
compile_data = ["//crates/lash-core-store:package_files"]

# The workbench unit test shells out to Node for its browser-projection case.
# Its interpreter is a pinned Buck2 input, including on feature-lane variants.
[[rule]]
packages = ["agent-workbench"]
kinds = ["bin-unit-test"]
data = ["native//:node"]
env = { LASH_WORKBENCH_TEST_NODE = "$(location native//:node)" }

# --- Test-run requests --------------------------------------------------------

# A test run's request comes from its measured row in test-run-sizes.json.
# Per-package exceptions are keyed package/crate; label pins follow below.
[test_runs]
# Timing-sensitive suites keep four cores whatever they measure. Below that the
# harness's and the runtime's own threads contend and time-sensitive cases fail
# instead of running slowly: CI run 34950810111 lost
# `//crates/lash-perf:lash-perf__unit_test` on a phase assertion and timed out
# `//crates/lash-sim:stack_policy__test` at one core. A measured p95 of 1.3
# cores for lash-perf is exactly what such a suite shows while it is healthy.
contention_floor = { cpu_count = 4, packages = ["lash-perf", "lash-sim"] }
# A hermetic PostgreSQL run holds the server beside the test binary: its
# backends and shared buffers keep the existing 1 GiB memory request. CPU
# requests still come from each label's measured row or existing default.
service_floor = { memory_kb = 1048576, packages = ["lash-internal-postgres-store"] }

# Unmeasured runs of these crates keep the larger request they have always had.
# The same crates are the suites that never join a `:test_batch`.
[test_runs.large_suites]
"agent-workbench/agent_workbench" = { cpu_count = 8, memory_kb = 4194304 }
"lash-internal-core/lash_core" = { cpu_count = 8, memory_kb = 6815744 }
"lash-runtime/lash" = { cpu_count = 8, memory_kb = 4194304 }

# Requests pinned per Buck2 label, for runs and batches whose size is policy
# rather than a measured row: too few samples for the table to price them, or
# a batch the member sum would oversize. A `__fv_` feature-variant label
# inherits its base label's pin, as it does a measured row.
[test_runs.pinned]
# Four cell threads per matrix action, with existing memory budgets.
"//crates/lash-durable-test:cell_restore_laws__test" = { cpu_count = 4, memory_kb = 524288 }
"//crates/lash-durable-test:child_turn_crash_proof__test" = { cpu_count = 4, memory_kb = 524288 }
"//crates/lash-durable-test:declared_start_crash_laws__test" = { cpu_count = 4, memory_kb = 524288 }
"//crates/lash-durable-test:drain_by_release__test" = { cpu_count = 4, memory_kb = 524288 }
"//crates/lash-durable-test:frame_switch_crash_proof__test" = { cpu_count = 4, memory_kb = 524288 }
"//crates/lash-durable-test:plugin_state_storage_laws__test" = { cpu_count = 4, memory_kb = 524288 }
"//crates/lash-durable-test:pressure_frame_crash_proof__test" = { cpu_count = 4, memory_kb = 524288 }
"//crates/lash-durable-test:process_crash_proof__test" = { cpu_count = 4, memory_kb = 524288 }
"//crates/lash-durable-test:process_step_crash_proof__test" = { cpu_count = 4, memory_kb = 524288 }
"//crates/lash-durable-test:process_tool_call_crash_laws__test" = { cpu_count = 4, memory_kb = 524288 }
"//crates/lash-durable-test:round_crash_matrix__test" = { cpu_count = 4, memory_kb = 524288 }
"//crates/lash-durable-test:tool_crash_laws__test" = { cpu_count = 4, memory_kb = 524288 }
"//crates/lash-durable-test:tool_group_pool_width__test" = { cpu_count = 4, memory_kb = 524288 }
"//crates/lash-durable-test:turn_phases__test" = { cpu_count = 4, memory_kb = 524288 }
"//crates/lash-durable-test:turn_round_crash_matrix__test" = { cpu_count = 4, memory_kb = 524288 }
"//crates/lash-durable-test:vertical_crash_proof__test" = { cpu_count = 4, memory_kb = 524288 }
"//crates/lash-durable-test:lash-durable-test__unit_test" = { cpu_count = 4, memory_kb = 524288 }

# The facade check runs rustdoc over the facade and its closure in one test
# action. At the 1.5 GiB default it held 1.91 GiB of anonymous memory and
# peaked at 2.06 GiB of the dense workers' 2.08 GiB slot share in all 38 runs
# recorded on 2026-10-01; 1.91 GiB x 1.25, in 256 MiB steps, is 2.5 GiB.
"//crates/lash:facade_completeness" = { cpu_count = 1, memory_kb = 2621440 }
# --- Service jobs --------------------------------------------------------------

# The service jobs select test labels by their execution tags or package
# (`tools/buck2/<service>_test_labels.txt`). The S3 job builds them from the
# shared cache and executes them uncached against the service it stands up;
# the PostgreSQL labels are hermetic and run on the pool. Tag selection keeps
# multi-store durable laws in the PostgreSQL job as new binaries are added.
[service_tests]
postgres = { tags = ["hermetic-postgres"] }
s3 = { packages = ["lash-internal-s3-store"] }

# --- Feature-lane variants ---------------------------------------------------

# Compile inputs a variant needs only when one of its features is on.
[feature_compile_data.agent-workbench]
provider-wire-fixtures = ["//crates/lash-sim:package_files"]

# --- Shared filegroups ---------------------------------------------------------

# Package files other packages' targets name as compile or runtime inputs.
[filegroups.lash-internal-core]
durable_read_fixture_source = { srcs = ["tests/support/durable_read_fixture.rs"] }

[filegroups.lash-dialect-typescript]
# FIG-3727: the corpora are shard trees — one file per session, generated
# session or census row — so parallel corpus changes never meet in a file.
session_oracle_corpus = { glob = [
    "tests/differential/sessions/expectations/**",
    "tests/differential/sessions/generated/**",
    "tests/test262/census/**",
] }
# The vendored Test262 selection, its harness renderings and main's outcome
# record, which the kernel dialect's runner reads.
test262_corpus = { glob = [
    "tests/test262/harness-shim/**",
    "tests/test262/outcomes/**",
    "tests/test262/sample.tsv",
    "tests/test262/test/**",
] }

# --- Exported files ------------------------------------------------------------

# Single package files another package's rule names as one `attrs.source()`
# input: a script it runs or a file it reads at its repository path. Each is
# an `export_file(mode = "reference")`, so the consumer receives the source
# artifact itself, materialized at its repository path. A filegroup would hand
# it a symlinked directory instead.
[exported_files]
# The schema `postgres_action_runner.py` applies to a hermetic test's database.
lash-internal-postgres-store = ["schema.sql"]

# --- trybuild fixtures ---------------------------------------------------------

# FIG-3364: the trusted seal lane compiles every tests/ui/*.stderr fixture with
# the toolchain rustc directly (`ui_fixtures`), reading the harness's own
# CrateInfo so fixtures see the identical `--extern` set and feature
# resolution. The fixture set mirrors the registration gates in tests/ui.rs:
# `rlm_gated` fixtures exist only when `rlm` resolves, and the `store_seam`
# pins are written for the rlm-without-testing graph, so they stay excluded
# under the canonical resolution.
[ui_fixtures.lash-runtime]
harness = "ui"
rlm_gated = [
  "linked_module_has_one_carrier",
  "module_artifact_cannot_be_assembled",
  "rlm_config_builder_requires_channel",
  "rlm_config_builder_requires_every_bound",
  "rlm_memory_limit_cannot_take_an_instruction_budget",
  "rlm_protocol_event_decode_is_not_public",
  "rlm_turn_options_cannot_name_a_dialect",
]
store_seam = [
  "attachment_store_head_has_no_default",
]

# --- facade completeness ------------------------------------------------------

# FIG-4373/FIG-4375: `//crates/lash:facade_completeness` fails when a signature
# the facade exports names a first-party type no `lash::` path reaches. It
# reads the `doc-json` subtarget of `package`'s library and of every
# first-party library in its normal-dependency closure, which the generator
# takes from Cargo's resolve (tools/buck2/facade_completeness.bzl).
[facade]
package = "lash-runtime"

[[rule]]
packages = ["transcript-contract"]
compile_data = ["//crates/lash-core-execution:rust_sources"]

# The replay-read gate (FIG-4324) reads the production sources of every crate,
# example and runbook host, and the store trait declarations, at run time.
[[rule]]
packages = ["lash-internal-core-execution"]
kinds = ["unit-test"]
data = ["//:workspace_rust_sources"]

# Kernel conformance reads independently owned rule shards and the specification.
[[rule]]
packages = ["lash-kernel-conformance"]
kinds = ["unit-test"]
compile_data = ["//docs/kernel:package_files", "//crates/lash-kernel-conformance:package_files", "//crates/lash-kernel-lib:package_files"]

[[rule]]
packages = ["kernel-embedder"]
kinds = ["lib"]
compile_data = ["//examples/kernel-embedder:package_files"]
