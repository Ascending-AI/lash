# Workspace-wide clippy configuration.
#
# Clippy reads the nearest `clippy.toml` walking up from each crate's manifest
# directory and stops at the first one it finds, so `crates/lash-core/clippy.toml`
# shadows this file for that crate and repeats the keys below.

# Test code is allowed to panic on a broken assumption; production code is not.
# The workspace lint table denies `unwrap_used`/`expect_used` (FIG-2784); these
# keys are the exemption that makes that deny apply to production code only.
# They reach `#[test]` functions and `#[cfg(test)]` modules, not the setup
# helpers beside them in an integration-test target, so those targets carry a
# reasoned crate-root `#![expect(...)]` instead.
allow-expect-in-tests = true
allow-unwrap-in-tests = true
