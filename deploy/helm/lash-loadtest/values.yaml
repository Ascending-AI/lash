nameOverride: lash-loadtest
credentialsSecret: lash-loadtest-credentials
image:
  repository: lash-loadtest
  tag: local
  pullPolicy: IfNotPresent
  runtimeBase: ubuntu:24.04
restate:
  image: restatedev/restate:1.7.12@sha256:bb9c93ab92bb401548841b35dba0e7236a3b108bc1d7d4c06a8f3ece46b80d4b
  replicas: 3
  partitions: 24
  replication: 2
  storage: 10Gi
  storageClass: ""
  rocksdbMemory: 512 MiB
  queryMemory: 128 MiB
  resources:
    requests: {cpu: "2", memory: 4Gi}
    limits: {cpu: "2", memory: 4Gi}
  nodeSelector: {}
  antiAffinity: preferred
workers:
  pgConnections: 16
  witnessConnections: 2
  count: 2
  generation: initial
  retainedGenerations: []
  generationImages: {}
  # Whether a replacement generation's own `lashctl migrate` runs as the
  # pre-upgrade hook before its workers start. The rolling-upgrade campaign
  # turns it off when it rolls back to N, whose operator only preflights the
  # store N+1 expanded.
  migrate: true
  resources:
    requests: {cpu: "2", memory: 2Gi}
    limits: {cpu: "2", memory: 2Gi}
  nodeSelector: {}
postgres:
  # Every database on this server shares this capacity. A rollback campaign
  # overrides maxGenerations to 3 and sizes maxConnections from the budget.
  maxConnections: 94
  maxGenerations: 2
  otherWorkers: 12
  adminHeadroom: 10
  image: postgres:16-alpine
  storage: 20Gi
  storageClass: ""
  resources:
    requests: {cpu: "4", memory: 8Gi}
    limits: {cpu: "4", memory: 8Gi}
  nodeSelector: {}
s3:
  mode: garage
  image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
  region: us-east-1
  bucket: lash-loadtest
  attachmentPrefix: attachments
  snapshotPrefix: snapshots
  externalEndpoint: ""
  storage: 20Gi
  storageClass: ""
  resources:
    requests: {cpu: "2", memory: 2Gi}
    limits: {cpu: "2", memory: 2Gi}
  nodeSelector: {}
provider:
  resources:
    requests: {cpu: "1", memory: 256Mi}
    limits: {cpu: "2", memory: 512Mi}
proxy:
  image: caddy:2.10.2-alpine
  resources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {cpu: "1", memory: 256Mi}
driver:
  enabled: true
  activeDeadlineSeconds: 300
  resources:
    requests: {cpu: "1", memory: 512Mi}
    limits: {cpu: "2", memory: 1Gi}
# The durable workload (FIG-4168). The recipe enables it after the topology
# gates; the smoke profile covers every durable operation class in a few turns.
load:
  enabled: false
  workload: smoke-v1
  sessions: 4
  turnsPerSession: 6
  # Keep every session sending until the fault controller ends its campaign.
  faultCampaign: false
  # The run ID the driver and the fault controller share; empty picks one.
  run: ""
  # Filled by the recipe from the rendered definition and workload before admission.
  definitionHash: ""
  target: ""
  activeDeadlineSeconds: 900
  # Preserve completed journals for L5 evidence; differs from deployment defaults.
  journalRetention: 5m
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: "2", memory: 1Gi}
# The fault controller's in-cluster hand: it reaches the witness, Restate's
# admin API and the workers' control endpoints from here.
probe:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 500m, memory: 256Mi}
metrics:
  image: prom/prometheus:v3.5.0
  scrapeInterval: 1s
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
network:
  enabled: true
  delayMs: 1
  jitterMs: 0.25
  bandwidthMbps: 1000
# The fault controller (FIG-4169, `scripts/loadtest_faults.py`). Fault times
# and restart delays come from the workload; when each fault is due the
# controller picks a worker running load work and a Restate node leading
# partitions that are processing work.
faults:
  # The generation the rolling deploy starts beside the running one, from
  # the synthetic N+1 image the recipe builds.
  rollingGeneration: next
local:
  nodeImage: kindest/node:v1.33.1@sha256:050072256b9a903bd914c0b2866828150cb229cea0efe5892e2b644d5dd3b34f
  nodes: 3
