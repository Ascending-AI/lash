{{- $name := include "loadtest.name" . -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-schema
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: schema
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "loadtest.env" . | nindent 10 }}
            - {name: WITNESS_PASSWORD, valueFrom: {secretKeyRef: {name: {{ .Values.credentialsSecret }}, key: witness-password}}}
          command: [bash, -ec]
          args:
            - |
              until psql "$DATABASE_URL" -Atqc 'SELECT 1' >/dev/null 2>&1; do sleep 1; done
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /opt/lash/schema.sql
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements'
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v witness_password="$WITNESS_PASSWORD" <<'SQL'
              CREATE ROLE lash_witness LOGIN PASSWORD :'witness_password';
              CREATE DATABASE lash_witness OWNER lash;
              SQL
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /opt/lash/witness.sql
          resources: {{ toJson .Values.driver.resources }}
---
# The server's live setting is authoritative. Run before migration and before
# Helm starts replacement workers, including rolls that reuse the image.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-connection-preflight-{{ .Values.workers.generation }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 30
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: preflight
          image: "{{ .Values.image.repository }}:{{ index .Values.workers.generationImages .Values.workers.generation | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [lashctl, preflight, --json, --processes-per-generation, {{ .Values.workers.count | quote }}, --pool-max, {{ add (int .Values.workers.pgConnections) (int .Values.workers.witnessConnections) | quote }}, --generations, {{ .Values.postgres.maxGenerations | quote }}, --workers, {{ .Values.postgres.otherWorkers | quote }}, --admin-headroom, {{ .Values.postgres.adminHeadroom | quote }}]
          env:
            - {name: LASH_POSTGRES_DATABASE_URL, valueFrom: {secretKeyRef: {name: {{ .Values.credentialsSecret }}, key: database-url}}}
          resources: {{ toJson .Values.driver.resources }}
{{- $replacement := index .Values.workers.generationImages .Values.workers.generation }}
{{- if $replacement }}
---
# A worker generation built apart from the bootstrap image is a replacement
# build (FIG-4169's rolling deploy): its own operator binary expands the
# store before its workers start. Expanding an expanded store is a no-op.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-migrate-{{ .Values.workers.generation }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ $replacement }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [lashctl, migrate, --json]
          env:
            - {name: LASH_POSTGRES_DATABASE_URL, valueFrom: {secretKeyRef: {name: {{ .Values.credentialsSecret }}, key: database-url}}}
          resources: {{ toJson .Values.driver.resources }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata: {name: {{ $name }}-provider}
spec:
  selector: {app: {{ $name }}-provider}
  ports: [{name: http, port: 18001}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ $name }}-provider}
spec:
  replicas: 1
  selector: {matchLabels: {app: {{ $name }}-provider}}
  template:
    metadata: {labels: {app: {{ $name }}-provider}}
    spec:
      containers:
        - name: provider
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [lash-e2e-mock-provider]
          {{- include "loadtest.env" . | nindent 10 }}
            - {name: MOCK_PROVIDER_PORT, value: "18001"}
          resources: {{ toJson .Values.provider.resources }}
          readinessProbe: {httpGet: {path: /health, port: 18001}, periodSeconds: 2}
{{- if .Values.driver.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-smoke
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.driver.activeDeadlineSeconds }}
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-topology
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [bash, -ec]
          args:
            - |
              until curl -fsS http://{{ $name }}-restate:9070/health >/dev/null; do sleep 1; done
              {{ range $index := until (int .Values.workers.count) }}until curl -fsS http://{{ $name }}-worker-{{ $index }}-{{ $.Values.workers.generation }}:18101/health >/dev/null; do sleep 1; done
              {{ end }}
      containers:
        - name: smoke
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [lash-loadtest-smoke]
          {{- include "loadtest.env" . | nindent 10 }}
            - {name: WORKER_DEPLOYMENT_URL, value: "http://{{ $name }}-workers-{{ .Values.workers.generation }}:18100"}
            - {name: WORKER_CONTROL_URLS, value: "{{ range $index := until (int .Values.workers.count) }}{{ if $index }},{{ end }}http://{{ $name }}-worker-{{ $index }}-{{ $.Values.workers.generation }}:18101{{ end }}"}
          resources: {{ toJson .Values.driver.resources }}
{{- end }}
{{- if .Values.load.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-load
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.load.activeDeadlineSeconds }}
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-topology
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [bash, -ec]
          args:
            - |
              until curl -fsS http://{{ $name }}-restate:9070/health >/dev/null; do sleep 1; done
              {{ range $index := until (int .Values.workers.count) }}until curl -fsS http://{{ $name }}-worker-{{ $index }}-{{ $.Values.workers.generation }}:18101/health >/dev/null; do sleep 1; done
              {{ end }}
      containers:
        - name: load
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [lash-loadtest-driver]
          {{- include "loadtest.env" . | nindent 10 }}
            - {name: LASH_LOAD_SESSIONS, value: {{ .Values.load.sessions | quote }}}
            - {name: LASH_LOAD_TURNS_PER_SESSION, value: {{ .Values.load.turnsPerSession | quote }}}
            - {name: LASH_LOAD_FAULT_CAMPAIGN, value: {{ ternary "1" "0" .Values.load.faultCampaign | quote }}}
            {{- if .Values.load.run }}
            - {name: LASH_LOAD_RUN, value: {{ .Values.load.run | quote }}}
            {{- end }}
            - {name: WORKER_CONTROL_URLS, value: "{{ range $index := until (int .Values.workers.count) }}{{ if $index }},{{ end }}http://{{ $name }}-worker-{{ $index }}-control:18101{{ end }}"}
            - {name: LASH_LOAD_MEASUREMENTS_PATH, value: /tmp/load-measurements.jsonl}
            - {name: LASH_LOAD_JOURNAL_RETENTION, value: {{ .Values.load.journalRetention | quote }}}
            - {name: RESTATE_METRICS_URLS, value: "{{ range $index := until (int .Values.restate.replicas) }}{{ if $index }},{{ end }}http://{{ $name }}-restate-{{ $index }}.{{ $name }}-peers:5122{{ end }}"}
          resources: {{ toJson .Values.load.resources }}
{{- end }}
