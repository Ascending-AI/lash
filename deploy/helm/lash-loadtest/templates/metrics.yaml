{{- $name := include "loadtest.name" . -}}
apiVersion: v1
kind: ConfigMap
metadata: {name: {{ $name }}-metrics}
data:
  prometheus.yml: |
    global: {scrape_interval: {{ .Values.metrics.scrapeInterval }}}
    scrape_configs:
      - job_name: restate
        static_configs:
          - targets: [{{ range $index := until (int .Values.restate.replicas) }}{{ if $index }}, {{ end }}"{{ $name }}-restate-{{ $index }}.{{ $name }}-peers:5122"{{ end }}]
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ $name }}-metrics}
spec:
  replicas: 1
  selector: {matchLabels: {app: {{ $name }}-metrics}}
  template:
    metadata: {labels: {app: {{ $name }}-metrics}}
    spec:
      {{- include "loadtest.placement" .Values.metrics | nindent 6 }}
      containers:
        - name: prometheus
          image: {{ .Values.metrics.image }}
          args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=2h]
          resources: {{ toJson .Values.metrics.resources }}
          volumeMounts: [{name: config, mountPath: /etc/prometheus}]
      volumes: [{name: config, configMap: {name: {{ $name }}-metrics}}]
---
apiVersion: v1
kind: Service
metadata: {name: {{ $name }}-metrics}
spec:
  selector: {app: {{ $name }}-metrics}
  ports: [{name: http, port: 9090}]
---
# The fault controller's targets (FIG-4169): every worker and Restate node it
# may pick from, and both generations' deployment URLs.
apiVersion: v1
kind: ConfigMap
metadata: {name: {{ $name }}-faults}
data:
  targets.json: |
    {{- $targets := dict
      "namespace" .Release.Namespace
      "name" $name
      "generation" .Values.workers.generation
      "rollingGeneration" .Values.faults.rollingGeneration
      "workerCount" (int .Values.workers.count)
      "restatePods" (list)
      "partitions" (int .Values.restate.partitions)
      "probe" (printf "%s-fault-probe" $name)
      "restateAdminUrl" (printf "http://%s-restate:9070" $name)
    }}
    {{- range $index := until (int .Values.restate.replicas) }}
    {{- $_ := set $targets "restatePods" (append $targets.restatePods (printf "%s-restate-%d" $name $index)) }}
    {{- end }}
    {{ toJson $targets }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ $name }}-fault-probe}
spec:
  replicas: 1
  selector: {matchLabels: {app: {{ $name }}-fault-probe}}
  template:
    metadata: {labels: {app: {{ $name }}-fault-probe}}
    spec:
      {{- include "loadtest.placement" .Values.probe | nindent 6 }}
      containers:
        - name: probe
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [sleep, infinity]
          {{- include "loadtest.env" . | nindent 10 }}
          resources: {{ toJson .Values.probe.resources }}
