[package]
name = "lash-internal-vm-releases"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "lash's own packages, as build-generated data, and what a parent holds of them."

[lib]
name = "lash_vm_releases"
doctest = false

# Which dialects' helper releases the build defines and holds, each off by
# default: a host names the dialects it builds with (FIG-5990). The
# extensions (ECMAScript regular expressions and dates, WHATWG URLs) are the
# TypeScript dialect's, and each dialect has its operations' natives.
[features]
dialect-typescript = [
    "dep:lash-dialect-typescript",
    "dep:lash-ext-date-ecma",
    "dep:lash-ext-regex-ecma",
    "dep:lash-ext-url-whatwg",
    "dep:lash-ext-ts-core",
]
dialect-python = ["dep:lash-dialect-python", "dep:lash-ext-py-core"]
# The synthetic successor's kernel version and helper change, made by a
# worker and its parent alike.
synthetic-next = [
    "lash-kernel-doc/synthetic-next",
    "lash-kernel-package/synthetic-next",
]

[[bin]]
name = "record-helper-data"
path = "src/bin/record-helper-data.rs"
required-features = ["dialect-typescript", "dialect-python"]
test = false

[lints]
workspace = true

# The library holds data alone: a host that only edits links it, and links no
# dialect or extension (FIG-5812). The build script defines the helpers.
[dependencies]
lash-vocabulary = { workspace = true }
lash-kernel-doc = { workspace = true }
lash-kernel-package = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
lash-kernel-package = { workspace = true }
thiserror = { workspace = true }
lash-kernel-doc = { workspace = true }
lash-kernel-dialect = { workspace = true }
lash-kernel-lib = { workspace = true }
lash-kernel-vm = { workspace = true }
lash-dialect-typescript = { workspace = true, optional = true }
lash-dialect-python = { workspace = true, optional = true }
lash-ext-date-ecma = { workspace = true, optional = true }
lash-ext-regex-ecma = { workspace = true, optional = true }
lash-ext-url-whatwg = { workspace = true, optional = true }
lash-ext-ts-core = { workspace = true, optional = true }
lash-ext-py-core = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
lash-kernel-package = { workspace = true }
lash-ext-regex-ecma = { workspace = true }
lash-ext-date-ecma = { workspace = true }
lash-ext-url-whatwg = { workspace = true }
lash-kernel-lib = { workspace = true }
