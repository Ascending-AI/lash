[package]
name = "lash-internal-typescript"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "The ECMA-exact TypeScript dialect front-end for the Lash heap VM."
keywords = ["lash", "typescript", "codeact", "agent"]
categories = ["compilers", "parser-implementations"]

[lib]
name = "lash_typescript"

[features]
testing = []

[lints]
workspace = true

[dependencies]
lashlang = { workspace = true }
ryu-js = { workspace = true }
serde_json = { workspace = true }
swc_common = { workspace = true }
swc_ecma_ast = { workspace = true }
swc_ecma_parser = { workspace = true }

[dev-dependencies]
futures = "0.3"
lash-typescript = { package = "lash-internal-typescript", path = ".", features = ["testing"] }
serde = { workspace = true, features = ["derive"] }
serde_yaml = "=0.9.34"
swc_common = { workspace = true }
swc_ecma_ast = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[[test]]
name = "integration"
path = "tests/main.rs"
