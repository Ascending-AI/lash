[package]
name = "lash-internal-typescript"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "The ECMA-exact TypeScript dialect front-end for the Lash heap VM."
keywords = ["lash", "typescript", "codeact", "agent"]
categories = ["compilers", "parser-implementations"]


# FIG-3571 (ADR 0100 R8): `scripts/check-workflow-graph-model.sh` reads this
# role. A language-neutral crate may not reach a front-end crate through its
# dependency graph.
[package.metadata.lash]
role = "front-end"

[lib]
name = "lash_typescript"
doctest = false

[features]
testing = []

[lints]
workspace = true

[dependencies]
lashlang = { workspace = true }
ryu-js = { workspace = true }
serde_json = { workspace = true }
swc_common = { workspace = true }
swc_ecma_ast = { workspace = true }
swc_ecma_parser = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
futures = "0.3"
jsonschema = { workspace = true, default-features = false }
lashlang = { workspace = true, features = ["testing"] }
lash-sansio = { workspace = true }
lash-typescript = { package = "lash-internal-typescript", path = ".", features = ["testing"] }
serde = { workspace = true, features = ["derive"] }
serde_yaml = "=0.9.34"
strum = { workspace = true }
swc_common = { workspace = true }
swc_ecma_ast = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[[test]]
name = "integration"
path = "tests/main.rs"

# Its own binary: the scripted host is one more instantiation of the generic
# VM, and the integration binary's compile is already at its memory request.
[[test]]
name = "race_any_runtime"
path = "tests/race_any_runtime.rs"

# Its own binary for the same reason: the carrier laws (FIG-3571) link
# modules, compile artifacts and project graphs, and the integration binary's
# compile is already at its memory request.
[[test]]
name = "carrier_laws"
path = "tests/carrier_laws.rs"

# Its own binary: the corpus laws (FIG-3599) link, project, print and relink
# every program of every corpus, and the integration binary's compile is
# already at its memory request.
[[test]]
name = "corpus_laws"
path = "tests/corpus_laws.rs"

# The Test262 PR lane (FIG-3646): census and record checks plus a stratified
# sample of the selection. Its own binary so the PR partition runs it without
# the integration binary.
[[test]]
name = "test262"
path = "tests/test262_sample.rs"

# The whole Test262 selection against the same record: the workspace
# partition's tail and the nightly run.
[[test]]
name = "test262_full"
path = "tests/test262_full.rs"
