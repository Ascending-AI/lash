[package]
name = "lash-provider-google"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Google OAuth (Gemini via Code Assist) provider for lash."
keywords = ["lash", "agent", "llm", "google", "gemini"]
categories = ["api-bindings", "asynchronous"]

[features]
# Enables public test support and the cross-provider response-normalization
# conformance test. CI opts in explicitly; production builds keep it disabled.
default = []
testing = ["lash-llm-transport/testing"]

[lints]
workspace = true

[dependencies]
lash-core = { workspace = true }
lash-llm-transport = { workspace = true }
lash-provider-auth = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
lash-llm-transport = { workspace = true, features = ["proptest-support", "testing"] }
proptest = "1"
tokio = { workspace = true, features = ["rt", "time"] }
