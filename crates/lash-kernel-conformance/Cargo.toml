[package]
name = "lash-kernel-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Dialect-independent kernel rule corpus and reader, machine and native conformance harnesses."
publish = false

[lib]
doctest = false

[features]
# Shipped release fixtures are opt-in; the generic rule harness needs none.
shipped-library = ["dep:lash-kernel-releases"]
dialect-typescript = [
    "shipped-library",
    "lash-kernel-releases/dialect-typescript",
    "dep:lash-ext-date-ecma",
    "dep:lash-ext-regex-ecma",
    "dep:lash-ext-url-whatwg",
    "dep:lash-ext-ts-core",
]
dialect-python = [
    "shipped-library",
    "lash-kernel-releases/dialect-python",
    "dep:lash-ext-py-core",
]

[lints]
workspace = true

[dependencies]
lash-kernel-releases = { workspace = true, optional = true }
lash-ext-date-ecma = { workspace = true, optional = true }
lash-ext-regex-ecma = { workspace = true, optional = true }
lash-ext-url-whatwg = { workspace = true, optional = true }
lash-ext-ts-core = { workspace = true, optional = true }
lash-ext-py-core = { workspace = true, optional = true }
lash-kernel-value = { workspace = true }
arbitrary = "1"
lash-kernel-check.workspace = true
lash-kernel-dialect.workspace = true
lash-kernel-doc.workspace = true
lash-kernel-lib.workspace = true
lash-kernel-package.workspace = true
lash-kernel-exec.workspace = true
lash-kernel-state.workspace = true
lash-kernel-vm.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
lash-kernel-engine = { workspace = true, features = ["dialect-typescript", "dialect-python"] }
lash-kernel-services = { workspace = true }
lash-kernel-releases = { workspace = true, features = ["dialect-typescript", "dialect-python"] }
lash-kernel-package = { workspace = true, features = ["testing"] }
lash-ext-helper-compiler = { workspace = true }
kernel-embedder = { path = "../../examples/kernel-embedder" }
lash-kernel-edit.workspace = true
lash-kernel-view.workspace = true
lash-ext-regex-ecma = { path = "../lash-ext-regex-ecma" }

# Helper conformance uses the shared dialect runner.
lash-ext-date-ecma.workspace = true
lash-ext-url-whatwg.workspace = true
lash-dialect-python.workspace = true
lash-dialect-typescript.workspace = true
lash-ext-py-core.workspace = true
lash-ext-ts-core.workspace = true
