[package]
name = "lash-internal-sansio"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Sans-IO protocol kernel for the lash agent runtime. Turn machine and protocol driver contracts; no IO or async."
keywords = ["lash", "agent", "sans-io", "protocol", "runtime"]
categories = ["asynchronous", "api-bindings"]

[lib]
name = "lash_sansio"
doctest = false

[lints]
workspace = true

[features]
default = []
testing = ["lash-protocol-types/testing"]
schema-validation = ["lash-protocol-types/schema-validation"]
synthetic-next = ["lash-protocol-types/synthetic-next"]

[dependencies]
lash-vocabulary = { workspace = true }
lash-protocol-types = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }

[dev-dependencies]
lash-protocol-types = { workspace = true, features = ["testing"] }
