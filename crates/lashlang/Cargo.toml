[package]
name = "lash-internal-lashlang"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Lashlang: compact CodeAct language for model-authored REPL blocks in the lash agent runtime."
keywords = ["lash", "lashlang", "agent", "codeact", "llm"]
categories = ["asynchronous", "api-bindings"]

[lib]
name = "lashlang"
doctest = false

[features]
# Expose `lashlang::testing::conformance` so downstream crates (the durable
# artifact stores) can hold their `LashlangArtifactStore` implementations to the
# same executable contract as the in-memory double.
testing = []

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
compact_str = { version = "0.9.0", features = ["serde"] }
futures-executor = "0.3"
lash-core = { workspace = true }
lash-regress = { workspace = true }
lash-sansio = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
rustc-hash = "2"
rmp-serde = { workspace = true }
ryu-js = { workspace = true }
schemars = { workspace = true }
serde = { version = "1", features = ["derive", "rc"] }
serde_ignored = "0.1"
serde_json = "1"
sha2 = { workspace = true }
smallvec = "1"
thiserror = "2"
url = { workspace = true }

[dev-dependencies]
# Version-less on purpose: lash-typescript depends on this crate, so a
# versioned dev-dependency back onto it would be a publish cycle (a
# versioned dev-dep survives into the published manifest and has to
# resolve on the index). Path-only dev-deps are stripped when packaging.
lash-typescript = { package = "lash-internal-typescript", path = "../lash-typescript" }
criterion = { version = "0.5", features = ["async_tokio"] }
futures = "0.3"
insta = "1"
jsonschema = { workspace = true, default-features = false }
proptest = "1"
tokio = { version = "1", features = ["macros", "rt", "time"] }

[[test]]
name = "integration"
path = "tests/main.rs"

[[test]]
name = "dialect_cost"
path = "tests/dialect_cost.rs"

[[test]]
name = "append_cost"
path = "tests/append_cost.rs"

[[test]]
name = "diagnostic_locations"
path = "tests/diagnostic_locations.rs"

[[test]]
name = "benchmark_contract"
path = "tests/benchmark_contract.rs"

[[test]]
name = "stack_budget"
path = "tests/stack_budget.rs"

[[test]]
name = "property"
path = "tests/property.rs"

[[bench]]
name = "benchmark"
harness = false
