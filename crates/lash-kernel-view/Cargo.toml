[package]
name = "lash-kernel-view"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "The lash kernel's workflow view: the canvas read of a checked document's entry, with no dialect, editor or runtime."
keywords = ["lash", "kernel", "workflow", "view"]
categories = ["data-structures"]
publish = false

[lib]
name = "lash_kernel_view"
doctest = false

[lints]
workspace = true

[dependencies]
lash-helper-labels = { workspace = true }
lash-kernel-check = { workspace = true }
lash-kernel-doc = { workspace = true }
lash-kernel-package = { workspace = true }
schemars = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
lash-vm-library = { workspace = true, features = ["dialect-typescript", "dialect-python"] }
lash-dialect-typescript = { workspace = true }
lash-dialect-python = { workspace = true }
lash-kernel-dialect = { workspace = true }
lash-vm-worker = { workspace = true, features = ["dialect-typescript", "dialect-python"] }
lash-kernel-edit = { workspace = true }

[[bin]]
name = "kernel_view_schema_generator"
path = "src/bin/kernel_view_schema_generator.rs"
