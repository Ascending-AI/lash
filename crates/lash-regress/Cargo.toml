[package]
name = "lash-regress"
autotests = false
version.workspace = true
authors = ["ridiculousfish <corydoras@ridiculousfish.com>"]
description = "Lash's fuel-metered fork of the regress ECMAScript regular expression engine"
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["regex", "regexp"]
edition.workspace = true
rust-version.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
default = ["backend-pikevm", "std"]

std = ["memchr/std"]

# Enables the PikeVM backend.
backend-pikevm = []

# Prefers indexes to pointers for bytecode IP and string positions, for the paranoid.
index-positions = []

# Prohibits all uses of unsafe code, for the paranoid.
prohibit-unsafe = []

# Enables UTF-16 support. This disables some optimizations, so it should only be used when necessary.
utf16 = []

[dependencies]
hashbrown = "0.16.0"
memchr = { version = "2.4.0", default-features = false, features = ["alloc"] }

[[test]]
name = "integration"
path = "tests/main.rs"

[[test]]
name = "unicode_property_escapes"
path = "tests/unicode_property_escapes.rs"

[[test]]
name = "unicodesets"
path = "tests/unicodesets.rs"
