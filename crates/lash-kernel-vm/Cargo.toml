[package]
name = "lash-kernel-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "The lash kernel's machine: runs an admitted document as tasks, charges it, parks it and resumes it."
keywords = ["lash", "kernel", "workflow", "interpreter"]
categories = ["emulators"]
publish = false

[lib]
name = "lash_kernel_vm"
doctest = false

[features]
# Differential execution controls for embedders' laws.
testing = []
# Unsupported synchronous capture/import diagnostics; absent from ordinary builds.
perf-witness = ["lash-kernel-state/perf-witness", "lash-kernel-doc/perf-witness"]
# The machine also runs the synthetic successor of kernel version 1.
synthetic-next = ["lash-kernel-doc/synthetic-next", "lash-kernel-state/synthetic-next"]

[lints]
workspace = true

[dependencies]
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
lash-kernel-value = { workspace = true }
lash-kernel-dialect = { workspace = true }
lash-kernel-doc = { workspace = true }
lash-kernel-package = { workspace = true }
lash-kernel-exec = { workspace = true }
lash-kernel-state = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
lash-kernel-doc = { workspace = true, features = ["perf-witness"] }
lash-kernel-check = { workspace = true }
lash-kernel-lib = { workspace = true }
lash-kernel-package = { workspace = true, features = ["testing"] }
lash-kernel-state = { workspace = true, features = ["perf-witness"] }
