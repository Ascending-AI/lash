[package]
name = "lash-kernel-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "The lash kernel's machine: runs an admitted document as tasks, charges it, parks it and resumes it."
keywords = ["lash", "kernel", "workflow", "interpreter"]
categories = ["emulators"]
publish = false

[lib]
name = "lash_kernel_vm"
doctest = false

[features]
# The machine also runs the synthetic successor of kernel version 1.
synthetic-next = ["lash-kernel-doc/synthetic-next", "lash-kernel-state/synthetic-next"]

[lints]
workspace = true

[dependencies]
cranelift-codegen = { workspace = true }
cranelift-frontend = { workspace = true }
cranelift-jit = { workspace = true }
cranelift-module = { workspace = true }
cranelift-native = { workspace = true }
lash-kernel-doc = { workspace = true }
lash-kernel-state = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
