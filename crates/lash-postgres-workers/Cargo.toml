[package]
name = "lash-internal-postgres-workers"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false
description = "Failover harness of the lash-postgres-workers runbook: lash nodes over one PostgreSQL store as OS processes, killed, partitioned, stopped and restarted under a witness ledger"

[lib]
name = "lash_postgres_workers"
doctest = false

[[bin]]
name = "lash-postgres-workers-node"
path = "src/bin/node.rs"
test = false

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
lash-core = { workspace = true }
lash-core-execution = { workspace = true, features = ["testing"] }
lash-core-store = { workspace = true, features = ["testing"] }
lash-durable = { workspace = true }
lash-postgres-store = { workspace = true }
lash-sansio = { workspace = true }
lash-typescript = { workspace = true }
lash-vm-broker = { workspace = true }
lashlang = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true, default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
