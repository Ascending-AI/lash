[package]
name = "lash-internal-vm-client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Parent-owned bounded worker pool and opaque-state client."

[lib]
name = "lash_vm_client"
doctest = false

[features]
# Development heap tracing needs a longer Ready handshake, not a longer live watchdog.
dhat-heap = []
synthetic-next = [
    "lash-kernel-package/synthetic-next",
    "lash-kernel-migrate/synthetic-next",
    "lash-vm-releases/synthetic-next",
    "lash-vm-protocol/synthetic-next",
    "lash-vm-broker/synthetic-next",
    "lash-core-execution/synthetic-next",
    "lash-kernel-doc/synthetic-next",
    "lash-kernel-vm/synthetic-next",
]
testing = []
perf-witness = ["lash-core-execution/perf-witness"]

[lints]
workspace = true

[dependencies]
lash-protocol-types = { workspace = true }
lash-vocabulary = { workspace = true }
lash-kernel-package = { workspace = true }
lash-kernel-migrate = { workspace = true, optional = true }
lash-vm-releases = { workspace = true }
lash-core-execution = { workspace = true }
lash-vm-broker = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
lash-vm-protocol = { workspace = true }
lash-kernel-doc = { workspace = true }
lash-kernel-dialect = { workspace = true }
lash-kernel-state = { workspace = true }
lash-kernel-vm = { workspace = true }
lash-core-store = { workspace = true }
schemars = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
rmp-serde = { workspace = true }
serde_json = { workspace = true }
serde_bytes = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }

[[bin]]
name = "worker_wire_schema_generator"
path = "src/bin/worker_wire_schema_generator.rs"
