[package]
name = "lash-internal-vm-client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Parent-owned bounded worker pool and opaque-state client."

[lib]
name = "lash_vm_client"
doctest = false

[features]
synthetic-next = ["lash-vm-protocol/synthetic-next", "lash-vm-broker/synthetic-next", "lash-vm/synthetic-next"]
testing = []

[lints]
workspace = true

[package.metadata.lash]
role = "language-neutral"

[dependencies]
lash-core-execution = { workspace = true }
lash-vm-broker = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
lash-vm-protocol = { workspace = true }
lash-vm = { workspace = true }
serde = { workspace = true, features = ["derive"] }
rmp-serde = { workspace = true }
serde_json = { workspace = true }
serde_bytes = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }


[dev-dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
