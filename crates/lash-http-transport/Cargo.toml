[package]
name = "lash-internal-http-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Host-configurable HTTP transport seam for Lash integrations."
keywords = ["lash", "transport", "http", "async"]
categories = ["asynchronous", "network-programming"]

[lib]
name = "lash_http_transport"
doctest = false

[lints]
workspace = true

[dependencies]
lash-transport-failure = { workspace = true }
lash-protocol-types = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true, features = ["json", "query", "stream", "rustls", "http2"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }
