[package]
name = "lash-upgrade-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Phase A's synthetic N+1 harness (ADR 0115 §6): two builds of one tree rolled, rolled back and rolled again over real stores and a real Restate server. Not shipped."

[features]
# The synthetic N+1 build (ADR 0115 §6). It moves the constants whose
# `synthetic-next` blocks sit beside them in the crates it forwards to. No
# production build enables it.
synthetic-next = [
    "lash-restate/synthetic-next",
    "lash/synthetic-next",
    "lash-postgres-store/synthetic-next",
    "lashlang/synthetic-next",
    "lash-vm-client/synthetic-next",
]

[lib]
name = "lash_upgrade_harness"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "lash-upgrade-node"
path = "src/bin/lash-upgrade-node.rs"

[[bin]]
name = "lash-e2e-proxy"
path = "src/bin/lash-e2e-proxy.rs"

[[test]]
name = "phase_a"
path = "tests/phase_a/main.rs"

[[test]]
name = "rolling"
path = "tests/rolling/main.rs"

[[test]]
name = "e2e_hosts"
path = "tests/e2e/hosts.rs"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[[test]]
name = "e2e_h3"
path = "tests/e2e/h3.rs"

[[test]]
name = "e2e_telemetry"
path = "tests/e2e/telemetry.rs"

[[test]]
name = "h1_providers"
path = "tests/e2e/providers.rs"

[[test]]
name = "h1_recovery"
path = "tests/e2e/provider_recovery.rs"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
lash-vm-client = { workspace = true }
lash = { workspace = true, features = ["restate", "sqlite", "typescript", "rlm", "testing"] }
lash-provider-openai = { workspace = true }
lash-core = { workspace = true, features = ["testing"] }
lash-core-store = { workspace = true }
lash-lashlang-runtime = { workspace = true }
lashlang = { workspace = true }
lash-postgres-store = { workspace = true }
lash-remote-protocol = { workspace = true, features = ["core-conversions"] }
lash-restate = { workspace = true }
lash-restate-test = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true, features = ["json", "http2"] }
prost = { workspace = true }
sqlx = { workspace = true, default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
clap = { workspace = true, features = ["derive", "env"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "signal", "time", "net", "io-util", "sync"] }

[dev-dependencies]
lash = { workspace = true, features = ["otel-trace"] }
opentelemetry_sdk = { version = "0.33", features = ["metrics"] }
tempfile = { workspace = true }
rusqlite = { version = "0.37", features = ["bundled"] }
lash-postgres-store = { workspace = true, features = ["testing"] }
lash-sqlite-store = { workspace = true, features = ["testing"] }
