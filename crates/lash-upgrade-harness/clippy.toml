# Crate-local clippy configuration. Clippy stops at the first `clippy.toml`
# it finds walking up from the manifest directory, so this file shadows the
# workspace one entirely.
#
# lash-upgrade-harness is a test host: its node binary reads its environment
# and store paths, and its tests spawn the node builds as processes (FIG-2971).
# The workspace `disallowed-methods` ambient fs/env/process ban therefore does
# not apply here; the test exemptions below are repeated to match the
# workspace file.
allow-expect-in-tests = true
allow-unwrap-in-tests = true
