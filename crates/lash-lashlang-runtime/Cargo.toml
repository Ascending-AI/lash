[package]
name = "lash-internal-lashlang-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Lashlang runtime integration for lash-core process engines and tool surfaces."
keywords = ["lash", "agent", "runtime", "lashlang"]
categories = ["asynchronous", "api-bindings"]


# FIG-3571 (ADR 0100 R8): `scripts/check-workflow-graph-model.sh` reads this
# role. A language-neutral crate may not reach a front-end crate through its
# dependency graph.
[package.metadata.lash]
role = "language-neutral"

[lib]
name = "lash_lashlang_runtime"
doctest = false

[features]
testing = ["lash-core/testing", "lashlang/testing"]

[lints]
workspace = true

[dependencies]
lash-sansio = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
lash-core = { workspace = true }
lash-core-worker = { workspace = true }
lash-remote-protocol = { workspace = true }
lash-trace = { workspace = true }
lashlang = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
lash-core = { workspace = true, features = ["testing"] }
lash-core-execution = { workspace = true }
lashlang = { workspace = true, features = ["testing"] }
lash-sqlite-store = { workspace = true }
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = { workspace = true }
