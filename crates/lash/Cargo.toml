[package]
# Crate name on crates.io. The library is still imported as `lash`
# (see lib section below) so `use lash::...` keeps working everywhere.
name = "lash-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Durable agent runtime for Rust: sessions, turns, tools, plugins. Embeddable facade over lash-core."
keywords = ["lash", "agent", "llm", "runtime", "ai"]
categories = ["asynchronous", "api-bindings"]

[lib]
name = "lash"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
lash-sansio = { workspace = true, features = ["schema-validation"] }
async-trait = { workspace = true }
futures-util = { workspace = true }
lash-core = { workspace = true }
lash-core-worker = { workspace = true }
lash-lashlang-runtime = { workspace = true, optional = true }
lash-remote-protocol = { workspace = true, features = ["core-conversions"] }
lash-tool-support = { workspace = true }
lash-provider-anthropic = { workspace = true, optional = true }
lash-provider-google = { workspace = true, optional = true }
lash-provider-openai = { workspace = true, optional = true }
lash-plugin-mcp = { workspace = true, optional = true }
lash-postgres-store = { workspace = true, optional = true }
lash-restate = { workspace = true, optional = true }
lash-s3-store = { workspace = true, optional = true }
lash-sqlite-store = { workspace = true, optional = true }
lash-subagents = { workspace = true, optional = true }
lash-typescript = { workspace = true, optional = true }
lash-http-transport = { workspace = true, optional = true }
lash-protocol-rlm = { workspace = true, optional = true }
lash-protocol-standard = { workspace = true }
lash-plugin-tool-output-budget = { workspace = true }
lash-plugin-process-controls = { workspace = true, optional = true }
lash-rlm-types = { workspace = true, optional = true }
lash-trace = { workspace = true }
uuid = { workspace = true }
lashlang = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[features]
default = []
rlm = [
    "dep:lash-lashlang-runtime",
    "dep:lash-plugin-process-controls",
    "dep:lash-protocol-rlm",
    "dep:lash-rlm-types",
    "dep:lashlang",
]

# Host-wired extension features (ADR 0079 section 1). Each gates one
# `lash::<name>` module that re-exports the matching internal crate's
# host-facing surface; none is enabled by default.
sqlite = ["dep:lash-sqlite-store"]
postgres = ["dep:lash-postgres-store"]
s3 = ["dep:lash-s3-store"]
restate = ["dep:lash-restate"]
openai = ["dep:lash-provider-openai"]
anthropic = ["dep:lash-provider-anthropic"]
google = ["dep:lash-provider-google"]
mcp = ["dep:lash-plugin-mcp"]
subagents = ["dep:lash-subagents"]
typescript = ["dep:lash-typescript"]
http-transport = ["dep:lash-http-transport"]
# Exposes `lash::testing` (e.g. `TestProvider`) for embedder integration tests.
# The durable-backend certification laws are not part of the facade: a host
# depends on `lash-internal-conformance` directly, so the laws stay off the
# facade's dependency edge.
testing = [
    "lash-core/testing",
    "lash-protocol-rlm?/testing",
    "lashlang?/testing",
]
# Exposes the OpenTelemetry trace sink (`lash::tracing::OtelTraceSink`).
otel-trace = ["lash-core/otel-trace"]

[dev-dependencies]
lash-conformance.workspace = true
insta = "1"
lash-core = { workspace = true, features = ["testing"] }
lashlang = { workspace = true, features = ["testing"] }
lash-llm-tools = { workspace = true }
lash-plugin-standard-compaction = { workspace = true }
lash-subagents = { workspace = true }
lash-sqlite-store = { workspace = true, features = ["testing"] }
lash-postgres-store = { workspace = true, features = ["testing"] }
lash-provider-anthropic = { workspace = true, features = ["testing"] }
lash-protocol-rlm = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sqlx = { workspace = true, default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
rmp-serde = { workspace = true }
serde_bytes = { workspace = true }
trybuild = "1"
tracing-subscriber = { workspace = true }
# The compile-fail proof that a Restate process segment cannot reach its
# effects without the committed start marker's proof (FIG-3588).
lash-restate = { workspace = true }
