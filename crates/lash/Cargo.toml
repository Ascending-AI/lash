[package]
# Crate name on crates.io. The library is still imported as `lash`
# (see lib section below) so `use lash::...` keeps working everywhere.
name = "lash-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Durable agent runtime for Rust: sessions, turns, tools, plugins. Embeddable facade over lash-core."
keywords = ["lash", "agent", "llm", "runtime", "ai"]
categories = ["asynchronous", "api-bindings"]

[lib]
name = "lash"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
lash-sansio = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
lash-core = { workspace = true }
lash-lashlang-runtime = { workspace = true, optional = true }
lash-remote-protocol = { workspace = true, features = ["core-conversions"] }
lash-tool-support = { workspace = true }
lash-protocol-rlm = { workspace = true, optional = true }
lash-protocol-standard = { workspace = true }
lash-plugin-tool-output-budget = { workspace = true }
lash-rlm-types = { workspace = true, optional = true }
lash-trace = { workspace = true }
uuid = { workspace = true }
lashlang = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[features]
default = []
rlm = [
    "dep:lash-lashlang-runtime",
    "dep:lash-protocol-rlm",
    "dep:lash-rlm-types",
    "lash-protocol-standard/lashlang",
]
# Exposes `lash::testing` (e.g. `TestProvider`) for embedder integration tests.
testing = ["lash-core/testing", "lash-protocol-rlm?/testing"]
# Exposes the OpenTelemetry trace sink (`lash::tracing::OtelTraceSink`).
otel-trace = ["lash-core/otel-trace"]

[dev-dependencies]
insta = "1"
lash-core = { workspace = true, features = ["testing"] }
lash-llm-tools = { workspace = true }
lash-plugin-process-controls = { workspace = true }
lash-subagents = { workspace = true }
lash-tools = { workspace = true }
lash-sqlite-store = { workspace = true }
lash-postgres-store = { workspace = true, features = ["testing"] }
lash-protocol-rlm = { workspace = true, features = ["testing"] }
lash-standard-plugins = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sqlx = { workspace = true, default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
rmp-serde = { workspace = true }
serde_bytes = { workspace = true }
sha2 = { workspace = true }
trybuild = "1"
tracing-subscriber = { workspace = true }
