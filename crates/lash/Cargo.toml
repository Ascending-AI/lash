[package]
# Crate name on crates.io. The library is still imported as `lash`
# (see lib section below) so `use lash::...` keeps working everywhere.
name = "lash-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Durable agent runtime for Rust: sessions, turns, tools, plugins. Embeddable facade over lash-core."
keywords = ["lash", "agent", "llm", "runtime", "ai"]
categories = ["asynchronous", "api-bindings"]

[lib]
name = "lash"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
lash-durable = { workspace = true }
lash-execution-contracts = { workspace = true }
lash-transport-failure = { workspace = true }
lash-dialect-typescript = { workspace = true, optional = true }
lash-dialect-python = { workspace = true, optional = true }
lash-kernel-doc = { workspace = true, optional = true }
lash-kernel-check = { workspace = true, optional = true }
lash-kernel-edit = { workspace = true, optional = true }
lash-kernel-view = { workspace = true, optional = true }
lash-kernel-dialect = { workspace = true, optional = true }
lash-kernel-package = { workspace = true, optional = true }
lash-vm-client = { workspace = true, optional = true }
lash-vm-worker = { workspace = true, optional = true }
lash-sansio = { workspace = true, features = ["schema-validation"] }
lash-protocol-types = { workspace = true, features = ["schema-validation"] }
async-trait = { workspace = true }
futures-util = { workspace = true }
lash-core = { workspace = true }
lash-core-store = { workspace = true }
lash-core-worker = { workspace = true }
lash-vm-runtime = { workspace = true, optional = true }
lash-llm-tools = { workspace = true, optional = true }
lash-llm-transport = { workspace = true, optional = true }
lash-tool-support = { workspace = true }
lash-provider-anthropic = { workspace = true, optional = true }
lash-provider-google = { workspace = true, optional = true }
lash-provider-openai = { workspace = true, optional = true }
lash-plugin-mcp = { workspace = true, optional = true }
lash-postgres-store = { workspace = true, optional = true }
lash-s3-store = { workspace = true, optional = true }
lash-sqlite-store = { workspace = true, optional = true }
lash-http-transport = { workspace = true, optional = true }
lash-protocol-rlm = { workspace = true, optional = true }
lash-render = { workspace = true, optional = true }
lash-protocol-standard = { workspace = true }
lash-tool-presenter-api = { workspace = true }
lash-tool-presenter-standard = { workspace = true }
lash-tool-shape = { workspace = true }
lash-plugin-standard-compaction = { workspace = true }
lash-plugin-process-controls = { workspace = true }
lash-rlm-types = { workspace = true, optional = true }
lash-trace = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# The PostgreSQL live replay store (`postgres` feature).
sqlx = { workspace = true, optional = true, default-features = false, features = ["runtime-tokio", "postgres"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[features]
default = []
# Kernel process execution, workflow publication and reads, without a REPL.
# It links no editor, no view and no in-process parser: a host that only
# runs and publishes documents needs none of them (FIG-6378).
codemode = [
    "dep:lash-vm-client",
    "dep:lash-vm-runtime",
    "dep:lash-kernel-doc",
    "dep:lash-kernel-check",
    "dep:lash-kernel-dialect",
    "dep:lash-kernel-package",
    "dep:lash-llm-tools",
    "lash-plugin-mcp?/lash-vm",
]
# The persistent REPL protocol on top of code mode. Rendering is protocol-owned;
# LLM tools are usable by workflow processes as well as REPL cells.
rlm = ["codemode", "dep:lash-protocol-rlm", "dep:lash-rlm-types", "dep:lash-render"]

# The canvas read of a checked document (`lash::workflow::view`), drawn with
# display facts from the selected `lash::package::PackageView`. It
# links the kernel's document, checker and view and no dialect, editor or
# runtime: a viewer draws TypeScript and Python workflows alike without
# either parser.
workflow-view = [
    "dep:lash-kernel-package",
    "dep:lash-kernel-doc",
    "dep:lash-kernel-check",
    "dep:lash-kernel-view",
]
# Editing a document (`lash::workflow::edit`, `lash::workflow::authoring`):
# drafts, edits, transactions and authoring operations, over the view.
workflow-authoring = ["workflow-view", "dep:lash-kernel-edit"]

# The dialects a host's sessions and processes are written in, each off by
# default: a host names the ones it runs, and there is no dialect it gets
# without choosing (FIG-5990). A dialect's feature builds its helper
# releases, which the parent links, admits and resumes documents against,
# and, in a host that is its own worker (`worker`), links its parser into
# the worker embedding. It never links a parser into the host's own
# process: that is `typescript` or `python`, chosen separately. A host that
# enables one compiles none of the other's parser or helpers.
dialect-typescript = [
    "codemode",
    "lash-vm-runtime/dialect-typescript",
    "lash-vm-worker?/dialect-typescript",
]
dialect-python = [
    "codemode",
    "lash-vm-runtime/dialect-python",
    "lash-vm-worker?/dialect-python",
]

# The worker embedding (`lash::vm::worker_entry` and what a worker
# registers): a single-binary host is its own worker, so it links the
# kernel library and each dialect its `dialect-*` features name. A host that
# runs the shipped worker executable leaves it off and links no worker
# embedding.
worker = ["codemode", "dep:lash-vm-worker"]

# Host-wired extension features (ADR 0079 section 1). Each gates one
# `lash::<name>` module that re-exports the matching internal crate's
# host-facing surface; none is enabled by default.
sqlite = ["dep:lash-sqlite-store"]
postgres = ["dep:lash-postgres-store", "dep:sqlx", "tokio/rt", "tokio/time", "tokio/macros"]
s3 = ["dep:lash-s3-store"]
openai = ["dep:lash-provider-openai", "dep:lash-llm-transport", "http-transport"]
anthropic = ["dep:lash-provider-anthropic", "dep:lash-llm-transport", "http-transport"]
google = ["dep:lash-provider-google", "dep:lash-llm-transport", "http-transport"]
mcp = ["dep:lash-plugin-mcp"]
# The TypeScript front end and printer in the host's own process
# (`lash::typescript`), with no helper release. A host that lowers or prints
# TypeScript itself names it; `dialect-typescript` does not imply it.
typescript = ["codemode", "dep:lash-dialect-typescript"]
# The Python front end and exact codec in the host's own process
# (`lash::python`), without selecting a helper release.
python = ["codemode", "dep:lash-dialect-python"]
http-transport = ["dep:lash-http-transport"]
# Exposes `lash::testing` (e.g. `TestProvider`) for embedder integration tests.
# The durable-backend certification laws are not part of the facade: a host
# depends on `lash-internal-conformance` directly, so the laws stay off the
# facade's dependency edge.
testing = [
    "lash-core/testing",
    "lash-plugin-mcp?/testing",
    "dep:lash-sqlite-store",
    "lash-sqlite-store?/testing",
    "lash-postgres-store?/testing",
    "tokio/rt-multi-thread",
    "tokio/time",
    "lash-protocol-rlm?/testing",
    "lash-provider-openai?/testing",
    "lash-vm-worker?/testing",
]
# Exposes the host-installed OpenTelemetry adapter (`lash::tracing::OtelTelemetry`).
otel-trace = ["lash-core/otel-trace"]
# Phase A's synthetic N+1 build (ADR 0115 §6): forwarded to every crate
# whose constants it moves. Optional backends move only when a host enables
# them. Only lash-upgrade-harness enables it; no production build does.
synthetic-next = [
    "lash-vm-worker?/synthetic-next",
    "lash-core/synthetic-next",
    "lash-core-store/synthetic-next",
    "lash-postgres-store?/synthetic-next",
    "lash-sqlite-store?/synthetic-next",
    "lash-protocol-rlm?/synthetic-next",
    "lash-vm-worker?/synthetic-next",
]

[dev-dependencies]
lash-llm-transport = { workspace = true }
# The dev-dependencies' testing client is paired with a testing worker when
# the `worker` feature links one (FIG-4409).
lash-vm-worker = { workspace = true, features = ["testing", "dialect-typescript", "dialect-python"] }
# The facade's laws run TypeScript and Python sessions and processes.
lash-vm-runtime = { workspace = true, features = ["dialect-typescript", "dialect-python"] }
lash-conformance.workspace = true
lash-core = { workspace = true, features = ["testing"] }
lash-sqlite-store = { workspace = true, features = ["testing"] }
lash-postgres-store = { workspace = true, features = ["testing"] }
lash-provider-anthropic = { workspace = true, features = ["testing"] }
lash-provider-openai = { workspace = true, features = ["testing"] }
lash-protocol-rlm = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "test-util"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres"] }
trybuild = "1"
tracing-subscriber = { workspace = true }
opentelemetry_sdk = { version = "0.33", features = ["metrics", "testing"] }

[[test]]
name = "plugin_certification"
path = "tests/plugin_certification.rs"
required-features = ["testing"]

[[test]]
name = "workflow_laws"
path = "tests/workflow_laws.rs"
required-features = ["codemode", "workflow-authoring"]

[[example]]
name = "worker_host"
path = "examples/worker_host.rs"
required-features = ["worker", "dialect-typescript"]
test = false

[[example]]
name = "plugin_authoring"
path = "examples/plugin_authoring.rs"
required-features = ["testing"]
test = false

[[example]]
name = "generated_source"
path = "examples/generated_source.rs"
required-features = ["worker", "typescript", "python", "dialect-typescript", "dialect-python"]
test = false
