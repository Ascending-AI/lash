[package]
name = "lash-internal-llm-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "LLM-backed tool implementations (llm_query and friends) for the lash agent runtime."
keywords = ["lash", "agent", "tools", "llm", "subagent"]
categories = ["asynchronous", "api-bindings"]

[lib]
name = "lash_llm_tools"

[features]
default = []
lashlang = ["lash-tool-support/lashlang"]

[lints]
workspace = true

[dependencies]
lash-sansio = { workspace = true }
lash-core = { workspace = true }
lash-lashlang-runtime = { workspace = true }
lash-tool-support = { workspace = true }
async-trait = { workspace = true }
jsonschema = { workspace = true, default-features = false }
serde_json = { workspace = true }

[dev-dependencies]
lash-core = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt"] }
