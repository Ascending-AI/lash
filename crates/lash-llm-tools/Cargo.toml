[package]
license-file.workspace = true
include = ["/src/**", "/build.rs", "/README.md", "/LICENSE*", "/THIRD-PARTY-NOTICES"]
name = "lash-internal-llm-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "LLM-backed tool implementations (llm_query and friends) for the lash agent runtime."
keywords = ["lash", "agent", "tools", "llm"]
categories = ["asynchronous", "api-bindings"]

[lib]
name = "lash_llm_tools"
doctest = false

[features]
default = []

[lints]
workspace = true

[dependencies]
lash-kernel-value = { workspace = true }
lash-vocabulary = { workspace = true }
lash-execution-contracts = { workspace = true }
lash-protocol-types = { workspace = true }
lash-core = { workspace = true }
lash-tool-support = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
lash-core = { package = "lash-internal-core", path = "../lash-core", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt"] }
