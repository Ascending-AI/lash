[package]
name = "lash-provider-anthropic"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Anthropic API (Claude) provider for lash."
keywords = ["lash", "agent", "llm", "anthropic", "claude"]
categories = ["api-bindings", "asynchronous"]

[features]
# Enables public test support and the cross-provider response-normalization
# conformance test. CI opts in explicitly; production builds keep it disabled.
default = []
testing = ["lash-llm-transport/testing"]

[lints]
workspace = true

[dependencies]
lash-sansio = { workspace = true }
lash-core = { workspace = true }
lash-llm-transport = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
# Self dev-dependency so `testing` is on for every test build of this crate:
# a bare `cargo test -p lash-provider-anthropic` runs the conformance law instead of
# quietly compiling it out (FIG-1266).
lash-provider-anthropic = { path = ".", features = ["testing"] }
lash-llm-transport = { workspace = true, features = ["proptest-support", "testing"] }
proptest = "1"
tokio = { workspace = true, features = ["rt", "time"] }
