[package]
name = "lash-internal-plugin-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "MCP (Model Context Protocol) plugin for the lash agent runtime."
keywords = ["lash", "agent", "mcp", "plugin", "llm"]
categories = ["asynchronous", "api-bindings"]

[lib]
name = "lash_plugin_mcp"
doctest = false

[features]
default = []
lash-vm = ["dep:lash-vm-runtime"]
# The SEP-3415 fixture server laws and examples run against.
testing = []

[lints]
workspace = true

[dependencies]
blake3 = { workspace = true }
chrono = { workspace = true }
lash-protocol-types = { workspace = true }
lash-core = { workspace = true }
lash-vm-runtime = { workspace = true, optional = true }
lash-tool-support = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
fastrand = { workspace = true }
futures-util = { workspace = true }
http = "1"
jsonschema = { workspace = true, default-features = false }
rmcp = { workspace = true, features = [
    "client",
    "elicitation",
    "transport-async-rw",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync", "process", "rt", "macros", "signal", "time"] }
tokio-util = { workspace = true }

# Process-group shutdown of stdio servers is a Unix behavior (FIG-3519).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
axum = "0.8"
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
lash = { workspace = true, features = ["testing"] }
lash-sqlite-store = { workspace = true }
lash-core = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util", "net", "io-util"] }
tracing-subscriber = { workspace = true }
