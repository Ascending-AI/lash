[package]
name = "lash-internal-durable-test"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false
description = "Fault-injecting durable test harness: the production lash-durable runtime over one database, with labelled commit cuts, virtual time and simulated nodes"

[lib]
name = "lash_durable_test"
doctest = false

[features]
synthetic-next = ["lash-vm-runtime/synthetic-next", "lash-vm-worker/synthetic-next"]

[lints]
workspace = true

[dependencies]
# The synthetic carry witness enables its VM feature through a normal optional edge.
lash-vm-runtime = { workspace = true, optional = true }
lash-vm-worker = { workspace = true, optional = true }
lash-kernel-value = { workspace = true }
lash-vocabulary = { workspace = true }
lash-execution-contracts = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
lash-core-ids = { workspace = true, features = ["perf-witness"] }
lash-durable = { workspace = true }
lash-sansio = { workspace = true }
lash-protocol-types = { workspace = true }
lash-core-store = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
workflow-corpus = { path = "../../examples/workflows" }
lash-transport-failure = { workspace = true }
base64 = { workspace = true }
delegation = { workspace = true }
# The certification selection includes both in-process codecs: a dialect
# feature selects helper releases only, and the workspace build's exact-source
# laws print and read both languages in the host (FIG-6378).
lash = { workspace = true, features = ["rlm", "testing", "dialect-typescript", "dialect-python", "typescript", "python", "workflow-view", "mcp", "worker"] }
lash-core = { workspace = true }
lash-core-execution = { workspace = true, features = ["testing"] }
lash-core-store = { workspace = true, features = ["testing"] }
lash-vm-runtime = { workspace = true, features = ["testing"] }
lash-kernel-doc = { workspace = true }
lash-kernel-releases = { workspace = true }
lash-kernel-migrate = { workspace = true }
lash-kernel-package = { workspace = true }
lash-vm-broker = { workspace = true }
lash-kernel-state = { workspace = true }
lash-kernel-vm = { workspace = true }
lash-llm-tools = { workspace = true }
lash-llm-transport = { workspace = true }
lash-provider-anthropic = { workspace = true }
lash-protocol-rlm = { workspace = true, features = ["testing"] }
lash-plugin-standard-compaction = { workspace = true }
lash-postgres-store = { workspace = true, features = ["testing"] }
lash-sqlite-store = { workspace = true, features = ["testing", "perf-witness"] }
lash-vm-client = { workspace = true, features = ["testing"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }
