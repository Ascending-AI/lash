[package]
name = "lash-internal-durable-test"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false
description = "Fault-injecting durable test harness: the production lash-durable runtime over one database, with labelled commit cuts, virtual time and simulated nodes"

[lib]
name = "lash_durable_test"
doctest = false

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
lash-core-ids = { workspace = true }
lash-durable = { workspace = true }
lash-sansio = { workspace = true }
lash-core-store = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
base64 = { workspace = true }
flate2 = "1"
delegation = { workspace = true }
# The certification selection includes both in-process codecs: a dialect
# feature selects helper releases only, and the workspace build's exact-source
# laws print and read both languages in the host (FIG-6378).
lash = { workspace = true, features = ["rlm", "testing", "dialect-typescript", "dialect-python", "typescript", "python", "workflow-view", "mcp", "worker"] }
lash-core = { workspace = true }
lash-core-execution = { workspace = true, features = ["testing"] }
lash-core-store = { workspace = true, features = ["testing"] }
lash-vm-runtime = { workspace = true }
lash-kernel-doc = { workspace = true }
lash-kernel-state = { workspace = true }
lash-kernel-vm = { workspace = true }
lash-llm-tools = { workspace = true }
lash-llm-transport = { workspace = true }
lash-provider-anthropic = { workspace = true }
lash-plugin-standard-compaction = { workspace = true }
lash-postgres-store = { workspace = true, features = ["testing"] }
lash-sqlite-store = { workspace = true, features = ["testing"] }
lash-vm-client = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rusqlite = { version = "0.37", features = ["bundled"] }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }
