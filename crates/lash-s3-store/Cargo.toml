[package]
license-file.workspace = true
include = ["/src/**", "/build.rs", "/README.md", "/LICENSE*", "/THIRD-PARTY-NOTICES"]
name = "lash-internal-s3-store"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "S3-compatible attachment storage adapter for the lash agent runtime."
keywords = ["lash", "agent", "s3", "garage", "attachments"]
categories = ["database", "asynchronous"]

[lib]
name = "lash_s3_store"
doctest = false

[lints]
workspace = true

[features]
testing = []

[dependencies]
lash-execution-contracts = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
lash-core = { workspace = true }
lash-protocol-types = { workspace = true }
# `aws` enables reqwest 0.13's `rustls`, which validates against platform trust.
object_store = { workspace = true, default-features = false, features = ["aws"] }
url = "2"

[dev-dependencies]
lash-conformance.workspace = true
lash-core = { package = "lash-internal-core", path = "../lash-core", features = ["testing"] }
lash-sqlite-store = { package = "lash-internal-sqlite-store", path = "../lash-sqlite-store" }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }
