[package]
name = "lash-internal-restate"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Restate durable execution adapter for Lash runtime effects"

[lib]
name = "lash_restate"
doctest = false

[lints]
workspace = true

[dependencies]
lash-sansio = { workspace = true }
async-trait = { workspace = true }
lash-core = { workspace = true }
lash-core-worker = { workspace = true }
lash-trace = { workspace = true }
lash-http-transport = { workspace = true }
restate-sdk = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
# The segment-admission nonce (FIG-3588) is drawn from OS randomness: Restate
# replays a journaled nonce, and its context RNG repeats after a purge.
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
lash-conformance.workspace = true
# The in-process Restate server double the effect-group suites run on. Only
# its server (endpoint-agnostic) is used here, so the second copy of this
# crate it links for its own backend never meets these tests' types.
lash-restate-test.workspace = true
bytes = { workspace = true }
chrono = { workspace = true }
http = "1"
http-body = "1"
http-body-util = { version = "0.1", features = ["channel"] }
reqwest = { workspace = true, features = ["json", "rustls", "http2"] }
lash = { package = "lash-runtime", path = "../lash", features = ["testing"] }
lash-core = { workspace = true, features = ["testing"] }
lash-lashlang-runtime = { workspace = true }
lash-typescript = { workspace = true }
lash-llm-tools = { workspace = true }
lashlang = { workspace = true, features = ["testing"] }
lash-protocol-rlm = { workspace = true }
lash-protocol-standard = { workspace = true }
lash-plugin-process-controls = { workspace = true }
lash-sqlite-store = { workspace = true, features = ["testing"] }
lash-subagents = { workspace = true }
tempfile = { workspace = true }
rusqlite = { version = "0.37", features = ["bundled"] }
