[package]
name = "lash-dialect-python"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
rust-version.workspace = true
description = "The Python dialect of the lash kernel: a front end that lowers a Python subset to kernel documents, and the helper functions it emits calls to."
keywords = ["lash", "kernel", "python", "dialect"]
categories = ["compilers", "parser-implementations"]
publish = false

[lib]
name = "lash_dialect_python"
doctest = false

[lints]
workspace = true

[dependencies]
lash-vocabulary = { workspace = true }
unicode-ident = "1"
unicode-normalization = { workspace = true }
lash-kernel-dialect = { workspace = true }
lash-kernel-doc = { workspace = true }
ruff_python_ast = { workspace = true }
ruff_python_parser = { workspace = true }
ruff_text_size = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
lash-kernel-package = { workspace = true, features = ["testing"] }
lash-vm-releases = { workspace = true, features = ["dialect-typescript", "dialect-python"] }
lash-vm-worker = { workspace = true, features = ["dialect-typescript", "dialect-python"] }
lash-ext-helper-compiler = { workspace = true }
lash-ext-py-core = { workspace = true }
lash-ext-date-ecma = { workspace = true }
lash-ext-url-whatwg = { workspace = true }
lash-ext-regex-ecma = { workspace = true }
arbitrary = "1"
lash-kernel-conformance = { workspace = true }
lash-dialect-typescript = { workspace = true }
lash-kernel-state = { workspace = true }
lash-kernel-check = { workspace = true }
lash-kernel-lib = { path = "../lash-kernel-lib" }
lash-kernel-vm = { workspace = true }
