[package]
license-file.workspace = true
include = ["/src/**", "/build.rs", "/README.md", "/LICENSE*", "/THIRD-PARTY-NOTICES"]
name = "lash-dialect-python"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
rust-version.workspace = true
description = "The Python dialect of the lash kernel: a front end that lowers a Python subset to kernel documents, and the helper functions it emits calls to."
keywords = ["lash", "kernel", "python", "dialect"]
categories = ["compilers", "parser-implementations"]

[lib]
name = "lash_dialect_python"
doctest = false

[lints]
workspace = true

[dependencies]
lash-dialect-conventions = { workspace = true }
lash-ext-py-helpers = { workspace = true }
num-bigint = { workspace = true }
lash-kernel-services = { workspace = true }
lash-kernel-value = { workspace = true }
unicode-ident = "1"
unicode-normalization = { workspace = true }
lash-kernel-dialect = { workspace = true }
lash-kernel-doc = { workspace = true }
ruff_python_ast = { workspace = true }
ruff_python_parser = { workspace = true }
ruff_text_size = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
lash-kernel-package = { workspace = true, features = ["testing"] }
lash-kernel-releases = { path = "../lash-kernel-releases", features = ["dialect-typescript", "dialect-python"] }
lash-ext-helper-compiler = { path = "../lash-ext-helper-compiler" }
lash-ext-py-core = { path = "../lash-ext-py-core" }
lash-ext-date-ecma = { workspace = true }
lash-ext-url-whatwg = { workspace = true }
lash-ext-regex-ecma = { workspace = true }
arbitrary = "1"
lash-kernel-conformance = { path = "../lash-kernel-conformance", features = ["dialect-typescript", "dialect-python"] }
lash-dialect-typescript = { path = "../lash-dialect-typescript" }
lash-kernel-state = { workspace = true }
lash-kernel-check = { workspace = true }
lash-kernel-lib = { path = "../lash-kernel-lib" }
lash-kernel-vm = { workspace = true, features = ["testing"] }
