[package]
name = "lash-internal-subagents"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Subagent / spawn_agent harness for the lash agent runtime."
keywords = ["lash", "agent", "subagent", "spawn", "llm"]
categories = ["asynchronous", "api-bindings"]

[lib]
name = "lash_subagents"
doctest = false

[lints]
workspace = true

[dependencies]
lash-sansio = { workspace = true }
lash-core = { workspace = true }
lash-lashlang-runtime = { workspace = true }
lash-protocol-rlm = { workspace = true }
lash-tool-support = { workspace = true }
lash-rlm-types = { workspace = true }
async-trait = { workspace = true }
jsonschema = { workspace = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[dev-dependencies]
# Kernel tests whose effects need an engine run on the Restate server double
# (FIG-3668, D1 PR-S2).
lash-restate-test = { workspace = true }
lash-sqlite-store = { workspace = true }
lash-core = { workspace = true, features = ["testing"] }
lash-core-worker = { workspace = true, features = ["testing"] }
lash-plugin-process-controls = { workspace = true }
lash-protocol-rlm = { workspace = true, features = ["testing"] }
lash-typescript = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
