[package]
name = "lash-internal-vm-library"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "The library functions lash's shipped worker holds, as a parent knows them: the helper releases the build holds."

[lib]
name = "lash_vm_library"
doctest = false

[features]
# The synthetic successor's kernel version and helper change, made by a
# worker and its parent alike.
synthetic-next = [
    "lash-kernel-doc/synthetic-next",
    "lash-kernel-migrate/synthetic-next",
]

# The dialects whose helper releases the build defines and a parent holds
# (FIG-5990). None is a default.
dialect-typescript = ["lash-vm-releases/dialect-typescript"]
dialect-python = ["lash-vm-releases/dialect-python"]

[lints]
workspace = true

[dependencies]
lash-kernel-doc = { workspace = true }
lash-kernel-migrate = { workspace = true }
lash-vm-releases = { workspace = true }
thiserror = { workspace = true }
