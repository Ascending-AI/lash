[package]
license-file.workspace = true
include = ["/src/**", "/build.rs", "/README.md", "/LICENSE*", "/THIRD-PARTY-NOTICES"]
name = "lash-internal-vocabulary"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Neutral package, operation, identity and encoding vocabulary."
[lib]
name = "lash_vocabulary"
doctest = false
[lints]
workspace = true
[features]
default = []
testing = ["lash-kernel-value/testing"]
schema-validation = []
[dependencies]
blake3 = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
schemars = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
[dev-dependencies]
jsonschema = { workspace = true, default-features = false }
proptest = "1"
serde_json = { workspace = true, features = ["arbitrary_precision", "raw_value"] }

[dependencies.lash-kernel-value]
workspace = true
