[package]
name = "lash-internal-vm-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Credential-free VM worker entry and bounded resettable process pool."

[lib]
name = "lash_vm_worker"
doctest = false

[[bin]]
name = "lash-vm-worker"
path = "src/main.rs"
test = false

[features]
dhat-heap = ["dep:dhat"]
synthetic-next = [
    "lash-vm-protocol/synthetic-next",
    "lash-vm-client/synthetic-next",
    "lash-core-execution/synthetic-next",
    "lash-kernel-doc/synthetic-next",
    "lash-kernel-migrate/synthetic-next",
    "lash-kernel-state/synthetic-next",
    "lash-kernel-vm/synthetic-next",
]
testing = ["lash-vm-client/testing"]

[[bin]]
name = "lash-vm-worker-fixture"
path = "src/bin/fixture.rs"
required-features = ["testing"]
test = false

[lints]
workspace = true

[dependencies]
dhat = { version = "0.3", optional = true }
blake3 = { workspace = true }
lash-vm-client = { workspace = true }
lash-core-execution = { workspace = true }
lash-vm-protocol = { workspace = true }
lash-kernel-doc = { workspace = true }
lash-kernel-vm = { workspace = true }
lash-kernel-lib = { workspace = true }
lash-kernel-migrate = { workspace = true }
lash-kernel-state = { workspace = true }
lash-kernel-dialect = { workspace = true }
lash-dialect-typescript = { workspace = true }
lash-ext-date-ecma = { workspace = true }
lash-ext-regex-ecma = { workspace = true }
lash-ext-url-whatwg = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
rmp-serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
lash-kernel-doc = { workspace = true }
lash-kernel-dialect = { workspace = true }
lash-kernel-lib = { workspace = true }
lash-kernel-vm = { workspace = true }
lash-dialect-typescript = { workspace = true }
lash-ext-date-ecma = { workspace = true }
lash-ext-regex-ecma = { workspace = true }
lash-ext-url-whatwg = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
lash-vm-worker = { package = "lash-internal-vm-worker", path = ".", features = ["testing"] }
rmp-serde = { workspace = true }
serde_bytes = { workspace = true }

[[test]]
name = "pool_laws"
path = "tests/pool_laws.rs"
