[package]
name = "lash-internal-vm-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Credential-free VM worker entry and bounded resettable process pool."

[lib]
name = "lash_vm_worker"
doctest = false

# `src/lib.rs` pulls in `../lash-vm-releases/src/library.rs` with `#[path]`;
# cargo-shear cannot see that file, the only user of `lash-kernel-lib` here.
[package.metadata.cargo-shear]
ignored = ["lash-kernel-lib"]

[[bin]]
name = "lash-vm-worker"
path = "src/main.rs"
test = false

[features]
# The dialects a worker can install, each off by default: a host names the
# ones it runs (FIG-5990). A dialect's feature links its parser, the library
# it ships with, and its helper releases, and nothing of another's.
dialect-typescript = [
    "dep:lash-dialect-typescript",
    "dep:lash-ext-date-ecma",
    "dep:lash-ext-regex-ecma",
    "dep:lash-ext-url-whatwg",
    "dep:lash-ext-ts-core",
    "lash-vm-releases/dialect-typescript",
]
dialect-python = [
    "dep:lash-dialect-python",
    "dep:lash-ext-py-core",
    "lash-vm-releases/dialect-python",
]
dhat-heap = ["dep:dhat", "lash-vm-client/dhat-heap"]
synthetic-next = [
    "lash-vm-protocol/synthetic-next",
    "lash-vm-client/synthetic-next",
    "lash-core-execution/synthetic-next",
    "lash-kernel-doc/synthetic-next",
    "lash-kernel-migrate/synthetic-next",
    "lash-kernel-state/synthetic-next",
    "lash-kernel-vm/synthetic-next",
    "lash-vm-library/synthetic-next",
]
testing = ["dep:tokio", "lash-vm-client/testing", "lash-core-execution/perf-witness", "lash-core-store/perf-witness", "lash-kernel-vm/perf-witness"]

[[bin]]
name = "lash-vm-worker-fixture"
path = "src/bin/fixture.rs"
required-features = ["testing", "dialect-typescript"]
test = false

[lints]
workspace = true

[dependencies]
lash-execution-contracts = { workspace = true }
async-trait = { workspace = true }
dhat = { version = "0.3", optional = true }
lash-vm-client = { workspace = true }
lash-vm-broker = { workspace = true }
lash-core-execution = { workspace = true }
lash-vm-protocol = { workspace = true }
lash-core-store = { workspace = true }
lash-kernel-doc = { workspace = true }
lash-kernel-vm = { workspace = true }
lash-kernel-check = { workspace = true }
lash-kernel-lib = { workspace = true }
lash-kernel-migrate = { workspace = true }
lash-kernel-state = { workspace = true }
lash-kernel-dialect = { workspace = true }
lash-vm-library = { workspace = true }
lash-vm-releases = { workspace = true }
lash-dialect-typescript = { workspace = true, optional = true }
lash-dialect-python = { workspace = true, optional = true }
lash-ext-date-ecma = { workspace = true, optional = true }
lash-ext-regex-ecma = { workspace = true, optional = true }
lash-ext-url-whatwg = { workspace = true, optional = true }
lash-ext-ts-core = { workspace = true, optional = true }
lash-ext-py-core = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
rmp-serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, optional = true, features = ["rt", "sync"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
blake3 = { workspace = true }
tokio-util = { workspace = true }
lash-protocol-types = { workspace = true }
lash-vm-broker = { workspace = true, features = ["testing"] }
lash-durable = { workspace = true }
lash-durable-test = { workspace = true }
lash-postgres-store = { workspace = true, features = ["testing"] }
lash-sqlite-store = { workspace = true, features = ["testing"] }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
lash-core-execution = { workspace = true, features = ["testing"] }
lash-vm-worker = { package = "lash-internal-vm-worker", path = ".", features = ["testing", "dialect-typescript", "dialect-python"] }
async-trait = { workspace = true }
tempfile = { workspace = true }
rmp-serde = { workspace = true }
serde_bytes = { workspace = true }

[[test]]
name = "pool_laws"
path = "tests/pool_laws.rs"

[[test]]
name = "fresh_embedding"
path = "tests/fresh_embedding.rs"
