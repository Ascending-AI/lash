[package]
name = "lash-internal-vm-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Credential-free VM worker entry and bounded resettable process pool."

[lib]
name = "lash_vm_worker"
doctest = false

[[bin]]
name = "lash-vm-worker"
path = "src/main.rs"
test = false

[features]
synthetic-next = ["lash-vm-protocol/synthetic-next", "lash-vm-client/synthetic-next", "lashlang/synthetic-next", "lash-core-execution/synthetic-next"]
testing = ["lash-vm-client/testing"]

[[bin]]
name = "lash-vm-worker-fixture"
path = "src/bin/fixture.rs"
required-features = ["testing"]
test = false

[lints]
workspace = true

[dependencies]
blake3 = { workspace = true }
lash-vm-client = { workspace = true }
lash-core-execution = { workspace = true }
lash-vm-protocol = { workspace = true }
lashlang = { workspace = true }
lash-typescript = { workspace = true }
serde = { workspace = true, features = ["derive"] }
rmp-serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
lash-core-execution = { workspace = true, features = ["testing"] }
lash-durable = { workspace = true }
lash-sansio = { workspace = true, features = ["testing"] }
lash-sqlite-store = { workspace = true }
lash-vm-broker = { workspace = true, features = ["testing"] }
lash-vm-worker = { package = "lash-internal-vm-worker", path = ".", features = ["testing"] }
lashlang = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "pool_laws"
path = "tests/pool_laws.rs"
