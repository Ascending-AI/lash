[package]
name = "lash-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Built-in shell and web tools for the lash agent runtime."
keywords = ["lash", "agent", "tools", "llm", "runtime"]
categories = ["asynchronous", "development-tools"]

[features]
default = []
lashlang = ["dep:lash-lashlang-runtime", "lash-tool-support/lashlang"]

[lints]
workspace = true

[dependencies]
lash-sansio = { workspace = true }
lash-core = { workspace = true }
lash-lashlang-runtime = { workspace = true, optional = true }
lash-tool-support = { workspace = true }
async-trait = { workspace = true }
libc = "0.2"
portable-pty = "0.9"
reqwest = { workspace = true, features = ["json", "query", "stream", "rustls"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "rt", "rt-multi-thread", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }

[dev-dependencies]
lash-core = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
