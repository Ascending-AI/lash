[package]
name = "lash-kernel-state"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "The lash kernel's paged semantic heap and persistent execution records."
keywords = ["lash", "kernel", "workflow", "state"]
categories = ["data-structures", "encoding"]
publish = false

[lib]
name = "lash_kernel_state"
doctest = false

[features]
# Unsupported transient-work diagnostics; absent from ordinary builds.
perf-witness = []
# A parked run may state the synthetic successor of kernel version 1.
synthetic-next = ["lash-kernel-doc/synthetic-next"]

[lints]
workspace = true

[dependencies]
foldhash = { workspace = true }
lash-kernel-doc = { workspace = true }
schemars = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive", "rc"] }
# `unbounded_depth`: the decoder bounds nesting itself, at a depth
# serde_json's fixed limit of 128 would refuse (a value nests 128 deep,
# `K-VAL-034`, and each level is two of JSON's).
serde_json = { workspace = true, features = ["unbounded_depth"] }
thiserror = { workspace = true }
