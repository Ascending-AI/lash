[package]
autobins = false
name = "lash-internal-sqlite-store"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "SQLite-backed session store for the lash agent runtime."
keywords = ["lash", "agent", "sqlite", "persistence", "store"]
categories = ["database", "asynchronous"]

[lib]
name = "lash_sqlite_store"
doctest = false

[features]
perf-witness = ["lash-core-execution/perf-witness", "rusqlite/trace"]
testing = ["lash-core-execution/testing"]

[lints]
workspace = true

[dependencies]
lash-store-sql = { workspace = true }
lash-sansio = { workspace = true }
lash-core-execution = { workspace = true }
async-trait = { workspace = true }
flate2 = "1"
rmp-serde = "1"
tokio-rusqlite = { version = "0.7", features = ["bundled"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
chrono = { workspace = true }
lash-conformance = { workspace = true, features = ["lashlang"] }
lash-core = { workspace = true, features = ["testing"] }
lashlang = { workspace = true, features = ["testing"] }
lash-sqlite-store = { package = "lash-internal-sqlite-store", path = ".", features = ["testing"] }
rusqlite = { version = "0.37", features = ["bundled", "trace"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing-subscriber = { workspace = true }


[[test]]
name = "integration"
path = "tests/main.rs"

[[test]]
name = "conformance"
path = "tests/conformance.rs"
required-features = ["testing"]

[[test]]
name = "conformance_memory"
path = "tests/conformance_memory.rs"
required-features = ["testing"]

[[test]]
name = "fencing_backstop"
path = "tests/fencing_backstop.rs"

[[test]]
name = "process_change_horizon"
path = "tests/process_change_horizon.rs"

[[test]]
name = "durable_read_fixture"
path = "tests/durable_read_fixture.rs"

# Recovery subprocesses use certification fixtures only as dev dependencies.
[[example]]
name = "sqlite-await-event-helper"
path = "src/bin/sqlite-await-event-helper.rs"
required-features = ["testing"]
