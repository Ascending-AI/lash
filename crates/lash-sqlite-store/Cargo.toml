[package]
name = "lash-internal-sqlite-store"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "SQLite-backed session store for the lash agent runtime."
keywords = ["lash", "agent", "sqlite", "persistence", "store"]
categories = ["database", "asynchronous"]

[lib]
name = "lash_sqlite_store"

[features]
perf-witness = ["lash-core/perf-witness"]
testing = ["lash-core/testing"]

[lints]
workspace = true

[dependencies]
lash-sansio = { workspace = true }
lash-core = { workspace = true }
lashlang = { workspace = true }
async-trait = { workspace = true }
flate2 = "1"
futures-executor = "0.3"
rmp-serde = "1"
tokio-rusqlite = { version = "0.7", features = ["bundled"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
lash-core = { workspace = true, features = ["testing"] }
lash-lashlang-runtime = { workspace = true, features = ["testing"] }
lash-sqlite-store = { package = "lash-internal-sqlite-store", path = ".", features = ["testing"] }
rusqlite = { version = "0.37", features = ["bundled", "trace"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[[bin]]
name = "sqlite-await-event-helper"
path = "src/bin/sqlite-await-event-helper.rs"
test = false

[[test]]
name = "integration"
path = "tests/main.rs"

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "durable_read_fixture"
path = "tests/durable_read_fixture.rs"
