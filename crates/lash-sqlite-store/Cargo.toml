[package]
autobins = false
name = "lash-internal-sqlite-store"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "SQLite-backed session store for the lash agent runtime."
keywords = ["lash", "agent", "sqlite", "persistence", "store"]
categories = ["database", "asynchronous"]

[lib]
name = "lash_sqlite_store"
doctest = false

[features]
perf-witness = ["lash-core-execution/perf-witness", "rusqlite/trace"]
testing = ["lash-core-execution/testing"]
# Phase A's synthetic successor (ADR 0115 §6): the SQLite components'
# descriptors move with the migration catalog that reaches them.
synthetic-next = ["lash-core-store/synthetic-next", "lash-core-execution/synthetic-next"]

# cargo-shear resolves `use` statements per crate directory and cannot see
# inside macro expansions: `lash_conformance::queue_observation_tests!` in
# tests/conformance/suite.rs expands to `lash::LashCore` and friends.
[package.metadata.cargo-shear]
ignored = ["lash"]

[lints]
workspace = true

[dependencies]
lash-store-sql = { workspace = true }
lash-durable = { workspace = true }
lash-sansio = { workspace = true }
lash-core-execution = { workspace = true }
lash-core-store = { workspace = true }
async-trait = { workspace = true }
flate2 = "1"
rmp-serde = "1"
tokio-rusqlite = { version = "0.7", features = ["bundled"] }
rusqlite = { version = "0.37", features = ["bundled", "trace"] }
serde = { workspace = true, features = ["derive"] }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
lash-durable = { workspace = true, features = ["testing"] }
lash-vm-runtime = { workspace = true, features = ["testing"] }
lash.workspace = true
lash-conformance = { workspace = true, features = ["lash-vm"] }
lash-core = { workspace = true, features = ["testing"] }
# The guarded-surface laws (FIG-3802) this crate runs over its own decoders.
lash-core-store = { workspace = true, features = ["testing"] }
lash-vm = { workspace = true, features = ["testing"] }
lash-sqlite-store = { package = "lash-internal-sqlite-store", path = ".", features = ["testing"] }
# `hooks`: the commit hook a law refuses a `COMMIT` with (FIG-5748).
rusqlite = { version = "0.37", features = ["bundled", "hooks", "trace"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }


[[test]]
name = "integration"
path = "tests/main.rs"

[[test]]
name = "conformance"
path = "tests/conformance.rs"
required-features = ["testing"]

[[test]]
name = "conformance_memory"
path = "tests/conformance_memory.rs"
required-features = ["testing"]

[[test]]
name = "process_change_horizon"
path = "tests/process_change_horizon.rs"

[[test]]
name = "durable_read_fixture"
path = "tests/durable_read_fixture.rs"
