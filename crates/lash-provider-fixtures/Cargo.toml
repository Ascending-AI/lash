[package]
name = "lash-internal-provider-fixtures"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Scripted provider transports and wire fixtures for Lash test tooling."
publish = false

[lib]
name = "lash_provider_fixtures"
doctest = false

[features]
default = []

[lints]
workspace = true

[dependencies]
lash-vocabulary = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
lash-core = { workspace = true }
lash-llm-transport = { workspace = true }
lash-provider-anthropic = { workspace = true }
lash-provider-google = { workspace = true }
lash-provider-openai = { workspace = true }
lash-protocol-types = { workspace = true }
lash-transport-failure = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
lash-core = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
chrono = { workspace = true }
lash-trace = { workspace = true, features = ["otel"] }
opentelemetry_sdk = { version = "0.33", features = ["metrics", "testing"] }
