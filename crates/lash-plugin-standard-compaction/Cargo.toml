[package]
license-file.workspace = true
include = ["/src/**", "/build.rs", "/README.md", "/LICENSE*", "/THIRD-PARTY-NOTICES"]
name = "lash-internal-plugin-standard-compaction"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Standard-compaction context plugin for the lash agent runtime."
keywords = ["lash", "agent", "context", "plugin", "llm"]
categories = ["asynchronous", "api-bindings"]

[lib]
name = "lash_plugin_standard_compaction"
doctest = false

[lints]
workspace = true

[dependencies]
lash-kernel-value = { workspace = true }
lash-vocabulary = { workspace = true }
lash-execution-contracts = { workspace = true }
lash-core = { workspace = true }
lash-protocol-types = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
lash-sansio = { workspace = true }
lash = { package = "lash-runtime", path = "../lash", features = ["testing"] }
lash-core = { package = "lash-internal-core", path = "../lash-core", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt"] }
