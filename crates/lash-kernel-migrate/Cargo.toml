[package]
name = "lash-kernel-migrate"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "The lash kernel's version migrations: documents, library functions and saved functions rewritten for the next kernel version."
keywords = ["lash", "kernel", "workflow", "migration"]
categories = ["data-structures"]
publish = false

[lib]
name = "lash_kernel_migrate"
doctest = false

[features]
# Ships the migration from kernel version 1 to its synthetic successor.
synthetic-next = [
    "lash-kernel-doc/synthetic-next",
]

[lints]
workspace = true

[dependencies]
lash-kernel-value = { workspace = true }
schemars = { workspace = true, features = ["derive"] }
lash-kernel-check = { workspace = true }
lash-kernel-dialect = { workspace = true }
lash-kernel-doc = { workspace = true }
lash-kernel-state = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]

[[bin]]
name = "kernel_migration_schema_generator"
path = "src/bin/kernel_migration_schema_generator.rs"
