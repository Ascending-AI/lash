[package]
name = "lash-internal-standard-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Default plugin stack bundle for the lash agent runtime."
keywords = ["lash", "agent", "plugins", "llm", "runtime"]
categories = ["asynchronous", "api-bindings"]

[lib]
name = "lash_standard_plugins"

[features]
default = []
lashlang = [
    "lash-plugin-process-controls/lashlang",
    "lash-tools/lashlang",
]

[lints]
workspace = true

[dependencies]
lash-sansio = { workspace = true }
lash-core = { workspace = true }
lash-plugin-process-controls = { workspace = true }
lash-plugin-tool-output-budget = { workspace = true }
lash-tools = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
lash-core = { workspace = true, features = ["testing"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
