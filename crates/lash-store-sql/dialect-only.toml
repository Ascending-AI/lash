# The dialect-only manifest (FIG-3380).
#
# `scripts/check-store-sql-ownership.py` reads this file and refuses:
#
#   * a production SQL string literal naming a converted family's table from a
#     file that is not one of the family's declared owners;
#   * two statements with the same text inside one backend;
#   * a shared statement shadowed by a per-backend copy of the same name;
#   * a statement declared in a backend and missing from `[[dialect_only]]`
#     below, or listed here for backends that do not declare it — which is how
#     an operation that exists in one backend only gets named;
#   * a projection of two or more columns over a converted table that is not
#     one of the column-list constants the table module declares;
#   * a statement that is SQL over another converted family's tables with no
#     `[[cross_family]]` entry below naming them and why;
#   * a statement that spells a lifecycle literal over a column the family
#     declares as vocabulary-valued, instead of naming it as a
#     `{{term(column)}}` token the renderer expands.
#
# `converted` is what makes the gate total for what is converted and silent
# about what is not. FIG-3387 closes it over every family.

converted = ["artifact", "attachment", "effect", "trigger", "wait"]

# Production sources that may name a converted family's tables in SQL although
# they own no statements. Each one needs a reason; the list is not a place to
# park work.
[[exempt]]
path = "crates/lash-sim/src/postgres_replay.rs"
reason = """
Deterministic-simulation harness: one TRUNCATE naming every table in the
PostgreSQL schema to reset a replay database between runs. It belongs to no
family and names all sixty tables, so it cannot be owned by one.
"""

# A path ending in `/` exempts a subtree.
[[exempt]]
path = "runbooks/restate-postgres-workers/"
reason = """
Out-of-runtime operational harness, the same class as the lash-sim replay
harness above: the runbook workers assert against a provisioned schema from
outside the runtime — version-bump probes, process assertions, worker
environment checks — rather than persisting anything lash reads back. Its
statements are observations of a database lash already wrote, so binding them
to a family's owner module would make the runbook's evidence depend on the
layout it is meant to check independently. No production runtime SQL is
exempted here, and none may be added.
"""

# ---------------------------------------------------------------------------
# Cross-family statements
# ---------------------------------------------------------------------------
#
# One owner module, one declaration, and the other families' tables written
# down. A sweep or a quiescence question that spans families is not a defect —
# splitting it would open a window between the parts — but the other families'
# owners must be able to find it, which is what these entries are for.

[[cross_family]]
statement = "effect_journal.scope_is_quiescent"
owner = "crates/lash-store-sql/src/effect.rs"
touches = ["await_event_waits"]
reason = """
Quiescence is one question over both families: an in-progress effect row, a
group still short of a journaled child, or an unresolved promise all mean the
scope is live. Asking it as three statements would let a child start between
them, so the effect family owns the whole predicate and reads the wait
family's table inside it.
"""

[families.artifact]
tables = ["blobs", "artifact_refs", "artifact_owners", "artifact_owner_retirements"]
statement_prefixes = ["blob", "artifact_ref", "artifact_owner", "artifact_owner_retirement"]
shared = [
    "crates/lash-store-sql/src/artifact/blobs.rs",
    "crates/lash-store-sql/src/artifact/refs.rs",
    "crates/lash-store-sql/src/artifact/owners.rs",
    "crates/lash-store-sql/src/artifact/owner_retirements.rs",
]
# Two owner modules per backend: the artifact tables, and the content-addressed
# byte store they point at. `blobs` is shared with checkpoint storage and had
# statements in four PostgreSQL modules before this; giving it a module of its
# own is what lets the lock order its writers share be written once.
sqlite = [
    "crates/lash-sqlite-store/src/artifact_store.rs",
    "crates/lash-sqlite-store/src/blobs.rs",
]
postgres = [
    "crates/lash-postgres-store/src/postgres/artifact_store.rs",
    "crates/lash-postgres-store/src/postgres/blobs.rs",
]
schema = [
    "crates/lash-sqlite-store/src/schema.rs",
    "crates/lash-sqlite-store/src/schema_fragments.rs",
    "crates/lash-postgres-store/src/postgres/schema.rs",
    "crates/lash-postgres-store/src/postgres/schema/migrations.rs",
    "crates/lash-postgres-store/src/postgres/schema/historical_migrations.rs",
    "crates/lash-postgres-store/src/postgres/schema_shape.rs",
    "crates/lash-postgres-store/src/postgres/schema_shape/introspect.rs",
]

[families.artifact.table_modules]
blobs = "crates/lash-store-sql/src/artifact/blobs.rs"
artifact_refs = "crates/lash-store-sql/src/artifact/refs.rs"
artifact_owners = "crates/lash-store-sql/src/artifact/owners.rs"
artifact_owner_retirements = "crates/lash-store-sql/src/artifact/owner_retirements.rs"

[families.attachment]
