# The dialect-only manifest (FIG-3380).
#
# `scripts/check-store-sql-ownership.py` reads this file and refuses:
#
#   * a production SQL string literal naming a converted family's table from a
#     file that is not one of the family's declared owners;
#   * two statements with the same text inside one backend;
#   * a shared statement shadowed by a per-backend copy of the same name;
#   * a statement declared in a backend and missing from `[[dialect_only]]`
#     below, or listed here for backends that do not declare it — which is how
#     an operation that exists in one backend only gets named;
#   * a projection of two or more columns over a converted table that is not
#     one of the column-list constants the table module declares;
#   * a statement that is SQL over another converted family's tables with no
#     `[[cross_family]]` entry below naming them and why;
#   * a statement that spells a lifecycle literal over a column the family
#     declares as vocabulary-valued, instead of naming it as a
#     `{{term(column)}}` token the renderer expands;
#   * a production SQL literal anywhere under `crates/lash-sqlite-store/src` or
#     `crates/lash-postgres-store/src` that is not a declared statement, a
#     schema artifact, a `[[connection]]` module's or exempt — which is what
#     makes the gate total rather than table-shaped, since a pragma or an
#     advisory lock names no table for the table rules to catch;
#   * a `[[connection]]` module's literal that reaches an owned table, or two
#     of them in one store crate with the same text.
#
# The gate is total (FIG-3387). There is no list of families it is silent
# about: a family is checked because it is declared below.

# Production sources that may name an owned table in SQL although they own no
# statements. Each one needs a reason; the list is not a place to park work.
[[exempt]]
path = "crates/lash-sim/src/postgres_replay.rs"
reason = """
Deterministic-simulation harness: one TRUNCATE naming every table in the
PostgreSQL schema to reset a replay database between runs. It belongs to no
family and names all sixty tables, so it cannot be owned by one.
"""

# A path ending in `/` exempts a subtree.
[[exempt]]
path = "runbooks/restate-postgres-workers/"
reason = """
Out-of-runtime operational harness, the same class as the lash-sim replay
harness above: the runbook workers assert against a provisioned schema from
outside the runtime — version-bump probes, process assertions, worker
environment checks — rather than persisting anything lash reads back. Its
statements are observations of a database lash already wrote, so binding them
to a family's owner module would make the runbook's evidence depend on the
layout it is meant to check independently. No production runtime SQL is
exempted here, and none may be added.
"""

[[exempt]]
path = "crates/lash-sqlite-store/src/testing.rs"
reason = """
Compiled only under the crate's `testing` feature: deterministic substrate
faults and DDL-slicing helpers for external test harnesses. Its one `CREATE
TABLE` is a fixture's, built per table name, and no production build contains
this module at all.
"""

[[exempt]]
path = "crates/lash-postgres-store/src/postgres/testing.rs"
reason = """
Compiled only under `test` or the crate's `testing` feature: creates and drops
throwaway databases so a suite can run against an isolated one. `CREATE
DATABASE` cannot be parameterised and names no lash table; no production build
contains this module.
"""

[[exempt]]
path = "crates/lash-postgres-store/src/postgres/test_support.rs"
reason = """
Compiled only under `test` or the crate's `testing` feature: pins the lease
clock on a transaction so a suite can move time. It names no lash table, and
the read side of the same pin — which does live in a production module — is a
named statement in that backend's connection module.
"""

# ---------------------------------------------------------------------------
# Connection modules
# ---------------------------------------------------------------------------
#
# The SQL that belongs to no table: pragmas, `ATTACH`, advisory locks,
# isolation levels, the server clock, catalog probes. One module per backend,
# because scattering them is how six verbatim copies of one advisory lock came
# to exist. A literal here that reaches an owned table is refused — that
# statement belongs to the table's family — and two with the same text in one
# store crate are refused as duplicates.

[[connection]]
path = "crates/lash-sqlite-store/src/connection_sql.rs"
reason = """
SQLite's connection-scoped SQL: the open pragmas built from the connection
policy, the read-only probe's pragmas, the two `ATTACH`es, and the three reads
of SQLite's own catalog (`sqlite_master`/`sqlite_schema`,
`pragma_database_list`). None of it is a `statements!` set: a pragma takes no
bound parameter and no table name, so the renderer has nothing to rewrite.
"""

[[connection]]
path = "crates/lash-postgres-store/src/postgres/connection_sql.rs"
reason = """
PostgreSQL's connection-scoped SQL: the advisory-lock shapes, the isolation
levels, the two `set_config` timeouts, the two clock reads and the `CHECK`
constraint catalog probe. Declared as a `statements!` set so each one is named
for tracing and rendered once, even though none of them names a table.
"""

# ---------------------------------------------------------------------------
# Cross-family statements
# ---------------------------------------------------------------------------
#
# One owner module, one declaration, and the other families' tables written
# down. A sweep or a quiescence question that spans families is not a defect —
# splitting it would open a window between the parts — but the other families'
# owners must be able to find it, which is what these entries are for.

[[cross_family]]
statement = "effect_journal.scope_is_quiescent"
owner = "crates/lash-store-sql/src/effect.rs"
touches = ["await_event_waits"]
reason = """
Quiescence is one question over both families: an in-progress effect row, a
group still short of a journaled child, or an unresolved promise all mean the
scope is live. Asking it as three statements would let a child start between
them, so the effect family owns the whole predicate and reads the wait
family's table inside it.
"""

[[cross_family]]
statement = "attachment_manifest.select_live_root_proving_process_death"
owner = "crates/lash-store-sql/src/attachment/manifest.rs"
touches = ["deleted_sessions", "processes", "runtime_turn_commits"]
reason = """
An attachment owned by a process outlives its owner only until the owner's row
is gone, and "is the owner still there?" is the same question as "may this
root be reclaimed?". Asking it separately would read the process row outside
the transaction that decides the attachment's fate, so the attachment family
owns the whole predicate and reads the process family's table inside it. It
renders only for a layout that places `processes`, which is what keeps a
connection with no registry bound from guessing.
"""

[[cross_family]]
statement = "session_core.delete_process_session_rows"
owner = "crates/lash-postgres-store/src/postgres/session_sql.rs"
touches = [
    "pending_turn_inputs",
    "queued_run_members",
    "queued_runs",
    "queued_work_batches",
    "queued_work_items",
    "session_execution_leases",
    "turn_cancel_closure_authorizations",
    "turn_cancel_requests",
    "turn_cancellation_bindings",
    "wake_allocation_floors",
    "wake_redelivery_fences",
]
reason = """
The process prune deletes a batch of sessions' rows from every table a session
owns, in one statement, because the parts would race: fourteen deletes keyed by
the same session array, and a writer landing between two of them would leave a
session whose queue is gone and whose metadata is not. Two of the fourteen
tables belong to the process family — a session's wake redelivery fences and
the allocation floors targeting it. The turn-ingress family owns the queue,
inputs, lane lease and cancellation facts. They all go with
the session that owns them, so the session-core family owns the whole cascade
and deletes from the other two families' tables inside it. SQLite's session
delete is per session and issues the named per-table deletes in sequence under
`BEGIN IMMEDIATE`, which is the same atomicity without the CTE.
"""

[[cross_family]]
statement = "blob.reclaim_unowned_artifact"
owner = "crates/lash-sqlite-store/src/blobs.rs"
touches = ["checkpoint_blob_refs", "node_anchors", "session_head"]
reason = """
A blob is reclaimable only when nothing roots it, and three of the four roots
are session-core rows: a session head's checkpoint, an explicit node anchor,
and a checkpoint's component edge. Asking the four questions separately would
let a commit publish a root between two of them and lose the bytes it just
pointed at, so the artifact family owns the whole predicate and reads this
family's tables inside it.
"""

[[cross_family]]
statement = "blob.reclaim_session_candidate"
owner = "crates/lash-sqlite-store/src/blobs.rs"
touches = ["checkpoint_blob_refs", "node_anchors", "session_head"]
reason = """
The delete-time twin of `blob.reclaim_unowned_artifact`, over the same three
session-core roots and for the same reason. PostgreSQL declares its own.
"""

[[cross_family]]
statement = "blob.select_session_checkpoint_page"
owner = "crates/lash-sqlite-store/src/blobs.rs"
touches = ["session_head"]
reason = """
One preflight page of sessions that have published a checkpoint, joined to the
manifest bytes each one points at. The join is the whole statement: a page that
named the checkpoints and then fetched their bytes would report a root that had
been collected between the two reads.
"""

[[cross_family]]
statement = "blob.reclaim_session_candidate"
owner = "crates/lash-postgres-store/src/postgres/blobs.rs"
touches = ["checkpoint_blob_refs", "node_anchors", "sessions"]
reason = """
PostgreSQL's delete-time blob reclaim, over the same three session-core roots
as SQLite's; see `blob.reclaim_unowned_artifact` for why the roots are one
predicate. It is a separate entry from the SQLite one because the durable head
is a different table name here (ADR 0098), so the two copies of this statement
reach different tables.
"""

[[cross_family]]
statement = "attachment_manifest.select_live_root"
owner = "crates/lash-store-sql/src/attachment/manifest.rs"
touches = ["deleted_sessions", "runtime_turn_commits"]
reason = """
An attachment intent stops being live when its owner dies, and two of the three
proofs of death are session-core facts: the owning session entered the
permanent deleted set, or a later turn of the same session committed and
superseded the turn that put the intent there. Asking them as separate
statements would let a commit land between the probe and the decision it
feeds.
"""

[[cross_family]]
statement = "attachment_manifest.delete_aged_uncommitted"
owner = "crates/lash-store-sql/src/attachment/manifest.rs"
touches = ["deleted_sessions", "runtime_turn_commits"]
reason = """
The sweeping twin of `attachment_manifest.select_live_root`, over the same two
session-core proofs of owner death and for the same reason: the probe and the
delete must read one snapshot.
"""

[[cross_family]]
statement = "attachment_manifest.delete_aged_uncommitted_proving_process_death"
owner = "crates/lash-store-sql/src/attachment/manifest.rs"
touches = ["deleted_sessions", "processes", "runtime_turn_commits"]
reason = """
The write half of the same question as
attachment_manifest.select_live_root_proving_process_death, and one statement
for the same reason: a process row deleted between a separate liveness read
and this delete would reclaim an attachment whose owner was live when the
decision was taken. The two session-core proofs of owner death — the session
entered the permanent deleted set, or a later turn of it committed and
superseded the turn that filed the intent — ride in the same predicate.
"""

[[cross_family]]
statement = "attachment_manifest.delete_deleted_session_roots"
owner = "crates/lash-sqlite-store/src/attachments.rs"
touches = ["deleted_sessions", "graph_nodes"]
reason = """
An attachment root a deleted session left behind is reclaimable exactly when
the session is in the permanent deleted set and no live graph node still roots
it (FIG-653). Both facts are session-core rows, and the manifest carries no
node edge of its own, so the sweep reads them inside its own predicate.
"""

[[cross_family]]
statement = "attachment_manifest.delete_deleted_session_roots"
owner = "crates/lash-postgres-store/src/postgres/attachments.rs"
touches = ["deleted_sessions", "graph_nodes"]
reason = """
PostgreSQL's copy of the same sweep; see the SQLite entry. It is a separate
entry because the statement forks on the tombstone literal and each copy is
declared in its own owner module.
"""

[[cross_family]]
statement = "attachment_manifest.forget_for_session"
owner = "crates/lash-sqlite-store/src/attachments.rs"
touches = ["graph_nodes"]
reason = """
Forgetting one attachment is refused while a live graph node still roots it,
which is the same session-core reachability question
`attachment_manifest.delete_deleted_session_roots` asks over a whole session.
"""

[[cross_family]]
statement = "attachment_manifest.forget_for_session"
owner = "crates/lash-postgres-store/src/postgres/attachments.rs"
touches = ["graph_nodes"]
reason = """
PostgreSQL's copy of the same forget; see the SQLite entry.
"""

