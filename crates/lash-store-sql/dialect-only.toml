# ---------------------------------------------------------------------------
# attachment family
# ---------------------------------------------------------------------------

[[dialect_only]]
statement = "attachment_manifest.delete_deleted_session_roots"
backends = ["sqlite", "postgres"]
kind = "boolean representation"
reason = """
graph_nodes.tombstoned is INTEGER 0/1 on SQLite and BOOLEAN on PostgreSQL, so
the predicate literal forks. The retention rule itself is the same on both:
owner-level retention deliberately includes suffix attachments, because the
manifest carries no node edge (FIG-653).
"""

[[dialect_only]]
statement = "attachment_manifest.forget_for_session"
backends = ["sqlite", "postgres"]
kind = "boolean representation"
reason = "Same tombstone-literal fork as attachment_manifest.delete_deleted_session_roots."

[[dialect_only]]
statement = "attachment_manifest.select_uncommitted"
backends = ["sqlite", "postgres"]
kind = "result ordering"
reason = """
SQLite reports oldest intent first and PostgreSQL reports digest order. Both
orders are total and neither caller depends on the other's, so the two are
left exactly as they stand rather than unified inside a refactor. The
projection itself is one column list, shared.
"""

[[dialect_only]]
statement = "attachment_condemnation.select_deleting"
backends = ["sqlite", "postgres"]
kind = "scalar versus optional row"
reason = """
PostgreSQL wraps the predicate in SELECT EXISTS(…) because its driver reads a
scalar that is always present; SQLite reads the row's presence instead.
"""

[[dialect_only]]
statement = "attachment_condemnation.select_exists"
backends = ["sqlite"]
kind = "operation exists on one backend only"
reason = """
SQLite reads the absence of a condemnation and inserts under one BEGIN
IMMEDIATE lock, so this read *is* its contention check. PostgreSQL cannot hold
that across statements at READ COMMITTED and detects a peer sweeper through the
insert's ON CONFLICT instead, so it has no counterpart read.
"""

[[dialect_only]]
statement = "attachment_condemnation.insert_condemned"
backends = ["sqlite", "postgres"]
kind = "ON CONFLICT"
reason = """
PostgreSQL's ON CONFLICT DO NOTHING is the fork and the contention check both;
SQLite has already proven the absence under the write lock this insert commits
under, so a conflict there is a defect and the constraint error is kept rather
than swallowed.
"""

# ---------------------------------------------------------------------------
# effect family
# ---------------------------------------------------------------------------

[[dialect_only]]
statement = "effect_journal.insert_session_scope_fences"
backends = ["sqlite", "postgres"]
kind = "server clock; boolean representation"
reason = """
PostgreSQL stamps the fence from the server's clock_timestamp() and writes the
cleanup flag as FALSE. SQLite binds a host-clock stamp and writes 0, because
the SQLite lease clock is the host's injected Clock.
"""

[[dialect_only]]
statement = "effect_replay.select_for_claim"
backends = ["sqlite", "postgres"]
kind = "FOR UPDATE"
reason = """
PostgreSQL must take the row's write lock explicitly (FOR UPDATE) to decide a
claim under READ COMMITTED. SQLite already holds the database write lock from
BEGIN IMMEDIATE, so the same projection carries no suffix. The projection
itself is one column list, shared.
"""

[[dialect_only]]
statement = "effect_replay.insert_claimed"
backends = ["sqlite", "postgres"]
kind = "ON CONFLICT"
reason = """
PostgreSQL detects a concurrent claimant through ON CONFLICT DO NOTHING,
because FOR UPDATE cannot lock a row that does not exist yet. Under SQLite's
write lock that race is unreachable and a conflict is a defect, so the
constraint error is kept rather than swallowed.
"""

[[dialect_only]]
statement = "effect_replay.finalize_terminal"
backends = ["sqlite", "postgres"]
kind = "server clock"
reason = """
PostgreSQL stamps and compares the lease from transaction_timestamp(), which is
what makes its fencing survive skew between hosts; SQLite binds the host clock
it shares with its runtime. The predicate is otherwise identical.
"""

[[dialect_only]]
statement = "effect_replay.renew_lease"
backends = ["sqlite", "postgres"]
kind = "server clock"
reason = "Same lease-clock fork as effect_replay.finalize_terminal."

[[dialect_only]]
statement = "effect_group.insert_new"
backends = ["sqlite", "postgres"]
kind = "RETURNING"
reason = """
PostgreSQL returns the inserted group row from the insert, so the durable
read-back costs a second statement only on the conflict path. SQLite reads it
back unconditionally, which is what its shared select_by_key is for.
"""

[[dialect_only]]
statement = "effect_scope_retirement.insert_fence"
backends = ["sqlite", "postgres"]
kind = "server clock; boolean representation"
reason = "Same clock and boolean fork as effect_journal.insert_session_scope_fences."

[[dialect_only]]
statement = "effect_scope_retirement.select_pending_artifact_cleanup"
backends = ["sqlite", "postgres"]
kind = "boolean representation"
reason = """
artifact_cleanup_completed is INTEGER 0/1 on SQLite and BOOLEAN on PostgreSQL,
so the predicate literal forks. The column is durable and unchanged by this
arc.
"""

[[dialect_only]]
statement = "effect_scope_retirement.complete_artifact_cleanup"
backends = ["sqlite", "postgres"]
kind = "boolean representation"
reason = "Same boolean fork as effect_scope_retirement.select_pending_artifact_cleanup."

[[dialect_only]]
statement = "effect_scope_retirement.select_all_scope_ids"
backends = ["sqlite"]
kind = "operation exists on one backend only"
reason = """
SQLite alone keeps this table in two files — the journal's and a bound process
registry's (ADR 0049) — and alone has to enumerate the journal's fences at bind
time to lift the ones the registry says are stale. PostgreSQL has one table and
no bind-time repair, so it has no counterpart operation.
"""

# ---------------------------------------------------------------------------
# wait family
# ---------------------------------------------------------------------------

[[dialect_only]]
statement = "await_event_wait.insert_pending"
backends = ["sqlite", "postgres"]
kind = "ON CONFLICT"
reason = """
PostgreSQL cannot hold "read the absence, then insert" atomic under READ
COMMITTED, so the conflict clause is what detects a concurrent registrar.
SQLite reads the absence under the same BEGIN IMMEDIATE lock it inserts under.
"""

[[dialect_only]]
statement = "await_event_wait.insert_resolved"
backends = ["sqlite", "postgres"]
kind = "ON CONFLICT"
reason = "Same conflict-detection fork as await_event_wait.insert_pending, plus its RETURNING."

[[dialect_only]]
statement = "await_event_wait.resolve_pending"
backends = ["sqlite", "postgres"]
kind = "compare-and-swap predicate (FIG-3381)"
reason = """
PostgreSQL carries the promise's identity comparison inside the UPDATE
predicate because READ COMMITTED cannot hold a read of it across statements;
SQLite compares the row it read under the write lock. This is a fencing/CAS
fork, left exactly as it stands for FIG-3381 to decide once in shared code.
"""

[[dialect_only]]
statement = "await_event_wait.cancel_session_promises"
backends = ["sqlite", "postgres"]
kind = "boolean representation"
reason = """
turn_control is INTEGER 0/1 on SQLite and BOOLEAN on PostgreSQL, so the
predicate literal forks.
"""

[[dialect_only]]
statement = "await_event_meta.select_signing_secret"
backends = ["sqlite", "postgres"]
kind = "boolean representation"
reason = """
The singleton flag is INTEGER 1 on SQLite and BOOLEAN TRUE on PostgreSQL. It is
the table's only read, which is why await_event_meta owns a name and a column
list here but no shared statement.
"""

# ---------------------------------------------------------------------------
# artifact family
# ---------------------------------------------------------------------------

[[dialect_only]]
statement = "artifact_ref.insert_pointer"
backends = ["sqlite"]
kind = "table exists on one backend only"
reason = """
SQLite reaches an artifact's bytes through this pointer table; PostgreSQL
keeps them inline in lash_lashlang_artifacts and has no pointer row, so the
whole artifact_refs set exists on one backend only.
"""

[[dialect_only]]
statement = "artifact_ref.select_blob_ref"
backends = ["sqlite"]
kind = "table exists on one backend only"
reason = """
Same one-backend pointer table as artifact_ref.insert_pointer.
"""

[[dialect_only]]
statement = "artifact_ref.delete_unowned"
backends = ["sqlite"]
kind = "table exists on one backend only"
reason = """
Same one-backend pointer table as artifact_ref.insert_pointer. PostgreSQL's
counterpart deletes the inline bytes instead, and is named
artifact_owner.delete_unowned_artifact.
"""

[[dialect_only]]
statement = "artifact_ref.select_gc_roots"
backends = ["sqlite"]
kind = "table exists on one backend only"
reason = """
Same one-backend pointer table as artifact_ref.insert_pointer. Only SQLite
runs a whole-catalog mark/sweep that needs a pointer root set.
"""

[[dialect_only]]
statement = "artifact_ref.select_preflight_page"
backends = ["sqlite"]
kind = "table exists on one backend only"
reason = """
Same one-backend pointer table as artifact_ref.insert_pointer. PostgreSQL's
preflight reads lash_lashlang_artifacts directly and needs no join.
"""

[[dialect_only]]
statement = "artifact_owner.transfer_edge"
backends = ["sqlite"]
kind = "INSERT then SELECT in one statement"
reason = """
SQLite makes 'the destination edge appears only if the source edge was there'
one statement under its write lock. PostgreSQL reads the source edge first,
because it holds a per-owner advisory lock anyway and has to tell a missing
staging edge from an already-completed transfer.
"""

[[dialect_only]]
statement = "artifact_owner.select_owned_refs"
backends = ["sqlite", "postgres"]
kind = "result ordering"
reason = """
PostgreSQL takes a per-artifact advisory lock for each row it reads, so the
read must hand them over in one stable order. SQLite reclaims each reference
under the single write lock it already holds and has no lock order to keep.
"""

[[dialect_only]]
statement = "artifact_owner.delete_unowned_artifact"
backends = ["postgres"]
kind = "operation exists on one backend only"
reason = """
PostgreSQL stores artifact bytes inline, so reclaiming an unowned artifact
deletes a lash_lashlang_artifacts row. SQLite deletes the pointer
(artifact_ref.delete_unowned) and then the blob it named.
"""

[[dialect_only]]
statement = "artifact_owner.delete_unowned_artifacts_for_owner"
backends = ["postgres"]
kind = "operation exists on one backend only"
reason = """
The array-bound form of artifact_owner.delete_unowned_artifact, issued once
after a retirement severs an owner's whole edge set. Same one-backend reason.
"""

[[dialect_only]]
statement = "blob.insert_ignore"
backends = ["sqlite"]
kind = "bulk bind"
reason = """
SQLite writes one row per statement with INSERT OR IGNORE. PostgreSQL writes
a whole chunk in one round trip through unnest, which is blob.insert_chunk.
"""

[[dialect_only]]
statement = "blob.insert_chunk"
backends = ["postgres"]
kind = "bulk bind"
reason = """
The unnest array bind writes a chunk in one round trip and stays under the
scalar-parameter ceiling. Its ORDER BY is the global blob lock order every
writer of this table takes. SQLite's counterpart is blob.insert_ignore.
"""

[[dialect_only]]
statement = "blob.select_existing_hashes"
backends = ["sqlite"]
kind = "list bind; no row lock"
reason = """
SQLite binds a JSON array and unpacks it with json_each, and needs no row
lock under BEGIN IMMEDIATE. PostgreSQL binds a text array and takes
FOR KEY SHARE, which is blob.lock_existing_hashes.
"""

[[dialect_only]]
statement = "blob.lock_existing_hashes"
backends = ["postgres"]
kind = "list bind; FOR KEY SHARE"
reason = """
FOR KEY SHARE holds each row against a concurrent delete for the rest of the
publishing transaction, in the global hash order. SQLite holds the whole
database under BEGIN IMMEDIATE instead.
"""

[[dialect_only]]
statement = "blob.lock_one"
backends = ["postgres"]
kind = "FOR KEY SHARE"
reason = """
The single-row form of blob.lock_existing_hashes. SQLite needs no counterpart
for the same reason.
"""

[[dialect_only]]
statement = "blob.lock_reclaim_candidates"
backends = ["postgres"]
kind = "FOR UPDATE"
reason = """
FOR UPDATE rather than FOR KEY SHARE: this caller is about to delete the rows
it locks, and takes them in the same ascending hash order publication does so
the two cannot deadlock. SQLite holds the database write lock.
"""

[[dialect_only]]
statement = "blob.select_bodies_by_hash"
backends = ["sqlite", "postgres"]
kind = "list bind"
reason = """
Same json_each/text-array fork as blob.select_existing_hashes. The projection
itself is one column list, shared.
"""

[[dialect_only]]
statement = "blob.select_exists"
backends = ["sqlite"]
kind = "operation exists on one backend only"
reason = """
SQLite's session-delete sweep proves under its write lock that an enumerated
reference is not already dangling. PostgreSQL gets the same proof from the row
lock blob.lock_reclaim_candidates takes, so it has no separate check.
"""

[[dialect_only]]
statement = "blob.reclaim_unowned_artifact"
backends = ["sqlite"]
kind = "table exists on one backend only"
reason = """
Only SQLite's artifacts are blobs, so only SQLite reclaims one when its
pointer goes. PostgreSQL deletes the inline bytes
(artifact_owner.delete_unowned_artifact) and this table never sees it.
"""

[[dialect_only]]
statement = "blob.reclaim_session_candidate"
backends = ["sqlite", "postgres"]
kind = "root set differs"
reason = """
SQLite has a fourth kind of root to rule out, the artifact_refs pointer, which
PostgreSQL does not have at all; and the two backends' head tables are
different relations, session_head and lash_sessions. Neither difference is a
dialect, so neither can be rendered away.
"""

[[dialect_only]]
statement = "blob.select_session_checkpoint_page"
backends = ["sqlite"]
kind = "head table differs"
reason = """
The preflight walk left-joins the head table so a dangling checkpoint stays
visible as a row. SQLite's head table is session_head; PostgreSQL's is
lash_sessions, and its walk reads it from its own preflight module rather than
as an artifact-family statement.
"""

# ---------------------------------------------------------------------------
# trigger family
# ---------------------------------------------------------------------------

[[dialect_only]]
statement = "trigger_subscription.select_record_by_id"
backends = ["sqlite", "postgres"]
kind = "FOR UPDATE"
reason = """
PostgreSQL must take the row's write lock to hold the record it read across the
mutation that record decides, under READ COMMITTED. SQLite reads it under the
BEGIN IMMEDIATE write lock it already holds, so the same projection carries no
suffix.
"""

[[dialect_only]]
statement = "trigger_subscription.select_records_for_prune"
backends = ["sqlite", "postgres"]
kind = "FOR UPDATE"
reason = "Same write-lock fork as trigger_subscription.select_record_by_id, over a prune's whole owner scope."

