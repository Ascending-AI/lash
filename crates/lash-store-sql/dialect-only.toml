[[dialect_only]]
statement = "process_registry.prune_rows"
backends = ["postgres"]
kind = "operation exists on one backend only"
reason = """
PostgreSQL performs the whole prune as one statement: the clock bump, the
tombstones that take their change sequences from it in candidate order, the
artifact cleanup derived from those tombstones, and the process delete gated on
both counts matching. SQLite issues the same steps separately under the
database write lock, which is what makes them atomic there.
"""

