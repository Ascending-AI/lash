statement = "process_segment_handover.insert"
backends = ["sqlite"]
kind = "ON CONFLICT"
reason = """
SQLite reads the ordinal's absence under the same write lock it inserts under
and raises the conflict itself, so the insert is plain. PostgreSQL has to
express that refusal as a conflict clause, which is the entry below.
"""

