[package]
name = "lash-internal-core-effect"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Effect promise semantics for the Lash runtime kernel."
keywords = ["lash", "agent", "runtime", "async", "ai"]
categories = ["asynchronous", "api-bindings"]

[lib]
name = "lash_core_effect"
doctest = false

[features]
default = []
otel-trace = ["lash-core-store/otel-trace"]
perf-witness = ["lash-core-store/perf-witness"]
testing = ["lash-core-store/testing"]

[lints]
workspace = true

[dependencies]
lash-core-store = { workspace = true }
lash-sansio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
