[package]
name = "lash-internal-core-effect"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Effect promise semantics and native await-event storage for the Lash runtime kernel."
keywords = ["lash", "agent", "runtime", "async", "ai"]
categories = ["asynchronous", "api-bindings"]

[lib]
name = "lash_core_effect"
doctest = false

[features]
default = []
otel-trace = ["lash-core-ids/otel-trace", "lash-core-store/otel-trace"]
perf-witness = ["lash-core-ids/perf-witness", "lash-core-store/perf-witness"]
testing = ["lash-core-ids/testing", "lash-core-store/testing"]

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
lash-core-ids = { workspace = true }
lash-core-store = { workspace = true }
lash-sansio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
lash-core-ids = { workspace = true, features = ["testing"] }
lash-core-memory = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }
