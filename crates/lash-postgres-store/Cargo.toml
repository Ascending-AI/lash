[package]
autobins = false
name = "lash-internal-postgres-store"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "PostgreSQL-backed durable storage for the lash agent runtime."
keywords = ["lash", "agent", "postgres", "persistence", "store"]
categories = ["database", "asynchronous"]

[lib]
name = "lash_postgres_store"
doctest = false

# cargo-shear resolves `use` statements per crate directory and cannot see
# inside macro expansions: `lash_conformance::queue_observation_tests!` in
# tests/conformance.rs expands to `lash::LashCore` and friends.
[package.metadata.cargo-shear]
ignored = ["lash"]

[lints]
workspace = true

[features]
perf-witness = ["lash-core-execution/perf-witness"]
# Test/performance-only seams. Production builds cannot bypass the schema gate.
testing = ["lash-core-execution/testing"]
synthetic-next = ["lash-core-execution/synthetic-next"]

[dependencies]
lash-store-sql = { workspace = true }
lash-sansio = { workspace = true }
async-trait = { workspace = true }
lash-core-execution = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true, default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
lash-lashlang-runtime = { workspace = true, features = ["testing"] }
lash.workspace = true
lash-conformance = { workspace = true, features = ["lashlang"] }
lash-core = { workspace = true, features = ["testing"] }
# The process worker a turn runner lends the tier's process workflow.
lash-core-worker = { workspace = true }
lashlang = { workspace = true, features = ["testing"] }
# Integration tests need this crate's own `testing` seams (the conformance
# factory and probe impls), the same way lash-sqlite-store wires itself.
lash-postgres-store = { package = "lash-internal-postgres-store", path = ".", features = ["testing"] }
# The promise authority and handler-bound turn runner the ported storage laws
# shift through: lash-restate's engine on the in-process server double.
lash-restate-test = { workspace = true }
lash-sqlite-store = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing-subscriber = { workspace = true }


[[test]]
name = "integration"
path = "tests/main.rs"

[[test]]
name = "conformance"
path = "tests/conformance.rs"
required-features = ["testing"]

[[test]]
name = "durable_read_fixture"
path = "tests/durable_read_fixture.rs"

[[test]]
name = "preflight_durable_walk"
path = "tests/preflight_durable_walk.rs"

[[test]]
name = "preflight_schema_status"
path = "tests/preflight_schema_status.rs"

[[test]]
name = "schema_drift"
path = "tests/schema_drift.rs"

[[test]]
name = "host_provisioned_rollout"
path = "tests/host_provisioned_rollout.rs"

[[test]]
name = "migrate"
path = "tests/migrate.rs"

[[test]]
name = "schema_constraints"
path = "tests/schema_constraints.rs"
