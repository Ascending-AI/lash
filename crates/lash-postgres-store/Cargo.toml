[package]
autobins = false
name = "lash-internal-postgres-store"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "PostgreSQL-backed durable storage for the lash agent runtime."
keywords = ["lash", "agent", "postgres", "persistence", "store"]
categories = ["database", "asynchronous"]

[lib]
name = "lash_postgres_store"
doctest = false

[lints]
workspace = true

[features]
perf-witness = ["lash-execution-contracts/perf-witness"]
# Test/performance-only seams. Production builds cannot bypass the schema gate.
testing = ["lash-store-sql/testing", "lash-execution-contracts/testing"]
synthetic-next = ["lash-core-store/synthetic-next", "lash-execution-contracts/synthetic-next"]

[dependencies]
lash-trace = { workspace = true }
lash-core-ids = { workspace = true }
lash-execution-contracts = { workspace = true }
futures-util.workspace = true
lash-store-sql = { workspace = true }
lash-core-store = { workspace = true }
lash-durable = { workspace = true }
lash-protocol-types = { workspace = true }
async-trait = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
schemars = { workspace = true, features = ["derive"] }
sqlx = { workspace = true, default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
lash-core-execution = { workspace = true, features = ["testing"] }
lash-durable-test = { workspace = true }
lash-kernel-doc = { workspace = true }
lash-durable = { workspace = true, features = ["testing"] }
lash = { workspace = true, features = ["postgres", "mcp", "testing"] }
lash-conformance = { workspace = true, features = ["lash-vm"] }
lash-core = { workspace = true, features = ["testing"] }
# Integration tests need this crate's own `testing` seams (the conformance
# factory and probe impls), the same way lash-sqlite-store wires itself.
lash-postgres-store = { package = "lash-internal-postgres-store", path = ".", features = ["testing"] }
lash-sqlite-store = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time", "test-util"] }
tracing-subscriber = { workspace = true }


[[test]]
name = "integration"
path = "tests/main.rs"

[[test]]
name = "conformance"
path = "tests/conformance.rs"
required-features = ["testing"]

[[test]]
name = "live_replay"
path = "tests/live_replay.rs"
required-features = ["testing"]

[[test]]
name = "process_replay"
path = "tests/process_replay.rs"
required-features = ["testing"]

[[test]]
name = "durable_read_fixture"
path = "tests/durable_read_fixture.rs"

[[test]]
name = "preflight_durable_walk"
path = "tests/preflight_durable_walk.rs"

[[test]]
name = "preflight_schema_status"
path = "tests/preflight_schema_status.rs"

[[test]]
name = "schema_drift"
path = "tests/schema_drift.rs"

[[test]]
name = "host_provisioned_rollout"
path = "tests/host_provisioned_rollout.rs"

[[test]]
name = "migrate"
path = "tests/migrate.rs"

[[test]]
name = "schema_constraints"
path = "tests/schema_constraints.rs"

[[bin]]
name = "host_config_schema_generator"
path = "src/bin/host_config_schema_generator.rs"
test = false
