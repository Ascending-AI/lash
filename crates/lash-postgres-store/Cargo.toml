[package]
name = "lash-internal-postgres-store"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "PostgreSQL-backed durable storage for the lash agent runtime."
keywords = ["lash", "agent", "postgres", "persistence", "store"]
categories = ["database", "asynchronous"]

[lib]
name = "lash_postgres_store"

[lints]
workspace = true

[features]
default = []
# Test/performance-only seams. Production builds cannot bypass the schema gate.
testing = ["lash-core/testing"]

[dependencies]
lash-sansio = { workspace = true }
async-trait = { workspace = true }
lash-core = { workspace = true }
lashlang = { workspace = true }
rmp-serde = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
fastrand = { workspace = true }
lash = { package = "lash-runtime", path = "../lash", features = ["testing"] }
lash-core = { workspace = true, features = ["testing"] }
lash-lashlang-runtime = { workspace = true, features = ["testing"] }
lash-protocol-standard = { workspace = true, features = ["lashlang"] }
lash-plugin-process-controls = { workspace = true }
lash-subagents = { workspace = true }
lash-tools = { workspace = true }
lash-sqlite-store = { workspace = true }
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing-subscriber = { workspace = true }

[[bin]]
name = "postgres-await-event-helper"
path = "src/bin/postgres-await-event-helper.rs"
test = false

[[test]]
name = "integration"
path = "tests/main.rs"

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "durable_read_fixture"
path = "tests/durable_read_fixture.rs"

[[test]]
name = "checkpoint_projection_migration"
path = "tests/checkpoint_projection_migration.rs"

[[test]]
name = "preflight_durable_walk"
path = "tests/preflight_durable_walk.rs"

[[test]]
name = "preflight_schema_status"
path = "tests/preflight_schema_status.rs"

[[test]]
name = "schema_drift"
path = "tests/schema_drift.rs"
