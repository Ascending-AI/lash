[package]
name = "lash-provider-openai"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "OpenAI providers for lash: API-key (OpenRouter, OpenAI, vLLM, etc.) and Codex OAuth (ChatGPT Plus/Pro/Team)."
keywords = ["lash", "agent", "llm", "openai", "codex"]
categories = ["api-bindings", "asynchronous"]

[features]
# Enables public test support and the cross-provider response-normalization
# conformance test. CI opts in explicitly; production builds keep it disabled.
default = []
testing = ["lash-llm-transport/testing"]

[lints]
workspace = true

[dependencies]
lash-sansio = { workspace = true }
lash-core = { workspace = true }
lash-llm-transport = { workspace = true }
lash-provider-auth = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "time"] }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
# Self dev-dependency so `testing` is on for every test build of this crate:
# a bare `cargo test -p lash-provider-openai` runs the conformance law instead of
# quietly compiling it out (FIG-1266).
lash-provider-openai = { path = ".", features = ["testing"] }
# The runtime facade, so the Codex WebSocket path is proven end-to-end through
# a normal `LashCore` turn in `tests/codex_websocket_runtime.rs`.
lash = { workspace = true }
lash-llm-transport = { workspace = true, features = ["testing"] }
lash-protocol-rlm = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[[test]]
name = "codex_websocket_runtime"
required-features = ["testing"]
