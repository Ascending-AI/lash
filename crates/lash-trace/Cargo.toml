[package]
name = "lash-internal-trace"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Trace types and sinks for the lash agent runtime."
keywords = ["lash", "agent", "trace", "observability"]
categories = ["asynchronous", "development-tools::debugging"]

[lib]
name = "lash_trace"
doctest = false

[features]
default = []
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk"]
# Exposes `RecordingTraceSink`, the in-memory sink tests read records from.
testing = []

[lints]
workspace = true

[dependencies]
lash-vocabulary = { workspace = true }
lash-protocol-types = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
opentelemetry = { version = "0.33", optional = true }
opentelemetry_sdk = { version = "0.33", optional = true, default-features = false, features = ["trace"] }
serde = { workspace = true, features = ["derive"] }
schemars = { workspace = true, features = ["chrono04"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
strum = { version = "0.28", features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
serde_yaml = "=0.9.34"
lash-protocol-types = { workspace = true, features = ["testing"] }
jsonschema = { workspace = true, default-features = false }
opentelemetry_sdk = { version = "0.33", features = ["metrics", "testing"] }
