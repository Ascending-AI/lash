[package]
name = "lash-internal-trace"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Trace types and JSONL exporter for the lash agent runtime."
keywords = ["lash", "agent", "trace", "jsonl", "observability"]
categories = ["asynchronous", "development-tools::debugging"]

[lib]
name = "lash_trace"
doctest = false

[features]
default = []
otel = ["dep:opentelemetry"]

[lints]
workspace = true

[dependencies]
lash-sansio = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
opentelemetry = { version = "0.31", optional = true }
serde = { workspace = true, features = ["derive"] }
schemars = { workspace = true, features = ["chrono"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
jsonschema = { workspace = true, default-features = false }
opentelemetry_sdk = { version = "0.31", features = ["metrics", "testing"] }
