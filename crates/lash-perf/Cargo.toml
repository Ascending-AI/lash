[package]
name = "lash-perf"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false
description = "Developer-only performance harness for the Lash runtime. Not shipped."

[features]
default = []
# Use the dhat heap profiler as the global allocator so the harness can emit
# dhat heap profiles. Without it the harness uses stats_alloc and reports
# allocation counters instead.
dhat-heap = ["dep:dhat"]

[lib]
name = "lash_perf"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "lash-perf"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
lash-sansio = { workspace = true }
lashlang = { workspace = true }
lash-typescript = { workspace = true }
libc = { workspace = true }
lash-conformance = { workspace = true }
lash-core = { workspace = true, features = ["perf-witness", "testing"] }
lash-lashlang-runtime = { workspace = true }
lash-restate = { workspace = true }
lash-restate-test = { workspace = true }
lash-postgres-store = { workspace = true, features = ["perf-witness", "testing"] }
lash = { workspace = true, features = ["restate", "rlm", "sqlite"] }
lash-llm-tools = { workspace = true }
lash-protocol-rlm = { workspace = true, features = ["testing"] }
lash-provider-openai = { workspace = true, features = ["testing"] }
lash-rlm-types = { workspace = true }
lash-sqlite-store = { workspace = true, features = ["perf-witness"] }
lash-plugin-process-controls = { workspace = true }
lash-plugin-standard-compaction = { workspace = true }
lash-subagents = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
futures-util = { workspace = true }
jsonschema = { workspace = true }
schemars = { workspace = true }
sha2 = { workspace = true }
rand_chacha = "=0.9.0"
flate2 = "=1.1.9"
crc32fast = "=1.5.0"
reqwest = { workspace = true, features = ["json", "rustls", "http2"] }
restate-sdk = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
stats_alloc = "0.1"
dhat = { version = "0.3", optional = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
