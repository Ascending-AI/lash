[package]
name = "lash-perf"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false
description = "Developer-only performance harness for the Lash runtime. Not shipped."

[features]
default = []
# Use the dhat heap profiler as the global allocator so the harness can emit
# dhat heap profiles. Without it the harness uses stats_alloc and reports
# allocation counters instead.
dhat-heap = ["dep:dhat"]

[lib]
name = "lash_perf"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "lash-perf"
path = "src/main.rs"

[[bin]]
name = "vm-worker-matrix"
path = "src/bin/vm_worker_matrix.rs"
test = false

[[bin]]
name = "postgres-substrate"
path = "src/bin/postgres_substrate.rs"
test = false

[[bin]]
name = "vm-snapshot"
path = "src/bin/vm_snapshot.rs"
test = false

[[bin]]
name = "durable-substrate"
path = "src/bin/durable_substrate.rs"
test = false

[lints]
workspace = true

[dependencies]
lash-sansio = { workspace = true }
lash-vm = { workspace = true }
lash-typescript = { workspace = true }
lash-vm-client = { workspace = true, features = ["perf-witness"] }
lash-vm-worker = { workspace = true }
lash-vm-protocol = { workspace = true }
rmp-serde = { workspace = true }
libc = { workspace = true }
lash-core = { workspace = true, features = ["perf-witness", "testing"] }
lash-core-execution = { workspace = true, features = ["testing"] }
lash-core-store = { workspace = true, features = ["testing"] }
lash-durable = { workspace = true }
lash-vm-runtime = { workspace = true }
lash-postgres-store = { workspace = true, features = ["perf-witness", "testing"] }
lash = { workspace = true, features = ["rlm", "sqlite", "testing"] }
lash-llm-transport = { workspace = true }
lash-http-transport = { workspace = true }
lash-llm-tools = { workspace = true }
lash-protocol-rlm = { workspace = true, features = ["testing"] }
lash-provider-openai = { workspace = true, features = ["testing"] }
lash-rlm-types = { workspace = true }
lash-sqlite-store = { workspace = true, features = ["perf-witness"] }
lash-plugin-process-controls = { workspace = true }
lash-plugin-standard-compaction = { workspace = true }
anyhow = { workspace = true }
delegation = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
futures-util = { workspace = true }
jsonschema = { workspace = true }
schemars = { workspace = true }
sha2 = { workspace = true }
rand_chacha = "=0.9.0"
flate2 = "=1.1.9"
crc32fast = "=1.5.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres"] }
stats_alloc = "0.1"
dhat = { version = "0.3", optional = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
