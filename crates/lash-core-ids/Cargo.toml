[package]
name = "lash-internal-core-ids"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Durable identity framing and leaf utilities for the lash runtime kernel."
keywords = ["lash", "agent", "runtime", "async", "ai"]
categories = ["asynchronous", "api-bindings"]

[lib]
name = "lash_core_ids"
doctest = false

[features]
default = []
otel-trace = ["lash-trace/otel"]
# Internal performance instrumentation. Production builds leave every call
# site compiled out unless an internal witness explicitly enables this feature.
perf-witness = []
# Test-only observation hooks shared with lash-core's unit suites.
testing = []

[lints]
workspace = true

[dependencies]
lash-sansio = { workspace = true, features = ["schema-validation"] }
lash-trace = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
