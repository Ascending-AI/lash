[package]
name = "lash-internal-core-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Durable process worker for the Lash runtime kernel."
keywords = ["lash", "agent", "runtime", "async", "ai"]
categories = ["asynchronous", "api-bindings"]

[lib]
name = "lash_core_worker"
doctest = false

[features]
default = []
otel-trace = ["lash-core/otel-trace", "lash-core-ids/otel-trace", "lash-core-execution/otel-trace"]
perf-witness = ["lash-core/perf-witness", "lash-core-ids/perf-witness", "lash-core-execution/perf-witness"]
testing = ["lash-core/testing", "lash-core-ids/testing", "lash-core-execution/testing"]

[lints]
workspace = true

[dependencies]
lash-core = { workspace = true }
lash-core-ids = { workspace = true }
lash-core-execution = { workspace = true }
tracing = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
