# Crate-scoped clippy configuration for lash-core-store. Clippy stops at the
# first `clippy.toml` it finds walking up from the manifest directory, so this
# file shadows the workspace one and must repeat its keys. It mirrors
# `crates/lash-core/clippy.toml`, the file that covered this code before the
# carve: `lash_core_store::task` is the same tracing-context spawn idiom, and
# the crate's tests keep the same expect/unwrap exemptions.
allow-expect-in-tests = true
allow-unwrap-in-tests = true
disallowed-methods = [
    { path = "tokio::spawn", reason = "use lash_core::task::spawn so tasks inherit the caller's tracing context" },
    { path = "tokio::task::spawn", reason = "use lash_core::task::spawn so tasks inherit the caller's tracing context" },
    # Ambient filesystem (std and tokio faces).
    { path = "std::fs::canonicalize", reason = "hosts supply the world: take the resolved path by parameter (FIG-2971)" },
    { path = "std::fs::copy", reason = "hosts supply the world: take the paths by parameter (FIG-2971)" },
    { path = "std::fs::create_dir", reason = "hosts supply the world: take the directory by parameter (FIG-2971)" },
    { path = "std::fs::create_dir_all", reason = "hosts supply the world: take the directory by parameter (FIG-2971)" },
    { path = "std::fs::exists", reason = "hosts supply the world: take the path by parameter (FIG-2971)" },
    { path = "std::fs::hard_link", reason = "hosts supply the world: take the paths by parameter (FIG-2971)" },
    { path = "std::fs::metadata", reason = "hosts supply the world: take the path by parameter (FIG-2971)" },
    { path = "std::fs::read", reason = "hosts supply the world: take the path or bytes by parameter (FIG-2971)" },
    { path = "std::fs::read_dir", reason = "hosts supply the world: take the directory by parameter (FIG-2971)" },
    { path = "std::fs::read_link", reason = "hosts supply the world: take the path by parameter (FIG-2971)" },
    { path = "std::fs::read_to_string", reason = "hosts supply the world: take the path or contents by parameter (FIG-2971)" },
    { path = "std::fs::remove_dir", reason = "hosts supply the world: take the directory by parameter (FIG-2971)" },
    { path = "std::fs::remove_dir_all", reason = "hosts supply the world: take the directory by parameter (FIG-2971)" },
    { path = "std::fs::remove_file", reason = "hosts supply the world: take the path by parameter (FIG-2971)" },
    { path = "std::fs::rename", reason = "hosts supply the world: take the paths by parameter (FIG-2971)" },
    { path = "std::fs::set_permissions", reason = "hosts supply the world: take the path by parameter (FIG-2971)" },
    { path = "std::fs::symlink_metadata", reason = "hosts supply the world: take the path by parameter (FIG-2971)" },
    { path = "std::fs::write", reason = "hosts supply the world: take the path or sink by parameter (FIG-2971)" },
    { path = "std::fs::File::create", reason = "hosts supply the world: take the path or writer by parameter (FIG-2971)" },
