[package]
name = "lash-internal-vm-broker"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Parent-side broker for lash's model-code workers: authority, admissions, VM snapshots and slot release."

[lib]
name = "lash_vm_broker"
doctest = false

[lints]
workspace = true

[features]
synthetic-next = ["lash-vm-protocol/synthetic-next"]

# The broker is parent code: it depends on the protocol, the kernel's
# vocabulary and the parent's identity vocabulary. It drives a machine
# through its interface and never compiles model code (ADR 0123).
[dependencies]
lash-core-execution = { workspace = true }
lash-core-store = { workspace = true }
lash-durable = { workspace = true }
lash-kernel-doc = { workspace = true }
lash-kernel-vm = { workspace = true }
lash-sansio = { workspace = true }
lash-vm-protocol = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The durable laws drive the broker over the durable store, cut by the
# substrate harness at every commit.
lash-core-execution = { workspace = true, features = ["testing"] }
lash-durable-test = { workspace = true }
lash-sqlite-store = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
