[package]
name = "lash-internal-remote-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Versioned remote embedding protocol DTOs for Lash sessions, turns, activities, tools, and LLM calls."
keywords = ["lash", "agent", "runtime", "protocol"]
categories = ["api-bindings", "data-structures"]

[lib]
name = "lash_remote_protocol"
doctest = false

[lints]
workspace = true

[dependencies]
lash-sansio = { workspace = true }
base64 = { workspace = true }
lash-core = { workspace = true, optional = true }
lash-trace = { workspace = true }
schemars = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
default = []
core-conversions = ["dep:lash-core"]

[[bin]]
name = "remote_schema_generator"
path = "src/bin/remote_schema_generator.rs"
required-features = ["core-conversions"]

[dev-dependencies]
jsonschema = { workspace = true, default-features = false }
lash-core = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["rt"] }
