[package]
name = "lash-internal-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Backend certification laws for Lash stores"

[lib]
name = "lash_conformance"
doctest = false

[lints]
workspace = true

[features]
# Lashlang artifact-store laws, enabled only by the store crates that certify
# a Lashlang artifact store.
lashlang = ["dep:lashlang"]

[dependencies]
lashlang = { workspace = true, features = ["testing"], optional = true }
lash-core = { workspace = true, features = ["testing"] }
# A batch issued from inside a process only reaches the leaves if something
# drives the registry. The durable process worker is that something, and it is
# the same one a deployment runs; the law stands one up for the producers that
# need it (FIG-3400).
lash-core-worker = { workspace = true, features = ["testing"] }
# The presentation-boundary laws run the real budget plugin as one step in a
# composed chain (FIG-3420).
lash-plugin-tool-output-budget.workspace = true
lash-sansio = { workspace = true, features = ["schema-validation"] }
async-trait.workspace = true
tokio = { workspace = true, features = ["test-util"] }
serde.workspace = true
serde_json.workspace = true
futures-util.workspace = true
uuid.workspace = true
pretty_assertions.workspace = true
proptest = "1"
tokio-util.workspace = true
sha2.workspace = true
chrono.workspace = true
rmp-serde.workspace = true
tracing.workspace = true

[dev-dependencies]
# The oracle self-tests hold a real store to the laws' own assertions: a
# SQLite memory backend, the zero-infra substrate (ADR 0102).
lash-sqlite-store.workspace = true
tempfile.workspace = true
