[package]
name = "lash-internal-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Backend certification laws for Lash stores"

[lib]
name = "lash_conformance"
doctest = false

# `lash-core-worker` has no source use: the edge only turns on its `testing`
# feature in the workspace feature graph (kept by FIG-5558).
[package.metadata.cargo-shear]
ignored = ["lash-core-worker"]

[lints]
workspace = true

[features]
# Lash VM artifact-store laws, enabled only by the store crates that certify
# a Lash VM artifact store.
lash-vm = []

[dependencies]
lash-core-store = { workspace = true }
lash-core = { workspace = true, features = ["testing"] }
# Enable the worker testing surface in the workspace feature graph.
lash-core-worker = { workspace = true, features = ["testing"] }
lash-kernel-doc = { workspace = true }
lash-sansio = { workspace = true, features = ["schema-validation"] }
async-trait.workspace = true
tokio = { workspace = true, features = ["test-util"] }
serde.workspace = true
serde_json.workspace = true
blake3 = { workspace = true }
futures-util.workspace = true
uuid.workspace = true
pretty_assertions.workspace = true
proptest = "1"
tokio-util.workspace = true
chrono.workspace = true
rmp-serde.workspace = true

[dev-dependencies]
# The store-contract self-tests replay their cases against a real store: a
# SQLite memory store set.
lash-sqlite-store.workspace = true
