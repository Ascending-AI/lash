[package]
name = "lash-internal-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Backend certification laws for Lash stores"

[lib]
name = "lash_conformance"
doctest = false

[lints]
workspace = true

[features]
# Lashlang artifact-store laws. The `lash` facade re-exports the store laws
# without this feature so `lash-runtime`'s dependency boundary keeps
# `lash-internal-lashlang` out of the `testing` resolution.
lashlang = ["dep:lashlang"]

[dependencies]
lashlang = { workspace = true, features = ["testing"], optional = true }
lash-core = { workspace = true, features = ["testing"] }
lash-sansio = { workspace = true, features = ["schema-validation"] }
async-trait.workspace = true
tokio = { workspace = true, features = ["test-util"] }
serde.workspace = true
serde_json.workspace = true
futures-util.workspace = true
uuid.workspace = true
pretty_assertions.workspace = true
proptest = "1"
tokio-util.workspace = true
sha2.workspace = true
chrono.workspace = true
rmp-serde.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
