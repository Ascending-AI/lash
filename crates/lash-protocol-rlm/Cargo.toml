[package]
name = "lash-internal-protocol-rlm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "RLM protocol (persistent TypeScript cell execution) for the lash agent runtime."
keywords = ["lash", "agent", "rlm", "typescript", "llm"]
categories = ["asynchronous", "api-bindings"]

[lib]
name = "lash_protocol_rlm"
doctest = false

[features]
default = []
testing = ["lashlang/testing", "lash-core/testing"]

[lints]
workspace = true

[dependencies]
lash-trace = { workspace = true }
lash-sansio = { workspace = true }
lash-core = { workspace = true }
lash-core-worker = { workspace = true }
lash-lashlang-runtime = { workspace = true }
lash-typescript = { workspace = true }
lashlang = { workspace = true }
lash-rlm-types = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_bytes = { workspace = true }
rmp-serde = { workspace = true }
thiserror = { workspace = true }
jsonschema = { workspace = true, default-features = false }
tokio = { workspace = true, features = ["rt", "sync"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
lash-conformance = { workspace = true }
lash-core = { workspace = true, features = ["testing"] }
lash-plugin-process-controls = { workspace = true }
lashlang = { workspace = true, features = ["testing"] }
lash-sansio = { workspace = true }
lash-sqlite-store = { workspace = true }
insta = "1"
tempfile = { workspace = true }

# The build script parses this crate's own `src/executor/state.rs` with `syn`
# and emits the declaration order of the two types declared there. It must not
# grow a first-party dependency: Bazel compiles a build script's whole closure
# a second time in the exec configuration at `opt-level=3`, so one runtime
# crate here duplicates the entire first-party tree beneath it (FIG-3032).
[build-dependencies]
syn = { version = "2", features = ["full"] }
