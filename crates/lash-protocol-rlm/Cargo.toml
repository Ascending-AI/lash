[package]
name = "lash-internal-protocol-rlm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "RLM protocol (persistent kernel cell execution) for the lash agent runtime."
keywords = ["lash", "agent", "rlm", "typescript", "llm"]
categories = ["asynchronous", "api-bindings"]

[lib]
name = "lash_protocol_rlm"
doctest = false

[features]
default = []
testing = ["lash-vm-client/testing", "lash-core/testing", "lash-vm-worker?/testing"]
# Phase A's synthetic N+1 build (ADR 0115 §6): the blocks beside the
# constants it moves, and the store's lift and pin tables they rely on. Only
# lash-upgrade-harness enables it; no production build does. It links the
# worker its laws run cells in at the synthetic successor, paired with the
# client it drives (FIG-4409).
synthetic-next = ["lash-kernel-package/synthetic-next", "lash-core/synthetic-next", "lash-vm-client/synthetic-next", "lash-vm-runtime/synthetic-next", "dep:lash-vm-worker", "lash-vm-worker/synthetic-next"]

[lints]
workspace = true

[dependencies]
lash-kernel-check = { workspace = true }
lash-execution-contracts = { workspace = true }
lash-vm-client = { workspace = true }
lash-vm-worker = { workspace = true, optional = true }
lash-vm-broker = { workspace = true }
lash-vm-protocol = { workspace = true }
lash-kernel-doc = { workspace = true }
lash-kernel-package = { workspace = true }
lash-kernel-dialect = { workspace = true }
lash-kernel-vm = { workspace = true }
lash-kernel-state = { workspace = true }
lash-trace = { workspace = true }
lash-sansio = { workspace = true }
lash-protocol-types = { workspace = true }
lash-core = { workspace = true }
# The checkpoint graph a cell's host state is written to (FIG-5887).
lash-core-store = { workspace = true }
lash-durable = { workspace = true }
lash-vm-runtime = { workspace = true }
lash-rlm-types = { workspace = true }
lash-render = { workspace = true }
lash-tool-presenter-api = { workspace = true }
lash-tool-presenter-python = { workspace = true }
lash-tool-presenter-typescript = { workspace = true }
lash-tool-shape = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
lash-llm-transport = { workspace = true }
# The `dataframe` fixture the package-set laws install (FIG-6926).
lash-kernel-package = { workspace = true, features = ["testing"] }
lash-vm-client = { workspace = true, features = ["testing"] }
# A testing client is paired with a testing worker, which the runtime links.
# The laws run TypeScript and Python sessions, so their build holds both
# dialects' helper releases.
lash-vm-runtime = { workspace = true, features = ["testing", "dialect-typescript", "dialect-python"] }
lash-core = { workspace = true, features = ["testing"] }
# The guarded-surface laws (FIG-3802) this crate runs over its own decoders.
lash-core-store = { workspace = true, features = ["testing"] }
lash-sansio = { workspace = true }
lash-protocol-types = { workspace = true }
lash-sqlite-store = { workspace = true, features = ["testing"] }
# The worker a Python-dialect law runs its cell in: this crate's test binary
# re-entered as the worker of a host that names Python alone.
lash-vm-worker = { workspace = true, features = ["testing", "dialect-typescript", "dialect-python"] }
# The prompt walker lowers every example a prompt shows with the dialect's
# own front end.
lash-dialect-typescript = { workspace = true }
# A test dialect spells its values in the compact notation.
lash-tool-presenter-standard = { workspace = true }
insta = "1"
