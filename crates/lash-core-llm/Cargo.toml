[package]
name = "lash-internal-core-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Provider handle, model resolution and LLM call vocabulary for the lash runtime kernel."
keywords = ["lash", "agent", "runtime", "async", "ai"]
categories = ["asynchronous", "api-bindings"]

[lib]
name = "lash_core_llm"
doctest = false

[features]
default = []
otel-trace = ["lash-trace/otel", "lash-core-ids/otel-trace"]
# Internal performance instrumentation. Production builds leave every call
# site compiled out unless an internal witness explicitly enables this feature.
perf-witness = ["lash-core-ids/perf-witness"]
# Test-only observation hooks shared with lash-core's unit suites.
testing = ["lash-core-ids/testing"]

[lints]
workspace = true

[dependencies]
lash-core-ids = { workspace = true }
lash-http-transport = { workspace = true }
lash-sansio = { workspace = true, features = ["schema-validation"] }
lash-trace = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
schemars = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
lash-core-ids = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }
