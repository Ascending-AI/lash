[package]
name = "lash-internal-vm-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Lash VM runtime integration for lash-core process engines and tool surfaces."
keywords = ["lash", "agent", "runtime", "lashvm"]
categories = ["asynchronous", "api-bindings"]


# FIG-3571 (ADR 0100 R8): `scripts/check-workflow-graph-model.sh` reads this
# role. A language-neutral crate may not reach a front-end crate through its
# dependency graph.
[package.metadata.lash]
role = "language-neutral"

[lib]
name = "lash_vm_runtime"
doctest = false

[features]
testing = ["dep:lash-vm-worker", "lash-vm-client/testing", "lash-core/testing", "lash-vm/testing"]

[lints]
workspace = true

[dependencies]
lash-vm-client = { workspace = true }
lash-vm-worker = { workspace = true, optional = true, features = ["testing"] }
rmp-serde = { workspace = true }
lash-sansio = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
lash-core = { workspace = true }
lash-core-worker = { workspace = true }
lash-tool-support = { workspace = true }
lash-trace = { workspace = true }
lash-vm = { workspace = true }
lash-vm-broker = { workspace = true }
lash-vm-protocol = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
lash-core = { workspace = true, features = ["testing"] }
lash-core-execution = { workspace = true }
lash-vm = { workspace = true, features = ["testing"] }
lash-sqlite-store = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
