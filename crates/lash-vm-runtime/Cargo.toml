[package]
name = "lash-internal-vm-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "The lash side of the kernel machine's host boundary."
keywords = ["lash", "agent", "runtime", "lashvm"]
categories = ["asynchronous", "api-bindings"]


# FIG-3571 (ADR 0100 R8): `scripts/check-workflow-graph-model.sh` reads this
# role. A language-neutral crate may not reach a front-end crate through its
# dependency graph.
[package.metadata.lash]
role = "language-neutral"

[lib]
name = "lash_vm_runtime"
doctest = false

[features]
# Prints a workflow document as TypeScript.
typescript = ["dep:lash-dialect-typescript"]
testing = ["lash-vm-client/testing", "lash-vm-worker/testing", "lash-core/testing"]
# The worker this crate links and the client it drives move protocol
# versions together.
synthetic-next = ["lash-vm-client/synthetic-next", "lash-vm-worker/synthetic-next"]

[lints]
workspace = true

[dependencies]
lash-vm-client = { workspace = true }
lash-sansio = { workspace = true }
async-trait = { workspace = true }
lash-core = { workspace = true }
lash-core-execution = { workspace = true }
lash-vm-broker = { workspace = true }
lash-kernel-doc = { workspace = true }
lash-kernel-vm = { workspace = true }
lash-vm-worker = { workspace = true }
lash-kernel-check = { workspace = true }
lash-kernel-dialect = { workspace = true }
lash-dialect-typescript = { workspace = true, optional = true }
lash-trace = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
