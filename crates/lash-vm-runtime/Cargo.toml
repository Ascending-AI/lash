[package]
name = "lash-internal-vm-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "The lash side of the kernel machine's host boundary."
keywords = ["lash", "agent", "runtime", "lashvm"]
categories = ["asynchronous", "api-bindings"]

[lib]
name = "lash_vm_runtime"
doctest = false

[features]
# The dialects whose helper releases the build defines and this parent
# holds, each off by default: a host names the dialects its sessions and
# processes are written in (FIG-5990).
dialect-typescript = ["lash-vm-releases/dialect-typescript"]
dialect-python = ["lash-vm-releases/dialect-python"]
testing = ["lash-vm-client/testing", "lash-core/testing"]
# The client this crate drives and the library its workers hold move
# versions together.
synthetic-next = [
    "lash-vm-client/synthetic-next",
    "lash-vm-releases/synthetic-next",
    "lash-kernel-doc/synthetic-next",
    "lash-kernel-package/synthetic-next",
    "lash-kernel-migrate/synthetic-next",
    "lash-kernel-state/synthetic-next",
    "lash-kernel-vm/synthetic-next",
]

[lints]
workspace = true

[dependencies]
lash-vocabulary = { workspace = true }
fastrand = { workspace = true }
lash-execution-contracts = { workspace = true }
lash-vm-client = { workspace = true }
lash-vm-protocol = { workspace = true }
lash-core-store = { workspace = true }
lash-protocol-types = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
lash-core = { workspace = true }
lash-core-execution = { workspace = true }
lash-core-ids = { workspace = true }
lash-durable = { workspace = true }
lash-vm-broker = { workspace = true }
lash-kernel-doc = { workspace = true }
lash-kernel-package = { workspace = true }
lash-kernel-vm = { workspace = true }
lash-kernel-migrate = { workspace = true }
lash-kernel-state = { workspace = true }
lash-vm-releases = { workspace = true }
lash-kernel-check = { workspace = true }
lash-kernel-dialect = { workspace = true }
lash-trace = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
lash-core-execution = { workspace = true, features = ["testing"] }
lash-core-ids = { workspace = true, features = ["testing"] }
lash-kernel-package = { workspace = true, features = ["testing"] }
# The laws' runs pin a dialect's release, so their build holds one.
lash-vm-releases = { workspace = true, features = ["dialect-typescript"] }
tokio = { workspace = true, features = ["macros", "rt"] }
