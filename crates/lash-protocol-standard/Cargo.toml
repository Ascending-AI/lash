[package]
name = "lash-internal-protocol-standard"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Standard protocol (native provider tool calls) for the lash agent runtime."
keywords = ["lash", "agent", "mode", "tools", "llm"]
categories = ["asynchronous", "api-bindings"]

[lib]
name = "lash_protocol_standard"
doctest = false

[lints]
workspace = true

[dependencies]
lash-sansio = { workspace = true }
lash-core = { workspace = true }
lash-tool-support = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }

[features]
default = []

[dev-dependencies]
# Kernel tests whose effects need an engine run on the Restate server double
insta = "1"
# Zero-dependency attribute crate providing `#[mutants::skip]`. Used only under
# `cfg(test)`, to exempt one provably equivalent mutant from the Confidence
# mutation gate (see `handle_exec_result` in src/lib.rs).
mutants = "0.0.4"
lash-core = { workspace = true, features = ["testing"] }
lash-sqlite-store = { workspace = true }
lash-plugin-process-controls = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }
