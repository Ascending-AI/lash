# Managed by prek (https://github.com/j178/prek): `prek install --hook-type pre-commit`
#
# pre-commit = seconds (hygiene + the cheap gates CI's Lint job enforces).
# No pre-push build: workspace Clippy runs in CI or on explicit local request.
# Tests deliberately stay out of hooks: the full workspace suite is minutes
# long and belongs to the development loop and CI's Test job — a hook that
# slow gets --no-verify'd and rots.
# docs/pagefind is a generated search index whose bytes are load-bearing.
# The vendored Test262 corpus (tests, upstream harness, LICENSE) is kept
# byte-for-byte at its pinned upstream commit and sync-verified; "fixing"
# its whitespace breaks the byte-comparison.
exclude: '^(docs/pagefind/|crates/lash-typescript/tests/test262/(test/|harness/|LICENSE))'
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json

  - repo: local
    hooks:
      # Apply the formatter before CI checks it. If files change, prek stops
      # the commit so the author can review and restage them.
      - id: cargo-fmt
        name: kiln fmt
        language: system
        entry: kiln fmt
        files: '\.rs$'
        pass_filenames: false

      # Mirrors CI Lint "Lint GitHub workflows" — GitHub rejects schema-invalid
      # workflow files that plain YAML parsing accepts.
      - id: actionlint
        name: actionlint
        language: system
        entry: actionlint -no-color
        files: '^\.github/workflows/.*\.ya?ml$'
        pass_filenames: true
      # Apply rustfmt to the files `cargo fmt` cannot see, because `include!`
      # splices text rather than declaring a module.
      - id: included-file-formatting
        name: include!d file formatting
        language: system
        entry: python3 scripts/check_included_file_formatting.py --fix
        files: '\.rs$'
        pass_filenames: false

      # Mirrors CI Lint "Check production file-size budget".
      - id: file-size-budget
        name: production file-size budget
        language: system
        entry: python3 scripts/check-production-file-size.py
        files: '\.rs$'
        pass_filenames: false

      # Mirrors CI Lint "Check core/UI boundary".
      - id: core-ui-boundary
        name: core/UI boundary
        language: system
        entry: bash scripts/check-core-ui-boundary.sh
        files: '\.rs$'
        pass_filenames: false

      - id: transcript-projection-boundary
        name: transcript projection boundary
        language: system
        entry: python3 scripts/check_transcript_projection.py
        files: '^(crates/.*\.rs|examples/|scripts/(check_transcript_projection\.py|transcript-projection-sites\.toml))'
        pass_filenames: false

      # Mirrors CI Lint "Check the durability engine's SQL boundary": the
      # engine's tables are written only by their neutral and dialect modules.
      - id: durable-sql-boundary
        name: durable SQL boundary
        language: system
        entry: python3 scripts/check-durable-sql.py
        files: '^(crates/.*\.(rs|sql)|examples/.*\.(rs|sql)|runbooks/.*\.(rs|sql)|scripts/check-durable-sql\.py)$'
        pass_filenames: false

      # Mirrors CI Lint "Check substrate boundary" — includes the
      # shift-determinism ratchet (FIG-3672), whose allowlist can only shrink.
      - id: substrate-boundary
        name: substrate boundary
        language: system
        entry: bash scripts/check-substrate-boundary.sh
        files: '^(\.pre-commit-config\.yaml|crates/.*\.rs|scripts/(check-substrate-boundary\.sh|shift-determinism-allowlist\.(count|txt)|test_check_substrate_boundary\.py))$'
        pass_filenames: false

      # Mirrors CI Lint "Check substrate port ledger": every test that uses the
      # Restate server double has a ledger row (ADR 0132 §14).
      - id: substrate-port-ledger
        name: substrate port ledger
        language: system
        entry: python3 scripts/check-substrate-port-ledger.py
        files: '^(\.pre-commit-config\.yaml|docs/testing/substrate-port-ledger\.toml|(crates|examples|runbooks)/.*(\.rs|Cargo\.toml)|scripts/(check-substrate-port-ledger|test_check_substrate_port_ledger)\.py)$'
        pass_filenames: false

      # Mirrors CI Lint "Check substrate stub lane tags": every substrate
      # `todo!`/`unimplemented!` names the lane that fills it (I0, FIG-5194).
      - id: substrate-todos
        name: substrate stub lane tags
        language: system
        entry: python3 scripts/check-substrate-todos.py
        files: '^(\.pre-commit-config\.yaml|crates/.*\.rs|scripts/(check-substrate-todos|test_check_substrate_todos)\.py)$'
        pass_filenames: false
