# Managed by prek (https://github.com/j178/prek): `prek install --hook-type pre-commit`
#
# pre-commit = seconds (hygiene + the cheap gates CI's Lint job enforces).
# No pre-push build: workspace Clippy runs in CI or on explicit local request.
# Tests deliberately stay out of hooks: the full workspace suite is minutes
# long and belongs to the development loop and CI's Test job — a hook that
# slow gets --no-verify'd and rots.
# docs/pagefind is a generated search index whose bytes are load-bearing.
# The vendored Test262 corpus (tests, upstream harness, LICENSE) is kept
# byte-for-byte at its pinned upstream commit and sync-verified; "fixing"
# its whitespace breaks the byte-comparison.
exclude: '^(docs/pagefind/|crates/lash-typescript/tests/test262/(test/|harness/|LICENSE))'
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        exclude: '^tools/bazel/patches/.*\.patch$'
      - id: end-of-file-fixer
        exclude: '^tools/bazel/patches/.*\.patch$'
      - id: check-yaml
      - id: check-json

  - repo: local
    hooks:
      # Apply the formatter before CI checks it. If files change, prek stops
      # the commit so the author can review and restage them.
      - id: cargo-fmt
        name: cargo fmt --all
        language: system
        entry: cargo fmt --all
        files: '\.rs$'
        pass_filenames: false

      # Mirrors CI Lint "Lint GitHub workflows" — GitHub rejects schema-invalid
      # workflow files that plain YAML parsing accepts.
      - id: actionlint
        name: actionlint
        language: system
        entry: actionlint -no-color
        files: '^\.github/workflows/.*\.ya?ml$'
        pass_filenames: true
      # Apply rustfmt to the files `cargo fmt` cannot see, because `include!`
      # splices text rather than declaring a module.
      - id: included-file-formatting
        name: include!d file formatting
        language: system
        entry: python3 scripts/check_included_file_formatting.py --fix
        files: '\.rs$'
        pass_filenames: false

      # Mirrors CI Lint "Check production file-size budget".
      - id: file-size-budget
        name: production file-size budget
        language: system
        entry: python3 scripts/check-production-file-size.py
        files: '\.rs$'
        pass_filenames: false

      # Mirrors CI Lint "Check core/UI boundary".
      - id: core-ui-boundary
        name: core/UI boundary
        language: system
        entry: bash scripts/check-core-ui-boundary.sh
        files: '\.rs$'
        pass_filenames: false

      # Mirrors CI Lint "Check substrate boundary" — includes the
      # drive-determinism ratchet (FIG-3672), whose allowlist can only shrink.
      - id: substrate-boundary
        name: substrate boundary
        language: system
        entry: bash scripts/check-substrate-boundary.sh
        files: '^(\.pre-commit-config\.yaml|crates/.*\.rs|scripts/(check-substrate-boundary\.sh|drive-determinism-allowlist\.(count|txt)|test_check_substrate_boundary\.py))$'
        pass_filenames: false

      # Orchestrating provider bodies are authored replay code. Keep obvious
      # nondeterminism out of their entrypoints before it reaches a journal.
      - id: orchestrating-tool-determinism
        name: orchestrating tool determinism
        language: system
        entry: python3 scripts/lint_orchestrating_tools.py
        files: '^crates/.*\.rs$'
        pass_filenames: false

      # Restate retries non-terminal handler failures indefinitely; production
      # handler code must use typed errors rather than panic-capable operations.
      - id: restate-handler-panic-boundary
        name: Restate handler panic boundary
        language: system
        entry: python3 scripts/check-restate-handler-panics.py
        files: '^(crates/lash-restate/src/.*|crates/lash-restate-test/src/backend)\.rs$'
        pass_filenames: false
