# Managed by prek (https://github.com/j178/prek): `prek install --hook-type pre-commit --hook-type pre-push`
#
# pre-commit = seconds (hygiene + the cheap gates CI's Lint job enforces).
# pre-push  = the expensive workspace-wide lint.
# Tests deliberately stay out of hooks: the full workspace suite is minutes
# long and belongs to the development loop and CI's Test job — a hook that
# slow gets --no-verify'd and rots.
# docs/pagefind is a generated search index; scenarios/ holds replay
# fixtures whose bytes are load-bearing. Neither should be "fixed".
# The vendored Test262 corpus (tests, upstream harness, LICENSE) is kept
# byte-for-byte at its pinned upstream commit and sync-verified; "fixing"
# its whitespace breaks the byte-comparison.
exclude: '^(docs/pagefind/|scenarios/|crates/lash-typescript/tests/test262/(test/|harness/|LICENSE))'
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json

  - repo: local
    hooks:
      # Mirrors CI Lint "Check formatting" — whole workspace, check-only.
      - id: cargo-fmt-check
        name: cargo fmt --all --check
        language: system
        entry: cargo fmt --all --check
        files: '\.rs$'
        pass_filenames: false

      # Mirrors CI Lint "Lint GitHub workflows" — GitHub rejects schema-invalid
      # workflow files that plain YAML parsing accepts.
      - id: actionlint
        name: actionlint
        language: system
        entry: actionlint -no-color
        files: '^\.github/workflows/.*\.ya?ml$'
        pass_filenames: true
      # Mirrors CI Lint "Check formatting" for the files `cargo fmt` cannot
      # see, because `include!` splices text rather than declaring a module.
      - id: included-file-formatting
        name: include!d file formatting
        language: system
        entry: python3 scripts/check_included_file_formatting.py
        files: '\.rs$'
        pass_filenames: false

      # Mirrors CI Lint "Check production file-size budget".
      - id: file-size-budget
        name: production file-size budget
        language: system
        entry: bash scripts/check-production-file-size.sh
        files: '\.rs$'
        pass_filenames: false

      # Mirrors CI Lint "Check core/UI boundary".
      - id: core-ui-boundary
        name: core/UI boundary
        language: system
        entry: bash scripts/check-core-ui-boundary.sh
        files: '\.rs$'
        pass_filenames: false

      # Orchestrating provider bodies are authored replay code. Keep obvious
      # nondeterminism out of their entrypoints before it reaches a journal.
      - id: orchestrating-tool-determinism
        name: orchestrating tool determinism
        language: system
        entry: python3 scripts/lint_orchestrating_tools.py
        files: '^crates/.*\.rs$'
        pass_filenames: false

      # Restate retries non-terminal handler failures indefinitely; production
      # handler code must use typed errors rather than panic-capable operations.
      - id: restate-handler-panic-boundary
        name: Restate handler panic boundary
        language: system
        entry: python3 scripts/check-restate-handler-panics.py
        files: '^crates/lash-restate/src/.*\.rs$'
        pass_filenames: false

      # Mirrors CI Lint "Check durable-read fixture schema declaration".
      - id: durable-read-fixture-version
        name: durable-read fixture schema declaration
        language: system
        entry: python3 scripts/check-durable-read-fixture-version.py --cached
        files: '^(fixtures/durable-read/|crates/lash-core/tests/support/durable_read_fixture\.rs$)'
        pass_filenames: false

      # Every *_json column must stay explicitly enrolled, excluded, or proven
      # not to carry a serialized struct.
      - id: postgres-json-carrier-coverage
        name: PostgreSQL JSON carrier coverage
        language: system
        entry: python3 scripts/check-postgres-json-carrier-coverage.py
        files: '^(crates/lash-postgres-store/(schema\.sql|schema-shape\.txt|json-carriers\.json)|scripts/check-postgres-json-carrier-coverage\.py)$'
        pass_filenames: false

      # Blob payload fields are outside PostgreSQL's catalog. Once a registered
      # type changes, its owning component version must move with the artifact.
      - id: postgres-payload-shape-version
        name: PostgreSQL payload-shape component version
        language: system
        entry: python3 scripts/check-postgres-payload-shape-version.py --cached
        files: '^(crates/lash-postgres-store/(?:schema-shape|payload-schema-fingerprints)\.txt|crates/lash-postgres-store/src/lib\.rs|crates/lash-sqlite-store/src/schema\.rs)$'
        pass_filenames: false

      # The recreation E2E's fixtures are projections of SCHEMA_MIGRATIONS. A
      # component bump that leaves them behind produces refusals about a
      # generation the build no longer has, so it fails here rather than one
      # container gate later.
      - id: version-bump-recreation-fixtures
        name: Version-bump recreation fixtures
        language: system
        entry: python3 scripts/check_version_bump_fixtures.py
        files: '^(crates/lash-postgres-store/src/(?:lib\.rs|postgres/schema\.rs)|runbooks/restate-postgres-workers/src/bin/version_bump\.rs|scripts/(?:check_version_bump_fixtures\.py|version-bump-recreation-e2e\.sh))$'
        pass_filenames: false

      # Mirrors CI Lint "Clippy (workspace, all targets)". Warm-cache this is
      # tens of seconds; run at push so commits stay instant.
      - id: cargo-clippy-workspace
        name: cargo clippy (workspace, all targets)
        language: system
        entry: cargo clippy --workspace --all-targets -- -D warnings
        files: '\.rs$'
        pass_filenames: false
        stages: [pre-push]
