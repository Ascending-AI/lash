schema_version = 4
judge_model_floor = "gpt-6-sol"
artifact_layout = "<run-root>/<scenario>/<label>/<store>"

# ADR 0139: TypeScript and Python lower to one dialect-free kernel. An RLM
# scenario emits once per listed dialect, defaulting to TypeScript.
dialects = ["typescript", "python"]
# SQL stores default to SQLite; G4 scenarios also certify PostgreSQL.
stores = ["sqlite", "postgres"]

# Execution tiers. A judged row's execution model is a claim about what the row
# is testing, not a uniform quality floor: the old blanket `gpt-5.6-sol`
# execution floor bought a frontier model for rows whose every gate is a row
# count. `tier` says which claim the row makes; `model` on each scenario is the
# concrete slug, written out rather than defaulted so a substitution is visible
# in the diff. RULES.md carries the semantics and the substitution rule.
#
#   deterministic — the row makes no provider network call. A scripted or
#                   in-process fixture provider supplies every reply, so the
#                   model's choices are not the judged subject at all.
#   economy       — a competent driver suffices. Every gate is a count, an id,
#                   a durable fact, or an instruction the runbook states
#                   outright; a frontier model would produce the same evidence.
#   frontier      — model *behaviour* is the judged subject. A weaker driver
#                   changes the verdict rather than the prose.
# Each tier lists the models it may be funded at; a scenario must name one of
# them. `economy` has two rungs because "a competent driver suffices" is not one
# capability: `flash` runs the rows that only have to follow an instruction the
# runbook states outright, `pro` the rows that have to author a working durable
# program or discover an affordance.
[tiers]
deterministic = ["scripted-provider"]
economy = ["deepseek/deepseek-v4-flash", "deepseek/deepseek-v4-pro"]
frontier = ["openai/gpt-6.1-sol", "openai/gpt-5.6-sol"]

# Groups declare whether entries emit judged-browser rows and what they name.
# A dialect label expands the entry's dialects (default: TypeScript).
[groups]
scenarios = { emits = true, label = "dialect" }
no_rlm_session_only = { emits = true, label = "standard" }
scripted_live_model = { emits = false, referent = "harness_case" }
scripted_harness = { emits = false, referent = "harness" }
deterministic_only = { emits = false, referent = "runbook" }

# Python rows run on a worker whose host names Python (FIG-5990).
# Declaration order is shard order; each scenario's dialect order is retained.
[scenarios]
workbench-python-session = { tier = "frontier", model = "openai/gpt-6.1-sol", dialects = ["python"] }
workbench-crash-resume = { tier = "deterministic", model = "scripted-provider", stores = ["sqlite", "postgres"] }
provider-runtime-feedback = { tier = "economy", model = "deepseek/deepseek-v4-flash", deterministic_phases = "runtime_feedback_ workspace nextest companion; live outgoing retry request remains judged" }
rlm-cell-boundary = { tier = "economy", model = "deepseek/deepseek-v4-flash", dialects = ["typescript", "python"] }
workbench-approval = { tier = "economy", model = "deepseek/deepseek-v4-pro", dialects = ["typescript", "python"] }
workbench-attachments = { tier = "economy", model = "deepseek/deepseek-v4-flash", deterministic_phases = "only Phase 2 calls a provider" }
workbench-chat-projection = { tier = "economy", model = "deepseek/deepseek-v4-flash", deterministic_phases = "Phase 2 mail delivery is host-driven; composer and registration turns call the live provider" }
workbench-continue-as = { tier = "frontier", model = "openai/gpt-6.1-sol", dialects = ["typescript", "python"] }
workbench-deferred-tools = { tier = "economy", model = "deepseek/deepseek-v4-pro", dialects = ["typescript", "python"] }
workbench-durable-stop = { tier = "economy", model = "deepseek/deepseek-v4-pro" }
workbench-execution-state-rehydration = { tier = "economy", model = "deepseek/deepseek-v4-pro", dialects = ["typescript", "python"] }
workbench-failure-paths = { tier = "deterministic", model = "scripted-provider" }
workbench-inbox-world = { tier = "economy", model = "deepseek/deepseek-v4-pro" }
workbench-process-lifecycle = { stores = ["sqlite", "postgres"], tier = "economy", model = "deepseek/deepseek-v4-pro", dialects = ["typescript", "python"] }
workbench-reconnect-resilience = { tier = "economy", model = "deepseek/deepseek-v4-flash" }
workbench-session-id-retirement = { tier = "economy", model = "deepseek/deepseek-v4-pro" }
workbench-session-isolation = { tier = "economy", model = "deepseek/deepseek-v4-pro" }
workbench-session-resume = { stores = ["sqlite", "postgres"], tier = "deterministic", model = "scripted-provider" }
workbench-shared-session-multi-tab = { tier = "economy", model = "deepseek/deepseek-v4-pro" }
workbench-tool-membership = { tier = "economy", model = "deepseek/deepseek-v4-flash" }
workbench-trigger-lifecycle = { tier = "economy", model = "deepseek/deepseek-v4-pro" }
workbench-turn-ingress = { tier = "frontier", model = "openai/gpt-6.1-sol", deterministic_phases = "Phase 5 queue management may use exec-blocked; Phases 0-4 use the live provider" }
workbench-weather = { tier = "frontier", model = "openai/gpt-6.1-sol", dialects = ["typescript", "python"] }

host-flows = { tier = "frontier", model = "openai/gpt-6.1-sol", dialects = ["typescript", "python"] }

# Scenarios that open no RLM session have no language to pin at all. They get
# one row each, emitted with the label `standard` — the mode, not a language —
# which is also their artifact directory. This is a behavioral predicate: a
# standard-mode host is one example, not the definition. The distinction
# is independent of future dialects: `typescript` on a row claims that an
# RLM session served it, and these rows cannot make that claim.
[no_rlm_session_only]
workbench-valid-empty-completion = { tier = "deterministic", model = "scripted-provider" }
# Re-judged against the kernel-document runbook (FIG-5717): it opens no RLM
# session and calls no provider, and a judge reads the page and the run's SSE
# overlay, so it stays a judged `standard` row at the deterministic tier.
workflow-editor-authoring = { tier = "deterministic", model = "scripted-provider" }

# Live-model scripted harnesses with deterministic shell oracles. They open an
# RLM session, so they run once per listed dialect, but they are not emitted to the
# judged-browser shard: the named runner owns the model turn and the oracle
# owns the verdict.
[scripted_live_model]
rlm-smoke-file-edit-bugfix = { tier = "economy", model = "deepseek/deepseek-v4-flash", runner = "just rlm-smoke-e2e", dialects = ["typescript", "python"] }
rlm-smoke-missing-helper-file = { tier = "economy", model = "deepseek/deepseek-v4-flash", runner = "just rlm-smoke-e2e", dialects = ["typescript", "python"] }
rlm-smoke-config-contract-edit = { tier = "economy", model = "deepseek/deepseek-v4-flash", runner = "just rlm-smoke-e2e", dialects = ["typescript", "python"] }

# Scripted harness roots, including README-only directories. Cases above
# carry funding; a root emits no judged-browser row.
[scripted_harness]
rlm-smoke = { runner = "just rlm-smoke-e2e" }
lash-facade-failover = { runner = "kiln test //runbooks/lash-facade-failover:failover__test --test_arg=--exact --test_arg=<case>" }
lash-postgres-workers = { runner = "kiln test //crates/lash-postgres-workers:failover__test --test_arg=--exact --test_arg=<case>" }

# Hermetic procedures with no provider call and no judged-browser row.
[deterministic_only]
latency-gate = { tier = "deterministic", model = "scripted-provider" }
kernel-migration-sweep = { tier = "deterministic", model = "scripted-provider" }
saved-functions = { tier = "deterministic", model = "scripted-provider" }
context-overflow-recovery = { tier = "deterministic", model = "scripted-provider" }
example-core-shutdown = { tier = "deterministic", model = "scripted-provider" }
host-provisioned-schema = { tier = "deterministic", model = "scripted-provider" }
mcp-naming-refresh = { tier = "deterministic", model = "scripted-provider" }
runtime-identity = { tier = "deterministic", model = "scripted-provider" }
workbench-attachment-reclamation = { tier = "deterministic", model = "scripted-provider" }
