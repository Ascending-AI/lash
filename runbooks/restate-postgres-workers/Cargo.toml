[package]
name = "lash-restate-postgres-workers-e2e"
version = "0.0.0"
edition.workspace = true
publish = false
rust-version.workspace = true

[[bin]]
name = "lash-e2e-worker"
path = "src/bin/worker.rs"
test = false

[[bin]]
name = "lash-e2e-mock-provider"
path = "src/bin/mock_provider.rs"

[[bin]]
name = "lash-e2e-runner"
path = "src/bin/runner.rs"

[[bin]]
name = "lash-e2e-await-event-helper"
path = "src/bin/await_event_helper.rs"
test = false

[[bin]]
name = "lash-e2e-process-operations-worker"
path = "src/bin/process_operations_worker.rs"
test = false

[[bin]]
name = "lash-e2e-context-overflow-recovery"
path = "src/bin/context_overflow_recovery.rs"
test = false

[[bin]]
name = "lash-e2e-session-operator"
path = "src/bin/session_operator.rs"
test = false

[[bin]]
name = "lash-loadtest-smoke"
path = "src/bin/loadtest_smoke.rs"
test = false

[[bin]]
name = "lash-loadtest-driver"
path = "src/bin/loadtest_driver.rs"
test = false

[[bin]]
name = "lash-loadtest-ledger-contract"
path = "src/bin/loadtest_ledger_contract.rs"
test = false

[lib]
doctest = false

[features]
# The synthetic N+1 worker (ADR 0115 §6) the FIG-4169 rolling deploy starts
# beside the running generation: it moves the constants whose
# `synthetic-next` blocks sit beside them, so it has its own drain
# generation. `just multi-node-load` builds the worker both ways. No
# production build enables it.
synthetic-next = ["lash/synthetic-next"]

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = "0.8"
chrono = { workspace = true }
lash = { workspace = true, features = [
    "rlm",
    "restate",
    "typescript",
    "postgres",
    "sqlite",
    "s3",
    "openai",
    "testing",
] }
lash-perf = { path = "../../crates/lash-perf" }
lash-plugin-standard-compaction = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls", "http2"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"
uuid = { workspace = true }

[dev-dependencies]
lash-restate-test = { workspace = true }
lash-provider-anthropic = { workspace = true }
lash-llm-transport = { workspace = true }
