[package]
name = "lash-restate-postgres-workers-e2e"
version = "0.0.0"
edition.workspace = true
publish = false
rust-version.workspace = true

[[bin]]
name = "lash-e2e-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "lash-e2e-mock-provider"
path = "src/bin/mock_provider.rs"

[[bin]]
name = "lash-e2e-runner"
path = "src/bin/runner.rs"

[[bin]]
name = "lash-e2e-frame-crash"
path = "src/bin/frame_crash.rs"

[[bin]]
name = "lash-e2e-await-event-helper"
path = "src/bin/await_event_helper.rs"

[[bin]]
name = "lash-e2e-process-operations-worker"
path = "src/bin/process_operations_worker.rs"

[[bin]]
name = "lash-e2e-version-bump"
path = "src/bin/version_bump.rs"

[[bin]]
name = "lash-e2e-session-lease-triage"
path = "src/bin/session_lease_triage.rs"

[[bin]]
name = "lash-e2e-process-operator-flow"
path = "src/bin/process_operator_flow.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = "0.8"
chrono = { workspace = true }
lash-core = { workspace = true, features = ["testing"] }
lash = { workspace = true, features = ["rlm"] }
lash-llm-tools = { workspace = true }
lash-postgres-store = { workspace = true }
lash-protocol-rlm = { workspace = true, features = ["testing"] }
lash-provider-openai = { workspace = true }
lash-restate = { workspace = true }
lash-sqlite-store = { workspace = true }
lash-s3-store = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls", "http2"] }
restate-sdk = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"
uuid = { workspace = true }
