# Distributed-backend e2e harness: Restate + Postgres + S3 (Garage) with two
# workers behind a round-robin proxy.
#
# The e2e binaries are built on the host by scripts/restate-postgres-workers-e2e.sh
# and bind-mounted in; LASH_E2E_BIN_DIR (exported by the script) points at the
# host's target/debug. The runtime image matches the GitHub ubuntu-latest
# runner's glibc, so host-built binaries run unmodified — which also means the
# harness needs a Linux x86_64 host with glibc <= the image's (any current
# Ubuntu works).
x-gate-labels: &gate-labels
  com.lash.e2e.worktree: "${LASH_GATE_WORKTREE_SLUG:?run via the e2e script}"

services:
  postgres:
    labels: *gate-labels
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lash
      POSTGRES_PASSWORD: lash
      POSTGRES_DB: lash
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lash -d lash"]
      interval: 2s
      timeout: 2s
      retries: 30

  # lash's S3 test service: Garage, as figments runs it. The image, the
  # credentials and the bucket come from scripts/ci/s3-service.sh, which the
  # e2e script sources; `--default-bucket` creates the key and the bucket at
  # startup, so there is no init container.
  s3:
    labels: *gate-labels
    image: ${LASH_S3_IMAGE:?run via the e2e script}
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${LASH_S3_RPC_SECRET:?run via the e2e script}
      GARAGE_DEFAULT_ACCESS_KEY: ${LASH_S3_ACCESS_KEY:?run via the e2e script}
      GARAGE_DEFAULT_SECRET_KEY: ${LASH_S3_SECRET_KEY:?run via the e2e script}
      GARAGE_DEFAULT_BUCKET: ${LASH_S3_BUCKET:?run via the e2e script}
    volumes:
      - ${LASH_S3_CONFIG:?run via the e2e script}:/etc/garage.toml:ro
    ports:
      - "127.0.0.1:${LASH_E2E_S3_PORT:?run via the e2e script}:3900"
    healthcheck:
      test: ["CMD", "/garage", "bucket", "info", "${LASH_S3_BUCKET}"]
      interval: 1s
      timeout: 5s
      retries: 60

  restate:
    labels: *gate-labels
    image: restatedev/restate:1.7.12@sha256:bb9c93ab92bb401548841b35dba0e7236a3b108bc1d7d4c06a8f3ece46b80d4b
    environment:
      RESTATE_ADMIN__BIND_PORT: "9070"
      RESTATE_INGRESS__BIND_PORT: "8080"
      RESTATE_BIND_PORT: "5122"

  mock-provider:
    labels: *gate-labels
    image: ubuntu:24.04
    command: /usr/local/bin/lash-e2e-mock-provider
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MOCK_PROVIDER_PORT: "18001"
      DATABASE_URL: postgres://lash:lash@postgres:5432/lash
    volumes:
      - ${LASH_E2E_BIN_DIR:?run via `just restate-postgres-workers-e2e`}/lash-e2e-mock-provider:/usr/local/bin/lash-e2e-mock-provider:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro

  worker-a:
    labels: *gate-labels
    image: ubuntu:24.04
    command: /usr/local/bin/lash-e2e-worker
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
      restate:
        condition: service_started
    environment:
      WORKER_INSTANCE_ID: worker-a
      WORKER_PORT: "18100"
      LASH_E2E_TOKIO_STACK_BYTES: "${LASH_E2E_TOKIO_STACK_BYTES:-8388608}"
      LASH_E2E_FAIL_ONCE: "1"
      DATABASE_URL: postgres://lash:lash@postgres:5432/lash
      RESTATE_INGRESS_URL: http://restate:8080
      RESTATE_AUTHORITY_ID: "${RESTATE_AUTHORITY_ID:?set a stable unique Restate authority id}"
      S3_ENDPOINT: http://s3:3900
      S3_BUCKET: ${LASH_S3_BUCKET:?run via the e2e script}
      S3_REGION: ${LASH_S3_REGION:?run via the e2e script}
      S3_ACCESS_KEY: ${LASH_S3_ACCESS_KEY:?run via the e2e script}
      S3_SECRET_KEY: ${LASH_S3_SECRET_KEY:?run via the e2e script}
      S3_PREFIX: runbooks/restate-postgres-workers
      MOCK_PROVIDER_BASE_URL: http://mock-provider:18001
      LASH_E2E_TRACE_DIR: /e2e-traces
    volumes:
      - ${LASH_E2E_BIN_DIR:?run via `just restate-postgres-workers-e2e`}/lash-e2e-worker:/usr/local/bin/lash-e2e-worker:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - trace-output:/e2e-traces

  worker-b:
    labels: *gate-labels
    image: ubuntu:24.04
    command: /usr/local/bin/lash-e2e-worker
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
      restate:
        condition: service_started
    environment:
      WORKER_INSTANCE_ID: worker-b
      WORKER_PORT: "18100"
      LASH_E2E_TOKIO_STACK_BYTES: "${LASH_E2E_TOKIO_STACK_BYTES:-8388608}"
      LASH_E2E_FAIL_ONCE: "1"
      DATABASE_URL: postgres://lash:lash@postgres:5432/lash
      RESTATE_INGRESS_URL: http://restate:8080
      RESTATE_AUTHORITY_ID: "${RESTATE_AUTHORITY_ID:?set a stable unique Restate authority id}"
      S3_ENDPOINT: http://s3:3900
      S3_BUCKET: ${LASH_S3_BUCKET:?run via the e2e script}
      S3_REGION: ${LASH_S3_REGION:?run via the e2e script}
      S3_ACCESS_KEY: ${LASH_S3_ACCESS_KEY:?run via the e2e script}
      S3_SECRET_KEY: ${LASH_S3_SECRET_KEY:?run via the e2e script}
      S3_PREFIX: runbooks/restate-postgres-workers
      MOCK_PROVIDER_BASE_URL: http://mock-provider:18001
      LASH_E2E_TRACE_DIR: /e2e-traces
    volumes:
      - ${LASH_E2E_BIN_DIR:?run via `just restate-postgres-workers-e2e`}/lash-e2e-worker:/usr/local/bin/lash-e2e-worker:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - trace-output:/e2e-traces

  worker-proxy:
    labels: *gate-labels
    image: caddy:2-alpine
    depends_on:
      - worker-a
      - worker-b
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  runner:
    labels: *gate-labels
    image: ubuntu:24.04
    command: /usr/local/bin/lash-e2e-runner
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
      restate:
        condition: service_started
      worker-proxy:
        condition: service_started
      mock-provider:
        condition: service_started
    environment:
      DATABASE_URL: postgres://lash:lash@postgres:5432/lash
      RESTATE_ADMIN_URL: http://restate:9070
      RESTATE_INGRESS_URL: http://restate:8080
      RESTATE_AUTHORITY_ID: "${RESTATE_AUTHORITY_ID:?set a stable unique Restate authority id}"
      WORKER_DEPLOYMENT_URL: http://worker-proxy:18100
      S3_ENDPOINT: http://s3:3900
      S3_BUCKET: ${LASH_S3_BUCKET:?run via the e2e script}
      S3_REGION: ${LASH_S3_REGION:?run via the e2e script}
      S3_ACCESS_KEY: ${LASH_S3_ACCESS_KEY:?run via the e2e script}
      S3_SECRET_KEY: ${LASH_S3_SECRET_KEY:?run via the e2e script}
      S3_PREFIX: runbooks/restate-postgres-workers
      MOCK_PROVIDER_BASE_URL: http://mock-provider:18001
      LASH_E2E_TRACE_DIR: /e2e-traces
      LASH_E2E_STALL_TIMEOUT_SECS: "${LASH_E2E_STALL_TIMEOUT_SECS:-240}"
      LASH_E2E_TURN_CONTROL_ONLY: "${LASH_E2E_TURN_CONTROL_ONLY:-0}"
      LASH_E2E_WAKE_RCA_ONLY: "${LASH_E2E_WAKE_RCA_ONLY:-0}"
      LASH_E2E_WORKFLOW_SEGMENT: "${LASH_E2E_WORKFLOW_SEGMENT:-}"
      LASH_E2E_COMPLETED_WORKFLOW_MANIFEST: "${LASH_E2E_COMPLETED_WORKFLOW_MANIFEST_CONTAINER:-}"
    volumes:
      - ${LASH_E2E_BIN_DIR:?run via `just restate-postgres-workers-e2e`}/lash-e2e-runner:/usr/local/bin/lash-e2e-runner:ro
      - ${LASH_E2E_BIN_DIR:?run via `just restate-postgres-workers-e2e`}/lash-e2e-frame-crash:/usr/local/bin/lash-e2e-frame-crash:ro
      - ${LASH_E2E_BIN_DIR:?run via `just restate-postgres-workers-e2e`}/lash-e2e-await-event-helper:/usr/local/bin/lash-e2e-await-event-helper:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - trace-output:/e2e-traces
      - ${LASH_E2E_WORKFLOW_MANIFEST_DIR:?run via the e2e script}:/e2e-manifests
    profiles:
      - runner

volumes:
  trace-output:

networks:
  default:
    name: "${LASH_E2E_NETWORK:?run via the e2e script}"
    external: true
