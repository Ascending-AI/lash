services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:${LASH_PROCESS_OPERATIONS_MINIO_PORT:-19446}:9000"
      - "127.0.0.1:${LASH_PROCESS_OPERATIONS_MINIO_CONSOLE_PORT:-19447}:9001"

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done &&
      mc mb --ignore-existing local/lash-attachments
      "

  restate:
    image: restatedev/restate:1.7.0
    environment:
      RESTATE_ADMIN__BIND_PORT: "9070"
      RESTATE_INGRESS__BIND_PORT: "8080"
      RESTATE_BIND_PORT: "5122"
    ports:
      - "127.0.0.1:${LASH_PROCESS_OPERATIONS_RESTATE_ADMIN_PORT:-19076}:9070"
      - "127.0.0.1:${LASH_PROCESS_OPERATIONS_RESTATE_INGRESS_PORT:-18086}:8080"
      - "127.0.0.1:${LASH_PROCESS_OPERATIONS_RESTATE_NODE_PORT:-15126}:5122"

  crash-worker:
    image: ubuntu:24.04
    entrypoint: ["/usr/local/bin/lash-e2e-process-operations-worker"]
    environment:
      DATABASE_URL: postgres://lash:lash@127.0.0.1:5446/lash
    network_mode: host
    volumes:
      - ${LASH_PROCESS_OPERATIONS_BIN_DIR:?run via `just process-operations-e2e`}/lash-e2e-process-operations-worker:/usr/local/bin/lash-e2e-process-operations-worker:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    profiles:
      - crash
