x-gate-labels: &gate-labels
  com.lash.e2e.worktree: "${LASH_GATE_WORKTREE_SLUG:?run via the e2e script}"

services:
  postgres:
    image: postgres:16-alpine
    labels: *gate-labels
    environment:
      POSTGRES_USER: lash
      POSTGRES_PASSWORD: lash
      POSTGRES_DB: lash
    ports:
      - "127.0.0.1:${LASH_PROCESS_OPERATIONS_POSTGRES_PORT:?run via the e2e script}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lash -d lash"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    labels: *gate-labels
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:${LASH_PROCESS_OPERATIONS_MINIO_PORT:?run via the e2e script}:9000"
      - "127.0.0.1:${LASH_PROCESS_OPERATIONS_MINIO_CONSOLE_PORT:?run via the e2e script}:9001"

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    labels: *gate-labels
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done &&
      mc mb --ignore-existing local/lash-attachments
      "

  restate:
    image: restatedev/restate:1.7.0
    labels: *gate-labels
    environment:
      RESTATE_ADMIN__BIND_PORT: "9070"
      RESTATE_INGRESS__BIND_PORT: "8080"
      RESTATE_BIND_PORT: "5122"
    ports:
      - "127.0.0.1:${LASH_PROCESS_OPERATIONS_RESTATE_ADMIN_PORT:?run via the e2e script}:9070"
      - "127.0.0.1:${LASH_PROCESS_OPERATIONS_RESTATE_INGRESS_PORT:?run via the e2e script}:8080"
      - "127.0.0.1:${LASH_PROCESS_OPERATIONS_RESTATE_NODE_PORT:?run via the e2e script}:5122"

  crash-worker:
    image: ubuntu:24.04
    labels: *gate-labels
    entrypoint: ["/usr/local/bin/lash-e2e-process-operations-worker"]
    environment:
      DATABASE_URL: "postgres://lash:lash@127.0.0.1:${LASH_PROCESS_OPERATIONS_POSTGRES_PORT:?run via the e2e script}/lash"
    network_mode: host
    volumes:
      - ${LASH_PROCESS_OPERATIONS_BIN_DIR:?run via `just process-operations-e2e`}/lash-e2e-process-operations-worker:/usr/local/bin/lash-e2e-process-operations-worker:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    profiles:
      - crash

networks:
  default:
    name: "${LASH_E2E_NETWORK:?run via the e2e script}"
    external: true
