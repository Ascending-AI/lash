x-gate-labels: &gate-labels
  com.lash.e2e.worktree: "${LASH_GATE_WORKTREE_SLUG:?run via the e2e script}"

services:
  postgres:
    image: postgres:16-alpine
    labels: *gate-labels
    environment:
      POSTGRES_USER: lash
      POSTGRES_PASSWORD: lash
      POSTGRES_DB: lash
    ports:
      - "127.0.0.1:${LASH_PROCESS_OPERATIONS_POSTGRES_PORT:?run via the e2e script}:5432"
    # TCP only: the image's temporary init server answers the unix socket
    # alone, so a TCP answer can only come from the final server — the same
    # probe scripts/ci/pg-service.sh runs.
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -p 5432 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" && PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -p 5432 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Atqc "SELECT 1"']
      interval: 2s
      timeout: 2s
      retries: 30

  # lash's S3 test service: Garage, as figments runs it. The image, the
  # credentials and the bucket come from scripts/ci/s3-service.sh, which the
  # e2e script sources; `--default-bucket` creates the key and the bucket at
  # startup, so there is no init container.
  s3:
    image: ${LASH_S3_IMAGE:?run via the e2e script}
    labels: *gate-labels
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${LASH_S3_RPC_SECRET:?run via the e2e script}
      GARAGE_DEFAULT_ACCESS_KEY: ${LASH_S3_ACCESS_KEY:?run via the e2e script}
      GARAGE_DEFAULT_SECRET_KEY: ${LASH_S3_SECRET_KEY:?run via the e2e script}
      GARAGE_DEFAULT_BUCKET: ${LASH_S3_BUCKET:?run via the e2e script}
    volumes:
      - ${LASH_S3_CONFIG:?run via the e2e script}:/etc/garage.toml:ro
    ports:
      - "127.0.0.1:${LASH_PROCESS_OPERATIONS_S3_PORT:?run via the e2e script}:3900"

  restate:
    image: restatedev/restate:1.7.12@sha256:bb9c93ab92bb401548841b35dba0e7236a3b108bc1d7d4c06a8f3ece46b80d4b
    labels: *gate-labels
    environment:
      RESTATE_ADMIN__BIND_PORT: "9070"
      RESTATE_INGRESS__BIND_PORT: "8080"
      RESTATE_BIND_PORT: "5122"
    ports:
      - "127.0.0.1:${LASH_PROCESS_OPERATIONS_RESTATE_ADMIN_PORT:?run via the e2e script}:9070"
      - "127.0.0.1:${LASH_PROCESS_OPERATIONS_RESTATE_INGRESS_PORT:?run via the e2e script}:8080"
      - "127.0.0.1:${LASH_PROCESS_OPERATIONS_RESTATE_NODE_PORT:?run via the e2e script}:5122"

  crash-worker:
    image: ubuntu:24.04
    labels: *gate-labels
    entrypoint: ["/usr/local/bin/lash-e2e-process-operations-worker"]
    environment:
      DATABASE_URL: "postgres://lash:lash@127.0.0.1:${LASH_PROCESS_OPERATIONS_POSTGRES_PORT:?run via the e2e script}/lash"
    network_mode: host
    volumes:
      - ${LASH_PROCESS_OPERATIONS_BIN_DIR:?run via `just process-operations-e2e`}/lash-e2e-process-operations-worker:/usr/local/bin/lash-e2e-process-operations-worker:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    profiles:
      - crash

networks:
  default:
    name: "${LASH_E2E_NETWORK:?run via the e2e script}"
    external: true
