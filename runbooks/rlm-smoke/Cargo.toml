[package]
name = "rlm-smoke-host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
lash = { workspace = true, features = ["restate", "rlm"] }
lash-provider-openai = { workspace = true }
lash-sqlite-store = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
restate-sdk = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = { workspace = true }
