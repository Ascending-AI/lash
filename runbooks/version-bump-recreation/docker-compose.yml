# Version-bump recreation harness: one PostgreSQL service standing in for a
# host's durable store across a lash version bump.
#
# The harness binary runs on the host (via `cargo run`), so PostgreSQL publishes
# a loopback port. Bring the stack up through
# `just version-bump-recreation-e2e`; the runner owns a fixed compose project
# (serialized by the fixed host port) and removes its services and volume on
# exit. The network is a fixed external one so repeated runs never create or
# destroy Docker networks: host-level watchers treat network add/remove as
# interface churn.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lash
      POSTGRES_PASSWORD: lash
      POSTGRES_DB: lash
    ports:
      - "127.0.0.1:${LASH_VERSION_BUMP_POSTGRES_PORT:-5463}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lash -d lash"]
      interval: 2s
      timeout: 2s
      retries: 30
networks:
  default:
    name: lash-e2e
    external: true
