# Version-bump recreation harness: one PostgreSQL service standing in for a
# host's durable store across a lash version bump.
#
# The harness binary runs on the host (via `cargo run`), so PostgreSQL publishes
# a loopback port. Bring the stack up through
# `just version-bump-recreation-e2e`; the runner owns a fixed per-worktree
# compose project and removes its services and volume on exit. The network is
# fixed per worktree so repeated runs never create or destroy Docker networks:
# host-level watchers treat network add/remove as interface churn.
x-gate-labels: &gate-labels
  com.lash.e2e.worktree: "${LASH_GATE_WORKTREE_SLUG:?run via the e2e script}"

services:
  postgres:
    image: postgres:16-alpine
    labels: *gate-labels
    environment:
      POSTGRES_USER: lash
      POSTGRES_PASSWORD: lash
      POSTGRES_DB: lash
    ports:
      - "127.0.0.1:${LASH_VERSION_BUMP_POSTGRES_PORT:?run via the e2e script}:5432"
    # TCP only: the image's temporary init server answers the unix socket
    # alone, so a TCP answer can only come from the final server — the same
    # probe scripts/ci/pg-service.sh runs.
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -p 5432 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" && PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -p 5432 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Atqc "SELECT 1"']
      interval: 2s
      timeout: 2s
      retries: 30
networks:
  default:
    name: "${LASH_E2E_NETWORK:?run via the e2e script}"
    external: true
