[workspace]
members = [
    "crates/lash-sansio",
    "crates/lash-trace",
    "crates/lash-rlm-types",
    "crates/lash-core",
    "crates/lash-lashlang-runtime",
    "crates/lash-remote-protocol",
    "crates/lash-http-transport",
    "crates/lash-llm-transport",
    "crates/lash-provider-auth",
    "crates/lash-sqlite-store",
    "crates/lash-postgres-store",
    "crates/lash-s3-store",
    "crates/lash-restate",
    "crates/lash",
    "crates/lash-protocol-rlm",
    "crates/lash-protocol-standard",
    "crates/lash-plugin-mcp",
    "crates/lash-plugin-process-controls",
    "crates/lash-plugin-tool-output-budget",
    "crates/lash-llm-tools",
    "crates/lash-tool-support",
    "crates/lash-tools",
    "crates/lash-standard-plugins",
    "crates/lash-provider-anthropic",
    "crates/lash-provider-google",
    "crates/lash-provider-openai",
    "crates/lash-sim",
    "crates/lash-subagents",
    "crates/lash-perf",
    "crates/lash-regress",
    "crates/lashlang",
    "crates/lash-typescript",
    "examples/agent-service",
    "examples/agent-workbench",
    "examples/toolbench",
    "examples/docs-snippets",
    "examples/slack-clone",
    "examples/workflow-graph-roundtrip",
    "runbooks/restate-postgres-workers",
]
# `cargo build` from the repo root compiles only the publishable SDK surface.
# Internal bins/benches/examples build with `cargo build --workspace` or `-p <name>`.
default-members = [
    "crates/lash-core",
    "crates/lash-remote-protocol",
    "crates/lash",
    "crates/lash-trace",
    "crates/lash-rlm-types",
    "crates/lash-http-transport",
    "crates/lash-llm-transport",
    "crates/lash-llm-tools",
    "crates/lash-protocol-standard",
    "crates/lash-protocol-rlm",
    "crates/lash-provider-auth",
    "crates/lash-provider-openai",
    "crates/lash-provider-anthropic",
    "crates/lash-provider-google",
    "crates/lash-sqlite-store",
    "crates/lash-postgres-store",
    "crates/lash-s3-store",
    "crates/lash-tool-support",
    "crates/lash-tools",
    "crates/lash-standard-plugins",
    "crates/lash-plugin-mcp",
    "crates/lash-plugin-process-controls",
    "crates/lash-plugin-tool-output-budget",
    "crates/lash-subagents",
]
resolver = "3"

[workspace.package]
# Honest working-tree placeholder. There is NO version-bump commit: main never
# carries a released version. The release workflow computes the next version
# from [workspace.metadata.release].channel + the v* tags and stamps it into an
# ephemeral tag checkout at packaging time (scripts/release_version.py stamp).
version = "0.0.0-dev"
license = "MIT"
edition = "2024"
authors = ["Samuel Galanakis"]
repository = "https://github.com/Ascending-AI/lash"
homepage = "https://samgalanakis.github.io/lash/"
documentation = "https://samgalanakis.github.io/lash/"
readme = "README.md"
rust-version = "1.90"

[workspace.lints.clippy]
disallowed_methods = "deny"
large_enum_variant = "warn"
large_futures = "warn"
result_large_err = "warn"

# The release series CI advances. `scripts/release_version.py print-next` reads
# this channel and returns the next `<channel>.N` (or, for a clean X.Y.Z
# channel, the next patch) from the existing tags — the manifest version above
# is always the dev placeholder, so the channel is the single source of truth
# for what series releases belong to.
[workspace.metadata.release]
channel = "0.1.0-alpha"

# Centralized external versions. Members opt in with
# `dep = { workspace = true, features = [...] }`.
[workspace.dependencies]
anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
base64 = "0.22"
blake3 = "1"
bytes = "1"
chrono = "0.4"
chrono-tz = "0.10"
clap = "4"
croner = "3"
futures-util = "0.3"
fastrand = "2"
form_urlencoded = "1"
hmac = "0.12"
httpdate = "1"
jsonschema = { version = "0.18", default-features = false }
object_store = { version = "0.13.2", default-features = false }
percent-encoding = "2.3"
reqwest = { version = "0.13", default-features = false }
rmp-serde = "1.3.1"
ryu-js = "=1.0.3"
rmcp = { version = "1.6", default-features = false }
restate-sdk = { version = "0.11", default-features = false, features = ["http_server"] }
schemars = "0.8"
serde = "1"
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "=2.5.8"
uuid = "1"
num-bigint = "0.4"
num-traits = "0.2"


# Internal crates — lockstep with [workspace.package].version. These carry the
# 0.0.0-dev placeholder in-tree; `scripts/release_version.py stamp <version>`
# rewrites every `=` pin (and the lockfile) in the release workflow's ephemeral
# tag checkout, so published crates depend on the real release version.
lash = { package = "lash-runtime", path = "crates/lash", version = "=0.0.0-dev" }
lash-core = { package = "lash-internal-core", path = "crates/lash-core", version = "=0.0.0-dev" }
lash-http-transport = { package = "lash-internal-http-transport", path = "crates/lash-http-transport", version = "=0.0.0-dev" }
lash-llm-tools = { package = "lash-internal-llm-tools", path = "crates/lash-llm-tools", version = "=0.0.0-dev" }
lash-llm-transport = { package = "lash-internal-llm-transport", path = "crates/lash-llm-transport", version = "=0.0.0-dev" }
lash-lashlang-runtime = { package = "lash-internal-lashlang-runtime", path = "crates/lash-lashlang-runtime", version = "=0.0.0-dev" }
lash-postgres-store = { package = "lash-internal-postgres-store", path = "crates/lash-postgres-store", version = "=0.0.0-dev" }
lash-s3-store = { package = "lash-internal-s3-store", path = "crates/lash-s3-store", version = "=0.0.0-dev" }
lash-plugin-mcp = { package = "lash-internal-plugin-mcp", path = "crates/lash-plugin-mcp", version = "=0.0.0-dev" }
lash-plugin-process-controls = { package = "lash-internal-plugin-process-controls", path = "crates/lash-plugin-process-controls", version = "=0.0.0-dev" }
lash-plugin-tool-output-budget = { package = "lash-internal-plugin-tool-output-budget", path = "crates/lash-plugin-tool-output-budget", version = "=0.0.0-dev" }
lash-protocol-rlm = { package = "lash-internal-protocol-rlm", path = "crates/lash-protocol-rlm", version = "=0.0.0-dev" }
lash-protocol-standard = { package = "lash-internal-protocol-standard", path = "crates/lash-protocol-standard", version = "=0.0.0-dev" }
lash-provider-anthropic = { package = "lash-internal-provider-anthropic", path = "crates/lash-provider-anthropic", version = "=0.0.0-dev" }
lash-provider-auth = { package = "lash-internal-provider-auth", path = "crates/lash-provider-auth", version = "=0.0.0-dev" }
lash-provider-google = { package = "lash-internal-provider-google", path = "crates/lash-provider-google", version = "=0.0.0-dev" }
lash-provider-openai = { package = "lash-internal-provider-openai", path = "crates/lash-provider-openai", version = "=0.0.0-dev" }
lash-regress = { path = "crates/lash-regress", version = "=0.0.0-dev", features = ["utf16"] }
lash-remote-protocol = { package = "lash-internal-remote-protocol", path = "crates/lash-remote-protocol", version = "=0.0.0-dev" }
lash-restate = { package = "lash-internal-restate", path = "crates/lash-restate", version = "=0.0.0-dev" }
lash-rlm-types = { package = "lash-internal-rlm-types", path = "crates/lash-rlm-types", version = "=0.0.0-dev" }
lash-sansio = { package = "lash-internal-sansio", path = "crates/lash-sansio", version = "=0.0.0-dev" }
lash-standard-plugins = { package = "lash-internal-standard-plugins", path = "crates/lash-standard-plugins", version = "=0.0.0-dev" }
lash-subagents = { package = "lash-internal-subagents", path = "crates/lash-subagents", version = "=0.0.0-dev" }
lash-tool-support = { package = "lash-internal-tool-support", path = "crates/lash-tool-support", version = "=0.0.0-dev" }
lash-tools = { package = "lash-internal-tools", path = "crates/lash-tools", version = "=0.0.0-dev" }
lash-trace = { package = "lash-internal-trace", path = "crates/lash-trace", version = "=0.0.0-dev" }
lash-sqlite-store = { package = "lash-internal-sqlite-store", path = "crates/lash-sqlite-store", version = "=0.0.0-dev" }
lashlang = { package = "lash-internal-lashlang", path = "crates/lashlang", version = "=0.0.0-dev" }
lash-typescript = { package = "lash-internal-typescript", path = "crates/lash-typescript", version = "=0.0.0-dev" }
swc_common = "=25.0.0"
swc_ecma_ast = "=28.0.0"
swc_ecma_parser = { version = "=44.0.0", default-features = false, features = ["typescript"] }

[profile.release]
lto = "thin"
strip = true

# File and line information keeps panic backtraces useful without paying for
# full local-variable DWARF across the workspace. The test profile inherits
# this setting. For a one-off full-debug build, set
# `CARGO_PROFILE_DEV_DEBUG=full` (or `CARGO_PROFILE_TEST_DEBUG=full` for tests).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package]
# These crates execute inside the proc-macro host while the workspace compiles.
proc-macro2 = { opt-level = 2 }
quote = { opt-level = 2 }
syn = { opt-level = 2 }

# Snapshot formatting and diffing are test hot paths.
insta = { opt-level = 3 }
similar = { opt-level = 3 }

# `lash-regress` is maintained third-party code whose upstream test suite
# participates in workspace gates. Preserve dependency-like optimization for
# it; the test profile inherits this override.
[profile.dev.package.lash-regress]
opt-level = 2

# The judged-runbook profile. A judged scenario scores what a host actually
# ships, so the example binaries it drives must not carry development-only
# self-checks: `debug_assert!` and overflow checks are compiled out here, and
# `runbooks/RULES.md` requires every judged host boot to use this profile.
#
# The alternative — judging a `dev` build — turned in-contract outcomes into
# `effect_panicked`: a Lashlang execution bound the runtime is supposed to
# report back as feedback instead tripped a debug-only assertion inside the
# effect task, and the turn surfaced as an opaque "turn could not be
# completed". Debug-assert coverage is real coverage, but it belongs to the
# unit/law lane (`cargo test`/`cargo nextest`), which keeps the `test` profile.
#
# Everything else inherits `dev`, so this stays a fast iteration build rather
# than a `release` build; only the assertion geometry differs.
[profile.judged]
inherits = "dev"
debug-assertions = false
overflow-checks = false
# Nobody attaches a debugger to a judged host; the one thing its log needs is a
# readable `file:line` if the shipping code genuinely panics.
debug = "line-tables-only"

[profile.judged.package."*"]
opt-level = 2
