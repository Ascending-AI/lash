name: Confidence

on:
  workflow_dispatch:
    inputs:
      lane:
        # Free text is intentional: the gate validates the complete selector
        # vocabulary, including full+area:<surface>, fast:<shard>+area:<surface>,
        # and full-depth sim-search:<i>/<n> shards.
        description: "Selector: lane/shard, optionally +area:<surface>"
        required: true
        default: "full"
        type: string
  schedule:
    - cron: "29 4 * * 0"

concurrency:
  group: confidence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LASH_CONFIDENCE_BOOTSTRAP: "1"
  # Preserve the established workflow artifact paths; local runs remain
  # worktree-qualified by default.
  LASH_CONFIDENCE_OUT_DIR: ${{ github.workspace }}/target/confidence
  LASH_CI_FEATURES: ""
  # External run entropy: recorded in each sim-search summary so every seed is
  # reproducible without introducing entropy inside the deterministic world.
  LASH_SIM_RUN_SALT: github-${{ github.run_id }}-attempt-${{ github.run_attempt }}

jobs:
  confidence:
    name: Confidence ${{ github.event_name == 'workflow_dispatch' && inputs.lane || 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # The unscoped full lane's sim search seed space is partitioned across this job
      # (shard 1/9) and the eight sim-search matrix jobs (shards 2/9..9/9), so
      # the weekly fleet covers every configured seed exactly once. Area-qualified
      # selectors and other lanes run their selected work unsharded.
      LASH_SIM_SHARD: ${{ (github.event_name != 'workflow_dispatch' || inputs.lane == 'full') && '1/9' || '1/1' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable


      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: true
          shared-key: confidence

      - name: Install protoc
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: protoc

      - name: Run confidence gate
        env:
          CONFIDENCE_SELECTOR: ${{ github.event_name == 'workflow_dispatch' && inputs.lane || 'full' }}
        run: bash scripts/confidence-gate.sh "$CONFIDENCE_SELECTOR"

      - name: Upload confidence artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: confidence-artifacts-attempt-${{ github.run_attempt }}
          path: target/confidence/**

  sim-search:
    name: Sim search shard ${{ matrix.shard }}/9
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [2, 3, 4, 5, 6, 7, 8, 9]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable


      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: true
          shared-key: confidence

      - name: Install protoc
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: protoc

      - name: Run sim search shard
        run: bash scripts/confidence-gate.sh "sim-search:${{ matrix.shard }}/9"

      - name: Upload sim search artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: confidence-sim-search-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: target/confidence/sim-search/**
