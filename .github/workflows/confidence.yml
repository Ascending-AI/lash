name: Confidence

on:
  workflow_dispatch:
    inputs:
      lane:
        # Free text is intentional: the gate validates the complete selector
        # vocabulary, including full+area:<surface>, fast:<shard>+area:<surface>,
        # and full-depth sim-search:<i>/<n> shards.
        description: "Selector: lane/shard, optionally +area:<surface>"
        required: true
        default: "full"
        type: string
  schedule:
    - cron: "29 4 * * 0"

concurrency:
  group: confidence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LASH_CONFIDENCE_BOOTSTRAP: "1"
  # Preserve the established workflow artifact paths; local runs remain
  # worktree-qualified by default.
  LASH_CONFIDENCE_OUT_DIR: ${{ github.workspace }}/target/confidence
  LASH_CI_FEATURES: ""
  # External run entropy: recorded in each sim-search summary so every seed is
  # reproducible without introducing entropy inside the deterministic world.
  LASH_SIM_RUN_SALT: github-${{ github.run_id }}-attempt-${{ github.run_attempt }}

jobs:
  confidence:
    name: Confidence ${{ github.event_name == 'workflow_dispatch' && inputs.lane || 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.lane != 'full' }}

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config gc.auto 0
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force "${GITHUB_SHA}"

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain


      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: true
          shared-key: confidence

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Run confidence gate
        env:
          CONFIDENCE_SELECTOR: ${{ github.event_name == 'workflow_dispatch' && inputs.lane || 'full' }}
        run: bash scripts/confidence-gate.sh "$CONFIDENCE_SELECTOR"

      - name: Upload confidence artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: confidence-artifacts-attempt-${{ github.run_attempt }}
          path: target/confidence/**

  confidence-build:
    name: Build full confidence once
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config gc.auto 0
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force "${GITHUB_SHA}"

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          components: llvm-tools-preview

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: confidence
          cache-bin: true
          cache-workspace-crates: true

      - name: Build full confidence
        env:
          LASH_CONFIDENCE_STAGE: build
        run: bash scripts/confidence-gate.sh full

      - name: Pack shared build
        run: |
          mkdir -p target/confidence-tools
          cp "$HOME/.cargo/bin/cargo-mutants" "$HOME/.cargo/bin/cargo-llvm-cov" target/confidence-tools/
          tar -cf "${RUNNER_TEMP}/build.tar" target

      - name: Upload shared build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: confidence-build-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  confidence-harnesses:
    name: Confidence harnesses
    needs: confidence-build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config gc.auto 0
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force "${GITHUB_SHA}"

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          components: llvm-tools-preview

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Download shared build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: confidence-build-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/confidence-build

      - name: Restore shared build
        run: |
          tar -xf "${RUNNER_TEMP}/confidence-build/build.tar" -C "$GITHUB_WORKSPACE"
          mkdir -p "$HOME/.cargo/bin"
          cp target/confidence-tools/* "$HOME/.cargo/bin/"

      - name: Run harnesses
        env:
          LASH_CONFIDENCE_STAGE: harnesses
          LASH_CONFIDENCE_OUT_DIR: ${{ github.workspace }}/target/confidence/stages/harnesses
        run: bash scripts/confidence-gate.sh full

      - name: Upload harnesses evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: confidence-harnesses-attempt-${{ github.run_attempt }}
          path: target/confidence/stages/harnesses/**
          if-no-files-found: error

  confidence-generated:
    name: Confidence generated-${{ matrix.shard }}
    needs: confidence-build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config gc.auto 0
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force "${GITHUB_SHA}"

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          components: llvm-tools-preview

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Download shared build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: confidence-build-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/confidence-build

      - name: Restore shared build
        run: |
          tar -xf "${RUNNER_TEMP}/confidence-build/build.tar" -C "$GITHUB_WORKSPACE"
          mkdir -p "$HOME/.cargo/bin"
          cp target/confidence-tools/* "$HOME/.cargo/bin/"

      - name: Run generated
        env:
          LASH_CONFIDENCE_STAGE: generated
          LASH_SIM_SHARD: ${{ matrix.shard }}/9
          LASH_CONFIDENCE_OUT_DIR: ${{ github.workspace }}/target/confidence/stages/generated-${{ matrix.shard }}
        run: bash scripts/confidence-gate.sh full

      - name: Upload generated evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: confidence-generated-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: target/confidence/stages/generated-${{ matrix.shard }}/**
          if-no-files-found: error

  confidence-minimizer:
    name: Confidence minimizer
    needs: confidence-build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config gc.auto 0
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force "${GITHUB_SHA}"

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          components: llvm-tools-preview

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Download shared build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: confidence-build-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/confidence-build

      - name: Restore shared build
        run: |
          tar -xf "${RUNNER_TEMP}/confidence-build/build.tar" -C "$GITHUB_WORKSPACE"
          mkdir -p "$HOME/.cargo/bin"
          cp target/confidence-tools/* "$HOME/.cargo/bin/"

      - name: Run minimizer
        env:
          LASH_CONFIDENCE_STAGE: minimizer
          LASH_CONFIDENCE_OUT_DIR: ${{ github.workspace }}/target/confidence/stages/minimizer
        run: bash scripts/confidence-gate.sh full

      - name: Upload minimizer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: confidence-minimizer-attempt-${{ github.run_attempt }}
          path: target/confidence/stages/minimizer/**
          if-no-files-found: error

  confidence-backends:
    name: Confidence backends
    needs: confidence-build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config gc.auto 0
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force "${GITHUB_SHA}"

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          components: llvm-tools-preview

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Download shared build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: confidence-build-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/confidence-build

      - name: Restore shared build
        run: |
          tar -xf "${RUNNER_TEMP}/confidence-build/build.tar" -C "$GITHUB_WORKSPACE"
          mkdir -p "$HOME/.cargo/bin"
          cp target/confidence-tools/* "$HOME/.cargo/bin/"

      - name: Run backends
        env:
          LASH_CONFIDENCE_STAGE: backends
          LASH_CONFIDENCE_OUT_DIR: ${{ github.workspace }}/target/confidence/stages/backends
        run: bash scripts/confidence-gate.sh full

      - name: Upload backends evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: confidence-backends-attempt-${{ github.run_attempt }}
          path: target/confidence/stages/backends/**
          if-no-files-found: error

  confidence-workers:
    name: Confidence workers
    needs: confidence-build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config gc.auto 0
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force "${GITHUB_SHA}"

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          components: llvm-tools-preview

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Download shared build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: confidence-build-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/confidence-build

      - name: Restore shared build
        run: |
          tar -xf "${RUNNER_TEMP}/confidence-build/build.tar" -C "$GITHUB_WORKSPACE"
          mkdir -p "$HOME/.cargo/bin"
          cp target/confidence-tools/* "$HOME/.cargo/bin/"

      - name: Run workers
        env:
          LASH_CONFIDENCE_STAGE: workers
          LASH_CONFIDENCE_OUT_DIR: ${{ github.workspace }}/target/confidence/stages/workers
        run: bash scripts/confidence-gate.sh full

      - name: Upload workers evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: confidence-workers-attempt-${{ github.run_attempt }}
          path: target/confidence/stages/workers/**
          if-no-files-found: error

  confidence-coverage:
    name: Confidence coverage
    needs: confidence-build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
