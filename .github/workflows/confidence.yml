name: Confidence

on:
  workflow_dispatch:
    inputs:
      lane:
        # Free text is intentional: the gate validates the complete selector
        # vocabulary, including full+area:<surface>, fast:<shard>+area:<surface>,
        # and full-depth sim-search:<i>/<n> shards.
        description: "Selector: lane/shard, optionally +area:<surface>"
        required: true
        default: "full"
        type: string
  schedule:
    - cron: "29 4 * * 0"

concurrency:
  group: confidence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LASH_CONFIDENCE_BOOTSTRAP: "1"
  # Preserve the established workflow artifact paths; local runs remain
  # worktree-qualified by default.
  LASH_CONFIDENCE_OUT_DIR: ${{ github.workspace }}/target/confidence
  LASH_CI_FEATURES: ""
  # External run entropy: recorded in each sim-search summary so every seed is
  # reproducible without introducing entropy inside the deterministic world.
  LASH_SIM_RUN_SALT: github-${{ github.run_id }}-attempt-${{ github.run_attempt }}

jobs:
  confidence:
    name: Confidence ${{ github.event_name == 'workflow_dispatch' && inputs.lane || 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.lane != 'full' }}

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config gc.auto 0
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          # Bounded and retried: a fetch that hangs used to hold the runner until the
          # job timeout. CHECKOUT_TAGS=--tags on the step fetches tags as well.
          for attempt in 1 2 3; do
            if timeout --kill-after=10 180 git fetch "${CHECKOUT_TAGS:---no-tags}" --prune --depth=1 origin "${GITHUB_SHA}"; then
              break
            fi
            [ "${attempt}" -lt 3 ] || exit 1
            echo "::warning::git fetch attempt ${attempt} failed; retrying"
            sleep $((attempt * 5))
          done
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain


      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: true
          shared-key: confidence

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Run confidence gate
        env:
          CONFIDENCE_SELECTOR: ${{ github.event_name == 'workflow_dispatch' && inputs.lane || 'full' }}
        run: bash scripts/confidence-gate.sh "$CONFIDENCE_SELECTOR"

      - name: Upload confidence artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: confidence-artifacts-attempt-${{ github.run_attempt }}
          path: target/confidence/**

  confidence-build:
    name: Build full confidence once
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config gc.auto 0
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          # Bounded and retried: a fetch that hangs used to hold the runner until the
          # job timeout. CHECKOUT_TAGS=--tags on the step fetches tags as well.
          for attempt in 1 2 3; do
            if timeout --kill-after=10 180 git fetch "${CHECKOUT_TAGS:---no-tags}" --prune --depth=1 origin "${GITHUB_SHA}"; then
              break
            fi
            [ "${attempt}" -lt 3 ] || exit 1
            echo "::warning::git fetch attempt ${attempt} failed; retrying"
            sleep $((attempt * 5))
          done
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          components: llvm-tools-preview

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: confidence
          cache-bin: true
          cache-workspace-crates: true

      - name: Build full confidence
        env:
          LASH_CONFIDENCE_STAGE: build
        run: bash scripts/confidence-gate.sh full

      - name: Pack shared build
        run: |
          mkdir -p target/confidence-tools
          cp "$HOME/.cargo/bin/cargo-mutants" "$HOME/.cargo/bin/cargo-llvm-cov" target/confidence-tools/
          tar -cf "${RUNNER_TEMP}/build.tar" target

      - name: Upload shared build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: confidence-build-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build.tar
