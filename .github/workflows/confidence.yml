          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          # Bounded and retried: a fetch that hangs used to hold the runner until the
          # job timeout. CHECKOUT_TAGS=--tags on the step fetches tags as well.
          for attempt in 1 2 3; do
            if timeout --kill-after=10 180 git fetch "${CHECKOUT_TAGS:---no-tags}" --prune --depth=1 origin "${GITHUB_SHA}"; then
              break
            fi
            [ "${attempt}" -lt 3 ] || exit 1
            echo "::warning::git fetch attempt ${attempt} failed; retrying"
            sleep $((attempt * 5))
          done
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          components: llvm-tools-preview

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Download shared build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: confidence-build-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/confidence-build

      - name: Restore shared build
        run: |
          tar -xmf "${RUNNER_TEMP}/confidence-build/build.tar" -C "$GITHUB_WORKSPACE"
          mkdir -p "$HOME/.cargo/bin"
          cp target/confidence-tools/* "$HOME/.cargo/bin/"

      - name: Run sim-search
        env:
          LASH_CONFIDENCE_BOOTSTRAP: "0"
        run: bash scripts/confidence-gate.sh "sim-search:${{ matrix.shard }}/9"

      - name: Upload sim-search evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: confidence-sim-search-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: target/confidence/sim-search/**
          if-no-files-found: error

  confidence-conclusion:
    name: Confidence conclusion
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [confidence, confidence-build, confidence-harnesses, confidence-generated, confidence-minimizer, confidence-backends, confidence-coverage, confidence-mutation-core, confidence-mutation-sim, confidence-mutation-authority, confidence-mutation-packages, sim-search]
    steps:
      - name: Check out repository
        env:
