      - name: Download shared build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: confidence-build-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/confidence-build

      - name: Restore shared build
        run: |
          tar -xf "${RUNNER_TEMP}/confidence-build/build.tar" -C "$GITHUB_WORKSPACE"
          mkdir -p "$HOME/.cargo/bin"
          cp target/confidence-tools/* "$HOME/.cargo/bin/"

      - name: Run mutation-core
        env:
          LASH_CONFIDENCE_STAGE: mutation-core
