  confidence-mutation-packages:
    name: Confidence mutation-packages-${{ matrix.package }}
    needs: confidence-build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        package: [lash-internal-core, lash-internal-lashlang, lash-internal-protocol-rlm, lash-internal-protocol-standard, lash-internal-sqlite-store, lash-internal-postgres-store]
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config gc.auto 0
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force "${GITHUB_SHA}"

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          components: llvm-tools-preview

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Download shared build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: confidence-build-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/confidence-build

      - name: Restore shared build
        run: |
          tar -xf "${RUNNER_TEMP}/confidence-build/build.tar" -C "$GITHUB_WORKSPACE"
          mkdir -p "$HOME/.cargo/bin"
          cp target/confidence-tools/* "$HOME/.cargo/bin/"

      - name: Run mutation-packages
        env:
          LASH_CONFIDENCE_STAGE: mutation-packages
          LASH_CONFIDENCE_PACKAGE: ${{ matrix.package }}
          LASH_CONFIDENCE_OUT_DIR: ${{ github.workspace }}/target/confidence/stages/mutation-packages-${{ matrix.package }}
        run: bash scripts/confidence-gate.sh full

      - name: Upload mutation-packages evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: confidence-mutation-packages-${{ matrix.package }}-attempt-${{ github.run_attempt }}
          path: target/confidence/stages/mutation-packages-${{ matrix.package }}/**
          if-no-files-found: error

  sim-search:
    name: Confidence sim-search-${{ matrix.shard }}
    needs: confidence-build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config gc.auto 0
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force "${GITHUB_SHA}"

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          components: llvm-tools-preview

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Download shared build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: confidence-build-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/confidence-build

      - name: Restore shared build
        run: |
          tar -xf "${RUNNER_TEMP}/confidence-build/build.tar" -C "$GITHUB_WORKSPACE"
          mkdir -p "$HOME/.cargo/bin"
          cp target/confidence-tools/* "$HOME/.cargo/bin/"

      - name: Run sim-search
        env:
          LASH_CONFIDENCE_BOOTSTRAP: "0"
        run: bash scripts/confidence-gate.sh "sim-search:${{ matrix.shard }}/9"

      - name: Upload sim-search evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: confidence-sim-search-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: target/confidence/sim-search/**
          if-no-files-found: error

  confidence-conclusion:
    name: Confidence conclusion
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [confidence, confidence-build, confidence-harnesses, confidence-generated, confidence-minimizer, confidence-backends, confidence-workers, confidence-coverage, confidence-mutation-core, confidence-mutation-sim, confidence-mutation-packages, sim-search]
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config gc.auto 0
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force "${GITHUB_SHA}"

      - name: Validate every confidence producer and consumer
        env:
          CONCLUSION_WORKFLOW: confidence
          CONFIDENCE_SELECTOR: ${{ github.event_name == 'workflow_dispatch' && inputs.lane || 'full' }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/conclusion.py conclusion
