      - name: Run mutation-sim
        env:
          LASH_CONFIDENCE_STAGE: mutation-sim
          LASH_CONFIDENCE_OUT_DIR: ${{ github.workspace }}/target/confidence/stages/mutation-sim
        run: bash scripts/confidence-gate.sh full

      - name: Upload mutation-sim evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: confidence-mutation-sim-attempt-${{ github.run_attempt }}
          path: target/confidence/stages/mutation-sim/**
          if-no-files-found: error

  confidence-mutation-authority:
    name: Confidence mutation-authority
    needs: confidence-build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'full' }}
    runs-on: ubuntu-24.04
    # 43 mutants over the FIG-3429 authority sites (rebind checklist, retained
    # tool-child request, group reopen settlement capture). Sized like
    # mutation-sim: ~2 min/mutant plus the ~23 minutes spent downloading and
    # restoring the shared build.
    timeout-minutes: 160
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config gc.auto 0
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          # Bounded and retried: a fetch that hangs used to hold the runner until the
          # job timeout. CHECKOUT_TAGS=--tags on the step fetches tags as well.
          for attempt in 1 2 3; do
            if timeout --kill-after=10 180 git fetch "${CHECKOUT_TAGS:---no-tags}" --prune --depth=1 origin "${GITHUB_SHA}"; then
              break
            fi
            [ "${attempt}" -lt 3 ] || exit 1
            echo "::warning::git fetch attempt ${attempt} failed; retrying"
            sleep $((attempt * 5))
          done
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          components: llvm-tools-preview

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Download shared build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: confidence-build-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/confidence-build

      - name: Restore shared build
        run: |
          tar -xmf "${RUNNER_TEMP}/confidence-build/build.tar" -C "$GITHUB_WORKSPACE"
          mkdir -p "$HOME/.cargo/bin"
          cp target/confidence-tools/* "$HOME/.cargo/bin/"

      - name: Run mutation-authority
        env:
          LASH_CONFIDENCE_STAGE: mutation-authority
          LASH_CONFIDENCE_OUT_DIR: ${{ github.workspace }}/target/confidence/stages/mutation-authority
        run: bash scripts/confidence-gate.sh full

      - name: Upload mutation-authority evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: confidence-mutation-authority-attempt-${{ github.run_attempt }}
          path: target/confidence/stages/mutation-authority/**
          if-no-files-found: error

  confidence-mutation-packages:
    name: Confidence mutation-packages-${{ matrix.package }}-${{ matrix.shard }}
    needs: confidence-build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'full' }}
    runs-on: ubuntu-24.04
    # The cap is unchanged; the lane is sharded to fit inside it instead. A
    # package's mutant space is far wider than one job can sweep (protocol-rlm
    # alone listed 1,641 mutants in run 35117123483 and was cancelled at the
    # cap), so each leg judges a bounded slice whose index rotates per run.
    # `shards` is the leg count for the package; `shard` is this leg's index.
    # See MUTATION_PACKAGES_* in scripts/confidence-gate.sh for the slice
    # arithmetic and per-package leg counts.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: lash-internal-core
            shard: 1
            shards: 2
          - package: lash-internal-core
            shard: 2
            shards: 2
          - package: lash-internal-lashlang
            shard: 1
            shards: 4
          - package: lash-internal-lashlang
            shard: 2
            shards: 4
          - package: lash-internal-lashlang
            shard: 3
            shards: 4
          - package: lash-internal-lashlang
            shard: 4
            shards: 4
          - package: lash-internal-protocol-rlm
            shard: 1
            shards: 4
          - package: lash-internal-protocol-rlm
            shard: 2
            shards: 4
          - package: lash-internal-protocol-rlm
            shard: 3
            shards: 4
          - package: lash-internal-protocol-rlm
            shard: 4
            shards: 4
          - package: lash-internal-protocol-standard
            shard: 1
            shards: 1
          - package: lash-internal-sqlite-store
            shard: 1
            shards: 3
          - package: lash-internal-sqlite-store
            shard: 2
            shards: 3
          - package: lash-internal-sqlite-store
            shard: 3
            shards: 3
          - package: lash-internal-postgres-store
            shard: 1
            shards: 4
          - package: lash-internal-postgres-store
            shard: 2
            shards: 4
          - package: lash-internal-postgres-store
            shard: 3
            shards: 4
          - package: lash-internal-postgres-store
            shard: 4
            shards: 4
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config gc.auto 0
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          # Bounded and retried: a fetch that hangs used to hold the runner until the
          # job timeout. CHECKOUT_TAGS=--tags on the step fetches tags as well.
          for attempt in 1 2 3; do
            if timeout --kill-after=10 180 git fetch "${CHECKOUT_TAGS:---no-tags}" --prune --depth=1 origin "${GITHUB_SHA}"; then
              break
            fi
            [ "${attempt}" -lt 3 ] || exit 1
            echo "::warning::git fetch attempt ${attempt} failed; retrying"
            sleep $((attempt * 5))
          done
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          components: llvm-tools-preview

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Download shared build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: confidence-build-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/confidence-build

      - name: Restore shared build
        run: |
          tar -xmf "${RUNNER_TEMP}/confidence-build/build.tar" -C "$GITHUB_WORKSPACE"
          mkdir -p "$HOME/.cargo/bin"
          cp target/confidence-tools/* "$HOME/.cargo/bin/"

      - name: Run mutation-packages
        env:
          LASH_CONFIDENCE_STAGE: mutation-packages
          LASH_CONFIDENCE_PACKAGE: ${{ matrix.package }}
          LASH_CONFIDENCE_OUT_DIR: ${{ github.workspace }}/target/confidence/stages/mutation-packages-${{ matrix.package }}-${{ matrix.shard }}
          # This leg is shard index `shard` of the package's `shards` legs;
          # the gate turns the coordinate plus the run number into the
          # mutant slice the leg judges. run_number is constant across retry
          # attempts, so a retried leg re-judges the same slice.
          LASH_MUTATION_PACKAGES_SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
          LASH_MUTATION_RUN_INDEX: ${{ github.run_number }}
        run: bash scripts/confidence-gate.sh full

      - name: Upload mutation-packages evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: confidence-mutation-packages-${{ matrix.package }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: target/confidence/stages/mutation-packages-${{ matrix.package }}-${{ matrix.shard }}/**
          if-no-files-found: error

  sim-search:
    name: Confidence sim-search-${{ matrix.shard }}
    needs: confidence-build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lane == 'full' }}
    runs-on: ubuntu-24.04
    # The cap is unchanged; the lane is sized to fit inside it instead. A shard
    # spends 23 minutes downloading and restoring the shared build, leaving
    # about 75 minutes for the two search passes. See SIM_SEARCH_FULL_SEEDS in
    # scripts/confidence-gate.sh for the seed arithmetic.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config gc.auto 0
