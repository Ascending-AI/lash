name: Seal cache

# `Seal-test the API surface` (ci.yml's `check` seal lane) took 748 s on
# PR #1417 and was the CI tail. A fully warm `target-seal` runs the same
# command in 28.6 s, so the whole cost is a cold cache, not compute: trybuild
# recompiles the entire dependency graph a second time under
# `--cfg trybuild -A dead_code` (trybuild 1.0.118 `src/rustflags.rs`), which no
# rlib from the outer build can satisfy, and `src/cargo.rs` pins that nested
# build's `CARGO_TARGET_DIR` with no override. The duplication is therefore
# permanent; paying it once and caching the result is the only lever.
#
# What that duplication costs changed shape: the suite holds compile-fail
# fixtures only, so `project.has_pass` is false, and trybuild takes its cheap
# path (`src/run.rs`). The nested dependency graph is built with `cargo check`
# rather than `cargo build`, and the fixtures compile in one `--keep-going`
# invocation rather than one `cargo` run per fixture, each preceded by a
# `cargo clean --package`. The tree this workflow saves is therefore a check
# tree, not a build tree. A `cargo check` unit and a `cargo build` unit have
# different fingerprints, so a cache written under the old shape makes every
# seal run re-check the nested graph (76 s of the 221 s seal step measured on
# 2026-09-15). Dispatching this workflow alone does not fix that: rust-cache
# skips the save when it restored the primary key in full, so the old tree
# stays on main until the key itself changes. That is what the generation
# suffix on `shared-key` is for: bump it here and in ci.yml together whenever
# the seal build's output shape changes without touching the lockfiles, then
# dispatch this workflow.
#
# ci.yml's `check` job never runs on `main` itself, so it never writes a cache
# into the default-branch scope, and a pull request can only restore caches
# from its own branch or from `main`. Every PR started this job from scratch.
# This workflow is the sole main-scoped writer of `linux-seal-2`; ci.yml's
# seal lane stays a restore-only consumer, and nothing here is gating.
#
# It is deliberately NOT a job inside ci.yml: it is a twelve-minute build, and
# it would drag `evaluate_conclusion` and the conclusion-policy tests into a
# cache fix.
#
# It is manual, like every other heavy job in this repository: nothing runs
# automatically on a push to main. The `linux-seal` key is a function of the
# lockfiles, the toolchain and the cargo environment — never of crate sources —
# so a refresh is needed only after a change to `Cargo.lock`, a manifest,
# `rust-toolchain*`, `.cargo/**`, the toolchain/tool/mold actions, this
# workflow, or the generation suffix. A source-only change keeps the key and
# restores a tree cargo rebuilds incrementally. Dispatch this workflow after
# such a change; until it runs, the `check` seal lane pays the cold trybuild
# build itself.
on:
  workflow_dispatch:

# Only the newest tree is worth warming; an older run's key is already stale.
concurrency:
  group: linux-seal-cache-main
  cancel-in-progress: true

permissions:
  contents: read

# Every name below is a `Swatinem/rust-cache` key input, and the key must equal
# the one ci.yml's seal lane computes or this writes a cache nothing reads.
# CARGO_HOME comes from the shared toolchain action; CARGO_INCREMENTAL=0 from
# the same action; CARGO_TERM_COLOR, LASH_CI_FEATURES and RUSTFLAGS mirror
# ci.yml's workflow-level `env`; CARGO_TARGET_DIR mirrors the seal matrix
# entry's `target-seal`.
env:
  CARGO_TERM_COLOR: always
  LASH_CI_FEATURES: ""
  RUSTFLAGS: -C link-arg=-fuse-ld=mold

jobs:
  linux-seal-cache:
    name: Build seal cache
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # trybuild derives its fixture tree from Cargo's target directory, and
      # this value is part of the cache key. It must stay the seal lane's.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-seal

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      # Sole writer of `linux-seal-2`; ci.yml's seal lane restores it. Every
      # input here mirrors that lane, `workspaces` included: rust-cache derives
      # the cached paths from it, so a different value would cache a different
      # tree under the same key.
      - name: Restore isolated seal dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: linux-seal-2
          workspaces: . -> target-seal

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Install mold
        uses: ./.github/actions/setup-mold

      # Byte-identical to the Cargo leg of ci.yml's `Seal-test the API surface`
      # step (the path untrusted events and this writer both take). The saved
      # tree is only worth restoring if it was produced by the same command:
      # a narrower build would leave the seal lane rebuilding what it missed.
      # The fixture set, feature unification and `--test ui` selection are the
      # seal lane's, unchanged. `--test ui` also carries the compile-pass
      # surface fixtures: they are modules of the ui binary rather than
      # trybuild `t.pass` cases, so they are proved by the outer build here and
      # in the seal lane, not by a second nested one.
      - name: Seal-test the API surface
        run: |
          # shellcheck disable=SC2086
          cargo test --workspace --locked ${LASH_CI_FEATURES} --test ui

      - name: Report cache disk capacity
        if: always()
        run: bash scripts/ci/report-cache.sh
