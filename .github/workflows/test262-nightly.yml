name: Test262 nightly

# The whole Test262 selection on the kernel, uncached, once a day: the
# TypeScript dialect lowers every vendored test and a kernel machine runs it.
# The merge group runs the same target in the `//:workspace_tests` tail, where
# an unchanged input set is a cache hit. This run executes it regardless, so a
# nondeterministic outcome, or one that only a cold run shows, surfaces within
# a day rather than on the next change to the dialect. The kernel's outcomes
# are then held to the checked-in record: every recorded pass passes, or the
# deviation register names it (ADR 0139). The corpus is vendored at the
# pinned commit; nothing here touches the network beyond the build pool.
on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

concurrency:
  group: test262-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test262-full:
    name: Test262 full selection
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: build-cache
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config gc.auto 0
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          # Bounded and retried: a fetch that hangs used to hold the runner until the
          # job timeout. CHECKOUT_TAGS=--tags on the step fetches tags as well.
          for attempt in 1 2 3; do
            if timeout --kill-after=10 180 git fetch "${CHECKOUT_TAGS:---no-tags}" --prune --depth=1 origin "${GITHUB_SHA}"; then
              break
            fi
            [ "${attempt}" -lt 3 ] || exit 1
            echo "::warning::git fetch attempt ${attempt} failed; retrying"
            sleep $((attempt * 5))
          done
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Configure Buck2 shared cache
        uses: ./.github/actions/buck2-shared-cache
        env:
          CACHE_ENDPOINT: ${{ secrets.CACHE_ENDPOINT }}
          CACHE_INSTANCE: ${{ secrets.CACHE_INSTANCE }}
          KILN_EXECUTOR_RUNTIME: ${{ secrets.KILN_EXECUTOR_RUNTIME }}
          CACHE_CA: ${{ secrets.CACHE_CA }}
          CACHE_CERT: ${{ secrets.CACHE_CERT }}
          CACHE_KEY: ${{ secrets.CACHE_KEY }}

      - name: Run the full Test262 selection uncached
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/buck2-test.sh test262-full \
            --no-test-cache --test_arg=--nocapture \
            //crates/lash-dialect-typescript:test262_kernel__test

      - name: Hold the kernel to the outcome record
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          observed="$RUNNER_TEMP/test262-kernel-outcomes.tsv"
          find "$RUNNER_TEMP/test262-full-test-results" -type f -path '*test262_kernel__test*' -print0 \
            | xargs -0 --no-run-if-empty cat \
            | awk -F '\t' '$1 == "outcome" { print $2 "\t" $3 "\t" $4 }' > "$observed"
          python3 scripts/check_test262_ratchet.py --base HEAD --kernel-outcomes "$observed" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # FIG-7589: the same selection, and the Python corpus, run once plain
      # and once parked everywhere or on kernel bodies only; the two runs
      # must agree. A mode action takes up to 25 minutes (2026-11-02:
      # 1697 s wall for both modes against 756 s for the plain selection),
      # past the default 300 s action bound. The modes are ignored laws, so neither a merge nor
      # `kiln test` runs them. Each mode's known divergences are a ratchet
      # under `divergences/`; a new one fails here.
      - name: Run the stress modes uncached
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/buck2-test.sh test262-stress-modes \
            --no-test-cache --test_timeout 3600 --test_arg=--ignored --test_arg=--nocapture \
            //crates/lash-dialect-typescript:test262_kernel__test
          scripts/ci/buck2-test.sh python-corpus-stress-modes \
            --no-test-cache --test_arg=--ignored --test_arg=--nocapture \
            --test_arg=tests::conformance::the_corpus_runs_alike \
            //crates/lash-dialect-python:lash-dialect-python__unit_test

      - name: Remove client credentials
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/build-cache"
