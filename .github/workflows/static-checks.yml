name: Static checks

# Run the cheap static gates on every push so a break that would wait for
# the hourly full CI shows within the push's own run.
on:
  push:
    branches: [main]

concurrency:
  group: ci-static-checks-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Required checks queue below interactive Kiln, which stays at 100.
  KILN_RE_PRIORITY: "10"
  LASH_CI_FEATURES: ""
  RUSTFLAGS: -C link-arg=-fuse-ld=mold

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'push'
    environment: build-cache
    steps:
      # Tags on: the repository gates assert release-baseline and fixture
      # contracts that read the tag set, as ci.yml's repo-gates checkout does.
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_TAGS: --tags
        run: |
          set -euo pipefail
          git init .
          git config gc.auto 0
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          # Bounded and retried: a fetch that hangs used to hold the runner until the
          # job timeout. CHECKOUT_TAGS=--tags on the step fetches tags as well.
          for attempt in 1 2 3; do
            if timeout --kill-after=10 180 git fetch "${CHECKOUT_TAGS:---no-tags}" --prune --depth=1 origin "${GITHUB_SHA}"; then
              break
            fi
            [ "${attempt}" -lt 3 ] || exit 1
            echo "::warning::git fetch attempt ${attempt} failed; retrying"
            sleep $((attempt * 5))
          done
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Install mold
        uses: ./.github/actions/setup-mold

      - name: Configure Buck2 shared cache
        uses: ./.github/actions/buck2-shared-cache
        env:
          CACHE_ENDPOINT: ${{ secrets.CACHE_ENDPOINT }}
          CACHE_INSTANCE: ${{ secrets.CACHE_INSTANCE }}
          KILN_EXECUTOR_RUNTIME: ${{ secrets.KILN_EXECUTOR_RUNTIME }}
          CACHE_CA: ${{ secrets.CACHE_CA }}
          CACHE_CERT: ${{ secrets.CACHE_CERT }}
          CACHE_KEY: ${{ secrets.CACHE_KEY }}

      # The launcher self-tests in the gate list isolate themselves with
      # bwrap; same profile ci.yml's repo-gates job installs.
      - name: Install launcher test sandbox
        run: |
          if ! command -v bwrap >/dev/null 2>&1 || ! command -v apparmor_parser >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap apparmor
          fi
          # Ubuntu 24.04 restricts capabilities inside unprivileged user
          # namespaces. Allow this runner's bwrap to configure its private
          # loopback interface without changing the host-wide restriction.
          sandbox_bin="$RUNNER_TEMP/lash-launcher-sandbox"
          mkdir -p "$sandbox_bin"
          install -m 0755 "$(command -v bwrap)" "$sandbox_bin/bwrap"
          cat > "$sandbox_bin/apparmor.profile" <<PROFILE
          abi <abi/4.0>,
          include <tunables/global>
          profile lash-launcher-bwrap "$sandbox_bin/bwrap" flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser --replace "$sandbox_bin/apparmor.profile"
          echo "$sandbox_bin" >> "$GITHUB_PATH"
          "$sandbox_bin/bwrap" --unshare-user --unshare-pid --unshare-net \
            --unshare-ipc --unshare-uts --die-with-parent \
            --ro-bind / / --proc /proc --dev /dev --tmpfs /tmp /bin/true

      # `//:schema_checks` is the generated host/example schema group;
      # `//crates/lash:facade_completeness` is an external-runner test whose
      # build only renders rustdoc, so the check itself runs under
      # `buck2 test` exactly as ci.yml's workspace-core leg runs it.
      - name: Check schemas and the facade
        shell: bash
        run: |
          set -euo pipefail
          scripts/hermetic-build.sh build --jobs 32 --materializations none \
            //:schema_checks
          scripts/ci/buck2-test.sh static-checks //crates/lash:facade_completeness

      # The same `__fv_` `[check]` aggregate ci.yml's feature-lanes job shards.
      # This job is its only owner on push.
      - name: Check the feature-lane graph
        shell: bash
        run: |
          set -euo pipefail
          scripts/hermetic-build.sh check --jobs 32 --materializations none \
            //:feature_lane_compile

      # The gate list is extracted from ci.yml's GATES heredoc, so it tracks
      # the repo-gates job as that job's contract changes.
      - name: Run repository gates
        run: bash scripts/ci/repository-gates.sh --all

      - name: Remove client credentials
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/build-cache"
