name: Slack-clone live-model acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

# Manual dispatches spend real OpenRouter credit under a per-run cap, so two
# runs of the same ref never overlap. Queue rather than cancel: an in-flight run
# has already spent, and cancelling it wastes that spend without a verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-model-swap:
    name: OpenRouter two-agent nonce swap
    runs-on: ubuntu-24.04
    environment: main
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LASH_LIVE_E2E_MAX_SPEND_USD: "2"

    steps:
      - name: Check out repository
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GitHub-side `actions/checkout` 429 storms have failed whole runs whose
      # content was green. One jittered retry rides out the rate-limit window;
      # the retry attempt is not `continue-on-error`, so a genuine checkout
      # failure still fails the job.
      - name: Back off before checkout retry
        if: steps.checkout.outcome == 'failure'
        run: sleep $((45 + RANDOM % 46))

      - name: Check out repository (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install protoc
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: protoc

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Install Chromium for Playwright
        run: uv run --with playwright==1.62.0 playwright install --with-deps chromium

      # Manifest-pinned install; the releases-API path rate-limits under fan-out
      # (see ci.yml).
      - name: Install just
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: just

      - name: Run structural probes and live nonce swap
        env:
          LASH_SLACK_CLONE_LIVE_E2E_ARTIFACT_DIR: ${{ runner.temp }}/slack-clone-live-model-e2e
        run: just slack-clone-live-model-e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slack-clone-live-model-e2e-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/slack-clone-live-model-e2e
          if-no-files-found: warn
