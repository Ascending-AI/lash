name: Slack-clone live-model acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-model-swap:
    name: OpenRouter two-agent nonce swap
    runs-on: ubuntu-24.04
    environment: main
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LASH_LIVE_E2E_MAX_SPEND_USD: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install protoc
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: protoc

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Install Chromium for Playwright
        run: uv run --with playwright==1.62.0 playwright install --with-deps chromium

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Run structural probes and live nonce swap
        env:
          LASH_SLACK_CLONE_LIVE_E2E_ARTIFACT_DIR: ${{ runner.temp }}/slack-clone-live-model-e2e
        run: just slack-clone-live-model-e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slack-clone-live-model-e2e-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/slack-clone-live-model-e2e
          if-no-files-found: warn
