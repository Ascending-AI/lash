name: Slack-clone live-model acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

# Manual dispatches spend real OpenRouter credit under a per-run cap, so two
# runs of the same ref never overlap. Queue rather than cancel: an in-flight run
# has already spent, and cancelling it wastes that spend without a verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-model-swap:
    name: OpenRouter two-agent nonce swap
    runs-on: ubuntu-24.04
    environment: main
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LASH_LIVE_E2E_MAX_SPEND_USD: "2"

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Install Chromium for Playwright
        run: uv run --with playwright==1.62.0 playwright install --with-deps chromium

      # Manifest-pinned install; the releases-API path rate-limits under fan-out
      # (see ci.yml).
      - name: Install just
        uses: ./.github/actions/install-tools
        with:
          tool: just

      - name: Run structural probes and live nonce swap
        env:
          LASH_SLACK_CLONE_LIVE_E2E_ARTIFACT_DIR: ${{ runner.temp }}/slack-clone-live-model-e2e
        run: just slack-clone-live-model-e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slack-clone-live-model-e2e-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/slack-clone-live-model-e2e
          if-no-files-found: warn
