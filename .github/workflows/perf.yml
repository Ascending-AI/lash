name: Performance

# The release workflow enforces these full profiles before publishing. This
# workflow keeps the same budget-enforcing check available on demand. Only the
# allocation ceilings and the phase inventory gate: runtime wall-clock budgets
# are advisory here and in the release job, reported in the step summary but
# never failing the run.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  perf-guard-full:
    name: Perf Guard Full
    runs-on: blacksmith-16vcpu-ubuntu-2404

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lash
          POSTGRES_PASSWORD: lash
          POSTGRES_DB: lash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lash -d lash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      LASH_POSTGRES_DATABASE_URL: postgres://lash:lash@localhost:5432/lash

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable


      - name: Restore cargo cache
        uses: useblacksmith/rust-cache@f53e7f127245d2a269b3d90879ccf259876842d5 # v3.0.1
        with:
          cache-bin: false
          # Restore-only against the release cache ci.yml warms on main.
          shared-key: linux-release
          save-if: false

      - name: Install protoc
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: protoc

      - name: Run full runtime performance checks
        run: |
          python3 scripts/profile_runtime.py --profile full --release --scenario all --enforce-budgets --out .benchmarks/perf-guard/runtime.json
          python3 scripts/profile_lashlang.py --iterations 2500 --profile-iterations 2500 --enforce-budgets --out .benchmarks/perf-guard/lashlang.json

      - name: Publish performance summaries
        run: |
          python3 scripts/perfreport.py .benchmarks/perf-guard/runtime.json >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/perfreport.py .benchmarks/perf-guard/lashlang.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload performance guard artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-guard-full-attempt-${{ github.run_attempt }}
          path: .benchmarks/perf-guard/*
          if-no-files-found: warn
