name: Performance

# The release workflow enforces these full profiles before publishing. This
# workflow keeps the same budget-enforcing check available on demand. Only the
# allocation ceilings and the phase inventory gate: runtime wall-clock budgets
# are advisory here and in the release job, reported in the step summary but
# never failing the run.

on:
  # Manual only: a full 2500-iteration profile costs ~2 runner hours, so it is
  # dispatched deliberately before release work rather than on a schedule.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  perf-guard-full:
    name: Perf Guard Full
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lash
          POSTGRES_PASSWORD: lash
          POSTGRES_DB: lash
        ports:
          - 5432:5432
        # TCP only: the image's temporary init server answers the unix socket
        # alone, so a TCP answer can only come from the final server — the
        # same probe scripts/ci/pg-service.sh runs.
        options: >-
          --health-cmd 'pg_isready -h 127.0.0.1 -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB" && PGPASSWORD=$POSTGRES_PASSWORD psql -h 127.0.0.1 -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "SELECT 1"'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      LASH_POSTGRES_DATABASE_URL: postgres://lash:lash@localhost:5432/lash
      # Required mode: a Postgres service that failed to start must fail this
      # leg rather than let its suites skip themselves green.
      LASH_REQUIRE_POSTGRES: "1"

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config gc.auto 0
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          # Bounded and retried: a fetch that hangs used to hold the runner until the
          # job timeout. CHECKOUT_TAGS=--tags on the step fetches tags as well.
          for attempt in 1 2 3; do
            if timeout --kill-after=10 180 git fetch "${CHECKOUT_TAGS:---no-tags}" --prune --depth=1 origin "${GITHUB_SHA}"; then
              break
            fi
            [ "${attempt}" -lt 3 ] || exit 1
            echo "::warning::git fetch attempt ${attempt} failed; retrying"
            sleep $((attempt * 5))
          done
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain


      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          # Restore-only against the cache release-cache.yml warms on main.
          shared-key: linux-release
          save-if: false

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      # Duration history for the advisory trend signal (FIG-1532, wired here by
      # FIG-1551). Runtime wall-clock ceilings are advisory (FIG-1385), which
      # leaves a regression that allocates nothing -- added blocking I/O, lock
      # contention, a stray sleep -- with no gate at all. The remedy is trend,
      # not threshold: each run appends its per-scenario medians to this series
      # and the harness warns when a scenario has sat above its own trailing
      # median for several consecutive runs. The release profile is where that
      # is worth reading: five runs of twelve turns against the quick profile's
      # two of three, so the series is the steadiest wall clock this repository
      # measures.
      #
      # The store is this cache and nothing else: no new service, no secret and
      # no write to a tracked branch. `full` in the key is not decoration -- the
      # records carry their profile and durations are only comparable within
      # one run shape, so a quick series and this one can never be read as one
      # series. The key is unique per run *attempt* (`gh run rerun` reuses
      # `run_id`, so keying on it alone would make a rerun collide with the
      # entry its own first attempt wrote) and the prefix restore-key picks the
      # newest previous entry.
      #
      # Every dispatch restores, so a run on a release branch is compared
      # against main's trailing median instead of against nothing; only main
      # saves, so nothing but trunk extends the durable series. The history
      # directory is deliberately not `.benchmarks/perf-guard`: that directory
      # holds a ~70 MB report per run and has no business in a cache entry
      # every run rewrites.
      #
      # Both cache steps are `continue-on-error` because neither is allowed to
      # gate: a cache-service outage or a key collision must cost the advisory
      # signal for one run, never the guard. That is the rule the trend code
      # itself follows (FIG-1385: this signal reports, it does not gate) -- an
      # unreadable history prints "insufficient data", never a failure. Reset
      # the series wholesale -- after a scenario is redefined, say -- with
      # `gh cache delete` on the `perf-duration-history-full-` keys.
      - name: Restore runtime perf duration history
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .benchmarks/perf-history
          key: perf-duration-history-full-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            perf-duration-history-full-

      # Two steps, not two commands in one step: a failure in the runtime
      # profile used to abort before the lashlang profile ran at all, so its
      # rows never reached the log and a single dispatch could only ever
      # report one of the two guards.
      - name: Run full runtime performance checks
        run: |
          python3 scripts/profile_runtime.py --profile full --release --scenario all --enforce-budgets --out .benchmarks/perf-guard/runtime.json \
            --duration-history .benchmarks/perf-history/runtime-full.jsonl

      - name: Run full lashlang performance checks
        if: '!cancelled()'
        run: |
          python3 scripts/profile_lashlang.py --iterations 2500 --profile-iterations 2500 --enforce-budgets --out .benchmarks/perf-guard/lashlang.json

      # Only trunk extends the durable series. It runs before the summary and
      # upload steps rather than after them so a later step's failure cannot
      # cost the observation this run already measured.
      - name: Save runtime perf duration history
        if: "!cancelled() && github.ref == 'refs/heads/main'"
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .benchmarks/perf-history
          key: perf-duration-history-full-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish performance summaries
        if: '!cancelled()'
        run: |
          for report in runtime lashlang; do
            path=".benchmarks/perf-guard/${report}.json"
            if [ -f "${path}" ]; then
              python3 scripts/perfreport.py "${path}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "No ${report} performance report was produced." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload performance guard artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-guard-full-attempt-${{ github.run_attempt }}
          path: |
            .benchmarks/perf-guard/*
            .benchmarks/perf-history/*
          if-no-files-found: warn
