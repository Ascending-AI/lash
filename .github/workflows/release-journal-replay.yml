name: Release journal replay

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: release-journal-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_journal_replay: ${{ steps.classify.outputs.release_journal_replay }}
      trusted: ${{ github.event_name == 'push' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Select main and registered surfaces
        id: classify
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            python3 scripts/ci_plan.py fail-open --reason "main replays release journals" >> "$GITHUB_OUTPUT"
          elif git diff --no-renames --name-status -z "$PR_BASE_SHA" HEAD > "$RUNNER_TEMP/replay-paths"; then
            python3 scripts/ci_plan.py classify --event pull_request --paths-file "$RUNNER_TEMP/replay-paths" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/ci_plan.py fail-open --reason "release journal diff unavailable" >> "$GITHUB_OUTPUT"
          fi

  release-journal-replay:
    name: Release journal replay
    needs: plan
    if: needs.plan.outputs.release_journal_replay == 'true'
    # FIG-4097 enables the required gate at the cut. This separate workflow
    # reports failures without joining the required CI conclusion.
    # Advisory until the 1.0 cut (FIG-4905/Z07 recaptures the corpus and flips
    # this to required): journal shapes still change under the version freeze,
    # so a stale corpus reports red without taking the board.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: build-cache
    env:
      # FIG-4495 repoints this at fixtures/release/v1.0.0/replay-corpus at the cut.
      # Current-tree journals during the freeze; the release tag supplies the immutable corpus.
      LASH_REPLAY_CORPUS_ROOT: crates/lash-restate/testdata/replay-corpus
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Configure shared build cache
        if: needs.plan.outputs.trusted == 'true'
        uses: ./.github/actions/buck2-shared-cache
        env:
          CACHE_ENDPOINT: ${{ secrets.CACHE_ENDPOINT }}
          CACHE_INSTANCE: ${{ secrets.CACHE_INSTANCE }}
          KILN_EXECUTOR_RUNTIME: ${{ secrets.KILN_EXECUTOR_RUNTIME }}
          CACHE_CA: ${{ secrets.CACHE_CA }}
          CACHE_CERT: ${{ secrets.CACHE_CERT }}
          CACHE_KEY: ${{ secrets.CACHE_KEY }}
      - name: Replay every release scenario and the added-step self-test
        env:
          TRUSTED: ${{ needs.plan.outputs.trusted }}
        run: |
          set -euo pipefail
          execution=()
          if [[ "$TRUSTED" != true ]]; then execution=(--local); fi
          scripts/hermetic-build.sh "${execution[@]}" test \
            //crates/lash-restate:lash-restate__unit_test \
            --local-test-execution --no-test-cache \
            --test_arg=tests::replay_corpus:: --test_arg=--nocapture \
            --test_env LASH_REPLAY_CORPUS_ROOT="$LASH_REPLAY_CORPUS_ROOT" \
            --test-report "$RUNNER_TEMP/release-journal-report.json" \
            --test-output-dir "$RUNNER_TEMP/release-journal-results"
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-journal-replay
          path: |
            ${{ runner.temp }}/release-journal-report.json
            ${{ runner.temp }}/release-journal-results
      - name: Remove client credentials
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/build-cache"
