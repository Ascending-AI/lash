name: Release journal replay

# The release-journal replay (FIG-4097) on main. Pull requests, merge groups
# and dispatches run the same replay as the `release-journal-replay` job of
# ci.yml, inside the required CI conclusion. This workflow covers a commit
# pushed straight to main.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-journal-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-journal-replay:
    name: Release journal replay
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: build-cache
    env:
      # The dry-run capture of the 1.0 cut branch. The tagged capture
      # (FIG-4495) repoints this at fixtures/release/v1.0.0/replay-corpus.
      LASH_REPLAY_CORPUS_ROOT: fixtures/release-rehearsal/cut-1.0-dry-run/replay-corpus
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Configure shared build cache
        uses: ./.github/actions/buck2-shared-cache
        env:
          CACHE_ENDPOINT: ${{ secrets.CACHE_ENDPOINT }}
          CACHE_INSTANCE: ${{ secrets.CACHE_INSTANCE }}
          KILN_EXECUTOR_RUNTIME: ${{ secrets.KILN_EXECUTOR_RUNTIME }}
          CACHE_CA: ${{ secrets.CACHE_CA }}
          CACHE_CERT: ${{ secrets.CACHE_CERT }}
          CACHE_KEY: ${{ secrets.CACHE_KEY }}
      - name: Replay every release scenario and the added-step self-test
        run: |
          set -euo pipefail
          scripts/hermetic-build.sh test \
            //crates/lash-restate:lash-restate__unit_test \
            --local-test-execution --no-test-cache \
            --test_arg=tests::replay_corpus:: --test_arg=--nocapture \
            --test_env LASH_REPLAY_CORPUS_ROOT="$LASH_REPLAY_CORPUS_ROOT" \
            --test-report "$RUNNER_TEMP/release-journal-report.json" \
            --test-output-dir "$RUNNER_TEMP/release-journal-results"
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-journal-replay
          path: |
            ${{ runner.temp }}/release-journal-report.json
            ${{ runner.temp }}/release-journal-results
      - name: Remove client credentials
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/build-cache"
