name: Release cache

# Keep this non-gating warmer out of CI's concurrency group. It is a heavy
# release-profile build, so it is manual like the rest of the heavy CI: a
# maintainer dispatches it to warm `linux-release` for release.yml and
# perf.yml. Both of those restore the cache opportunistically and build what is
# missing, so a cold cache costs wall clock, never correctness.
on:
  workflow_dispatch:

concurrency:
  group: linux-release-cache-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # perf.yml and release.yml restore this cache without mold RUSTFLAGS.
  RUSTFLAGS: ""

jobs:
  linux-release-cache:
    name: Build Linux release cache
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          # Sole writer; release.yml and perf.yml remain restore-only consumers.
          shared-key: linux-release

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Install mold
        uses: ./.github/actions/setup-mold

      - name: Build release workspace
        run: cargo build --locked --release --workspace

      - name: Report cache disk capacity
        if: always()
        run: bash scripts/ci/report-cache.sh
