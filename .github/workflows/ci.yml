      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      # Provides the linker the workflow-level RUSTFLAGS names. This job
      # restores the `linux-debug` cache without routing through the sccache
      # action, so it installs mold directly rather than taking on a
      # compilation cache it does not otherwise use.
      - name: Install mold
        uses: ./.github/actions/setup-mold

      - name: Start MinIO and create test bucket
        run: |
          docker run -d --name lash-ci-minio \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            -p 9000:9000 \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for attempt in $(seq 1 60); do
            if docker run --rm --network host minio/mc:RELEASE.2025-04-16T18-13-26Z \
              alias set ci http://127.0.0.1:9000 minioadmin minioadmin; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs lash-ci-minio
              exit 1
            fi
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh minio/mc:RELEASE.2025-04-16T18-13-26Z -c \
            'mc alias set ci http://127.0.0.1:9000 minioadmin minioadmin >/dev/null && mc mb --ignore-existing ci/lash-attachments'

      - name: Test S3 store conformance
        run: cargo test -p lash-s3-store --locked
        env:
          LASH_MINIO_ENDPOINT: http://127.0.0.1:9000
          LASH_REQUIRE_MINIO: "1"

      - name: Test attachment blob-store differential
        run: >-
          cargo test -p lash-sim
          --test cross_backend_store_differential
          --locked attachment_blob_store_differential_agrees -- --nocapture --include-ignored
        env:
          LASH_MINIO_ENDPOINT: http://127.0.0.1:9000
          LASH_REQUIRE_MINIO: "1"

      - name: Stop MinIO
        if: always()
        run: docker rm -f lash-ci-minio

  stack-budget:
    name: Stack budget
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Restore cargo cache
        uses: useblacksmith/rust-cache@f53e7f127245d2a269b3d90879ccf259876842d5 # v3.0.1
        with:
          cache-bin: false
          shared-key: linux-debug
          save-if: false

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      # Provides the linker the workflow-level RUSTFLAGS names. This job
      # restores the `linux-debug` cache without routing through the sccache
      # action, so it installs mold directly rather than taking on a
      # compilation cache it does not otherwise use.
      - name: Install mold
        uses: ./.github/actions/setup-mold

      - name: Enforce stack budget
        run: bash scripts/ci-stack-budget.sh

  # Release-profile coverage is x86_64 Linux only, matching what this
  # repository ships: source crates on crates.io, no platform binaries (the
  # binary artifacts, checksums, and installers belong to Host Application
  # repositories). Cross-target check legs were removed with no deploy target
  # behind them.
  linux-release-cache:
    name: Build Linux release cache
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 20
    # Warms the release-profile cache that release.yml and perf.yml restore on
    # main. A cache written by a pull-request run is scoped to that PR's merge
    # ref and can only be restored by re-runs of the same pull request, so on a
    # PR this spends the longest job on the board building a cache no other
    # workflow can read. The same is true of a merge-queue entry's
    # `gh-readonly-queue/...` ref, and there it would also be the longest job
    # gating queue throughput. Cache warming belongs on main. Pushes whose
    # dependency-graph inputs are unchanged skip the warm build after diffing
    # the complete pushed range; workflow dispatches and ambiguous histories
    # fail open so the cache can always be recovered manually. A floating
    # `stable` toolchain release is not itself a repository change, so it
    # re-warms only on the next inspected-path push or manual dispatch. Skipped
    # pushes can also leave sccache's workspace release objects stale, so a
    # manual release may need to recompile changed workspace crates. Those
    # trade-offs are accepted because releases are rare and manually dispatched.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    # The one job in this workflow that must not inherit the workflow-level
    # mold RUSTFLAGS. perf.yml and release.yml restore this same
    # `linux-release` cache and do not link through mold, so linking
    # differently here would refingerprint the graph and make them rebuild
    # everything they restored. Empty and unset are the same value to cargo,
    # which is what makes this override equal to what those workflows resolve.
    env:
      RUSTFLAGS: ""

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Detect release cache inputs
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          FORCE_PUSH: ${{ github.event.forced }}
        run: |
          set -euo pipefail

          run_build() {
            echo "run=true" >> "${GITHUB_OUTPUT}"
            echo "Running Linux release-cache warm build: $1"
            exit 0
          }

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            run_build "workflow_dispatch always warms the cache."
          fi

          if [[ "${FORCE_PUSH}" == "true" ]]; then
            run_build "the push rewrote history; failing open."
          fi

          if [[ "${BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            run_build "the push has no prior ref (initial/orphan history); failing open."
          fi

          if ! git fetch --no-tags --prune --depth=1 origin "${BEFORE_SHA}"; then
            run_build "the pushed-range base fetch failed; failing open."
          fi

          if ! git rev-parse --verify "${BEFORE_SHA}^{commit}" >/dev/null 2>&1; then
            run_build "the pushed-range base is unavailable after fetch; failing open."
          fi

          if ! diff_output=$(git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}"); then
            run_build "the input diff failed; failing open."
          fi

          changed_paths=()
          if [[ -n "${diff_output}" ]]; then
            mapfile -t changed_paths <<< "${diff_output}"
          fi
          for path in "${changed_paths[@]}"; do
            case "${path}" in
              Cargo.lock | Cargo.toml | */Cargo.toml | rust-toolchain | rust-toolchain.toml | .cargo/* | .github/actions/* | .github/workflows/ci.yml)
                run_build "cache input '${path}' changed in the pushed range ${BEFORE_SHA}..${GITHUB_SHA}."
                ;;
            esac
          done

          echo "run=false" >> "${GITHUB_OUTPUT}"
          echo "Skipping Linux release-cache warm build: no cache-input paths changed in the pushed range ${BEFORE_SHA}..${GITHUB_SHA}."
          echo "Inspected: Cargo.lock; Cargo.toml and */Cargo.toml; rust-toolchain and rust-toolchain.toml; .cargo/**; .github/actions/**; .github/workflows/ci.yml."

      - name: Reclaim runner disk
        if: steps.detect.outputs.run == 'true'
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        if: steps.detect.outputs.run == 'true'
        uses: ./.github/actions/rust-toolchain


      - name: Restore cargo cache
        if: steps.detect.outputs.run == 'true'
        uses: useblacksmith/rust-cache@f53e7f127245d2a269b3d90879ccf259876842d5 # v3.0.1
        with:
          cache-bin: false
          # Sole writer of the linux release-profile cache; release.yml's
          # perf jobs restore it, so release-profile dependencies stay warm.
          shared-key: linux-release

      - name: Install protoc
        if: steps.detect.outputs.run == 'true'
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Setup sccache
        if: steps.detect.outputs.run == 'true'
        uses: ./.github/actions/setup-sccache

      - name: Build release workspace
        if: steps.detect.outputs.run == 'true'
        run: cargo build --locked --release --workspace

      - name: Report sccache stats
        if: always() && steps.detect.outputs.run == 'true'
        run: sccache --show-stats

  functional-e2e:
    name: Functional E2E (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-service
            recipe: agent-service-restate-e2e
            node: false
            artifact: none
            browser: false
            runner: blacksmith-4vcpu-ubuntu-2404
          - name: agent-workbench
            recipe: agent-workbench-restate-e2e
            node: false
            artifact: none
            browser: false
            runner: blacksmith-8vcpu-ubuntu-2404
          - name: workflow-graph-roundtrip
            recipe: workflow-graph-integration-verify
            node: true
            artifact: none
            browser: false
            runner: blacksmith-2vcpu-ubuntu-2404
          - name: process-operations
            recipe: process-operations-e2e
            node: false
            artifact: process-operations
            browser: false
            runner: blacksmith-16vcpu-ubuntu-2404
          - name: version-bump-recreation
            recipe: version-bump-recreation-e2e
            node: false
            artifact: version-bump-recreation
            browser: false
            runner: blacksmith-8vcpu-ubuntu-2404
          - name: session-lease-triage
            recipe: session-lease-triage-e2e
            node: false
            artifact: session-lease-triage
            browser: false
            runner: blacksmith-8vcpu-ubuntu-2404
          - name: slack-clone-full-host
            recipe: slack-clone-full-host-e2e
            node: false
            artifact: none
            browser: true
            runner: blacksmith-8vcpu-ubuntu-2404

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain


      - name: Restore cargo cache
        uses: useblacksmith/rust-cache@f53e7f127245d2a269b3d90879ccf259876842d5 # v3.0.1
        with:
          cache-bin: false
          shared-key: linux-debug
          save-if: false

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      # Provides the linker the workflow-level RUSTFLAGS names. This job
      # restores the `linux-debug` cache without routing through the sccache
      # action, so it installs mold directly rather than taking on a
      # compilation cache it does not otherwise use.
      - name: Install mold
        uses: ./.github/actions/setup-mold

      - name: Install Node
        if: matrix.node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/workflow-graph-roundtrip/frontend/package-lock.json

      - name: Install uv
        if: matrix.browser
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install Chromium for Playwright
        if: matrix.browser
        run: uv run --with playwright==1.62.0 playwright install --with-deps chromium

      # The repo-local installer uses checksum-pinned release archives instead
      # of the GitHub releases API; merge-queue trains fan out enough jobs that
      # the API-listing path (extractions/setup-just) hit rate limits and
      # ejected whole trains.
      - name: Install just
        uses: ./.github/actions/install-tools
        with:
          tool: just

      # Each recipe owns its dependencies and any container lifecycle, so the
      # matrix legs run independently without cross-job coordination.
      - name: Run functional E2E
        env:
          LASH_PROCESS_OPERATIONS_ARTIFACT_DIR: target/functional-e2e-artifacts/process-operations
          LASH_VERSION_BUMP_ARTIFACT_DIR: target/functional-e2e-artifacts/version-bump-recreation
          LASH_SESSION_LEASE_ARTIFACT_DIR: target/functional-e2e-artifacts/session-lease-triage
          LASH_SLACK_CLONE_E2E_ARTIFACT_DIR: ${{ matrix.browser && format('{0}/slack-clone-full-host-e2e', runner.temp) || '' }}
        run: just ${{ matrix.recipe }}

      - name: Upload functional E2E failure artifacts
        if: failure() && matrix.artifact != 'none'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: functional-e2e-${{ matrix.artifact }}-attempt-${{ github.run_attempt }}
          path: target/functional-e2e-artifacts/${{ matrix.artifact }}
          if-no-files-found: warn

      - name: Upload slack-clone full-host E2E failure artifacts
        if: failure() && matrix.browser
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slack-clone-full-host-e2e-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/slack-clone-full-host-e2e
          if-no-files-found: warn

  restate-postgres-workers:
    name: Restate + Postgres + MinIO Workers (segment ${{ matrix.segment }})
    runs-on: blacksmith-16vcpu-ubuntu-2404
    # The harness has grown to 24 workflows + turn-control gates; 30 minutes
    # was hit on 2026-07-20 (job-timeout shows as 'cancelled').
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        segment: [1, 2]

    steps:
      - name: Explain merge-queue deferral
        if: github.event_name == 'pull_request'
        run: echo "Workers E2E execution is deferred to the merge-queue run."

      - name: Check out repository
        if: github.event_name != 'pull_request'
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Reclaim runner disk
        if: github.event_name != 'pull_request'
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/rust-toolchain

      # The e2e binaries are built on the host by the just recipe and
      # bind-mounted into the compose services, so the build reuses the
      # workspace debug cache that the test-doc job saves — which means using
      # the same cache action the writer uses, not a second backend that always
      # missed.
      - name: Restore cargo cache
        if: github.event_name != 'pull_request'
        uses: useblacksmith/rust-cache@f53e7f127245d2a269b3d90879ccf259876842d5 # v3.0.1
        with:
          cache-bin: false
          shared-key: linux-debug
          save-if: false

      - name: Install protoc
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      # Provides the linker the workflow-level RUSTFLAGS names. This job
      # restores the `linux-debug` cache without routing through the sccache
      # action, so it installs mold directly rather than taking on a
      # compilation cache it does not otherwise use.
      - name: Install mold
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/setup-mold

      - name: Run distributed backend E2E
        if: github.event_name != 'pull_request'
        env:
          LASH_E2E_WORKFLOW_SEGMENT: ${{ matrix.segment }}
          LASH_E2E_COMPLETED_WORKFLOW_MANIFEST: target/restate-postgres-workers-e2e-manifests/segment-${{ matrix.segment }}/completed-workflows.txt
        run: bash scripts/restate-postgres-workers-e2e.sh

      - name: Run graceful drain operator-flow E2E
        if: github.event_name != 'pull_request' && matrix.segment == 1
        env:
          LASH_GRACEFUL_DRAIN_ARTIFACT_DIR: target/operator-flow-artifacts/graceful-drain
        run: bash scripts/graceful-drain-e2e.sh

      - name: Run request abandon operator-flow E2E
        if: github.event_name != 'pull_request' && matrix.segment == 1
        env:
          LASH_REQUEST_ABANDON_ARTIFACT_DIR: target/operator-flow-artifacts/request-abandon
        run: bash scripts/request-abandon-e2e.sh

      - name: Upload operator-flow E2E failure artifacts
        if: failure() && github.event_name != 'pull_request' && matrix.segment == 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operator-flow-e2e-attempt-${{ github.run_attempt }}
          path: target/operator-flow-artifacts
          if-no-files-found: warn

      - name: Upload completed workflow manifest
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restate-workers-e2e-segment-${{ matrix.segment }}-attempt-${{ github.run_attempt }}
          path: target/restate-postgres-workers-e2e-manifests/segment-${{ matrix.segment }}
          if-no-files-found: error

  restate-postgres-workers-summary:
    name: Restate workers E2E coverage summary
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    if: always()
    needs:
