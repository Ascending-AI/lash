      - name: Report sccache stats
        if: always()
        run: sccache --show-stats

  confidence-fast-summary:
    name: Confidence fast summary
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    if: always()
    needs:
      - confidence-fast

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Download confidence fast shard artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: confidence-fast-*-attempt-${{ github.run_attempt }}
          path: target/confidence/fast-download
          merge-multiple: false

      - name: Assemble confidence fast shard tree
        run: |
          rm -rf target/confidence/fast
          mkdir -p target/confidence/fast
          for shard in scenario-harnesses fault-matrix sim-unit-perf-guards sim-generated minimizer-fixtures; do
            cp -a "target/confidence/fast-download/confidence-fast-${shard}-attempt-${{ github.run_attempt }}" "target/confidence/fast/${shard}"
          done

      - name: Validate confidence fast summary
        run: bash scripts/confidence-gate.sh fast:summary

      - name: Upload confidence fast summary artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: confidence-fast-summary-attempt-${{ github.run_attempt }}
          path: target/confidence/fast
          if-no-files-found: error

  postgres-store-build:
    name: Build Postgres store tests
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Restore cargo cache
        uses: useblacksmith/rust-cache@f53e7f127245d2a269b3d90879ccf259876842d5 # v3.0.1
        with:
          cache-bin: false
          shared-key: linux-debug
          save-if: false

      - name: Install protoc and nextest
        uses: ./.github/actions/install-tools
        with:
          tool: protoc,nextest

      - name: Install mold
        uses: ./.github/actions/setup-mold

      - name: Build Postgres store test archive
        run: |
          mkdir -p target/nextest
          cargo nextest archive --profile ci -p lash-postgres-store --locked \
            --archive-file target/nextest/postgres-store-tests.tar.zst

      # Nextest does not support Rust doctests. Compile the crate's two
      # compile-only examples once here instead of repeating them per major.
      - name: Test Postgres store doctests
        run: cargo test -p lash-postgres-store --doc --locked

      - name: Upload Postgres store test archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-store-tests-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: target/nextest/postgres-store-tests.tar.zst
          if-no-files-found: error
          # The nextest archive is already zstd-compressed; wrapping it in a
          # second compression pass only adds upload/download latency.
          compression-level: 0

  postgres-store:
    name: Test Postgres store (PG ${{ matrix.postgres }})
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 10
    needs: postgres-store-build

    # The structural schema check at open (`SchemaProvisioning`/`SchemaCheck`)
    # compares the live catalog against a generated expectation artifact, so a
    # catalog attribute that renders differently on a major lash has not tested
    # would reject every host on that major with no remedy but a lash release.
    # 14 and 18 bracket the supported range — 18 is where NOT NULL became
    # `pg_constraint` rows, 14 is before `pg_index.indnullsnotdistinct` existed —
    # and the shape suite asserts all three produce the byte-identical artifact.
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "16", "18"]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        command: -c shared_preload_libraries=pg_stat_statements
        env:
          POSTGRES_USER: lash
          POSTGRES_PASSWORD: lash
          POSTGRES_DB: lash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lash -d lash"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Restore cargo cache
        uses: useblacksmith/rust-cache@f53e7f127245d2a269b3d90879ccf259876842d5 # v3.0.1
        with:
          cache-bin: false
          shared-key: linux-debug
          save-if: false

      - name: Install protoc and nextest
        uses: ./.github/actions/install-tools
        with:
          tool: protoc,nextest

      # Provides the linker the workflow-level RUSTFLAGS names. This job
      # restores the `linux-debug` cache without routing through the sccache
      # action, so it installs mold directly rather than taking on a
      # compilation cache it does not otherwise use.
      - name: Install mold
        uses: ./.github/actions/setup-mold

      - name: Download Postgres store test archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: postgres-store-tests-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: target/nextest-archives

      # `lash-postgres-store`'s conformance tests run the backend-agnostic
      # RuntimePersistence / SessionStoreFactory / ProcessRegistry /
      # TriggerStore / LashlangArtifactStore suites against a real Postgres.
      # Required mode fails when the URL is unset, so missing CI configuration
      # cannot silently skip this lane. `connect()` applies the crate's
      # `schema.sql` artifact itself, so no separate migrate step. The same run
      # carries the `schema_shape` and `schema_drift` suites, which assert this
      # major produces the committed expectation artifact byte-for-byte and that
      # each seeded drift class is rejected by name.
      # The suites share one database and reset() truncates all lash_* tables.
      # The `docker-services` nextest group serializes the binaries which share
      # that database while leaving scratch-schema tests parallel.
      - name: Test Postgres store (conformance)
        run: >-
          cargo nextest run --profile ci
          --archive-file target/nextest-archives/postgres-store-tests.tar.zst
          --extract-to . --extract-overwrite
        env:
          LASH_POSTGRES_DATABASE_URL: postgres://lash:lash@localhost:5432/lash
          LASH_REQUIRE_POSTGRES: "1"

      # The differential compares backend semantics, not catalog rendering, so it
      # runs once on the primary major instead of three times.
      - name: Test cross-backend store differential
        if: matrix.postgres == '16'
        run: >-
          cargo nextest run --profile ci -p lash-sim
          --test cross_backend_store_differential
          --locked -j1 --no-capture --run-ignored all
        env:
          LASH_POSTGRES_DATABASE_URL: postgres://lash:lash@localhost:5432/lash
          LASH_REQUIRE_POSTGRES: "1"
          LASH_CROSS_BACKEND_CASES: "4"

