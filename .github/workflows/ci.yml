name: CI

# GitHub natively skips push/PR runs when the head commit requests a CI skip,
# so no per-job guards are needed for that.
#
# CI validates pull requests and the resulting commits on the main trunk.
# Releases are separate: a maintainer manually dispatches release.yml for a
# green commit on main. Ordinary merges never tag or publish.

on:
  # Manual re-validation for when GitHub drops a push event (merge commit
  # d70ce7ea got zero check suites). Recovery-only: no inputs, never invoked
  # from another workflow, and unrelated to the removed pass-2 bump chain.
  #
  # Don't drive this recovery by hand: `scripts/ci_ensure_run.sh <branch>
  # <head-sha>` waits a bounded window for the run GitHub should have made,
  # dispatches this trigger exactly once if none arrives, then polls that run
  # to a conclusion. A dispatch run is NOT equivalent to the run it replaces —
  # the event-conditional steps below (`Check versioned surface bumps`,
  # `Check and preview PR release notes`) do not run, and it builds
  # refs/heads/<branch> rather than the PR merge tree — so the script exits 3,
  # not 0, on a green dispatch. Callers opt in with --accept-dispatch-run.
  workflow_dispatch:
  pull_request:
  # The merge queue delivers a queued PR's required checks on its own event, from
  # its own `gh-readonly-queue/...` ref. Without this trigger a queue entry gets
  # no checks at all and the queue stalls.
  merge_group:
  push:
    branches:
      - main

# One live CI run per head branch, whatever event produced it — because a
# `pull_request` run carries `refs/pull/<n>/merge` while a manual recovery
# dispatch of the same commit carries `refs/heads/<branch>`, so keying on
# `github.ref` put them in different groups and ran the whole board twice over an
# identical tree. That duplication was the single largest line in the CI bill
# (54% of branch runner-minutes). Now a dispatch supersedes the pull-request run
# of the same branch instead of doubling it, and the dispatch trigger itself
# stays exactly as it was — still the recovery path for a dropped push event.
#
# The key is not *only* the branch name, because a branch name is not unique
# across repositories: a fork's pull request from a branch literally named `main`
# would key into main's group and, being a pull-request run, would cancel a live
# trunk run — destroying the one guarantee below. So each event class that must
# never be collided into gets its own key, and those keys contain a colon, which
# `git check-ref-format` forbids in a ref name. That is what makes them
# unforgeable: no branch anyone can push, here or in a fork, can produce one.
#
# * `push` (main only) keys on `trunk:push`, so a trunk run shares a group with
#   nothing but another trunk push. Trunk runs are never cancelled: release.yml
#   refuses to release a commit without its own successful main CI run, so a
#   cancelled trunk run would strand that commit as unreleasable.
# * a dispatch on main keys on `trunk:dispatch` for the same reason — it is the
#   recovery path that produces exactly that release evidence. The cost is that
#   it no longer queues behind a live trunk push run but runs beside it; two
#   validations of main are wasteful, never wrong.
# * a *fork* pull request keys on its PR number, which no branch name can
#   collide with. Same-repo pull requests keep the branch key, which is what lets
#   a dispatch dedupe with them.
# * a `merge_group` run has no `head_ref` and falls through to its own
#   `gh-readonly-queue/main/pr-<n>-<sha>` ref name, unique per queue entry: two
#   queue builds never share a group and never cancel each other. Their
#   cancellation belongs to the queue, which drops an entry's run when it
#   dequeues it, so `cancel-in-progress` stays false for the event.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'push' && 'trunk:push'
      || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') && 'trunk:dispatch'
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && format('fork-pr:{0}', github.event.pull_request.number)
      || github.head_ref
      || github.ref_name
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref_name != 'main') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LASH_CI_FEATURES: ""
  # The linker is a property of the caches this workflow shares, not of any
  # one job's step list. RUSTFLAGS is part of cargo's per-unit fingerprint, so
  # a job that restores `linux-debug` under a different RUSTFLAGS than the job
  # that wrote it logs "cache restored" and then cold-builds the whole graph —
  # which is exactly what the five container/E2E readers did while the flag
  # was appended by the sccache action they never ran. Setting it here makes
  # every job in this workflow resolve the same value by default; the one
  # cache that must stay mold-free (`linux-release`, restored by perf.yml and
  # release.yml, which do not link through mold) overrides it at job scope.
  # Linking is what sccache cannot help with: a compilation cache hit still
  # pays full link cost, and this workspace links a lot of test binaries.
  RUSTFLAGS: -C link-arg=-fuse-ld=mold
  # Preserve the pre-worktree-isolation artifact tree consumed below.
  LASH_CONFIDENCE_OUT_DIR: ${{ github.workspace }}/target/confidence

jobs:
  # Sole writer of the shared linux-debug cache and the doctest gate. It builds
  # the superset (`cargo check --workspace --all-targets` plus the doctest
  # link) that every read-only debug-profile job restores. The nextest run is
  # sharded out to the test-shard matrix below.
  #
  # This job is deliberately *only* the cache superset (which now includes the
  # trybuild fixture graph, see the step) and the doctests. Every
  # gate that neither warms nor needs that superset — the repository gates, the
  # public-API coverage gate, the package feature checks, the default-off runtime
  # boundary — used to queue behind it as serial steps, which made this job the
  # run's critical path (9m40s warm, 20m36s on a cold branch cache) for work
  # that has no dependency on it. They are sibling jobs now; nothing was dropped
  # or weakened.
  test-doc:
    name: Test docs + build cache
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain


      - name: Restore cargo cache
        uses: useblacksmith/rust-cache@f53e7f127245d2a269b3d90879ccf259876842d5 # v3.0.1
        with:
          cache-bin: false
          # This job builds a superset of what the other debug-profile jobs
          # (test shards, Postgres store, Restate E2E, the distributed-workers
          # e2e workflow) need, so it is the sole writer of the shared cache.
          shared-key: linux-debug

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      # Compiles every target of every workspace crate — libs, bins, tests,
      # examples, and benches. This subsumes the old standalone checks for
      # docs-snippets and the runtime perf harness, which would otherwise only break post-merge. It also warms the
      # dependency graph the test-shard matrix restores.
      - name: Check workspace (all targets)
        run: |
          # shellcheck disable=SC2086
          cargo check --workspace --all-targets --locked ${LASH_CI_FEATURES}

      # nextest does not run doctests; keep them covered here (also builds the
      # workspace crates as rlibs, warming the shared cache for the readers).
      - name: Test workspace doctests
        run: |
          # shellcheck disable=SC2086
          cargo test --doc --workspace --locked ${LASH_CI_FEATURES}

      # The trybuild API-sealing suite (crates/lash/tests/ui.rs) compiles its
      # fixtures in a private cargo project under `target/tests/trybuild` — a
      # second full build of lash and its dependency graph, and the one part of
      # the test suite the shared cache never carried. The shards restore that
      # cache read-only, so whatever they build there dies with the job, and the
      # three shards holding a `ui` test each paid the cold fixture build every
      # run (184s, 106s and 103s of shard time).
      #
      # Building it here is what puts it in the cache: this job is the sole
      # writer, and rust-cache already knows `target/tests/trybuild` is a target
      # directory to keep rather than a stray file to sweep. trybuild rewrites
      # the fixture manifest on every run, so a warm fixture directory is its
      # normal operating mode, not a staleness hazard.
      #
      # What the shards get back is the fixture's *dependency* graph, not the
      # whole build: rust-cache's save-time cleaning keeps only artifacts of
      # packages from outside the workspace, so the fixture's copy of lash and
      # its sibling crates is swept and rebuilt. Measured on the same machine —
      # cold fixture 505s, cache-cleaned fixture 184s, untouched fixture 20s —
      # which is why this buys most of the shard cost back and not all of it.
      # The rest is sccache's job: the fixture compiles under a `--target`
      # triple, so its rustc invocations are keyed apart from the ordinary host
      # build and this step is the first to prime them for the shards.
      #
      # The cache only takes the fixture on a run whose cache key misses —
      # rust-cache skips the save outright on a full key match — so the warming
      # lands with the next toolchain, manifest or Cargo.lock change, not on the
      # merge of this step.
      #
      # `--test ui` builds that one test target, not the workspace's other test
      # binaries. The step is named for what it runs, not for the caching:
      # compile_fail drift now fails here first, minutes ahead of the shard that
      # would otherwise report it, and a red step named for a cache would send
      # the reader hunting a caching bug. The shards still run the suite;
      # nothing here replaces their coverage.
      - name: Seal-test the API surface (warms the trybuild fixture cache)
        run: |
          # shellcheck disable=SC2086
          cargo test --workspace --locked ${LASH_CI_FEATURES} --test ui

      - name: Report sccache stats
        if: always()
        run: sccache --show-stats

  # Python-only repository gates plus the rustdoc lint. These were serial steps
  # of test-doc, where they sat behind twelve minutes of compilation for no
  # reason: nothing here depends on the workspace check. The rustdoc lint is the
  # one cargo consumer, so this job restores the shared cache read-only.
  repo-gates:
    name: Repository gates
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Restore cargo cache
        uses: useblacksmith/rust-cache@f53e7f127245d2a269b3d90879ccf259876842d5 # v3.0.1
        with:
          cache-bin: false
          shared-key: linux-debug
          save-if: false

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Lint docs
        run: python3 scripts/lint_docs.py

      - name: Check documented format versions
        run: python3 scripts/check_format_versions.py

      - name: Lint orchestrating tools
        run: python3 scripts/lint_orchestrating_tools.py

      - name: Check test quarantine metadata
        run: python3 scripts/check_test_quarantines.py

      - name: Check judged build geometry
        run: python3 scripts/check_judged_build_geometry.py

      - name: Test repository scripts
        run: |
          python3 scripts/test_check_api_example_coverage.py
          python3 scripts/test_check_core_public_member_docs.py
          python3 scripts/test_check_durable_read_fixture_version.py
          python3 scripts/test_check_format_versions.py
          python3 scripts/test_lint_docs.py
          python3 scripts/test_check_postgres_json_carrier_coverage.py
          python3 scripts/test_check_postgres_payload_shape_version.py
          python3 scripts/test_check_service_gate_pinning.py
          python3 scripts/test_check_version_bumps.py
          python3 scripts/test_fast_test.py
          python3 scripts/test_check_version_bump_fixtures.py
          python3 scripts/test_check_transcript_diff.py
          python3 scripts/test_gate_scope.py
          python3 scripts/test_release_version.py
          python3 scripts/test_publish_workspace.py
          python3 scripts/test_confidence_gate_ci_contract.py
          python3 scripts/test_slack_clone_full_host_e2e_contract.py
          python3 scripts/test_slack_clone_live_model_e2e_contract.py
          python3 scripts/test_judged_runbook_matrix.py
          python3 scripts/test_check_judged_build_geometry.py
          python3 scripts/test_release_notes.py
          python3 scripts/test_restate_workers_e2e_coverage.py
          python3 scripts/test_rustdoc_json_cache.py
          bash scripts/test-worktree-gate-env.sh
          bash scripts/test-dev-script-process-identity.sh

      - name: Lint rustdoc
        run: bash scripts/check-rustdoc.sh

      - name: Report sccache stats
        if: always()
        run: sccache --show-stats

  # The public-API disposition gate builds rustdoc JSON for the facade crates,
  # which is its own compile of the dependency graph — 7m49s of the old 21m
  # test-doc critical path, and independent of every other check. Its own job.
  api-coverage:
    name: Public API example coverage
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Restore cargo cache
        uses: useblacksmith/rust-cache@f53e7f127245d2a269b3d90879ccf259876842d5 # v3.0.1
        with:
          cache-bin: false
          shared-key: linux-debug
          save-if: false

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Check public API example coverage
        run: python3 scripts/check_api_example_coverage.py

      - name: Report sccache stats
        if: always()
        run: sccache --show-stats

  # A dependency workspace's [patch] table is invisible to its consumers.
  # Resolve lashlang from this checkout as a Git dependency in a fresh external
  # crate so every dependency needed by downstream users is carried explicitly.
  lashlang-git-consumer:
    name: Lashlang Git consumer
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Restore cargo cache
        uses: useblacksmith/rust-cache@f53e7f127245d2a269b3d90879ccf259876842d5 # v3.0.1
        with:
          cache-bin: false
          shared-key: linux-debug
          save-if: false

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Check lashlang Git consumer without patch mirror
        run: bash scripts/check-lashlang-git-consumer.sh "${GITHUB_SHA}"

      - name: Report sccache stats
        if: always()
        run: sccache --show-stats

  # Feature-set coverage the workspace check cannot reach, and the deliberately
  # non-default provider/protocol test features. Split out of test-doc: these
  # resolve their own feature graphs, so they neither reuse nor warm anything the
  # workspace check produces, and running them beside it costs nothing.
  package-feature-checks:
    name: Package feature checks
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Restore cargo cache
        uses: useblacksmith/rust-cache@f53e7f127245d2a269b3d90879ccf259876842d5 # v3.0.1
        with:
          cache-bin: false
          shared-key: linux-debug
          save-if: false

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      # The workspace check unifies testing features through dev-dependencies.
      # Keep these package-scoped consumers honest about feature forwarding.
      #
      # agent-service's `restate` feature is off by default, so the workspace
      # check compiles neither its restate constructor nor the E2E test
      # target that calls it. That gap shipped a `missing field` break to the
      # Functional E2E leg, twenty minutes of docker away, when a local
      # workspace battery was entirely green. Compile it here in seconds.
      # `cargo check -p agent-workbench` (no `--all-targets`) is also the judged
      # lane's compile leg: it resolves the host without dev-dependencies, which
      # is exactly the feature set a judged runbook boots. The workspace check
      # unifies `testing` back in through dev-dependencies and would not notice
      # the host losing it.
      - name: Check package-scoped testing consumers
        run: |
          cargo check -p lash-protocol-rlm --features testing --locked
          cargo check -p agent-workbench --locked
          cargo check -p slack-clone --all-targets --features e2e --locked
          cargo check -p agent-service --features restate --all-targets --locked

      # The workspace test run only reaches lash-remote-protocol's core
      # conversions because `lash` unifies the feature in. Run the crate on its
      # own so the coverage survives any change to who depends on what, and so
      # `cargo test -p lash-remote-protocol` stops being a misleading command.
      - name: Test lash-remote-protocol core conversions
        run: cargo test -p lash-remote-protocol --features core-conversions --locked

      # Provider test support is deliberately outside each crate's default
      # feature set. Keep the shared normalization contract explicit so a
      # production-safe default cannot silently reduce conformance coverage.
      #
      # A bare `cargo test -p lash-provider-*` now runs these laws too: each
      # crate carries a self dev-dependency that turns `testing` on for its test
      # builds, plus a sentinel test that fails if the law is ever compiled out.
      # This step stays because it pins the feature by name, independently of
      # that wiring.
      - name: Test provider response-normalization conformance
        run: |
          cargo test -p lash-llm-transport --features testing --locked conformance
          cargo test -p lash-provider-openai --features testing --locked conformance
          cargo test -p lash-provider-anthropic --features testing --locked conformance
          cargo test -p lash-provider-google --features testing --locked conformance

      - name: Report sccache stats
        if: always()
        run: sccache --show-stats

  # The default-off boundary lane: `lash-runtime` without its default features
  # compiles, tests, and pulls no RLM/Lashlang dependency. Its feature
  # resolution differs from every other job's, so it is its own compile and its
  # own job; `scripts/push-gate` runs the identical commands locally.
  runtime-feature-boundary:
    name: Runtime feature boundary
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Restore cargo cache
        uses: useblacksmith/rust-cache@f53e7f127245d2a269b3d90879ccf259876842d5 # v3.0.1
        with:
          cache-bin: false
          shared-key: linux-debug
          save-if: false

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Check lash-runtime feature boundary
        run: |
          cargo check -p lash-runtime --no-default-features --locked
          cargo check -p lash-runtime --no-default-features --features testing --locked
          cargo test -p lash-runtime --no-default-features --locked
          count=$(cargo test -p lash-runtime --no-default-features --locked --lib -- --list | grep -c ': test$')
          [ "$count" -ge 130 ] || { echo "default-build lash-runtime tests regressed: $count"; exit 1; }

          if cargo tree -p lash-runtime -e normal --no-default-features --locked | grep -E 'lash-protocol-rlm|lash-lashlang-runtime|lashlang'; then
            echo "default-off lash-runtime pulled RLM/Lashlang dependencies"
            exit 1
          fi

          if cargo tree -p lash-runtime -e normal --locked | grep -E 'lash-protocol-rlm|lash-lashlang-runtime|lashlang'; then
            echo "default lash-runtime pulled RLM/Lashlang dependencies"
            exit 1
          fi

          if cargo tree -p lash-runtime -e normal --no-default-features --features testing --locked | grep -E 'lash-protocol-rlm|lash-lashlang-runtime|lashlang'; then
            echo "testing-only lash-runtime pulled RLM/Lashlang dependencies"
            exit 1
          fi

      - name: Report sccache stats
        if: always()
        run: sccache --show-stats

  # The workspace test suite, sharded by nextest partitions so it drops off the
  # critical path. Restore-only against the linux-debug cache the test-doc job
  # writes; sccache absorbs the workspace test-binary codegen that rust-cache's
  # read-only restore cannot save, sharing it across the shards and runs.
  # --no-fail-fast so one failure never hides the rest (the alpha.82 lesson).
  #
  # Four partitions, not three: with the old three, shard 3 ran 30% longer than
  # shard 1 (12m09s vs 9m20s) and set the wall time for the whole lane. nextest
  # partitions by count, which balances test *numbers* and not test *durations*,
  # so the residual skew is reduced by making each partition smaller rather than
  # by hand-assigning tests to shards.
  test-shard:
    name: Test shard ${{ matrix.shard }}/4
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Install Node for browser projection gates
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Same action as the writer. A `Swatinem/rust-cache` restore here read a
      # different cache backend than the `useblacksmith/rust-cache` save in
      # test-doc, so every shard logged `No cache found` and rebuilt the whole
      # dependency graph from scratch.
      - name: Restore cargo cache
        uses: useblacksmith/rust-cache@f53e7f127245d2a269b3d90879ccf259876842d5 # v3.0.1
        with:
          cache-bin: false
          shared-key: linux-debug
          save-if: false

      - name: Install protoc and nextest
        uses: ./.github/actions/install-tools
        with:
          tool: protoc,nextest

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      # Workspace-wide: every crate's tests run, not a hand-maintained crate
      # list. Live tests (Restate e2e, Postgres conformance without a database
      # URL) are #[ignore]d or self-skip. Partition count:i/4 splits execution
      # across the four shards.
      - name: Test workspace shard
        run: |
          # shellcheck disable=SC2086
          cargo nextest run --profile ci --workspace --locked ${LASH_CI_FEATURES} \
            --no-fail-fast --partition count:${{ matrix.shard }}/4

      - name: Report sccache stats
        if: always()
        run: sccache --show-stats

  lint:
    name: Lint
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 15
    # The transcript gate reads the `Transcript:` justification from the PR
    # body. A manually dispatched run — the recovery path when GitHub stops
    # delivering a branch's events — has no pull request in its payload, so the
    # gate asks the API for it instead. Job-level and read-only: no other job
    # needs it.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune origin "+refs/heads/*:refs/remotes/origin/*"
          git fetch \
            --force --tags origin
          git fetch \
            --no-tags origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Check and preview PR release notes
        if: github.event_name == 'pull_request'
        run: |
          merge_base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          python3 scripts/release_notes.py check-pr \
            --range "${merge_base}..HEAD" \
            --summary "$GITHUB_STEP_SUMMARY"

      # Every event compares against the base its own tree actually sits on.
      #
      # PRs compare with their target branch's merge-base. Main pushes compare
      # with HEAD~1 so the landed tree is independently rechecked; manual
      # workflow dispatches have no meaningful base and intentionally skip it.
      # A merge-queue entry is neither: its head is a queue commit carrying one
      # or more PRs on top of the base the queue chose, so HEAD~1 would check
      # only the last commit of a multi-commit PR — passing vacuously when the
      # change is earlier, and failing falsely when the bump is earlier. The
      # queue states the base it built on, so use it.
      # The PR guarantee requires a current merge ref, enforced by an up-to-date
      # branch rule or merge queue; a stale merge ref has a stale merge-base.
      - name: Check versioned surface bumps
        if: github.event_name != 'workflow_dispatch'
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)"
          elif [[ "$GITHUB_EVENT_NAME" == "merge_group" ]]; then
            base="$MERGE_GROUP_BASE_SHA"
            [ -n "$base" ] || { echo "merge_group event carried no base_sha"; exit 1; }
          else
            base="HEAD~1"
          fi
          python3 scripts/check_version_bumps.py --base "$base"

      # A service-backed suite that skips itself reports green having compared
      # nothing. This pins both mechanisms that stop it: the LASH_REQUIRE_*
      # flags that turn a missing service into a failure, and the
      # --run-ignored/--include-ignored opt-in that the cross-backend
      # differential's `#[ignore]`d tests need in order to run at all.
      - name: Pin service gates
        run: python3 scripts/check_service_gate_pinning.py

      # GitHub rejects some workflow files that plain YAML parsing accepts
      # (e.g. expressions in contexts where they are not allowed); actionlint
      # validates against the real workflow schema. The release binary is
      # pinned by version and by the sha256 from the upstream release
      # checksums asset.
      - name: Lint GitHub workflows
        run: |
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.10/actionlint_1.7.10_linux_amd64.tar.gz"
          echo "f4c76b71db5755a713e6055cbb0857ed07e103e028bda117817660ebadb4386f  ${RUNNER_TEMP}/actionlint.tar.gz" | sha256sum -c
          tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -no-color

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          components: clippy, rustfmt


      - name: Restore cargo cache
        uses: useblacksmith/rust-cache@f53e7f127245d2a269b3d90879ccf259876842d5 # v3.0.1
        with:
          cache-bin: false
          # The test-doc job is the sole writer of the shared linux-debug cache;
          # the lint job only reads it so clippy reuses the checked dependency
          # graph.
          shared-key: linux-debug
          save-if: false

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      # `cargo fmt --all --check` and the same `--all-targets` clippy the local
      # push gate runs, plus the two boundary guards that otherwise gate nothing.
      # The clippy feature set mirrors the test-doc workspace check so the
      # dependency graph resolves identically.
      - name: Check formatting
        run: |
          cargo fmt --all --check
          # include!d files escape cargo fmt's module walk. The scoped scan
          # finds every one under the scopes it covers, so a new include! is
          # checked the moment it exists rather than when someone remembers to
          # add it here.
          python3 scripts/check_included_file_formatting.py
          rustfmt --edition 2024 --check crates/lash-perf/src/runtime_perf/measurement/store_hardening.rs

      - name: Clippy (workspace, all targets)
        run: |
          # shellcheck disable=SC2086
          cargo clippy --workspace --all-targets --locked ${LASH_CI_FEATURES} -- -D warnings
          cargo clippy -p slack-clone --all-targets --features e2e --locked --no-deps -- -D warnings

      - name: Check Restate handler panic boundary
        run: python3 scripts/check-restate-handler-panics.py

      - name: Enforce durable transcript justification
        env:
          # Needed only by the dispatch path, where the justification has to be
          # read from the pull request rather than the event payload.
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check-transcript-diff.py --enforce

      - name: Check durable-read fixture schema declaration
        run: python3 scripts/check-durable-read-fixture-version.py

      - name: Check PostgreSQL payload-shape component version
        run: |
          python3 scripts/check-postgres-json-carrier-coverage.py
          python3 scripts/check-postgres-payload-shape-version.py

      # The recreation E2E's fixtures are pinned to the newest component
      # generation. Catch a stale pin here rather than one container gate later.
      - name: Check version-bump recreation fixtures
        run: python3 scripts/check_version_bump_fixtures.py

      # Duration history for the advisory trend signal (FIG-1532). Runtime
      # wall-clock ceilings are advisory (FIG-1385), which leaves a regression
      # that allocates nothing — added blocking I/O, lock contention, a stray
      # sleep — with no gate at all. The remedy is trend, not threshold: each
      # main run appends its per-scenario medians here and the harness warns
      # when a scenario has sat above its own trailing median for several
      # consecutive main runs.
      #
      # The store is this cache and nothing else: no new service, no secret,
      # and no write to a tracked branch. The key is unique per run *attempt*
      # — `gh run rerun` reuses `run_id`, so keying on it alone would make a
      # rerun collide with the entry its own first attempt wrote — and the
      # prefix restore-key picks the newest previous entry. Pull requests fall
      # back to main's cache automatically, which is exactly the read-only
      # advisory behaviour they should have. A missing or evicted cache
      # degrades to "insufficient data", never to a failure.
      #
      # Both steps are `continue-on-error` because neither is allowed to gate:
      # a cache-service outage or a key collision must cost the advisory
      # signal for one run, never the lint job. That is the same rule the trend
      # code itself follows (FIG-1385: this signal reports, it does not gate).
      # Reset the series wholesale — after a scenario is redefined, say — with
      # `gh cache delete` on the `perf-duration-history-quick-*` keys.
      - name: Restore runtime perf duration history
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .benchmarks/perf-history
          key: perf-duration-history-quick-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            perf-duration-history-quick-

      # Exercise every database-free runtime and Lashlang measurement path and
      # enforce the cheap budget/phase inventory before release.
      - name: Run performance harness smoke
        run: |
          python3 scripts/profile_runtime.py --profile quick --enforce-inventory --out .benchmarks/perf-smoke/runtime.json \
            --duration-history .benchmarks/perf-history/runtime-quick.jsonl
          python3 scripts/profile_lashlang.py --debug --iterations 10 --profile-iterations 10 --out .benchmarks/perf-smoke/lashlang.json

      # Only trunk extends the durable series. A pull request appends to its
      # restored copy for its own advisory table and throws it away.
      - name: Save runtime perf duration history
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .benchmarks/perf-history
          key: perf-duration-history-quick-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check core/UI boundary
        run: bash scripts/check-core-ui-boundary.sh

      - name: Check workflow graph model
        run: bash scripts/check-workflow-graph-model.sh

      - name: Check production file-size budget
        run: bash scripts/check-production-file-size.sh

  confidence-fast:
    name: Confidence fast (${{ matrix.shard }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        shard:
          - scenario-harnesses
          - fault-matrix
          - sim-unit-perf-guards
          - sim-generated
          - minimizer-fixtures
        include:
          - shard: scenario-harnesses
            runner: blacksmith-16vcpu-ubuntu-2404
          - shard: fault-matrix
            runner: blacksmith-16vcpu-ubuntu-2404
          - shard: sim-unit-perf-guards
            runner: blacksmith-8vcpu-ubuntu-2404
          - shard: sim-generated
            runner: blacksmith-8vcpu-ubuntu-2404
          - shard: minimizer-fixtures
            runner: blacksmith-16vcpu-ubuntu-2404

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain


      - name: Restore cargo cache
        uses: useblacksmith/rust-cache@f53e7f127245d2a269b3d90879ccf259876842d5 # v3.0.1
        with:
          cache-bin: false
          shared-key: linux-debug
          save-if: false

      - name: Install protoc and nextest
        uses: ./.github/actions/install-tools
        with:
          tool: protoc,nextest

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Run confidence fast shard
        run: bash scripts/confidence-gate.sh "fast:${{ matrix.shard }}"

      - name: Upload confidence fast shard artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: confidence-fast-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: target/confidence/fast/${{ matrix.shard }}
