name: CI

# GitHub natively skips push/PR runs when the head commit requests a CI skip,
# so no per-job guards are needed for that.
#
# CI validates pull requests and the resulting commits on the main trunk.
# Releases are separate: a maintainer manually dispatches release.yml for a
# green commit on main. Ordinary merges never tag or publish.

on:
  # Manual re-validation for when GitHub drops a push event (merge commit
  # d70ce7ea got zero check suites). Recovery-only: no inputs, never invoked
  # from another workflow, and unrelated to the removed pass-2 bump chain.
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LASH_CI_FEATURES: ""
  # Preserve the pre-worktree-isolation artifact tree consumed below.
  LASH_CONFIDENCE_OUT_DIR: ${{ github.workspace }}/target/confidence

jobs:
  # Sole writer of the shared linux-debug cache and the doctest gate. It builds
  # the superset (`cargo check --workspace --all-targets` plus the doctest
  # link) that every read-only debug-profile job restores. The nextest run is
  # sharded out to the test-shard matrix below.
  test-doc:
    name: Test docs + build cache
    runs-on: blacksmith-16vcpu-ubuntu-2404

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable


      - name: Restore cargo cache
        uses: useblacksmith/rust-cache@v3.0.1
        with:
          cache-bin: false
          # This job builds a superset of what the other debug-profile jobs
          # (test shards, Postgres store, Restate E2E, the distributed-workers
          # e2e workflow) need, so it is the sole writer of the shared cache.
          shared-key: linux-debug

      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Lint docs
        run: python3 scripts/lint_docs.py

      - name: Lint rustdoc
        run: bash scripts/check-rustdoc.sh

      - name: Check test quarantine metadata
        run: python3 scripts/check_test_quarantines.py

      - name: Test repository scripts
        run: |
          python3 scripts/test_check_api_example_coverage.py
          python3 scripts/test_check_core_public_member_docs.py
          python3 scripts/test_check_transcript_diff.py
          python3 scripts/test_release_version.py
          python3 scripts/test_publish_workspace.py
          python3 scripts/test_confidence_gate_ci_contract.py
          python3 scripts/test_release_notes.py
          bash scripts/test-worktree-gate-env.sh

      - name: Check public API example coverage
        run: python3 scripts/check_api_example_coverage.py

      # Compiles every target of every workspace crate — libs, bins, tests,
      # examples, and benches. This subsumes the old standalone checks for
      # docs-snippets and the runtime perf harness, which would otherwise only break post-merge. It also warms the
      # dependency graph the test-shard matrix restores.
      - name: Check workspace (all targets)
        run: |
          # shellcheck disable=SC2086
          cargo check --workspace --all-targets --locked ${LASH_CI_FEATURES}

      - name: Check lash-runtime feature boundary
        run: |
          cargo check -p lash-runtime --no-default-features --locked
          cargo check -p lash-runtime --no-default-features --features testing --locked

          if cargo tree -p lash-runtime -e normal --no-default-features --locked | grep -E 'lash-protocol-rlm|lash-lashlang-runtime|lashlang'; then
            echo "default-off lash-runtime pulled RLM/Lashlang dependencies"
            exit 1
          fi

          if cargo tree -p lash-runtime -e normal --locked | grep -E 'lash-protocol-rlm|lash-lashlang-runtime|lashlang'; then
            echo "default lash-runtime pulled RLM/Lashlang dependencies"
            exit 1
          fi

          if cargo tree -p lash-runtime -e normal --no-default-features --features testing --locked | grep -E 'lash-protocol-rlm|lash-lashlang-runtime|lashlang'; then
            echo "testing-only lash-runtime pulled RLM/Lashlang dependencies"
            exit 1
          fi

      # The workspace test run only reaches lash-remote-protocol's core
      # conversions because `lash` unifies the feature in. Run the crate on its
      # own so the coverage survives any change to who depends on what, and so
      # `cargo test -p lash-remote-protocol` stops being a misleading command.
      - name: Test lash-remote-protocol core conversions
        run: cargo test -p lash-remote-protocol --features core-conversions --locked

      # Provider test support is deliberately outside each crate's default
      # feature set. Keep the shared normalization contract explicit so a
      # production-safe default cannot silently reduce conformance coverage.
      - name: Test provider response-normalization conformance
        run: |
          cargo test -p lash-provider-openai --features testing --locked conformance
          cargo test -p lash-provider-anthropic --features testing --locked conformance
          cargo test -p lash-provider-google --features testing --locked conformance

      # nextest does not run doctests; keep them covered here (also builds the
      # workspace crates as rlibs, warming the shared cache for the readers).
      - name: Test workspace doctests
        run: |
          # shellcheck disable=SC2086
          cargo test --doc --workspace --locked ${LASH_CI_FEATURES}

  # The workspace test suite, sharded by nextest partitions so it drops off the
  # critical path. Restore-only against the linux-debug cache the test-doc job
  # writes; sccache absorbs the workspace test-binary codegen that rust-cache's
  # read-only restore cannot save, sharing it across the shards and runs.
  # --no-fail-fast so one failure never hides the rest (the alpha.82 lesson).

      - name: Report sccache stats
        if: always()
        run: sccache --show-stats

  test-shard:
    name: Test shard ${{ matrix.shard }}/3
    runs-on: blacksmith-16vcpu-ubuntu-2404

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node for browser projection gates
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          shared-key: linux-debug
          save-if: false

      - name: Install protoc and nextest
        uses: taiki-e/install-action@v2
        with:
          tool: protoc,nextest

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      # Workspace-wide: every crate's tests run, not a hand-maintained crate
      # list. Live tests (Restate e2e, Postgres conformance without a database
      # URL) are #[ignore]d or self-skip. Partition count:i/3 splits execution
      # across the three shards.
      - name: Test workspace shard
        run: |
          # shellcheck disable=SC2086
          cargo nextest run --workspace --locked ${LASH_CI_FEATURES} \
            --no-fail-fast --partition count:${{ matrix.shard }}/3

      - name: Report sccache stats
        if: always()
        run: sccache --show-stats

  lint:
    name: Lint
    runs-on: blacksmith-8vcpu-ubuntu-2404

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check and preview PR release notes
        if: github.event_name == 'pull_request'
        run: |
          merge_base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          python3 scripts/release_notes.py check-pr \
            --range "${merge_base}..HEAD" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt


      - name: Restore cargo cache
        uses: useblacksmith/rust-cache@v3.0.1
        with:
          cache-bin: false
          # The test-doc job is the sole writer of the shared linux-debug cache;
          # the lint job only reads it so clippy reuses the checked dependency
          # graph.
          shared-key: linux-debug
          save-if: false

      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      # `cargo fmt --all --check` and the same `--all-targets` clippy the local
      # push gate runs, plus the two boundary guards that otherwise gate nothing.
      # The clippy feature set mirrors the test-doc workspace check so the
      # dependency graph resolves identically.
      - name: Check formatting
        run: |
          cargo fmt --all --check
          # include!d files escape cargo fmt's module walk; list each one here.
          rustfmt --edition 2024 --check crates/lash-perf/src/runtime_perf/measurement/store_hardening.rs

      - name: Clippy (workspace, all targets)
        run: |
          # shellcheck disable=SC2086
          cargo clippy --workspace --all-targets --locked ${LASH_CI_FEATURES} -- -D warnings

      - name: Surface durable transcript changes
        run: python3 scripts/check-transcript-diff.py

      # Exercise every database-free runtime and Lashlang measurement path and
      # enforce the cheap budget/phase inventory before release.
      - name: Run performance harness smoke
        run: |
          python3 scripts/profile_runtime.py --profile quick --enforce-inventory --out .benchmarks/perf-smoke/runtime.json
          python3 scripts/profile_lashlang.py --debug --iterations 10 --profile-iterations 10 --out .benchmarks/perf-smoke/lashlang.json

      - name: Check core/UI boundary
        run: bash scripts/check-core-ui-boundary.sh

      - name: Check workflow graph model
        run: bash scripts/check-workflow-graph-model.sh

      - name: Check production file-size budget
        run: bash scripts/check-production-file-size.sh

  confidence-fast:
    name: Confidence fast (${{ matrix.shard }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        shard:
          - scenario-harnesses
          - fault-matrix
          - sim-unit-perf-guards
          - sim-generated
          - minimizer-fixtures
        include:
          - shard: scenario-harnesses
            runner: blacksmith-16vcpu-ubuntu-2404
          - shard: fault-matrix
            runner: blacksmith-16vcpu-ubuntu-2404
          - shard: sim-unit-perf-guards
            runner: blacksmith-16vcpu-ubuntu-2404
          - shard: sim-generated
            runner: blacksmith-16vcpu-ubuntu-2404
          - shard: minimizer-fixtures
            runner: blacksmith-16vcpu-ubuntu-2404

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable


      - name: Restore cargo cache
        uses: useblacksmith/rust-cache@v3.0.1
        with:
          cache-bin: false
          shared-key: linux-debug
          save-if: false

      - name: Install protoc and nextest
        uses: taiki-e/install-action@v2
        with:
          tool: protoc,nextest

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Run confidence fast shard
        run: bash scripts/confidence-gate.sh "fast:${{ matrix.shard }}"

      - name: Upload confidence fast shard artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: confidence-fast-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: target/confidence/fast/${{ matrix.shard }}
          if-no-files-found: warn

      - name: Report sccache stats
        if: always()
        run: sccache --show-stats

  confidence-fast-summary:
    name: Confidence fast summary
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: always()
    needs:
      - confidence-fast

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download confidence fast shard artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: confidence-fast-*-attempt-${{ github.run_attempt }}
          path: target/confidence/fast-download
          merge-multiple: false

      - name: Assemble confidence fast shard tree
        run: |
          rm -rf target/confidence/fast
          mkdir -p target/confidence/fast
          for shard in scenario-harnesses fault-matrix sim-unit-perf-guards sim-generated minimizer-fixtures; do
            cp -a "target/confidence/fast-download/confidence-fast-${shard}-attempt-${{ github.run_attempt }}" "target/confidence/fast/${shard}"
          done

      - name: Validate confidence fast summary
        run: bash scripts/confidence-gate.sh fast:summary

      - name: Upload confidence fast summary artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: confidence-fast-summary-attempt-${{ github.run_attempt }}
          path: target/confidence/fast
          if-no-files-found: error

  postgres-store:
    name: Test Postgres store (PG ${{ matrix.postgres }})
    runs-on: blacksmith-4vcpu-ubuntu-2404

    # The structural schema check at open (`SchemaProvisioning`/`SchemaCheck`)
    # compares the live catalog against a generated expectation artifact, so a
    # catalog attribute that renders differently on a major lash has not tested
    # would reject every host on that major with no remedy but a lash release.
    # 14 and 18 bracket the supported range — 18 is where NOT NULL became
    # `pg_constraint` rows, 14 is before `pg_index.indnullsnotdistinct` existed —
    # and the shape suite asserts all three produce the byte-identical artifact.
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "16", "18"]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: lash
          POSTGRES_PASSWORD: lash
          POSTGRES_DB: lash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lash -d lash"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo cache
        uses: useblacksmith/rust-cache@v3.0.1
        with:
          cache-bin: false
          shared-key: linux-debug
          save-if: false

      - name: Install protoc and nextest
        uses: taiki-e/install-action@v2
        with:
          tool: protoc,nextest

      # `lash-postgres-store`'s conformance tests run the backend-agnostic
      # RuntimePersistence / SessionStoreFactory / ProcessRegistry /
      # TriggerStore / LashlangArtifactStore suites against a real Postgres.
      # Required mode fails when the URL is unset, so missing CI configuration
      # cannot silently skip this lane. `connect()` applies the crate's
      # `schema.sql` artifact itself, so no separate migrate step. The same run
      # carries the `schema_shape` and `schema_drift` suites, which assert this
      # major produces the committed expectation artifact byte-for-byte and that
      # each seeded drift class is rejected by name.
      # The suites self-serialize on a shared in-process guard (they share one
      # database and reset() truncates all lash_* tables), so no --test-threads=1.
      # That guard is per-process, so this must stay `cargo test` — nextest's
      # process-per-test model would race the suites against each other.
      - name: Test Postgres store (conformance)
        run: cargo test -p lash-postgres-store --locked
        env:
          LASH_POSTGRES_DATABASE_URL: postgres://lash:lash@localhost:5432/lash
          LASH_REQUIRE_POSTGRES: "1"

      # The differential compares backend semantics, not catalog rendering, so it
      # runs once on the primary major instead of three times.
      - name: Test cross-backend store differential
        if: matrix.postgres == '16'
        run: >-
          cargo nextest run -p lash-sim
          --test cross_backend_store_differential
          --locked -j1 --no-capture
        env:
          LASH_POSTGRES_DATABASE_URL: postgres://lash:lash@localhost:5432/lash
          LASH_REQUIRE_POSTGRES: "1"
          LASH_CROSS_BACKEND_CASES: "4"

  s3-store:
    name: Test S3 store against MinIO
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo cache
        uses: useblacksmith/rust-cache@v3.0.1
        with:
          cache-bin: false
          shared-key: linux-debug
          save-if: false

      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - name: Start MinIO and create test bucket
        run: |
          docker run -d --name lash-ci-minio \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            -p 9000:9000 \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for attempt in $(seq 1 60); do
            if docker run --rm --network host minio/mc:RELEASE.2025-04-16T18-13-26Z \
              alias set ci http://127.0.0.1:9000 minioadmin minioadmin; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs lash-ci-minio
              exit 1
            fi
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh minio/mc:RELEASE.2025-04-16T18-13-26Z -c \
            'mc alias set ci http://127.0.0.1:9000 minioadmin minioadmin >/dev/null && mc mb --ignore-existing ci/lash-attachments'

      - name: Test S3 store conformance
        run: cargo test -p lash-s3-store --locked
        env:
          LASH_MINIO_ENDPOINT: http://127.0.0.1:9000
          LASH_REQUIRE_MINIO: "1"

      - name: Test attachment blob-store differential
        run: >-
          cargo test -p lash-sim
          --test cross_backend_store_differential
          --locked attachment_blob_store_differential_agrees -- --nocapture
        env:
          LASH_MINIO_ENDPOINT: http://127.0.0.1:9000
          LASH_REQUIRE_MINIO: "1"

      - name: Stop MinIO
        if: always()
        run: docker rm -f lash-ci-minio

  stack-budget:
    name: Stack budget
    runs-on: blacksmith-8vcpu-ubuntu-2404

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo cache
        uses: useblacksmith/rust-cache@v3.0.1
        with:
          cache-bin: false
          shared-key: linux-debug
          save-if: false

      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - name: Enforce stack budget
        run: bash scripts/ci-stack-budget.sh

  # Cross-target compile gate. Release-profile link coverage is split by
  # platform: x86_64 Linux is built by linux-release-cache, while cross
  # targets are type-checked here.
  cross-check:
    name: Check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            # No linking happens under `cargo check`, but build scripts still
            # cc-compile target C code, so the cross gcc is required.
            apt_packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
            apt_packages: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}


      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          shared-key: cross-${{ matrix.target }}

      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: scripts/ci-install-apt-packages.sh ${{ matrix.apt_packages }}

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install llvm

      - name: Check release target
        run: cargo check --locked --release --workspace --target ${{ matrix.target }}

  linux-release-cache:
    name: Build Linux release cache
    runs-on: blacksmith-16vcpu-ubuntu-2404
    # Warms the release-profile cache that release.yml and perf.yml restore on
    # main. A cache written by a pull-request run is scoped to that PR's merge
    # ref and can only be restored by re-runs of the same pull request, so on a
    # PR this spends the longest job on the board building a cache no other
    # workflow can read. Cache warming belongs on main.
    if: github.event_name != 'pull_request'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable


      - name: Restore cargo cache
        uses: useblacksmith/rust-cache@v3.0.1
        with:
          cache-bin: false
          # Sole writer of the linux release-profile cache; release.yml's
          # perf jobs restore it, so release-profile dependencies stay warm.
          shared-key: linux-release

      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache
        with:
          # perf.yml restores this same `linux-release` cache and does not use
          # this action, so linking differently here would refingerprint the
          # graph and make perf rebuild everything it restored.
          link-with-mold: "false"

      - name: Build release workspace
        run: cargo build --locked --release --workspace

      - name: Report sccache stats
        if: always()
        run: sccache --show-stats

  functional-e2e:
    name: Functional E2E (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-service
            recipe: agent-service-restate-e2e
            node: false
            runner: blacksmith-4vcpu-ubuntu-2404
          - name: agent-workbench
            recipe: agent-workbench-restate-e2e
            node: false
            runner: blacksmith-8vcpu-ubuntu-2404
          - name: workflow-graph-roundtrip
            recipe: workflow-graph-integration-verify
            node: true
            runner: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable


      - name: Restore cargo cache
        uses: useblacksmith/rust-cache@v3.0.1
        with:
          cache-bin: false
          shared-key: linux-debug
          save-if: false

      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - name: Install Node
        if: matrix.node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/workflow-graph-roundtrip/frontend/package-lock.json

      - name: Install just
        uses: extractions/setup-just@v2

      # Each recipe owns its dependencies and any container lifecycle, so the
      # matrix legs run independently without cross-job coordination.
      - name: Run example integration verification
        run: just ${{ matrix.recipe }}

  restate-postgres-workers:
    name: Restate + Postgres + MinIO Workers
    runs-on: blacksmith-16vcpu-ubuntu-2404
    # The harness has grown to 24 workflows + turn-control gates; 30 minutes
    # was hit on 2026-07-20 (job-timeout shows as 'cancelled').
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The e2e binaries are built on the host by the just recipe and
      # bind-mounted into the compose services, so the build reuses the
      # workspace debug cache that the test-doc job saves.
      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          shared-key: linux-debug
          save-if: false

      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - name: Run distributed backend E2E
        run: bash scripts/restate-postgres-workers-e2e.sh

      - name: Run graceful drain operator-flow E2E
        env:
          LASH_GRACEFUL_DRAIN_ARTIFACT_DIR: target/operator-flow-artifacts/graceful-drain
        run: bash scripts/graceful-drain-e2e.sh

      - name: Run request abandon operator-flow E2E
        env:
          LASH_REQUEST_ABANDON_ARTIFACT_DIR: target/operator-flow-artifacts/request-abandon
        run: bash scripts/request-abandon-e2e.sh

      - name: Upload operator-flow E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: operator-flow-e2e-attempt-${{ github.run_attempt }}
          path: target/operator-flow-artifacts
          if-no-files-found: warn
