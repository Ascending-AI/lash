name: CI

# GitHub natively skips push/PR runs when the head commit requests a CI skip,
# so no per-job guards are needed for that.
#
# CI validates pull requests and the resulting commits on the main trunk.
# Releases are separate: a maintainer manually dispatches release.yml for a
# green commit on main. Ordinary merges never tag or publish.

on:
  # Manual full-profile validation serves release certification and recovery
  # when GitHub drops an automatic event (merge commit d70ce7ea got zero check
  # suites). It has no inputs, is never invoked from another workflow, and is
  # unrelated to the removed pass-2 bump chain.
  #
  # Don't drive this recovery by hand: `scripts/ci_ensure_run.sh <branch>
  # <head-sha>` waits a bounded window for the run GitHub should have made,
  # dispatches this trigger exactly once if none arrives, then polls that run
  # to a conclusion. A dispatch run is NOT equivalent to the run it replaces —
  # the event-conditional `Check versioned surface bumps` step below does not
  # run, and it builds refs/heads/<branch> rather than the PR merge tree — so
  # the script exits 3, not 0, on a green dispatch. Callers opt in with
  # --accept-dispatch-run. Release certification instead relies on the full
  # dispatch profile and the exact-SHA gate in release.yml.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # The merge queue delivers a queued PR's required checks on its own event, from
  # its own `gh-readonly-queue/...` ref. Without this trigger a queue entry gets
  # no checks at all and the queue stalls.
  merge_group:
  push:
    branches:
      - main

# One live CI run per head branch, whatever event produced it — because a
# `pull_request` run carries `refs/pull/<n>/merge` while a manual recovery
# dispatch of the same commit carries `refs/heads/<branch>`, so keying on
# `github.ref` put them in different groups and ran the whole board twice over an
# identical tree. That duplication was the single largest line in the CI bill
# (54% of branch runner-minutes). A dispatch supersedes a pull-request run from
# the same branch instead of doubling it; the trigger supplies both the recovery
# path for a dropped event and the full profile required for release evidence.
#
# The key is not *only* the branch name, because a branch name is not unique
# across repositories: a fork's pull request from a branch literally named `main`
# would key into main's group and, being a pull-request run, would cancel a live
# trunk run — destroying the one guarantee below. So each event class that must
# never be collided into gets its own key, and those keys contain a colon, which
# `git check-ref-format` forbids in a ref name. That is what makes them
# unforgeable: no branch anyone can push, here or in a fork, can produce one.
#
# * `push` (main only) keys on `trunk:push`, so every newer automatic trunk run
#   cancels the older queued or active one. Cancellation is visible
#   supersession, not successful CI evidence; release.yml still requires its
#   own exact-target full-profile dispatch.
# * a dispatch on main keys on `trunk:dispatch`, so release certification for
#   the current main tip cannot cancel or be cancelled by automatic pushes. An
#   older main commit is certified from a temporary branch pinned to that exact
#   commit; its branch-named group is isolated from `trunk:push`. See the
#   release procedure in CONTRIBUTING.md.
# * a *fork* pull request keys on its PR number, which no branch name can
#   collide with. Same-repo pull requests keep the branch key, which is what lets
#   a dispatch dedupe with them.
# * a `merge_group` run has no `head_ref` and falls through to its own
#   `gh-readonly-queue/main/pr-<n>-<sha>` ref name, unique per queue entry: two
#   queue builds never share a group and never cancel each other. Their
#   cancellation belongs to the queue, which drops an entry's run when it
#   dequeues it, so `cancel-in-progress` stays false for the event.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'push' && 'trunk:push'
      || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') && 'trunk:dispatch'
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && format('fork-pr:{0}', github.event.pull_request.number)
      || github.head_ref
      || github.ref_name
    }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref_name != 'main') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LASH_CI_FEATURES: ""
  # The linker is a property of the caches this workflow shares, not of any
  # one job's step list. RUSTFLAGS is part of cargo's per-unit fingerprint, so
  # a job that restores `linux-debug` under a different RUSTFLAGS than the job
  # that wrote it logs "cache restored" and then cold-builds the whole graph —
  # which is exactly what the five container/E2E readers did while the flag
  # was appended by a setup action they never ran. Setting it here makes
  # every job in this workflow resolve the same value by default; the one
  # cache that must stay mold-free (`linux-release`, restored by perf.yml and
  # release.yml, which do not link through mold) overrides it at job scope.
  # Mold reduces link cost across the workspace test binaries.
  RUSTFLAGS: -C link-arg=-fuse-ld=mold
  # Preserve the pre-worktree-isolation artifact tree consumed below.
  LASH_CONFIDENCE_OUT_DIR: ${{ github.workspace }}/target/confidence

jobs:
  # Keep path classification cheap and conservative. Every event whose exact
  # diff is unavailable fails open to all expensive families.
  plan:
    name: Plan CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      confidence: ${{ steps.classify.outputs.confidence }}
      stores: ${{ steps.classify.outputs.stores }}
      functional_e2e: ${{ steps.classify.outputs.functional_e2e }}
      workers_e2e: ${{ steps.classify.outputs.workers_e2e }}
      rust_code: ${{ steps.classify.outputs.rust_code }}
      deps_config: ${{ steps.classify.outputs.deps_config }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      workflows_only: ${{ steps.classify.outputs.workflows_only }}
      e2e_relevant: ${{ steps.classify.outputs.e2e_relevant }}
      scripts_gates: ${{ steps.classify.outputs.scripts_gates }}
      identity_versions: ${{ steps.classify.outputs.identity_versions }}
      fail_open: ${{ steps.classify.outputs.fail_open }}
      reason: ${{ steps.classify.outputs.reason }}

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Classify exact diff
        id: classify
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CHECKOUT_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail

          fail_open() {
            python3 scripts/ci_plan.py fail-open --reason "$1" >> "${GITHUB_OUTPUT}"
            exit 0
          }

          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch)
              fail_open "workflow_dispatch has no exact triggering diff"
              ;;
            pull_request)
              base_sha="${PR_BASE_SHA}"
              ;;
            merge_group)
              base_sha="${MERGE_GROUP_BASE_SHA}"
              ;;
            push)
              base_sha="${BEFORE_SHA}"
              ;;
            *)
              fail_open "unsupported event ${GITHUB_EVENT_NAME}"
              ;;
          esac

          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            fail_open "event has no exact base commit"
          fi
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          if ! git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            fetch --no-tags --prune --depth=1 origin "${base_sha}"; then
            fail_open "base commit ${base_sha} could not be fetched"
          fi
          if ! git rev-parse --verify "${base_sha}^{commit}" >/dev/null 2>&1; then
            fail_open "base commit ${base_sha} is unavailable"
          fi
          if ! git diff --name-status --no-renames -z "${base_sha}" "${GITHUB_SHA}" > "${RUNNER_TEMP}/changed-paths"; then
            fail_open "exact diff ${base_sha}..${GITHUB_SHA} could not be computed"
          fi
          # The exact diff *content*, not just its paths: `identity_versions`
          # keys on a changed `const LASHLANG_SEMANTIC_HASH_VERSION`/
          # `const BYTECODE_FORMAT_VERSION` definition line, which a path list
          # cannot see. Context-free (`--unified=0`) keeps it to the changed
          # lines; a failure here falls open to the wide matrix.
          if ! git diff --unified=0 --no-color --no-renames "${base_sha}" "${GITHUB_SHA}" > "${RUNNER_TEMP}/exact-diff"; then
            fail_open "exact diff content ${base_sha}..${GITHUB_SHA} could not be computed"
          fi
          python3 scripts/ci_plan.py classify \
            --paths-file "${RUNNER_TEMP}/changed-paths" \
            --diff-file "${RUNNER_TEMP}/exact-diff" >> "${GITHUB_OUTPUT}"

      - name: Summarize plan
        env:
          PLAN_JSON: ${{ toJson(steps.classify.outputs) }}
        run: |
          {
            echo "## CI plan"
            echo
            echo '```json'
            jq . <<< "${PLAN_JSON}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  facade-only-examples:
    name: Facade-only examples
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Check example facade imports
        run: python3 scripts/check_facade_only_examples.py

  # Separate matrix jobs run the workspace check/doctests and API seal in
  # parallel. The matrix result remains the same required test-doc context.
  test-doc:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Check workspace + doctests
            lane: workspace
            target: target
          - name: Seal-test the API surface
            lane: seal
            target: target-seal
    env:
      # trybuild derives its fixture/output tree from Cargo's target directory.
      # The seal job has no shared writable output with any other CI job.
      CARGO_TARGET_DIR: ${{ github.workspace }}/${{ matrix.target }}

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain


      - name: Restore cargo cache
        if: matrix.lane == 'workspace'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: linux-debug

      - name: Restore isolated seal dependencies
        if: matrix.lane == 'seal'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: linux-seal
          workspaces: . -> target-seal

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Install mold
        uses: ./.github/actions/setup-mold

      - name: Check workspace (all targets)
        if: matrix.lane == 'workspace'
        run: |
          # shellcheck disable=SC2086
          cargo check --workspace --all-targets --locked ${LASH_CI_FEATURES}

      # nextest does not run doctests; keep the full workspace gate.
      - name: Test workspace doctests
        if: matrix.lane == 'workspace'
        run: |
          # shellcheck disable=SC2086
          cargo test --doc --workspace --locked ${LASH_CI_FEATURES}

      # Every existing compile-fail/pass fixture remains in the ui binary.
      # Keep workspace feature unification and the original cargo test command.
      - name: Seal-test the API surface
        if: matrix.lane == 'seal'
        run: |
          # shellcheck disable=SC2086
          cargo test --workspace --locked ${LASH_CI_FEATURES} --test ui

      - name: Report cache disk capacity
        if: always()
        run: bash scripts/ci/report-cache.sh

  # Python-only repository gates. These were serial steps of test-doc, where
  # they sat behind twelve minutes of compilation for no reason: nothing here
  # depends on the workspace check.
  repo-gates:
    name: Repository gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Install mold
        uses: ./.github/actions/setup-mold

      - name: Lint orchestrating tools
        run: python3 scripts/lint_orchestrating_tools.py

      - name: Check test quarantine metadata
        run: python3 scripts/check_test_quarantines.py

      - name: Check judged build geometry
        run: python3 scripts/check_judged_build_geometry.py

      - name: Test repository scripts
        run: |
          python3 scripts/test_api_surface.py
          python3 scripts/test_check_facade_external_types.py
          python3 scripts/test_check_facade_only_examples.py
          python3 scripts/test_check_feature_coverage.py
          python3 scripts/check_feature_coverage.py check
          python3 scripts/test_check_postgres_json_carrier_coverage.py
          python3 scripts/test_check_postgres_payload_shape_version.py
          python3 scripts/test_check_service_gate_pinning.py
          python3 scripts/test_check_version_bumps.py
          python3 scripts/test_fast_test.py
          python3 scripts/test_check_version_bump_fixtures.py
          python3 scripts/test_check_transcript_diff.py
          python3 scripts/test_gate_scope.py
          python3 scripts/test_main_ci_policy.py
          python3 scripts/test_release_version.py
          python3 scripts/test_publish_workspace.py
          python3 scripts/test_production_file_size.py
          python3 scripts/test_confidence_gate_ci_contract.py
          python3 scripts/test_slack_clone_full_host_e2e_contract.py
          python3 scripts/test_slack_clone_live_model_e2e_contract.py
          python3 scripts/test_judged_runbook_matrix.py
          python3 scripts/test_check_judged_build_geometry.py
          python3 scripts/test_restate_workers_e2e_coverage.py
          python3 scripts/test_rustdoc_json_cache.py
          python3 scripts/test_runtime_perf_percentiles.py
          python3 scripts/test_perfreport.py
          python3 scripts/test_ci_plan.py
          python3 scripts/test_ci_plan_hygiene.py
          python3 scripts/test_ci_workspace_cache.py
          python3 scripts/test_ci_artifact_provenance.py
          bash scripts/test-worktree-gate-env.sh
          bash scripts/test-dev-script-process-identity.sh
          bash scripts/test-ci-reclaim-disk.sh

  # An unused dependency is a real cost: it enlarges the locked graph that
  # cargo-deny audits, the surface `Cargo.lock` churns on, and every build. The
  # check is source-level (cargo-shear parses the crates' `use` graph), so it is
  # cheap and needs no compiled artifacts.
  unused-deps:
    name: Unused dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.rust == 'true'

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      # The workflow-level RUSTFLAGS link through mold, so even a host-tool
      # `cargo install` needs the linker present.
      - name: Install mold
        uses: ./.github/actions/setup-mold

      - name: Install cargo-shear
        run: cargo install cargo-shear --locked --version 1.13.4

      - name: Check for unused dependencies
        run: cargo shear

  # The generated facade contract gates build rustdoc JSON for the facade crate,
  # independently of the workspace build. They run only on the full profile.
  facade-gates:
    name: Facade API contract gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: plan
    # Full-profile only (2026-08-26 ruling): the surface snapshot and related
    # facade gates certify docs/ artifacts, not the build, so they
    # run on workflow_dispatch — which the release gate requires on the
    # release SHA — instead of spending a rustdoc compile on every PR.
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.rust == 'true'

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: linux-debug
          save-if: false

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Install mold
        uses: ./.github/actions/setup-mold

      - name: Check facade external types
        run: python3 scripts/check_facade_external_types.py

      # Same rustdoc graph and cache geometry as the coverage gate, so it
      # rides in this job instead of paying a second rustdoc build.
      - name: Check public API surface snapshot
        run: python3 scripts/api_surface.py check

      - name: Report cache disk capacity
        if: always()
        run: bash scripts/ci/report-cache.sh

  # A dependency workspace's [patch] table is invisible to its consumers.
  # Resolve lashlang from this checkout as a Git dependency in a fresh external
  # crate so every dependency needed by downstream users is carried explicitly.
  lashlang-git-consumer:
    name: Lashlang Git consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: plan
    # Deferred on pull requests per the 2026-08-25 CI-scope ruling, but required
    # on every merge group -- including docs-only ones. This compile
    # configuration is resolved nowhere else, and the change classifier
    # certifies the diff, not the health of the base the group is built over
    # (FIG-2854).
    if: github.event_name == 'merge_group' || (github.event_name != 'pull_request' && needs.plan.outputs.rust == 'true')

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: queue-lashlang-git-consumer
          workspaces: . -> target/lashlang-git-consumer
          save-if: ${{ github.event_name != 'merge_group' }}

      - name: Install mold
        uses: ./.github/actions/setup-mold

      - name: Check lashlang Git consumer without patch mirror
        run: bash scripts/check-lashlang-git-consumer.sh "${GITHUB_SHA}"

      - name: Report cache disk capacity
        if: always()
        run: bash scripts/ci/report-cache.sh

  # Feature-set coverage the workspace check cannot reach. The executable
  # registry owns every declared workspace feature, resolves ON/OFF graphs in
  # normal dependency context, and runs the exact package checks for this lane.
  # Split out of test-doc: these resolve their own feature graphs, so they
  # neither reuse nor warm anything the workspace check produces.
  package-feature-checks:
    name: Package feature check (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    # Deferred on pull requests per the 2026-08-25 CI-scope ruling, but required
    # on every merge group -- including docs-only ones. Every matrix leg keeps
    # one exact package feature graph independently visible and cacheable.
    if: github.event_name == 'merge_group' || (github.event_name != 'pull_request' && needs.plan.outputs.rust == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: sansio-schema-validation
            command: python3 scripts/check_feature_coverage.py run sansio-schema-validation
          - lane: otel-feature-chain
            command: python3 scripts/check_feature_coverage.py run otel-feature-chain
          - lane: core-internal-features
            command: python3 scripts/check_feature_coverage.py run core-internal-features
          - lane: language-testing-features
            command: python3 scripts/check_feature_coverage.py run language-testing-features
          - lane: llm-transport-features
            command: python3 scripts/check_feature_coverage.py run llm-transport-features
          - lane: store-features
            command: python3 scripts/check_feature_coverage.py run store-features
          - lane: runtime-features
            command: python3 scripts/check_feature_coverage.py run runtime-features
          - lane: protocol-rlm-testing
            command: python3 scripts/check_feature_coverage.py run protocol-rlm-testing
          - lane: remote-protocol-conversions
            command: python3 scripts/check_feature_coverage.py run remote-protocol-conversions
          - lane: tool-lashlang-proxies
            command: python3 scripts/check_feature_coverage.py run tool-lashlang-proxies
          - lane: provider-testing-features
            command: python3 scripts/check_feature_coverage.py run provider-testing-features
          - lane: perf-dhat-heap
            command: python3 scripts/check_feature_coverage.py run perf-dhat-heap
          - lane: regress-stable-features
            command: python3 scripts/check_feature_coverage.py run regress-stable-features
          - lane: host-features
            command: python3 scripts/check_feature_coverage.py run host-features

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      # Main/dispatch runs write dependency outputs for this exact graph. Queue
      # refs restore the compatible main cache but never publish ephemeral
      # queue-scoped entries.
      - name: Restore package feature cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: queue-package-${{ matrix.lane }}
          save-if: ${{ github.event_name != 'merge_group' }}

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Install mold
        uses: ./.github/actions/setup-mold

      - name: Run exact package feature graph
        run: ${{ matrix.command }}

      - name: Report cache disk capacity
        if: always()
        run: bash scripts/ci/report-cache.sh

  # The default-off boundary lane: lash-runtime without its default features
  # compiles, tests, and pulls no RLM/Lashlang dependency.
  runtime-feature-boundary:
    name: Runtime feature boundary (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: plan
    # Deferred on pull requests per the 2026-08-25 CI-scope ruling, but required
    # on every merge group -- including docs-only ones. The independent feature
    # resolutions run concurrently; fail-fast stays off so one failure never
    # suppresses evidence from another required graph.
    if: github.event_name == 'merge_group' || (github.event_name != 'pull_request' && needs.plan.outputs.rust == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: default-off-check
            command: cargo check -p lash-runtime --no-default-features --locked
          - lane: testing-check
            command: cargo check -p lash-runtime --no-default-features --features testing --locked
          - lane: default-off-tests
            command: |
              cargo test -p lash-runtime --no-default-features --locked
              count=$(cargo test -p lash-runtime --no-default-features --locked --lib -- --list | grep -c ': test$')
              [ "$count" -ge 130 ] || { echo "default-build lash-runtime tests regressed: $count"; exit 1; }
          - lane: dependency-boundary
            command: |
              if cargo tree -p lash-runtime -e normal --no-default-features --locked | grep -E 'lash-internal-protocol-rlm|lash-internal-lashlang-runtime|lash-internal-lashlang'; then
                echo "default-off lash-runtime pulled RLM/Lashlang dependencies"
                exit 1
              fi
              if cargo tree -p lash-runtime -e normal --locked | grep -E 'lash-internal-protocol-rlm|lash-internal-lashlang-runtime|lash-internal-lashlang'; then
                echo "default lash-runtime pulled RLM/Lashlang dependencies"
                exit 1
              fi
              if cargo tree -p lash-runtime -e normal --no-default-features --features testing --locked | grep -E 'lash-internal-protocol-rlm|lash-internal-lashlang-runtime|lash-internal-lashlang'; then
                echo "testing-only lash-runtime pulled RLM/Lashlang dependencies"
                exit 1
              fi

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Restore runtime feature cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: queue-runtime-${{ matrix.lane }}
          save-if: ${{ github.event_name != 'merge_group' }}

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Install mold
        uses: ./.github/actions/setup-mold

      - name: Run exact runtime feature graph
        env:
          FEATURE_GRAPH_COMMAND: ${{ matrix.command }}
        run: bash -euo pipefail -c "${FEATURE_GRAPH_COMMAND}"

      - name: Report cache disk capacity
        if: always()
        run: bash scripts/ci/report-cache.sh
  # Build and execute the workspace suite on one runner. The suite itself is
  # short enough that shipping a multi-gigabyte archive to four fresh runners
  # costs more than running every test here. Service-backed jobs retain their
  # independent feature graphs and services.
  workspace-tests:
    name: Test workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config gc.auto 0
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force "${GITHUB_SHA}"

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Install Node for browser projection gates
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Report runner capacity
        run: |
          echo "Logical CPUs: $(nproc)"
          free -h
          df -h /

      - name: Resolve workspace test cache inputs
        id: workspace-test-cache-inputs
        run: |
          compiler_digest="$(rustc -vV | sha256sum | cut -d ' ' -f 1)"
          settings_digest="$(printf '%s\0%s\0' "${RUSTFLAGS}" "${LASH_CI_FEATURES}" | sha256sum | cut -d ' ' -f 1)"
          source_digest="$(python3 scripts/ci_workspace_cache.py digest)"
          {
            echo "compiler=${compiler_digest}"
            echo "settings=${settings_digest}"
            echo "source=${source_digest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: linux-tests
          # Workspace outputs have their own source-aware cache below.
          cache-targets: false

      # Keep the primary key source-aware so an unchanged tree gets an exact
      # hit. The compatibility prefix deliberately stops before the source
      # hash: Cargo validates restored fingerprints and incrementally rebuilds
      # a changed crate, while dependency/toolchain changes cannot cross it.
      # Only build-bearing target subtrees are retained, and cache service
      # failures never replace the test result.
      - name: Restore workspace test build outputs
        id: workspace-test-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
            target/debug/examples
            target/workspace-test-cache/source-mtimes.json
          key: >-
            workspace-tests-v2-${{ runner.os }}-${{ runner.arch }}-${{
            steps.workspace-test-cache-inputs.outputs.compiler }}-${{
            steps.workspace-test-cache-inputs.outputs.settings }}-${{
            hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml', '.cargo/**', 'rust-toolchain*', '.github/actions/rust-toolchain/**', '.github/actions/setup-mold/**', '.github/actions/install-tools/**')
            }}-${{ steps.workspace-test-cache-inputs.outputs.source }}
          restore-keys: |
            workspace-tests-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.workspace-test-cache-inputs.outputs.compiler }}-${{ steps.workspace-test-cache-inputs.outputs.settings }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml', '.cargo/**', 'rust-toolchain*', '.github/actions/rust-toolchain/**', '.github/actions/setup-mold/**', '.github/actions/install-tools/**') }}-

      - name: Restore unchanged source mtimes
        continue-on-error: true
        run: python3 scripts/ci_workspace_cache.py restore target/workspace-test-cache/source-mtimes.json

      - name: Snapshot source mtimes
        run: python3 scripts/ci_workspace_cache.py snapshot target/workspace-test-cache/source-mtimes.json

      - name: Install protoc and nextest
        uses: ./.github/actions/install-tools
        with:
          tool: protoc,nextest

      - name: Install mold
        uses: ./.github/actions/setup-mold

      # Workspace-wide: every crate's tests run, not a hand-maintained crate
      # list. Live tests (Restate e2e, Postgres conformance without a database
      # URL) are #[ignore]d or self-skip. `profile.ci` excludes the multi-minute
      # heavy suites run by heavy-tests below and the trybuild ui binary run by
      # test-doc's seal step. Keep the recovery helpers in this target because
      # their certification fixtures are dev-only.
      - name: Test workspace
        run: |
          # shellcheck disable=SC2086
          cargo build --workspace --locked ${LASH_CI_FEATURES} \
            --example sqlite-await-event-helper --example postgres-await-event-helper
          # shellcheck disable=SC2086
          cargo nextest run --profile ci --workspace --locked ${LASH_CI_FEATURES} \
            --no-fail-fast

      - name: Save workspace test build outputs
        if: success() && steps.workspace-test-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
            target/debug/examples
            target/workspace-test-cache/source-mtimes.json
          key: >-
            workspace-tests-v2-${{ runner.os }}-${{ runner.arch }}-${{
            steps.workspace-test-cache-inputs.outputs.compiler }}-${{
            steps.workspace-test-cache-inputs.outputs.settings }}-${{
            hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml', '.cargo/**', 'rust-toolchain*', '.github/actions/rust-toolchain/**', '.github/actions/setup-mold/**', '.github/actions/install-tools/**')
            }}-${{ steps.workspace-test-cache-inputs.outputs.source }}

      - name: Report cache disk capacity
        if: always()
        run: bash scripts/ci/report-cache.sh

  # The heavy suites excluded from the per-push workspace job by `profile.ci`'s
  # default-filter (see .config/nextest.toml): the fault-matrix chunk tests,
  # which each fork real `cargo` invocations and run 3-9 minutes serially, and
  # the lash-sim runner/minimizer fixture cases. Deferred to trunk runs
  # (push/dispatch) like the other trunk-only jobs: any one of these tests set
  # the wall-clock of the ordinary suite, and their behavior almost never varies
  # with a PR's diff.
  heavy-tests:
    name: Test heavy suites
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: plan
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group' && needs.plan.outputs.rust == 'true'

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Install Node for browser projection gates
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: linux-debug
          save-if: false

      - name: Install protoc and nextest
        uses: ./.github/actions/install-tools
        with:
          tool: protoc,nextest

      - name: Install mold
        uses: ./.github/actions/setup-mold

      - name: Test heavy suites
        run: |
          # shellcheck disable=SC2086
          cargo nextest run --profile ci-heavy --workspace --locked ${LASH_CI_FEATURES} \
            --no-fail-fast

      - name: Report cache disk capacity
        if: always()
        run: bash scripts/ci/report-cache.sh

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The transcript gate reads the `Transcript:` justification from the PR
    # body. A manually dispatched run — the recovery path when GitHub stops
    # delivering a branch's events — has no pull request in its payload, so the
    # gate asks the API for it instead. Job-level and read-only: no other job
    # needs it.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune origin "+refs/heads/*:refs/remotes/origin/*"
          git fetch \
            --force --tags origin
          git fetch \
            --no-tags origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      # Every event compares against the base its own tree actually sits on.
      #
      # PRs compare with their merge-base against main, not their target
      # branch: main is the sole long-lived branch, and a stacked PR whose
      # target is a sibling layer would otherwise be judged against a tree
      # that already carries the window's one version bump. Main pushes compare
      # with HEAD~1 so the landed tree is independently rechecked; manual
      # workflow dispatches have no meaningful base and intentionally skip it.
      # A merge-queue entry is neither: its head is a queue commit carrying one
      # or more PRs on top of the base the queue chose, so HEAD~1 would check
      # only the last commit of a multi-commit PR — passing vacuously when the
      # change is earlier, and failing falsely when the bump is earlier. The
      # queue states the base it built on, so use it.
      # The PR guarantee requires a current merge ref, enforced by an up-to-date
      # branch rule or merge queue; a stale merge ref has a stale merge-base.
      # Manual recovery runs skip this gate and immediately emit a warning summary
      # so their green conclusion cannot be mistaken for version-surface proof.
      - name: Check versioned surface bumps
        if: github.event_name != 'workflow_dispatch'
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$(git merge-base origin/main HEAD)"
          elif [[ "$GITHUB_EVENT_NAME" == "merge_group" ]]; then
            base="$MERGE_GROUP_BASE_SHA"
            [ -n "$base" ] || { echo "merge_group event carried no base_sha"; exit 1; }
          else
            base="HEAD~1"
          fi
          python3 scripts/check_version_bumps.py --base "$base"

      - name: Explain skipped versioned surface bump gate
        if: github.event_name == 'workflow_dispatch'
        run: bash scripts/ci/report-manual-dispatch-skips.sh

      # A service-backed suite that skips itself reports green having compared
      # nothing. This pins both mechanisms that stop it: the LASH_REQUIRE_*
      # flags that turn a missing service into a failure, and the
      # --run-ignored/--include-ignored opt-in that the cross-backend
      # differential's `#[ignore]`d tests need in order to run at all.
      - name: Pin service gates
        run: python3 scripts/check_service_gate_pinning.py

      # GitHub rejects some workflow files that plain YAML parsing accepts
      # (e.g. expressions in contexts where they are not allowed); actionlint
      # validates against the real workflow schema. The release binary is
      # pinned by version and by the sha256 from the upstream release
      # checksums asset.
      - name: Lint GitHub workflows
        run: |
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.10/actionlint_1.7.10_linux_amd64.tar.gz"
          echo "f4c76b71db5755a713e6055cbb0857ed07e103e028bda117817660ebadb4386f  ${RUNNER_TEMP}/actionlint.tar.gz" | sha256sum -c
          tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -no-color

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          components: clippy, rustfmt


      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          # The test-doc job is the sole writer of the shared linux-debug cache;
          # the lint job only reads it so clippy reuses the checked dependency
          # graph.
          shared-key: linux-debug
          save-if: false

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Install mold
        uses: ./.github/actions/setup-mold

      # `cargo fmt --all --check` and the same `--all-targets` clippy the local
      # push gate runs, plus the two boundary guards that otherwise gate nothing.
      # The clippy feature set mirrors the test-doc workspace check so the
      # dependency graph resolves identically.
      - name: Check formatting
        run: |
          cargo fmt --all --check
          # include!d files escape cargo fmt's module walk. The scoped scan
          # finds every one under the scopes it covers, so a new include! is
          # checked the moment it exists rather than when someone remembers to
          # add it here.
          python3 scripts/check_included_file_formatting.py

      - name: Clippy (workspace, all targets)
        run: |
          # shellcheck disable=SC2086
          cargo clippy --workspace --all-targets --locked ${LASH_CI_FEATURES} -- -D warnings
          cargo clippy -p slack-clone --all-targets --features e2e --locked --no-deps -- -D warnings

      - name: Check Restate handler panic boundary
        run: python3 scripts/check-restate-handler-panics.py

      - name: Enforce durable transcript justification
        env:
          # Needed only by the dispatch path, where the justification has to be
          # read from the pull request rather than the event payload.
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check-transcript-diff.py --enforce

      - name: Check PostgreSQL payload-shape component version
        run: |
          python3 scripts/check-postgres-json-carrier-coverage.py
          python3 scripts/check-postgres-payload-shape-version.py

      # The recreation E2E's fixtures are pinned to the newest component
      # generation. Catch a stale pin here rather than one container gate later.
      - name: Check version-bump recreation fixtures
        run: python3 scripts/check_version_bump_fixtures.py

      # Duration history for the advisory trend signal (FIG-1532). Runtime
      # wall-clock ceilings are advisory (FIG-1385), which leaves a regression
      # that allocates nothing — added blocking I/O, lock contention, a stray
      # sleep — with no gate at all. The remedy is trend, not threshold: each
      # main run appends its per-scenario medians here and the harness warns
      # when a scenario has sat above its own trailing median for several
      # consecutive main runs.
      #
      # The store is this cache and nothing else: no new service, no secret,
      # and no write to a tracked branch. The key is unique per run *attempt*
      # — `gh run rerun` reuses `run_id`, so keying on it alone would make a
      # rerun collide with the entry its own first attempt wrote — and the
      # prefix restore-key picks the newest previous entry. Only main-push runs
      # consume and extend this advisory series. A missing or evicted cache
      # degrades to "insufficient data", never to a failure.
      #
      # Both steps are `continue-on-error` because neither is allowed to gate:
      # a cache-service outage or a key collision must cost the advisory
      # signal for one run, never the lint job. That is the same rule the trend
      # code itself follows (FIG-1385: this signal reports, it does not gate).
      # Reset the series wholesale — after a scenario is redefined, say — with
      # `gh cache delete` on the `perf-duration-history-quick-*` keys.
      - name: Restore runtime perf duration history
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .benchmarks/perf-history
          key: perf-duration-history-quick-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            perf-duration-history-quick-

      # Exercise every database-free runtime and Lashlang measurement path and
      # enforce the cheap budget/phase inventory before release.
      - name: Run performance harness smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 scripts/profile_runtime.py --profile quick --smoke --enforce-inventory --out .benchmarks/perf-smoke/runtime.json \
            --duration-history .benchmarks/perf-history/runtime-quick.jsonl
          python3 scripts/profile_lashlang.py --debug --iterations 10 --profile-iterations 10 --out .benchmarks/perf-smoke/lashlang.json

      # Only trunk extends the durable series.
      - name: Save runtime perf duration history
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .benchmarks/perf-history
          key: perf-duration-history-quick-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check core/UI boundary
        run: bash scripts/check-core-ui-boundary.sh

      - name: Check substrate boundary
        run: bash scripts/check-substrate-boundary.sh

      - name: Check workflow graph model
        run: bash scripts/check-workflow-graph-model.sh

      - name: Check production file-size budget
        run: bash scripts/check-production-file-size.sh

  confidence-fast:
    name: Confidence fast (${{ matrix.shard }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    needs: plan
    # Deferred to trunk runs (push/dispatch) per the 2026-08-25 CI-scope
    # ruling; reassess after the FIG-2169 test-prune sweep.
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group' && needs.plan.outputs.confidence == 'true'

    strategy:
      fail-fast: false
      matrix:
        shard:
          - scenario-harnesses
          - fault-matrix
          - sim-unit-perf-guards
          - sim-generated
          - minimizer-fixtures
        include:
          - shard: scenario-harnesses
            runner: ubuntu-24.04
          - shard: fault-matrix
            runner: ubuntu-24.04
          - shard: sim-unit-perf-guards
            runner: ubuntu-24.04
          - shard: sim-generated
            runner: ubuntu-24.04
          - shard: minimizer-fixtures
            runner: ubuntu-24.04

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
