  restate-postgres-workers:
    name: Restate + Postgres + MinIO Workers (segment ${{ matrix.segment }})
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:workers'))
