            node: false
            artifact: none
            browser: false
            runner: ubuntu-24.04
          - name: effect-group-conformance
            recipe: effect-group-conformance-e2e
            node: false
            artifact: none
            browser: false
            runner: ubuntu-24.04
          - name: workflow-graph-roundtrip
            recipe: workflow-graph-integration-verify
            node: true
            artifact: none
            browser: false
            runner: ubuntu-24.04
          - name: version-bump-recreation
            recipe: version-bump-recreation-e2e
            node: false
            artifact: version-bump-recreation
            browser: false
            runner: ubuntu-24.04
          - name: session-lease-triage
            recipe: session-lease-triage-e2e
            node: false
            artifact: session-lease-triage
            browser: false
            runner: ubuntu-24.04
          - name: slack-clone-full-host
            recipe: slack-clone-full-host-e2e
            node: false
            artifact: none
            browser: true
            runner: ubuntu-24.04

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain


      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: linux-debug
          save-if: false

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      # Provides the linker the workflow-level RUSTFLAGS names. This job
      # restores the `linux-debug` cache and installs its linker directly.
      - name: Install mold
        uses: ./.github/actions/setup-mold

      - name: Install Node
        if: matrix.node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/workflow-graph-roundtrip/frontend/package-lock.json

      - name: Install uv
        if: matrix.browser
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install Chromium for Playwright
        if: matrix.browser
        run: uv run --with playwright==1.62.0 playwright install --with-deps chromium

      # The repo-local installer uses checksum-pinned release archives instead
      # of the GitHub releases API; merge-queue trains fan out enough jobs that
      # the API-listing path (extractions/setup-just) hit rate limits and
      # ejected whole trains.
      - name: Install just
        uses: ./.github/actions/install-tools
        with:
          tool: just

      - name: Run functional E2E
        env:
          LASH_PROCESS_OPERATIONS_ARTIFACT_DIR: target/functional-e2e-artifacts/process-operations
          LASH_VERSION_BUMP_ARTIFACT_DIR: target/functional-e2e-artifacts/version-bump-recreation
          LASH_SESSION_LEASE_ARTIFACT_DIR: target/functional-e2e-artifacts/session-lease-triage
          LASH_SLACK_CLONE_E2E_ARTIFACT_DIR: ${{ matrix.browser && format('{0}/slack-clone-full-host-e2e', runner.temp) || '' }}
        run: just ${{ matrix.recipe }}

      - name: Upload functional E2E failure artifacts
        if: failure() && matrix.artifact != 'none'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: functional-e2e-${{ matrix.artifact }}-attempt-${{ github.run_attempt }}
          path: target/functional-e2e-artifacts/${{ matrix.artifact }}
          if-no-files-found: warn

      - name: Upload slack-clone full-host E2E failure artifacts
        if: failure() && matrix.browser
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slack-clone-full-host-e2e-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/slack-clone-full-host-e2e
          if-no-files-found: warn

  functional-e2e-process-operations:
    name: Functional E2E (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    needs: [plan, worker-artifacts]
    # Deferred to trunk runs (push/dispatch) per the 2026-08-25 CI-scope
    # ruling; reassess after the FIG-2169 test-prune sweep.
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group' && needs.plan.outputs.functional_e2e == 'true'

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: process-operations
            recipe: process-operations-e2e
            node: false
            artifact: process-operations
            browser: false
            runner: ubuntu-24.04

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config gc.auto 0
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force "${GITHUB_SHA}"

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain


      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: linux-debug
          save-if: false

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      # Provides the linker the workflow-level RUSTFLAGS names. This job
      # restores the `linux-debug` cache and installs its linker directly.
      - name: Install mold
        uses: ./.github/actions/setup-mold

      # The repo-local installer uses checksum-pinned release archives instead
      # of the GitHub releases API; merge-queue trains fan out enough jobs that
      # the API-listing path (extractions/setup-just) hit rate limits and
      # ejected whole trains.
      - name: Install just
        uses: ./.github/actions/install-tools
        with:
          tool: just

      # Each recipe owns its dependencies and any container lifecycle, so the
      # matrix legs run independently without cross-job coordination.
      - name: Require exact worker artifact selection
        run: >-
          python3 scripts/ci/artifact_provenance.py select
          --artifact-name "${{ needs.worker-artifacts.outputs.artifact_name }}"
          --expected-artifact-name "worker-binaries-${GITHUB_SHA}-${{ needs.worker-artifacts.outputs.producer_attempt }}"
          --selected-artifact-id "${{ needs.worker-artifacts.outputs.artifact_id }}"
          --producer-attempt "${{ needs.worker-artifacts.outputs.producer_attempt }}"
          --current-attempt "${GITHUB_RUN_ATTEMPT}"

      - name: Download worker binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.worker-artifacts.outputs.artifact_id }}
          path: ${{ runner.temp }}/worker-download

      - name: Verify and extract worker binaries
        run: |
          python3 scripts/ci/artifact_provenance.py consume \
            --manifest "${RUNNER_TEMP}/worker-download/worker-binaries.provenance.json" \
            --payload-root "${RUNNER_TEMP}/worker-download" \
            --require-payload worker-binaries.tar \
            --artifact-name "${{ needs.worker-artifacts.outputs.artifact_name }}" \
            --producer-job worker-artifacts \
            --producer-instance worker-binaries \
            --producer-attempt "${{ needs.worker-artifacts.outputs.producer_attempt }}" \
            --selected-artifact-id "${{ needs.worker-artifacts.outputs.artifact_id }}" \
            --current-attempt "${GITHUB_RUN_ATTEMPT}" \
            --receipt "${RUNNER_TEMP}/worker-binaries-consumption.json" \
            --step-summary "${GITHUB_STEP_SUMMARY}" \
            --extract-tar worker-binaries.tar \
            --extract-to "${RUNNER_TEMP}/worker-binaries"
          echo "LASH_E2E_PREBUILT_BIN_DIR=${RUNNER_TEMP}/worker-binaries" >> "$GITHUB_ENV"

      - name: Run functional E2E
        env:
          LASH_PROCESS_OPERATIONS_ARTIFACT_DIR: target/functional-e2e-artifacts/process-operations
          LASH_VERSION_BUMP_ARTIFACT_DIR: target/functional-e2e-artifacts/version-bump-recreation
          LASH_SESSION_LEASE_ARTIFACT_DIR: target/functional-e2e-artifacts/session-lease-triage
          LASH_SLACK_CLONE_E2E_ARTIFACT_DIR: ${{ matrix.browser && format('{0}/slack-clone-full-host-e2e', runner.temp) || '' }}
        run: just ${{ matrix.recipe }}

      - name: Upload functional E2E failure artifacts
        if: failure() && matrix.artifact != 'none'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: functional-e2e-${{ matrix.artifact }}-attempt-${{ github.run_attempt }}
          path: target/functional-e2e-artifacts/${{ matrix.artifact }}
          if-no-files-found: warn

  restate-postgres-workers:
    name: Restate + Postgres + MinIO Workers (segment ${{ matrix.segment }})
    runs-on: ubuntu-24.04
    # This label-aware guard replaces `if: github.event_name != 'push' || github.ref == 'refs/heads/main'`.
    # Worker steps formerly repeated `if: (github.event_name != 'push' || github.ref == 'refs/heads/main') && needs.plan.outputs.workers_e2e == 'true'`.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:workers'))
    # The harness has grown to 24 workflows + turn-control gates; 30 minutes
    # was hit on 2026-07-20 (job-timeout shows as 'cancelled').
    timeout-minutes: 75
    needs: [plan, worker-artifacts]
    outputs:
      segment_1_artifact_id: ${{ steps.upload-segment-1.outputs.artifact-id }}
      segment_1_artifact_name: ${{ steps.prepare-segment-1.outputs.artifact_name }}
      segment_1_producer_attempt: ${{ steps.prepare-segment-1.outputs.producer_attempt }}
      segment_2_artifact_id: ${{ steps.upload-segment-2.outputs.artifact-id }}
      segment_2_artifact_name: ${{ steps.prepare-segment-2.outputs.artifact_name }}
      segment_2_producer_attempt: ${{ steps.prepare-segment-2.outputs.producer_attempt }}
    env:
      RUN_WORKERS_E2E: ${{ needs.plan.outputs.workers_e2e == 'true' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:workers')) }}
    strategy:
      fail-fast: false
      matrix:
        segment: [1, 2]

    steps:
      - name: Explain dispatch plan deferral
        if: github.event_name == 'workflow_dispatch' && env.RUN_WORKERS_E2E != 'true'
        run: echo "Workers E2E execution is not required by the full-profile CI plan."

      - name: Explain plan deferral
        if: github.event_name != 'workflow_dispatch' && env.RUN_WORKERS_E2E != 'true'
        run: echo "Workers E2E execution is not required by the CI plan."

      - name: Check out repository
        if: env.RUN_WORKERS_E2E == 'true'
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Reclaim runner disk
        if: env.RUN_WORKERS_E2E == 'true'
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        if: env.RUN_WORKERS_E2E == 'true'
        uses: ./.github/actions/rust-toolchain

      # Release binaries come from worker-artifacts. Segment 1 also builds the
      # S3 tests in debug; retain those workspace outputs in a dedicated cache.
      - name: Restore cargo cache
        if: env.RUN_WORKERS_E2E == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: linux-worker-tests
          cache-workspace-crates: true
          save-if: ${{ matrix.segment == 1 }}

      - name: Install protoc
        if: env.RUN_WORKERS_E2E == 'true'
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      # Provides the linker the workflow-level RUSTFLAGS names. This job
      # restores the `linux-worker-tests` cache and installs its linker directly.
      - name: Install mold
        if: env.RUN_WORKERS_E2E == 'true'
        uses: ./.github/actions/setup-mold

      - name: Require exact worker artifact selection
        if: env.RUN_WORKERS_E2E == 'true'
        run: >-
          python3 scripts/ci/artifact_provenance.py select
          --artifact-name "${{ needs.worker-artifacts.outputs.artifact_name }}"
          --expected-artifact-name "worker-binaries-${GITHUB_SHA}-${{ needs.worker-artifacts.outputs.producer_attempt }}"
          --selected-artifact-id "${{ needs.worker-artifacts.outputs.artifact_id }}"
          --producer-attempt "${{ needs.worker-artifacts.outputs.producer_attempt }}"
          --current-attempt "${GITHUB_RUN_ATTEMPT}"

      - name: Download worker binaries
        if: env.RUN_WORKERS_E2E == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.worker-artifacts.outputs.artifact_id }}
          path: ${{ runner.temp }}/worker-download

      - name: Verify and extract worker binaries
        if: env.RUN_WORKERS_E2E == 'true'
        run: |
          python3 scripts/ci/artifact_provenance.py consume \
            --manifest "${RUNNER_TEMP}/worker-download/worker-binaries.provenance.json" \
            --payload-root "${RUNNER_TEMP}/worker-download" \
            --require-payload worker-binaries.tar \
            --artifact-name "${{ needs.worker-artifacts.outputs.artifact_name }}" \
            --producer-job worker-artifacts \
            --producer-instance worker-binaries \
            --producer-attempt "${{ needs.worker-artifacts.outputs.producer_attempt }}" \
            --selected-artifact-id "${{ needs.worker-artifacts.outputs.artifact_id }}" \
            --current-attempt "${GITHUB_RUN_ATTEMPT}" \
            --receipt "target/restate-postgres-workers-e2e-manifests/segment-${{ matrix.segment }}/worker-binaries-consumption.json" \
            --step-summary "${GITHUB_STEP_SUMMARY}" \
            --extract-tar worker-binaries.tar \
            --extract-to "${RUNNER_TEMP}/worker-binaries"
          echo "LASH_E2E_PREBUILT_BIN_DIR=${RUNNER_TEMP}/worker-binaries" >> "$GITHUB_ENV"

      - name: Run distributed backend E2E
        if: env.RUN_WORKERS_E2E == 'true'
        env:
          LASH_E2E_WORKFLOW_SEGMENT: ${{ matrix.segment }}
          LASH_E2E_COMPLETED_WORKFLOW_MANIFEST: target/restate-postgres-workers-e2e-manifests/segment-${{ matrix.segment }}/completed-workflows.txt
        run: bash scripts/restate-postgres-workers-e2e.sh

      - name: Run graceful drain operator-flow E2E
        if: env.RUN_WORKERS_E2E == 'true' && matrix.segment == 1
        env:
          LASH_GRACEFUL_DRAIN_ARTIFACT_DIR: target/operator-flow-artifacts/graceful-drain
        run: bash scripts/graceful-drain-e2e.sh

      - name: Run request abandon operator-flow E2E
        if: env.RUN_WORKERS_E2E == 'true' && matrix.segment == 1
        env:
          LASH_REQUEST_ABANDON_ARTIFACT_DIR: target/operator-flow-artifacts/request-abandon
        run: bash scripts/request-abandon-e2e.sh

      - name: Upload operator-flow E2E failure artifacts
        if: failure() && env.RUN_WORKERS_E2E == 'true' && matrix.segment == 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operator-flow-e2e-attempt-${{ github.run_attempt }}
          path: target/operator-flow-artifacts
          if-no-files-found: warn

      - name: Record segment 1 result provenance
        id: prepare-segment-1
        if: always() && env.RUN_WORKERS_E2E == 'true' && matrix.segment == 1
        env:
          ARTIFACT_NAME: restate-workers-e2e-segment-1-attempt-${{ github.run_attempt }}
        run: |
          python3 scripts/ci/artifact_provenance.py create \
            --manifest target/restate-postgres-workers-e2e-manifests/segment-1/provenance.json \
            --payload-root target/restate-postgres-workers-e2e-manifests/segment-1 \
            --payload workflow-inventory.tsv \
            --payload completed-workflows.txt \
            --payload worker-binaries-consumption.json \
            --artifact-name "${ARTIFACT_NAME}" \
            --producer-job restate-postgres-workers \
            --producer-instance segment-1 \
            --producer-attempt "${GITHUB_RUN_ATTEMPT}"
          echo "artifact_name=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"
          echo "producer_attempt=${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Upload segment 1 completed workflow manifest
        id: upload-segment-1
        if: always() && env.RUN_WORKERS_E2E == 'true' && matrix.segment == 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.prepare-segment-1.outputs.artifact_name }}
          path: target/restate-postgres-workers-e2e-manifests/segment-1
          if-no-files-found: error

      - name: Record segment 2 result provenance
        id: prepare-segment-2
        if: always() && env.RUN_WORKERS_E2E == 'true' && matrix.segment == 2
        env:
          ARTIFACT_NAME: restate-workers-e2e-segment-2-attempt-${{ github.run_attempt }}
        run: |
          python3 scripts/ci/artifact_provenance.py create \
            --manifest target/restate-postgres-workers-e2e-manifests/segment-2/provenance.json \
            --payload-root target/restate-postgres-workers-e2e-manifests/segment-2 \
            --payload workflow-inventory.tsv \
            --payload completed-workflows.txt \
            --payload worker-binaries-consumption.json \
            --artifact-name "${ARTIFACT_NAME}" \
            --producer-job restate-postgres-workers \
            --producer-instance segment-2 \
            --producer-attempt "${GITHUB_RUN_ATTEMPT}"
          echo "artifact_name=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"
          echo "producer_attempt=${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Upload segment 2 completed workflow manifest
        id: upload-segment-2
        if: always() && env.RUN_WORKERS_E2E == 'true' && matrix.segment == 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.prepare-segment-2.outputs.artifact_name }}
          path: target/restate-postgres-workers-e2e-manifests/segment-2
          if-no-files-found: error

  restate-postgres-workers-summary:
    name: Restate workers E2E coverage summary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # This label-aware guard replaces `if: always() && (github.event_name != 'push' || github.ref == 'refs/heads/main')`.
    # Summary steps formerly repeated `if: (github.event_name != 'push' || github.ref == 'refs/heads/main') && needs.plan.outputs.workers_e2e == 'true'`.
    if: >-
      always()
      && (github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:workers')))
    needs:
      - plan
      - restate-postgres-workers
    env:
      RUN_WORKERS_E2E: ${{ needs.plan.outputs.workers_e2e == 'true' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:workers')) }}

    steps:
      - name: Check out repository
        if: env.RUN_WORKERS_E2E == 'true'
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Require exact segment result selections
        if: env.RUN_WORKERS_E2E == 'true'
        run: |
          python3 scripts/ci/artifact_provenance.py select \
            --artifact-name "${{ needs.restate-postgres-workers.outputs.segment_1_artifact_name }}" \
            --expected-artifact-name "restate-workers-e2e-segment-1-attempt-${{ needs.restate-postgres-workers.outputs.segment_1_producer_attempt }}" \
            --selected-artifact-id "${{ needs.restate-postgres-workers.outputs.segment_1_artifact_id }}" \
            --producer-attempt "${{ needs.restate-postgres-workers.outputs.segment_1_producer_attempt }}" \
            --current-attempt "${GITHUB_RUN_ATTEMPT}"
          python3 scripts/ci/artifact_provenance.py select \
            --artifact-name "${{ needs.restate-postgres-workers.outputs.segment_2_artifact_name }}" \
            --expected-artifact-name "restate-workers-e2e-segment-2-attempt-${{ needs.restate-postgres-workers.outputs.segment_2_producer_attempt }}" \
            --selected-artifact-id "${{ needs.restate-postgres-workers.outputs.segment_2_artifact_id }}" \
            --producer-attempt "${{ needs.restate-postgres-workers.outputs.segment_2_producer_attempt }}" \
            --current-attempt "${GITHUB_RUN_ATTEMPT}"

      - name: Download segment 1 completed workflow manifest
        if: env.RUN_WORKERS_E2E == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.restate-postgres-workers.outputs.segment_1_artifact_id }}
          path: target/restate-postgres-workers-e2e-download/segment-1

      - name: Download segment 2 completed workflow manifest
        if: env.RUN_WORKERS_E2E == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.restate-postgres-workers.outputs.segment_2_artifact_id }}
          path: target/restate-postgres-workers-e2e-download/segment-2

      - name: Verify completed workflow manifest provenance
        if: env.RUN_WORKERS_E2E == 'true'
        run: |
          for segment in 1 2; do
            artifact_name="${{ needs.restate-postgres-workers.outputs.segment_1_artifact_name }}"
            artifact_id="${{ needs.restate-postgres-workers.outputs.segment_1_artifact_id }}"
            producer_attempt="${{ needs.restate-postgres-workers.outputs.segment_1_producer_attempt }}"
            if [[ "${segment}" == 2 ]]; then
              artifact_name="${{ needs.restate-postgres-workers.outputs.segment_2_artifact_name }}"
              artifact_id="${{ needs.restate-postgres-workers.outputs.segment_2_artifact_id }}"
              producer_attempt="${{ needs.restate-postgres-workers.outputs.segment_2_producer_attempt }}"
            fi
            python3 scripts/ci/artifact_provenance.py consume \
              --manifest "target/restate-postgres-workers-e2e-download/segment-${segment}/provenance.json" \
              --payload-root "target/restate-postgres-workers-e2e-download/segment-${segment}" \
              --require-payload workflow-inventory.tsv \
              --require-payload completed-workflows.txt \
              --require-payload worker-binaries-consumption.json \
              --artifact-name "${artifact_name}" \
              --producer-job restate-postgres-workers \
              --producer-instance "segment-${segment}" \
              --producer-attempt "${producer_attempt}" \
              --selected-artifact-id "${artifact_id}" \
              --current-attempt "${GITHUB_RUN_ATTEMPT}" \
              --receipt "${RUNNER_TEMP}/worker-segment-${segment}-consumption.json" \
              --step-summary "${GITHUB_STEP_SUMMARY}"
          done

      - name: Verify complete workflow coverage
        if: env.RUN_WORKERS_E2E == 'true'
        run: >-
          python3 scripts/check_restate_workers_e2e_coverage.py
          --leg 1
          target/restate-postgres-workers-e2e-download/segment-1/workflow-inventory.tsv
          target/restate-postgres-workers-e2e-download/segment-1/completed-workflows.txt
          --leg 2
          target/restate-postgres-workers-e2e-download/segment-2/workflow-inventory.tsv
          target/restate-postgres-workers-e2e-download/segment-2/completed-workflows.txt

  diff-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_REF: origin/main
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
      # Labels exist only on pull_request; the footer override also covers merge_group.
      DIFF_HYGIENE_BYPASS: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'diff-hygiene-override') && '1' || '0' }}
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          # Background auto-gc rewrites .git/shallow between the deepen fetch and
          # the ancestry check ("shallow file has changed since we read it").
          git config gc.auto 0
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach --force "${GITHUB_SHA}"
          if [[ -n "${BASE_SHA}" ]]; then
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            depth=50
            until git merge-base --is-ancestor "${BASE_SHA}" HEAD 2>/dev/null; do
              if [[ ${depth} -gt 1600 ]]; then
                git fetch --no-tags --unshallow origin
                break
              fi
              git fetch --no-tags --deepen="${depth}" origin "${GITHUB_SHA}"
              depth=$((depth * 2))
            done
            git merge-base --is-ancestor "${BASE_SHA}" HEAD
          else
            git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
            depth=50
            until git merge-base origin/main HEAD >/dev/null 2>&1; do
              if [[ ${depth} -gt 1600 ]]; then
                git fetch --no-tags --unshallow origin
                break
              fi
              git fetch --no-tags --deepen="${depth}" origin "${GITHUB_SHA}"
              depth=$((depth * 2))
            done
            git merge-base origin/main HEAD >/dev/null
          fi
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0

      - name: Check diff hygiene
        run: bash scripts/ci/check-diff-hygiene.sh

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
      # Labels exist only on pull_request; the footer override also covers merge_group.
      SECRET_SCAN_BYPASS: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'secret-scan-override') && '1' || '0' }}
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          # Background auto-gc rewrites .git/shallow between the deepen fetch and
          # the ancestry check ("shallow file has changed since we read it").
          git config gc.auto 0
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach --force "${GITHUB_SHA}"
          if [[ -n "${BASE_SHA}" ]]; then
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            depth=50
            until git merge-base --is-ancestor "${BASE_SHA}" HEAD 2>/dev/null; do
              if [[ ${depth} -gt 1600 ]]; then
                git fetch --no-tags --unshallow origin
                break
              fi
              git fetch --no-tags --deepen="${depth}" origin "${GITHUB_SHA}"
              depth=$((depth * 2))
            done
            git merge-base --is-ancestor "${BASE_SHA}" HEAD
          else
            git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
            depth=50
            until git merge-base origin/main HEAD >/dev/null 2>&1; do
              if [[ ${depth} -gt 1600 ]]; then
                git fetch --no-tags --unshallow origin
                break
              fi
              git fetch --no-tags --deepen="${depth}" origin "${GITHUB_SHA}"
              depth=$((depth * 2))
            done
            git merge-base origin/main HEAD >/dev/null
          fi
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0

      - name: Resolve secret scan range and override
        id: secret-scan
        run: |
          set -euo pipefail

          if [[ -n "${BASE_SHA}" ]]; then
            base_sha="${BASE_SHA}"
          elif ! base_sha="$(git merge-base origin/main HEAD)"; then
            echo "Secret scan could not resolve merge-base for origin/main." >&2
            exit 1
          fi
          range="${base_sha}..HEAD"
          echo "base_sha=${base_sha}" >> "${GITHUB_OUTPUT}"

          if [[ "${SECRET_SCAN_BYPASS}" == "1" ]]; then
            echo "::warning::Secret scan bypassed by the secret-scan-override label."
            echo "bypass=1" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          commits_file="$(mktemp)"
          trailers_file="$(mktemp)"
          trap 'rm -f "${commits_file}" "${trailers_file}"' EXIT
          if ! git rev-list "${range}" > "${commits_file}"; then
            echo "Secret scan could not enumerate commits in range '${range}'." >&2
            exit 1
          fi

          footer_reason=""
          empty_footer_commits=""
          while IFS= read -r commit; do
            if ! git show -s --format=%B "${commit}" | git interpret-trailers --parse > "${trailers_file}"; then
              echo "Secret scan could not enumerate override footers for commit '${commit}'." >&2
              exit 1
            fi
            while IFS= read -r trailer; do
              [[ "${trailer}" == Bypass-Secret-Scan:* ]] || continue
              reason="${trailer#*:}"
              reason="${reason#"${reason%%[![:space:]]*}"}"
              reason="${reason%"${reason##*[![:space:]]}"}"
              if [[ -z "${reason}" ]]; then
                short_commit="$(git rev-parse --short "${commit}")"
                empty_footer_commits="${empty_footer_commits}${empty_footer_commits:+, }${short_commit}"
              elif [[ -z "${footer_reason}" ]]; then
                footer_reason="${reason}"
              fi
            done < "${trailers_file}"
          done < "${commits_file}"

          if [[ -n "${empty_footer_commits}" ]]; then
            echo "Secret-scan override-footer validation failed for commit(s) ${empty_footer_commits}: Bypass-Secret-Scan has an empty reason; supply a non-empty reason or use the secret-scan-override label." >&2
            exit 1
          fi
          if [[ -n "${footer_reason}" ]]; then
            echo "::warning::Secret scan bypassed by Bypass-Secret-Scan footer: ${footer_reason}"
            echo "bypass=1" >> "${GITHUB_OUTPUT}"
          else
            echo "bypass=0" >> "${GITHUB_OUTPUT}"
          fi

      - name: Download pinned Gitleaks binary
        if: steps.secret-scan.outputs.bypass != '1'
        run: |
          archive="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks

      - name: Test secret rejection
        if: steps.secret-scan.outputs.bypass != '1'
        env:
          GITLEAKS_BINARY: ${{ runner.temp }}/gitleaks
        run: python3 scripts/test_ci_plan_hygiene.py

      - name: Scan pull request commit range
        if: steps.secret-scan.outputs.bypass != '1'
        env:
          SCAN_BASE_SHA: ${{ steps.secret-scan.outputs.base_sha }}
        run: |
          "${RUNNER_TEMP}/gitleaks" git --log-opts="${SCAN_BASE_SHA}..HEAD" --redact --verbose

  # This is the single required context after FIG-2055 lands. Keep every
  # correctness job in needs: the script rejects missing or unmapped entries,
  # failures/cancellations, ungated skips, and family skips the plan required.
  ci-conclusion:
    name: CI conclusion
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: always()
    needs:
      - plan
      - facade-only-examples
      - test-doc
      - repo-gates
      - unused-deps
      - facade-gates
      - lashlang-git-consumer
      - package-feature-checks
      - runtime-feature-boundary
      - workspace-tests
      - heavy-tests
      - lint
      - diff-hygiene
      - secret-scan
      - confidence-fast
      - confidence-fast-summary
      - postgres-store
      - s3-store
      - fuzz-smoke
      - stack-budget
      - functional-e2e
      - functional-e2e-process-operations
      - worker-artifacts
      - restate-postgres-workers
      - restate-postgres-workers-summary

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Validate CI conclusion
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          WORKERS_E2E_ENABLED: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:workers')) }}
        run: python3 scripts/ci/conclusion.py conclusion
