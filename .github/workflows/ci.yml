  worker-artifacts:
    name: Build worker release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: plan
    outputs:
      artifact_id: ${{ steps.upload-worker-binaries.outputs.artifact-id }}
      artifact_name: ${{ steps.prepare-worker-binaries.outputs.artifact_name }}
      producer_attempt: ${{ steps.prepare-worker-binaries.outputs.producer_attempt }}
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:workers'))
    env:
      RUN_WORKER_ARTIFACTS: ${{ needs.plan.outputs.workers_e2e == 'true' || needs.plan.outputs.functional_e2e == 'true' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:workers')) }}
    steps:
      - name: Explain plan deferral
        if: env.RUN_WORKER_ARTIFACTS != 'true'
        run: echo "Worker artifacts are not required by the CI plan."

      - name: Check out repository
        if: env.RUN_WORKER_ARTIFACTS == 'true'
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config gc.auto 0
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force "${GITHUB_SHA}"

      - name: Reclaim runner disk
        if: env.RUN_WORKER_ARTIFACTS == 'true'
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        if: env.RUN_WORKER_ARTIFACTS == 'true'
        uses: ./.github/actions/rust-toolchain

      - name: Install protoc
        if: env.RUN_WORKER_ARTIFACTS == 'true'
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Install mold
        if: env.RUN_WORKER_ARTIFACTS == 'true'
        uses: ./.github/actions/setup-mold

      - name: Restore worker release dependencies
        if: env.RUN_WORKER_ARTIFACTS == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: linux-worker-release
          cache-workspace-crates: true
          save-if: true

      - name: Build worker binaries once
        if: env.RUN_WORKER_ARTIFACTS == 'true'
        run: |
          cargo build --locked --release -p lash-restate-postgres-workers-e2e --bins
          mkdir -p "${RUNNER_TEMP}/worker-artifacts"
          find target/release -maxdepth 1 -type f -name 'lash-e2e-*' -executable \
            -exec cp '{}' "${RUNNER_TEMP}/worker-artifacts/" \;
          tar -C "${RUNNER_TEMP}/worker-artifacts" -cf "${RUNNER_TEMP}/worker-binaries.tar" .

      - name: Record worker binary provenance
        id: prepare-worker-binaries
        if: env.RUN_WORKER_ARTIFACTS == 'true'
        env:
          ARTIFACT_NAME: worker-binaries-${{ github.sha }}-${{ github.run_attempt }}
        run: |
          python3 scripts/ci/artifact_provenance.py create \
            --manifest "${RUNNER_TEMP}/worker-binaries.provenance.json" \
            --payload-root "${RUNNER_TEMP}" \
            --payload worker-binaries.tar \
            --artifact-name "${ARTIFACT_NAME}" \
            --producer-job worker-artifacts \
            --producer-instance worker-binaries \
            --producer-attempt "${GITHUB_RUN_ATTEMPT}"
          echo "artifact_name=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"
          echo "producer_attempt=${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Upload worker binaries
        id: upload-worker-binaries
        if: env.RUN_WORKER_ARTIFACTS == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.prepare-worker-binaries.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/worker-binaries.tar
            ${{ runner.temp }}/worker-binaries.provenance.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  functional-e2e:
    name: Functional E2E (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    needs: plan
