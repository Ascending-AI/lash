name: CI

# GitHub natively skips pull-request runs when the head commit requests a CI
# skip, so no per-job guards are needed for that.
#
# CI validates pull requests and the resulting commits in the merge queue.
# Releases are separate: a maintainer manually dispatches release.yml for a
# green commit on main, which in turn requires a manual full-profile dispatch
# of this workflow against that exact commit. Ordinary merges never tag or
# publish.
#
# There is deliberately no `push` trigger, so an automatic push to main runs
# nothing at all. Trunk breadth on push (FIG-2789) is retired: the queue
# validates the required core board on its merge-group commit and main merges
# by fast-forwarding to that same commit, so an automatic push carried a tree
# CI had already seen. Pull requests and merge_group run the minimal core
# board — the Bazel partition (tests and the workspace compile) plus
# path-gated jobs — so wall time is pool queueing, not runner minutes. The
# breadth families — Test heavy suites, Test S3 store, Functional E2E, Restate
# workers E2E, Fuzz smoke, Stack budget, deferred Unicode, worker artifacts —
# are gated to `workflow_dispatch` alone, which is also the profile
# release.yml certifies against and the sole home of feature lanes, the
# PG14/PG18 compatibility legs, deferred Unicode, the seal lane on non-facade
# diffs, and the lashlang consumer.

on:
  # The full profile, and the only home of the heavy families. A manual
  # dispatch is what release certification consumes (release.yml accepts only a
  # green `workflow_dispatch` run whose headSha is the release commit) and it
  # is also the recovery path when GitHub drops an automatic event (merge
  # commit d70ce7ea got zero check suites). It has no inputs, is never invoked
  # from another workflow, and is unrelated to the removed pass-2 bump chain.
  #
  # Don't drive the recovery case by hand: `scripts/ci_ensure_run.sh <branch>
  # <head-sha>` waits a bounded window for the run GitHub should have made,
  # dispatches this trigger exactly once if none arrives, then polls that run
  # to a conclusion. A dispatch run is NOT equivalent to the pull-request run
  # it replaces — the event-conditional `Check versioned surface bumps` step
  # below does not run, and it builds refs/heads/<branch> rather than the PR
  # merge tree — so the script exits 3, not 0, on a green dispatch. Callers opt
  # in with --accept-dispatch-run.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # The merge queue delivers a queued PR's required checks on its own event, from
  # its own `gh-readonly-queue/...` ref. Without this trigger a queue entry gets
  # no checks at all and the queue stalls.
  merge_group:

# One live CI run per head branch, whatever event produced it — because a
# `pull_request` run carries `refs/pull/<n>/merge` while a manual recovery
# dispatch of the same commit carries `refs/heads/<branch>`, so keying on
# `github.ref` put them in different groups and ran the whole board twice over an
# identical tree. That duplication was the single largest line in the CI bill
# (54% of branch runner-minutes). A dispatch supersedes a pull-request run from
# the same branch instead of doubling it; the trigger supplies both the recovery
# path for a dropped event and the full profile required for release evidence.
#
# The key is not *only* the branch name, because a branch name is not unique
# across repositories: a fork's pull request from a branch literally named `main`
# would key into main's group. So each event class that must never be collided
# into gets its own key, and those keys contain a colon, which
# `git check-ref-format` forbids in a ref name. That is what makes them
# unforgeable: no branch anyone can push, here or in a fork, can produce one.
#
# * a dispatch on main keys on `trunk:dispatch`, so release certification for
#   the current main tip is isolated from every other run, and is never
#   cancelled. An older main commit is certified from a temporary branch pinned
#   to that exact commit; its branch-named group is isolated from
#   `trunk:dispatch` too. See the release procedure in CONTRIBUTING.md.
# * a *fork* pull request keys on its PR number, which no branch name can
#   collide with. Same-repo pull requests keep the branch key, which is what lets
#   a dispatch dedupe with them.
# * a `merge_group` run has no `head_ref` and falls through to its own
#   `gh-readonly-queue/main/pr-<n>-<sha>` ref name, unique per queue entry: two
#   queue builds never share a group and never cancel each other. Their
#   cancellation belongs to the queue, which drops an entry's run when it
#   dequeues it, so `cancel-in-progress` stays false for the event.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') && 'trunk:dispatch'
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && format('fork-pr:{0}', github.event.pull_request.number)
      || github.head_ref
      || github.ref_name
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref_name != 'main') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LASH_CI_FEATURES: ""
  # The linker is a property of the caches this workflow shares, not of any
  # one job's step list. RUSTFLAGS is part of cargo's per-unit fingerprint, so
  # a job that restores `linux-debug` under a different RUSTFLAGS than the job
  # that wrote it logs "cache restored" and then cold-builds the whole graph —
  # which is exactly what the five container/E2E readers did while the flag
  # was appended by a setup action they never ran. Setting it here makes
  # every job in this workflow resolve the same value by default; the one
  # cache that must stay mold-free (`linux-release`, restored by perf.yml and
  # release.yml, which do not link through mold) overrides it at job scope.
  # Mold reduces link cost across the workspace test binaries.
  RUSTFLAGS: -C link-arg=-fuse-ld=mold
  # Preserve the pre-worktree-isolation artifact tree consumed below.
  LASH_CONFIDENCE_OUT_DIR: ${{ github.workspace }}/target/confidence

jobs:
  # Keep path classification cheap and conservative. Every event whose exact
  # diff is unavailable fails open to all expensive families.
  plan:
    name: Plan CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      stores: ${{ steps.classify.outputs.stores }}
      functional_e2e: ${{ steps.classify.outputs.functional_e2e }}
      workers_e2e: ${{ steps.classify.outputs.workers_e2e }}
      workbench: ${{ steps.classify.outputs.workbench }}
      regress: ${{ steps.classify.outputs.regress }}
      facade: ${{ steps.classify.outputs.facade }}
      tooling: ${{ steps.classify.outputs.tooling }}
      schema: ${{ steps.classify.outputs.schema }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      fail_open: ${{ steps.classify.outputs.fail_open }}
      reason: ${{ steps.classify.outputs.reason }}
      postgres_matrix: ${{ steps.postgres-matrix.outputs.postgres_matrix }}
      bazel_trusted: >-
        ${{ github.event_name == 'merge_group'
        || github.event_name == 'workflow_dispatch'
        || (github.event_name == 'pull_request'
        && github.actor != 'dependabot[bot]'
        && github.event.pull_request.head.repo.full_name == github.repository) }}

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Classify exact diff
        id: classify
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail

          fail_open() {
            python3 scripts/ci_plan.py fail-open --reason "$1" >> "${GITHUB_OUTPUT}"
            exit 0
          }

          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch)
              fail_open "workflow_dispatch has no exact triggering diff"
              ;;
            pull_request)
              base_sha="${PR_BASE_SHA}"
              ;;
            merge_group)
              base_sha="${MERGE_GROUP_BASE_SHA}"
              ;;
            *)
              fail_open "unsupported event ${GITHUB_EVENT_NAME}"
              ;;
          esac

          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            fail_open "event has no exact base commit"
          fi
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          if ! git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            fetch --no-tags --prune --depth=1 origin "${base_sha}"; then
            fail_open "base commit ${base_sha} could not be fetched"
          fi
          if ! git rev-parse --verify "${base_sha}^{commit}" >/dev/null 2>&1; then
            fail_open "base commit ${base_sha} is unavailable"
          fi
          if ! git diff --name-status --no-renames -z "${base_sha}" "${GITHUB_SHA}" > "${RUNNER_TEMP}/changed-paths"; then
            fail_open "exact diff ${base_sha}..${GITHUB_SHA} could not be computed"
          fi
          python3 scripts/ci_plan.py classify \
            --event "${GITHUB_EVENT_NAME}" \
            --paths-file "${RUNNER_TEMP}/changed-paths" >> "${GITHUB_OUTPUT}"

      # PG16 is the sole primary lane on rust pull requests and merge groups.
      # PG14/PG18 run when the diff touches a durable schema crate, or on
      # workflow_dispatch. scripts/ci_plan.py owns the rule.
      - name: Resolve PostgreSQL matrix
        id: postgres-matrix
        run: |
          python3 scripts/ci_plan.py postgres-matrix \
            --event "${GITHUB_EVENT_NAME}" \
            --schema "${{ steps.classify.outputs.schema }}" >> "${GITHUB_OUTPUT}"

      - name: Summarize plan
        env:
          PLAN_JSON: ${{ toJson(steps.classify.outputs) }}
        run: |
          {
            echo "## CI plan"
            echo
            echo '```json'
            jq . <<< "${PLAN_JSON}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  facade-only-examples:
    name: Facade-only examples
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Check example facade imports
        run: python3 scripts/check_facade_only_examples.py

  # The API seal lane alone: the workspace compile proof lives in the Lint
  # job's `//:workspace_clippy`, which type-checks the full all-targets
  # workspace shape. Untrusted (fork/dependabot) pull requests lose no
  # coverage: the full Cargo workspace build inside `workspace-tests` already
  # compiles every target. The seal lane runs when the facade crate or the
  # root manifests changed; the release dispatch always runs it.
  check:
    name: Seal-test the API surface
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: plan
    if: >-
      github.event_name == 'workflow_dispatch'
      || needs.plan.outputs.facade == 'true'
    environment: build-cache
    env:
      # trybuild derives its fixture/output tree from Cargo's target directory.
      # The seal job has no shared writable output with any other CI job.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-seal

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain


      # Restore-only. `seal-cache.yml` is the sole writer of `linux-seal-2`,
      # and it must stay the writer: this job never runs on main itself, so a
      # cache saved here lands in a pull request's own branch scope, which no
      # other branch can read. Every key input below -- shared-key,
      # `workspaces`, CARGO_TARGET_DIR, RUSTFLAGS, CARGO_TERM_COLOR,
      # CARGO_INCREMENTAL, CARGO_HOME -- is mirrored there; changing one here
      # without changing it there writes a cache nothing reads, and this job
      # goes back to a twelve-minute cold build (FIG-3056).
      # `test_seal_cache_writer_mirrors_the_seal_lane` pins the mirror.
      #
      # The `-2` is the cache generation. rust-cache never re-saves a key it
      # restored in full, so a change to what the seal build produces that
      # leaves the lockfiles, toolchain and cargo environment alone (the move
      # to compile-fail-only fixtures was one) keeps the old tree on main
      # forever, and every run rebuilds the difference. Bump the generation in
      # both files together, then dispatch `seal-cache.yml`.
      - name: Restore isolated seal dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: linux-seal-2
          workspaces: . -> target-seal

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Install mold
        uses: ./.github/actions/setup-mold

      # The whole seal check is served by Bazel's shared remote cache, which
      # keys on content rather than the merge-group SHA (FIG-3364):
      # `ui_fixtures` compiles every tests/ui/*.stderr fixture with the
      # toolchain rustc against the ui__test rlib closure and diffs normalized
      # output against the pins -- the same .stderr files the untrusted Cargo
      # path checks through trybuild. `bazel build ui__test` separately proves
      # the compile-pass module fixtures still compile. Fork and Dependabot
      # runs have no cache credentials, so they keep the Cargo command.
      - name: Configure shared build cache
        if: needs.plan.outputs.bazel_trusted == 'true'
        uses: ./.github/actions/bazel-shared-cache
        env:
          CACHE_ENDPOINT: ${{ secrets.CACHE_ENDPOINT }}
          CACHE_INSTANCE: ${{ secrets.CACHE_INSTANCE }}
          KILN_EXECUTOR_RUNTIME: ${{ secrets.KILN_EXECUTOR_RUNTIME }}
          CACHE_CA: ${{ secrets.CACHE_CA }}
          CACHE_CERT: ${{ secrets.CACHE_CERT }}
          CACHE_KEY: ${{ secrets.CACHE_KEY }}

      - name: Seal-test the API surface
        run: |
          # shellcheck disable=SC2086
          if [ "${{ needs.plan.outputs.bazel_trusted }}" = "true" ]; then
            bazel --output_user_root="$BAZEL_OUTPUT_USER_ROOT" build \
              ${BAZEL_SHARED_CACHE_FLAGS} \
              --remote_download_outputs=toplevel \
              //crates/lash:ui__test
            bazel --output_user_root="$BAZEL_OUTPUT_USER_ROOT" test \
              ${BAZEL_SHARED_CACHE_FLAGS} \
              --test_output=errors \
              //crates/lash:ui_fixtures
          else
            cargo test --workspace --locked ${LASH_CI_FEATURES} --test ui
          fi

      - name: Remove client credentials
        if: always() && needs.plan.outputs.bazel_trusted == 'true'
        run: rm -rf -- "$RUNNER_TEMP/build-cache"

      - name: Report cache disk capacity
        if: always()
        run: bash scripts/ci/report-cache.sh

  # Python-only repository gates. These were serial steps of `check`, where
  # they sat behind twelve minutes of compilation for no reason: nothing here
  # depends on the workspace check. They self-check scripts, build tooling and
  # CI config, so they are gated to diffs that touch those paths.
  repo-gates:
    name: Repository gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.tooling == 'true'

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Install mold
        uses: ./.github/actions/setup-mold

      - name: Lint orchestrating tools
        run: python3 scripts/lint_orchestrating_tools.py

      - name: Check test quarantine metadata
        run: python3 scripts/check_test_quarantines.py

      - name: Check judged build geometry
        run: python3 scripts/check_judged_build_geometry.py

      - name: Check workers-E2E proxy health target
        run: python3 scripts/check_restate_workers_proxy_health_target.py

      # The feature-lane graph replaces per-lane Cargo legs, so the resolution
      # it compiles has to be Cargo's own. This re-derives every distinct lane
      # request with `cargo tree` and diffs it against the generator's resolver;
      # `generate_build_files.py --check` reconciles the unit SET, this
      # reconciles each unit's feature set.
      - name: Reconcile feature-lane resolution against Cargo
        run: python3 tools/bazel/generate_build_files.py --verify-resolution

      # The `dependency-boundary` leg of the retired `Runtime feature boundary`
      # matrix. It never compiled anything -- it reads the resolved graph -- so
      # it belongs with the other Python-speed gates rather than on a runner
      # holding a warm Cargo cache.
      - name: Hold the lash-runtime dependency boundary
        run: |
          set -euo pipefail
          forbidden='lash-internal-protocol-rlm|lash-internal-lashlang-runtime|lash-internal-lashlang'
          for resolution in "--no-default-features" "" "--no-default-features --features testing"; do
            # shellcheck disable=SC2086
            if cargo tree -p lash-runtime -e normal $resolution --locked | grep -E "$forbidden"; then
              echo "lash-runtime pulled RLM/Lashlang dependencies at: ${resolution:-default}"
              exit 1
            fi
          done

      # The self-tests are independent processes over a read-only checkout, so
      # they run concurrently; `scripts/ci/run-gate-commands.sh` holds each
      # one's output, prints a wall-time table and runs every command even
      # after one fails. The launcher self-tests share a box-wide `flock -n`
      # that refuses rather than waits, so `--serial` keeps them in one stream
      # beside the pool. Slowest commands are listed first so the pool starts
      # them first; the list is otherwise the serial list it replaces.
      - name: Test repository scripts
        run: |
          bash scripts/ci/run-gate-commands.sh --serial '^bash ' <<'GATES'
          bash scripts/test-agent-workbench-dev-reset.sh
          bash scripts/test-worktree-gate-env.sh
          bash scripts/test-dev-script-process-identity.sh
          bash scripts/test-ci-reclaim-disk.sh
          python3 scripts/test_with_service.py
          python3 scripts/test_check_feature_coverage.py
          python3 scripts/test_fast_test.py
          python3 scripts/test_bazel_test_contract.py
          python3 scripts/check_feature_coverage.py check
          python3 scripts/test_check_version_bumps.py
          python3 scripts/test_action_sizes_from_log.py
          python3 scripts/test_agent_workbench_restate_e2e.py
          python3 scripts/test_check_facade_only_examples.py
          python3 scripts/test_check_postgres_json_carrier_coverage.py
          python3 scripts/test_check_postgres_payload_shape_version.py
          python3 scripts/test_check_store_sql_ownership.py
          python3 scripts/test_check_service_gate_pinning.py
          python3 scripts/test_check_version_bump_fixtures.py
          python3 scripts/test_check_conformance_law_registration.py
          python3 scripts/test_check_transcript_diff.py
          python3 scripts/test_gate_scope.py
          python3 scripts/test_toolchain_canary.py
          python3 scripts/test_main_ci_policy.py
          python3 scripts/test_release_version.py
          python3 scripts/test_publish_workspace.py
          python3 scripts/test_package_workspace.py
          python3 scripts/test_production_file_size.py
          python3 scripts/test_confidence_gate_ci_contract.py
          python3 scripts/test_slack_clone_full_host_e2e_contract.py
          python3 scripts/test_slack_clone_live_model_e2e_contract.py
          python3 scripts/test_judged_runbook_matrix.py
          python3 scripts/test_check_judged_build_geometry.py
          python3 scripts/test_restate_workers_e2e_coverage.py
          python3 scripts/test_check_restate_workers_proxy_health_target.py
          python3 scripts/test_runtime_perf_percentiles.py
          python3 scripts/test_runtime_perf_diff.py
          python3 scripts/test_perfreport.py
          python3 scripts/test_perf_duration_history_contract.py
          python3 scripts/test_ci_plan.py
          python3 scripts/test_ci_plan_hygiene.py
          python3 scripts/test_ci_workspace_cache.py
          python3 scripts/test_ci_artifact_provenance.py
          GATES

  # An unused dependency is a real cost: it enlarges the locked graph that
  # cargo-deny audits, the surface `Cargo.lock` churns on, and every build. The
  # check is source-level (cargo-shear parses the crates' `use` graph), so it is
  # cheap and needs no compiled artifacts.
  unused-deps:
    name: Unused dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.rust == 'true'

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      # The workflow-level RUSTFLAGS link through mold, so even a host-tool
      # `cargo install` needs the linker present.
      - name: Install mold
        uses: ./.github/actions/setup-mold

      - name: Install cargo-shear
        run: cargo install cargo-shear --locked --version 1.13.4

      - name: Check for unused dependencies
        run: cargo shear

  # A dependency workspace's [patch] table is invisible to its consumers.
  # Resolve lashlang from this checkout as a Git dependency in a fresh external
  # crate so every dependency needed by downstream users is carried explicitly.
  lashlang-git-consumer:
    name: Lashlang Git consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: plan
    # Dispatch-only: this compile configuration is resolved nowhere else, so
    # the release dispatch carries it (FIG-2854). The merge queue runs the same
    # minimal board as pull requests.
    if: github.event_name == 'workflow_dispatch' && (needs.plan.outputs.rust == 'true' || needs.plan.outputs.fail_open == 'true')

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: queue-lashlang-git-consumer
          workspaces: . -> target/lashlang-git-consumer
          save-if: ${{ github.event_name != 'merge_group' }}

      - name: Install mold
        uses: ./.github/actions/setup-mold

      - name: Check lashlang Git consumer without patch mirror
        run: bash scripts/check-lashlang-git-consumer.sh "${GITHUB_SHA}"

      - name: Report cache disk capacity
        if: always()
        run: bash scripts/ci/report-cache.sh

  # Feature-set coverage the workspace check cannot reach, on the pool.
  #
  # `scripts/feature-coverage.toml` declares the exact Cargo commands that
  # witness every declared workspace feature ON and OFF. Each is a different
  # resolution of one package's first-party closure from the workspace graph,
  # so `tools/bazel/generate_build_files.py` emits one Bazel target per
  # distinct `(package, resolved features, Cargo target kind)` unit and
  # `//:feature_lanes` is their aggregate. Fourteen matrix legs of up to 504 s
  # of sequential `cargo check` on a 4-vCPU runner, plus the four
  # `Runtime feature boundary` legs, collapse into this one job: the lane
  # graph shares the pool's cache with every other Bazel job, so a merge group
  # whose diff touches no lane closure pays a cache lookup rather than a
  # rebuild.
  #
  # The *proof* is unchanged and still Cargo's. `check_feature_coverage.py
  # check` keeps running in `repo-gates`, and its `--bazel` reconciliation
  # (below) fails if the Bazel lane graph compiles a different set of units
  # from the one the declared Cargo commands compile. The resolver witnesses
  # (`cargo tree`) and the cfg-predicate analysis are pure analysis over
  # `cargo metadata`; they cost seconds and stay where they are.
  #
  # Dispatch-only: the lane graph is a shared-cache lookup on the pool, but it
  # still doubles the PR job count for evidence the release dispatch already
  # collects. On the dispatch profile `bazel_trusted` is always true, so the
  # Cargo fallback below is dead code kept only as documentation of the
  # untrusted path.
  feature-lanes:
    name: Feature lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: plan
    if: github.event_name == 'workflow_dispatch' && (needs.plan.outputs.rust == 'true' || needs.plan.outputs.fail_open == 'true')
    environment: build-cache
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Configure shared build cache
        uses: ./.github/actions/bazel-shared-cache
        env:
          CACHE_ENDPOINT: ${{ secrets.CACHE_ENDPOINT }}
          CACHE_INSTANCE: ${{ secrets.CACHE_INSTANCE }}
          KILN_EXECUTOR_RUNTIME: ${{ secrets.KILN_EXECUTOR_RUNTIME }}
          CACHE_CA: ${{ secrets.CACHE_CA }}
          CACHE_CERT: ${{ secrets.CACHE_CERT }}
          CACHE_KEY: ${{ secrets.CACHE_KEY }}

      # Every unit of every declared lane command, compiled at that command's
      # own feature resolution. `--remote_download_outputs=minimal` because a
      # compile-only proof needs the action's exit status, not its rlibs.
      - name: Compile every feature lane
        shell: bash
        run: |
          # shellcheck disable=SC2086
          bazel --output_user_root="$BAZEL_OUTPUT_USER_ROOT" build \
            ${BAZEL_SHARED_CACHE_FLAGS} \
            --remote_download_outputs=minimal \
            //:feature_lanes

      # The lane commands that are `cargo test`, not `cargo check`. They are
      # service-free, so the pool executes them under the same feature
      # resolution the compile above used.
      - name: Run the executable feature lanes
        shell: bash
        run: |
          # shellcheck disable=SC2086
          bazel --output_user_root="$BAZEL_OUTPUT_USER_ROOT" test \
            ${BAZEL_SHARED_CACHE_FLAGS} \
            --cache_test_results=yes --test_output=errors \
            //:feature_lane_tests

      # The `default-off-tests` leg of the retired `Runtime feature boundary`
      # matrix counted the default build's test cases as well as running them.
      # Compiling a test binary proves it still builds; only the count proves
      # it still tests anything.
      - name: Hold the feature-lane test-case floors
        shell: bash
        run: python3 scripts/ci/check_feature_lane_test_floors.py

      - name: Remove client credentials
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/build-cache"

  # The deterministic/default-feature partition is authoritative on trusted
  # events. The job executes locally on a GitHub-hosted runner and only shares
  # action results with that exact runner image identity, never Kiln's executor
  # identity. Fork and Dependabot pull requests intentionally skip this
  # secret-bearing job and retain the full Cargo workspace suite below.
  bazel-tests:
    name: Test Bazel partition
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: plan
    if: needs.plan.outputs.bazel_trusted == 'true' && needs.plan.outputs.rust == 'true'
    environment: build-cache
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Configure shared build cache
        uses: ./.github/actions/bazel-shared-cache
        env:
          CACHE_ENDPOINT: ${{ secrets.CACHE_ENDPOINT }}
          CACHE_INSTANCE: ${{ secrets.CACHE_INSTANCE }}
          KILN_EXECUTOR_RUNTIME: ${{ secrets.KILN_EXECUTOR_RUNTIME }}
          CACHE_CA: ${{ secrets.CACHE_CA }}
          CACHE_CERT: ${{ secrets.CACHE_CERT }}
          CACHE_KEY: ${{ secrets.CACHE_KEY }}

      # Every label here is deterministic and service-free, so reusing a
      # successful result is sound. The service-backed labels are `manual` and
      # never reach this aggregate; scripts/ci/store-tests.sh runs those with
      # `--nocache_test_results`.
      - name: Test deterministic workspace suite with shared cache
        shell: bash
        run: |
          # shellcheck disable=SC2086
          # The all-targets compile proof rides the Lint job instead:
          # `//:workspace_clippy` type-checks the same 189-target workspace
          # shape `cargo check --workspace --all-targets` used to, so the
          # workspace compile aggregate does not ride this command -- it
          # would pay the workspace compile a second time on this job's
          # critical path. It remains available for local runs.
          #
          # `-//:workspace_tail_tests` subtracts the profiled long tail (the
          # `//examples/` leaves and the `dev-deferred` slow tests), which the
          # `bazel-tests-tail` job runs on a parallel runner; a core-touching
          # diff otherwise ends this leg in a ~5.5-minute agent-workbench
          # compile long after every crate test has finished.
          bazel --output_user_root="$BAZEL_OUTPUT_USER_ROOT" test \
            ${BAZEL_SHARED_CACHE_FLAGS} \
            --remote_download_outputs=minimal \
            --cache_test_results=yes --test_output=errors \
            -- //:workspace_tests -//:workspace_tail_tests

      - name: Remove client credentials
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/build-cache"

  # The second leg of the Bazel partition. `//:workspace_tail_tests` is the
  # generated tail of `//:workspace_tests` -- the `//examples/` test leaves
  # that end the serial compile chain on a core-touching diff plus the
  # `dev-deferred` slow labels -- so it runs here in parallel with the main
  # leg instead of at the end of it. Same trust gate, same pool credentials,
  # same flags: the legs differ only in which suite labels they expand.
  bazel-tests-tail:
    name: Test Bazel partition tail
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: plan
    if: needs.plan.outputs.bazel_trusted == 'true' && needs.plan.outputs.rust == 'true'
    environment: build-cache
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Configure shared build cache
        uses: ./.github/actions/bazel-shared-cache
        env:
          CACHE_ENDPOINT: ${{ secrets.CACHE_ENDPOINT }}
          CACHE_INSTANCE: ${{ secrets.CACHE_INSTANCE }}
          KILN_EXECUTOR_RUNTIME: ${{ secrets.KILN_EXECUTOR_RUNTIME }}
          CACHE_CA: ${{ secrets.CACHE_CA }}
          CACHE_CERT: ${{ secrets.CACHE_CERT }}
          CACHE_KEY: ${{ secrets.CACHE_KEY }}

      - name: Test the workspace tail suite with shared cache
        shell: bash
        run: |
          # shellcheck disable=SC2086
          bazel --output_user_root="$BAZEL_OUTPUT_USER_ROOT" test \
            ${BAZEL_SHARED_CACHE_FLAGS} \
            --remote_download_outputs=minimal \
            --cache_test_results=yes --test_output=errors \
            //:workspace_tail_tests

      - name: Remove client credentials
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/build-cache"

  # The Cargo-owned partition. On trusted events that is the agent-workbench
  # binary alone: its Node.js browser projection gate keeps it Cargo-owned,
  # while every deterministic Rust binary is now executed by the Bazel
  # partition above. There is deliberately no parallel Cargo run of the Rust
  # workspace on a trusted event. Untrusted pull requests receive no cache
  # credentials and therefore no Bazel partition, so they keep running the full
  # Cargo workspace suite exactly as they do today.
  #
  # `plan.workbench` is the workbench binary's compiled dependency closure, read
  # out of the workspace manifests by scripts/ci_plan.py, not a path prefix: a
  # change to any crate the binary links selects this job, on every event that
  # runs it.
  workspace-tests:
    name: Test Cargo workspace partition
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: plan
    if: >-
      needs.plan.outputs.workbench == 'true'
      || (needs.plan.outputs.bazel_trusted != 'true' && needs.plan.outputs.rust == 'true')
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config gc.auto 0
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force "${GITHUB_SHA}"

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Install Node for browser projection gates
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Report runner capacity
        run: |
          echo "Logical CPUs: $(nproc)"
          free -h
          df -h /

      - name: Resolve workspace test cache inputs
        id: workspace-test-cache-inputs
        run: |
          compiler_digest="$(rustc -vV | sha256sum | cut -d ' ' -f 1)"
          settings_digest="$(printf '%s\0%s\0' "${RUSTFLAGS}" "${LASH_CI_FEATURES}" | sha256sum | cut -d ' ' -f 1)"
          source_digest="$(python3 scripts/ci_workspace_cache.py digest)"
          {
            echo "compiler=${compiler_digest}"
            echo "settings=${settings_digest}"
            echo "source=${source_digest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: linux-tests
          # Workspace outputs have their own source-aware cache below.
          cache-targets: false

      # Keep the primary key source-aware so an unchanged tree gets an exact
      # hit. The compatibility prefix deliberately stops before the source
      # hash: Cargo validates restored fingerprints and incrementally rebuilds
      # a changed crate, while dependency/toolchain changes cannot cross it.
      # Only build-bearing target subtrees are retained, and cache service
      # failures never replace the test result.
      - name: Restore workspace test build outputs
        id: workspace-test-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
            target/debug/examples
            target/workspace-test-cache/source-mtimes.json
          key: >-
            workspace-tests-v2-${{ runner.os }}-${{ runner.arch }}-${{
            steps.workspace-test-cache-inputs.outputs.compiler }}-${{
            steps.workspace-test-cache-inputs.outputs.settings }}-${{
            hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml', '.cargo/**', 'rust-toolchain*', '.github/actions/rust-toolchain/**', '.github/actions/setup-mold/**', '.github/actions/install-tools/**')
            }}-${{ steps.workspace-test-cache-inputs.outputs.source }}
          restore-keys: |
            workspace-tests-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.workspace-test-cache-inputs.outputs.compiler }}-${{ steps.workspace-test-cache-inputs.outputs.settings }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml', '.cargo/**', 'rust-toolchain*', '.github/actions/rust-toolchain/**', '.github/actions/setup-mold/**', '.github/actions/install-tools/**') }}-

      - name: Restore unchanged source mtimes
        continue-on-error: true
        run: python3 scripts/ci_workspace_cache.py restore target/workspace-test-cache/source-mtimes.json

      - name: Snapshot source mtimes
        run: python3 scripts/ci_workspace_cache.py snapshot target/workspace-test-cache/source-mtimes.json

      - name: Install protoc and nextest
        uses: ./.github/actions/install-tools
        with:
          tool: protoc,nextest

      - name: Install mold
        uses: ./.github/actions/setup-mold

      # Trusted events select the generated workbench partition, which is now
      # the Node-gated browser-projection cases alone: every other
      # agent-workbench case runs on the pool in `Test Bazel partition`. The
      # selection lives in one binary, so the build is scoped to that one
      # package -- a `--workspace` build compiled and linked every crate's test
      # binaries on a 2-core runner to execute a single test. Untrusted pull
      # requests omit the filter, keep the full-workspace build (the
      # `sqlite-await-event-helper` example included, which the store
      # conformance tests spawn) and retain full-workspace coverage. In either
      # mode profile.ci excludes the nested-Cargo fault-matrix chunks run by
      # heavy-tests below and the trybuild ui binary run by `check`'s seal
      # step.
      - name: Test workspace
        env:
          BAZEL_TRUSTED: ${{ needs.plan.outputs.bazel_trusted }}
        run: |
          workbench="${{ needs.plan.outputs.workbench }}"
          case "${BAZEL_TRUSTED}" in
            true)
              if [ "${workbench}" != "true" ]; then
                echo "cargo partition selected on a trusted event without workbench" >&2
                exit 1
              fi
              filter="$(tr -d '\n' < tools/bazel/workbench_nextest_filter.txt)"
              scope=(--package agent-workbench)
              build_args=("${scope[@]}" --tests)
              nextest_args=("${scope[@]}" -E "${filter}")
              ;;
            false)
              skip='not (package(lash-internal-postgres-store) + package(lash-internal-s3-store) + test(cross_backend) + (package(lash-runtime) & binary(ui)))'
              excludes=(--exclude lash-internal-postgres-store --exclude lash-internal-s3-store)
              if [ "${workbench}" != "true" ]; then
                skip="${skip} & not package(agent-workbench)"
                excludes+=(--exclude agent-workbench)
              fi
              build_args=(--workspace "${excludes[@]}" --example sqlite-await-event-helper)
              nextest_args=(--workspace -E "${skip}")
              ;;
            *)
              echo "invalid Bazel trust decision: ${BAZEL_TRUSTED}" >&2
              exit 1
              ;;
          esac
          # shellcheck disable=SC2086
          cargo build --locked ${LASH_CI_FEATURES} "${build_args[@]}"
          # shellcheck disable=SC2086
          cargo nextest run --profile ci --locked ${LASH_CI_FEATURES} \
            --no-fail-fast "${nextest_args[@]}"

      - name: Save workspace test build outputs
        if: success() && steps.workspace-test-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
            target/debug/examples
            target/workspace-test-cache/source-mtimes.json
          key: >-
            workspace-tests-v2-${{ runner.os }}-${{ runner.arch }}-${{
            steps.workspace-test-cache-inputs.outputs.compiler }}-${{
            steps.workspace-test-cache-inputs.outputs.settings }}-${{
            hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml', '.cargo/**', 'rust-toolchain*', '.github/actions/rust-toolchain/**', '.github/actions/setup-mold/**', '.github/actions/install-tools/**')
            }}-${{ steps.workspace-test-cache-inputs.outputs.source }}

      - name: Report cache disk capacity
        if: always()
        run: bash scripts/ci/report-cache.sh

  # The heavy suite excluded from the ordinary workspace job by `profile.ci`'s
  # default-filter (see .config/nextest.toml): the five fault-matrix chunk
  # tests, which each fork real `cargo test ... -- --list` invocations and run
  # 3-9 minutes serially. They are the only tests Cargo still owns for their
  # own sake -- the property they prove is Cargo's own name-based test
  # selection, which no hermetic action can supply, so the Bazel label skips
  # them by name and this job is where they run. Deferred to the manual
  # full-profile dispatch like the other heavy jobs: any one of these tests set
  # the wall-clock of the ordinary suite, and their behavior almost never varies
  # with a PR's diff.
  heavy-tests:
    name: Test heavy suites
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: plan
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.rust == 'true'

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Install Node for browser projection gates
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: linux-debug
          save-if: false

      - name: Install protoc and nextest
        uses: ./.github/actions/install-tools
        with:
          tool: protoc,nextest

      - name: Install mold
        uses: ./.github/actions/setup-mold

      - name: Test heavy suites
        run: |
          # shellcheck disable=SC2086
          cargo nextest run --profile ci-heavy --workspace --locked ${LASH_CI_FEATURES} \
            --no-fail-fast

      - name: Report cache disk capacity
        if: always()
        run: bash scripts/ci/report-cache.sh

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: plan
    # Trusted events run the workspace clippy as cached Bazel actions, which
    # need the shared cache credentials. Untrusted events never see them and
    # keep the Cargo command below.
    environment: build-cache
    # The transcript gate reads the `Transcript:` justification from the PR
    # body. A manually dispatched run — the recovery path when GitHub stops
    # delivering a branch's events — has no pull request in its payload, so the
    # gate asks the API for it instead. Job-level and read-only: no other job
    # needs it.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune origin "+refs/heads/*:refs/remotes/origin/*"
          git fetch \
            --force --tags origin
          git fetch \
            --no-tags origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      # Every event compares against the base its own tree actually sits on.
      #
      # PRs compare with their merge-base against main, not their target
      # branch: main is the sole long-lived branch, and a stacked PR whose
      # target is a sibling layer would otherwise be judged against a tree
      # that already carries the window's one version bump. Manual workflow
      # dispatches have no meaningful base and intentionally skip it.
      # A merge-queue entry is neither: its head is a queue commit carrying one
      # or more PRs on top of the base the queue chose, so HEAD~1 would check
      # only the last commit of a multi-commit PR — passing vacuously when the
      # change is earlier, and failing falsely when the bump is earlier. The
      # queue states the base it built on, so use it.
      # The PR guarantee requires a current merge ref, enforced by an up-to-date
      # branch rule or merge queue; a stale merge ref has a stale merge-base.
      # Manual recovery runs skip this gate and immediately emit a warning summary
      # so their green conclusion cannot be mistaken for version-surface proof.
      - name: Check versioned surface bumps
        if: github.event_name != 'workflow_dispatch'
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$(git merge-base origin/main HEAD)"
          elif [[ "$GITHUB_EVENT_NAME" == "merge_group" ]]; then
            base="$MERGE_GROUP_BASE_SHA"
            [ -n "$base" ] || { echo "merge_group event carried no base_sha"; exit 1; }
          else
            echo "unexpected event $GITHUB_EVENT_NAME for the bump gate"; exit 1
          fi
          python3 scripts/check_version_bumps.py --base "$base"

      - name: Explain skipped versioned surface bump gate
        if: github.event_name == 'workflow_dispatch'
        run: bash scripts/ci/report-manual-dispatch-skips.sh

      # A service-backed suite that skips itself reports green having compared
      # nothing. This pins both mechanisms that stop it: the LASH_REQUIRE_*
      # flags that turn a missing service into a failure, and the
      # --run-ignored/--include-ignored opt-in that the cross-backend
      # differential's `#[ignore]`d tests need in order to run at all.
      - name: Pin service gates
        run: python3 scripts/check_service_gate_pinning.py

      # GitHub rejects some workflow files that plain YAML parsing accepts
      # (e.g. expressions in contexts where they are not allowed); actionlint
      # validates against the real workflow schema. The release binary is
      # pinned by version and by the sha256 from the upstream release
      # checksums asset.
      - name: Lint GitHub workflows
        run: |
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.10/actionlint_1.7.10_linux_amd64.tar.gz"
          echo "f4c76b71db5755a713e6055cbb0857ed07e103e028bda117817660ebadb4386f  ${RUNNER_TEMP}/actionlint.tar.gz" | sha256sum -c
          tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -no-color

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          components: clippy, rustfmt


      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          # The `check` job is the sole writer of the shared linux-debug cache;
          # the lint job only reads it so clippy reuses the checked dependency
          # graph.
          shared-key: linux-debug
          save-if: false

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Install mold
        uses: ./.github/actions/setup-mold

      # `cargo fmt --all --check` and the same `--all-targets` clippy the local
      # `just push-gate` runs, plus the two boundary guards that otherwise gate
      # nothing.
      # The clippy feature set mirrors the `check` workspace lane so the
      # dependency graph resolves identically.
      - name: Check formatting
        run: |
          cargo fmt --all --check
          # include!d files escape cargo fmt's module walk. The scoped scan
          # finds every one under the scopes it covers, so a new include! is
          # checked the moment it exists rather than when someone remembers to
          # add it here.
          python3 scripts/check_included_file_formatting.py

      - name: Configure Bazel shared cache
        if: needs.plan.outputs.bazel_trusted == 'true'
        uses: ./.github/actions/bazel-shared-cache
        # Lint is the designated writer of the shared repository cache:
        # it is the one Bazel job that runs for every trusted event, so the
        # key stays warm even on a run whose plan skips the other two.
        with:
          save-repository-cache: "true"
          save-output-base: "true"
        env:
          CACHE_ENDPOINT: ${{ secrets.CACHE_ENDPOINT }}
          CACHE_INSTANCE: ${{ secrets.CACHE_INSTANCE }}
          KILN_EXECUTOR_RUNTIME: ${{ secrets.KILN_EXECUTOR_RUNTIME }}
          CACHE_CA: ${{ secrets.CACHE_CA }}
          CACHE_CERT: ${{ secrets.CACHE_CERT }}
          CACHE_KEY: ${{ secrets.CACHE_KEY }}

      # `//:workspace_clippy` runs one clippy action per first-party target of
      # the resolved default workspace graph — the `--workspace --all-targets`
      # shape — with the `[workspace.lints]` table, the nearest `clippy.toml`
      # and a trailing `-D warnings`, in the order Cargo emits them. See
      # `tools/bazel/clippy.bzl`.
      #
      # `//:feature_lane_clippy` lints the slack-clone `e2e` variant in the
      # same invocation. #1591 ran that leg as a Cargo command beside this one
      # so it would not queue behind it; it is a Bazel label now, so it rides
      # the same remote execution instead of this runner's four cores. The
      # lint set, the feature set and the trailing `-D warnings` are the ones
      # the Cargo leg carried.
      - name: Clippy (workspace, all targets, shared cache)
        if: needs.plan.outputs.bazel_trusted == 'true'
        shell: bash
        run: |
          # shellcheck disable=SC2086
          bazel --output_user_root="$RUNNER_TEMP/bazel-output" build \
            ${BAZEL_SHARED_CACHE_FLAGS} \
            --remote_download_outputs=minimal \
            //:workspace_clippy //:feature_lane_clippy

      - name: Remove client credentials
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/build-cache"

      # Untrusted pull requests receive no cache credentials and keep exactly
      # the Cargo command that predates the Bazel branch above.
      - name: Clippy (workspace, all targets)
        if: needs.plan.outputs.bazel_trusted != 'true'
        run: |
          # shellcheck disable=SC2086
          cargo clippy --workspace --all-targets --locked ${LASH_CI_FEATURES} -- -D warnings

      # `slack-clone`'s `e2e` feature is outside the resolved default workspace
      # graph, so it used to have no Bazel label and this 106 s Cargo compile
      # ran on every event. It has one now: `//:feature_lane_clippy` lints the
      # feature-lane variants of the same targets, above. `slack-clone`
      # declares no `default` feature, so the lane's `--no-default-features
      # --features e2e` resolution is the resolution this command used.
      # Untrusted events receive no cache credentials and keep the Cargo path.
      - name: Clippy (slack-clone e2e feature)
        if: needs.plan.outputs.bazel_trusted != 'true'
        run: cargo clippy -p slack-clone --all-targets --features e2e --locked --no-deps -- -D warnings

      - name: Check Restate handler panic boundary
        run: python3 scripts/check-restate-handler-panics.py

      - name: Enforce durable transcript justification
        env:
          # Needed only by the dispatch path, where the justification has to be
          # read from the pull request rather than the event payload.
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check-transcript-diff.py --enforce

      - name: Check PostgreSQL payload-shape component version
        run: |
          python3 scripts/check-postgres-json-carrier-coverage.py
          python3 scripts/check-postgres-payload-shape-version.py

      # One owner per table across both SQL stores (FIG-3380): no stray
      # statement, no duplicate, no shadowed shared statement, and every
      # dialect-only operation named in the manifest with a reason.
      - name: Check store SQL ownership
        run: python3 scripts/check-store-sql-ownership.py

      # The recreation E2E's fixtures are pinned to the newest component
      # generation. Catch a stale pin here rather than one container gate later.
      - name: Check version-bump recreation fixtures
        run: python3 scripts/check_version_bump_fixtures.py

      # A pub law added to a macro-support module but never catalogued compiles
      # and simply never runs on any backend; this names it before merge.
      - name: Check conformance law registration
        run: python3 scripts/check_conformance_law_registration.py

      - name: Check core/UI boundary
        run: bash scripts/check-core-ui-boundary.sh

      - name: Check substrate boundary
        run: bash scripts/check-substrate-boundary.sh

      - name: Check workflow graph model
        run: bash scripts/check-workflow-graph-model.sh

      - name: Check production file-size budget
        run: bash scripts/check-production-file-size.sh

  unicode-tests:
    name: Test deferred Unicode suites
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: plan
    if: >-
      github.event_name == 'workflow_dispatch'
      && (needs.plan.outputs.regress == 'true' || needs.plan.outputs.fail_open == 'true')
    environment: build-cache
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Configure shared build cache
        if: needs.plan.outputs.bazel_trusted == 'true'
        uses: ./.github/actions/bazel-shared-cache
        env:
          CACHE_ENDPOINT: ${{ secrets.CACHE_ENDPOINT }}
          CACHE_INSTANCE: ${{ secrets.CACHE_INSTANCE }}
          KILN_EXECUTOR_RUNTIME: ${{ secrets.KILN_EXECUTOR_RUNTIME }}
          CACHE_CA: ${{ secrets.CACHE_CA }}
          CACHE_CERT: ${{ secrets.CACHE_CERT }}
          CACHE_KEY: ${{ secrets.CACHE_KEY }}

      - name: Test deferred Unicode suites (Bazel)
        if: needs.plan.outputs.bazel_trusted == 'true'
        shell: bash
        run: |
          # shellcheck disable=SC2086
          bazel --output_user_root="$BAZEL_OUTPUT_USER_ROOT" test \
            ${BAZEL_SHARED_CACHE_FLAGS} \
            --cache_test_results=yes --test_output=errors \
            //:deferred_tests

      - name: Test deferred Unicode suites (Cargo)
        if: needs.plan.outputs.bazel_trusted != 'true'
        run: cargo test -p lash-regress --test unicodesets --locked

      - name: Remove client credentials
        if: always() && needs.plan.outputs.bazel_trusted == 'true'
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/build-cache"

  postgres-store:
    name: Test Postgres store (PG ${{ matrix.postgres }}, ${{ matrix.role }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: plan
    # Trusted events build every binary below from the shared cache; the
    # PostgreSQL version and connection settings are execution-only inputs, so
    # all three matrix legs reuse one set of compiled outputs. Untrusted events
    # receive no credentials and keep the Cargo compile. See
    # scripts/ci/store-tests.sh.
    #
    # Each suite runs inside `scripts/ci/with-service.sh pg<major>`, which owns
    # the image, the container environment, the readiness probe and the
    # connection URL, publishes the database on a free ephemeral port of the
    # loopback interface, and removes the container on every exit path. A
    # developer runs the identical line on their own box, so there is one code
    # path and one copy of these facts rather than a workflow `services:` block
    # and a second local runner.
    environment: build-cache
    # The require flag stays at job level so no step can lose it on its own; the
    # connection URL cannot, because the port is chosen per step by
    # `with-service.sh` and a job-level literal would be a lie.
    env:
      BAZEL_TRUSTED: ${{ needs.plan.outputs.bazel_trusted }}
      LASH_REQUIRE_POSTGRES: "1"
    # The stores family is path-derived: only diffs touching a store crate, a
    # migrations path, or a `.sql` file pay this leg; every other pull request
    # used to spend 7-18 minutes of runner Cargo on PG16 for evidence nothing
    # in the diff could change. The heavier PG16 store/perf coverage remains
    # deferred to the manual full-profile dispatch, which still runs the full
    # matrix, per the 2026-08-25 CI-scope ruling.
    if: needs.plan.outputs.stores == 'true'

    # The structural schema check at open (`SchemaProvisioning`/`SchemaCheck`)
    # compares the live catalog against a generated expectation artifact, so a
    # catalog attribute that renders differently on a major lash has not tested
    # would reject every host on that major with no remedy but a lash release.
    # 14 and 18 bracket the supported range — 18 is where NOT NULL became
    # `pg_constraint` rows, 14 is before `pg_index.indnullsnotdistinct` existed —
    # and the shape suite asserts all three produce the byte-identical artifact.
    # PG14 and PG18 are compatibility lanes: they run only the live catalog
    # artifact comparison and a focused version-stamp gate, so they are deferred
    # off the pull-request critical path and run on merge_group and
    # workflow_dispatch. Nothing reaches trunk without all three majors: the
    # merge queue runs the full matrix before anything lands.
    # scripts/ci_plan.py `postgres-matrix` owns the per-event matrix. PG16 is
    # the sole primary lane and runs on every event. On PR-class events it runs
    # the proven runtime identity oracle; on full-profile runs it retains the
    # package-wide, pool-wait, runtime, and cross-backend behavior coverage
    # without triplicating it across majors.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.postgres_matrix) }}

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Configure shared build cache
        if: needs.plan.outputs.bazel_trusted == 'true'
        uses: ./.github/actions/bazel-shared-cache
        env:
          CACHE_ENDPOINT: ${{ secrets.CACHE_ENDPOINT }}
          CACHE_INSTANCE: ${{ secrets.CACHE_INSTANCE }}
          KILN_EXECUTOR_RUNTIME: ${{ secrets.KILN_EXECUTOR_RUNTIME }}
          CACHE_CA: ${{ secrets.CACHE_CA }}
          CACHE_CERT: ${{ secrets.CACHE_CERT }}
          CACHE_KEY: ${{ secrets.CACHE_KEY }}

      - name: Install Rust toolchain
        if: needs.plan.outputs.bazel_trusted != 'true'
        uses: ./.github/actions/rust-toolchain

      - name: Restore cargo cache
        if: needs.plan.outputs.bazel_trusted != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: linux-debug
          save-if: false

      - name: Install protoc and nextest
        if: needs.plan.outputs.bazel_trusted != 'true'
        uses: ./.github/actions/install-tools
        with:
          tool: protoc,nextest

      # Provides the linker the workflow-level RUSTFLAGS names. This job
      # restores the `linux-debug` cache and installs its linker directly.
      - name: Install mold
        if: needs.plan.outputs.bazel_trusted != 'true'
        uses: ./.github/actions/setup-mold

      # `with-service.sh` exports LASH_REQUIRE_POSTGRES=1 alongside the URL, so
      # a database this step could not reach fails the lane instead of silently
      # skipping it.
      - name: Test PostgreSQL catalog compatibility
        if: matrix.role == 'compatibility'
        run: |
          bash scripts/ci/with-service.sh "pg${{ matrix.postgres }}" -- \
            bash scripts/ci/store-tests.sh pg-catalog-compatibility

      # `lash-postgres-store`'s conformance tests run the backend-agnostic
      # RuntimePersistence / SessionStoreFactory / ProcessRegistry /
      # TriggerStore / LashlangArtifactStore suites against a real Postgres.
      # `connect()` applies the crate's `schema.sql` artifact itself, so there
      # is no separate migrate step. The same run
      # carries the `schema_shape` and `schema_drift` suites, which assert this
      # major produces the committed expectation artifact byte-for-byte and that
      # each seeded drift class is rejected by name.
      # The suites self-serialize on a shared in-process guard (they share one
      # database and reset() truncates all lash_* tables), so no --test-threads=1.
      # That guard is per-process, so this must stay `cargo test` — nextest's
      # process-per-test model would race the suites against each other.
      # Keep this package-wide: tests/attempt_atomicity.rs is part of this gate;
      # narrowing to --test conformance would silently drop attempt atomicity.
      - name: Test Postgres store (conformance and attempt atomicity)
        if: matrix.role == 'primary' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: |
          bash scripts/ci/with-service.sh "pg${{ matrix.postgres }}" -- \
            bash scripts/ci/store-tests.sh pg-store

      - name: Test runtime pool-wait binding
        if: matrix.role == 'primary' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: |
          bash scripts/ci/with-service.sh "pg${{ matrix.postgres }}" -- \
            bash scripts/ci/store-tests.sh pg-pool-wait

      # crates/lash currently has one Agent Scenario gated by the shared
      # LASH_POSTGRES_DATABASE_URL/LASH_REQUIRE_POSTGRES helper. It is also the
      # test that caught a real identity-version mutation, so keep it stable and
      # focused instead of scheduling tests by parsing changed source literals.
      - name: Test runtime Postgres agent scenarios
        if: matrix.role == 'primary'
        run: |
          bash scripts/ci/with-service.sh "pg${{ matrix.postgres }}" -- \
            bash scripts/ci/store-tests.sh pg-agent-scenario

      # The simulator's backend-fault scenarios against a real PostgreSQL. They
      # compare fault semantics, not catalog rendering, so they run once on the
      # primary major instead of three times.
      - name: Test simulator backend faults on Postgres
        if: matrix.role == 'primary' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: |
          bash scripts/ci/with-service.sh "pg${{ matrix.postgres }}" -- \
            bash scripts/ci/store-tests.sh pg-sim-backend-faults

      # The full differential compares backend semantics, not catalog rendering,
      # so it runs once on the primary major instead of three times.
      - name: Test cross-backend store differential
        if: matrix.role == 'primary' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: |
          bash scripts/ci/with-service.sh "pg${{ matrix.postgres }}" -- \
            bash scripts/ci/store-tests.sh pg-cross-backend
        env:
          LASH_CROSS_BACKEND_CASES: "4"

      - name: Remove client credentials
        if: always() && needs.plan.outputs.bazel_trusted == 'true'
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/build-cache"

