name: API example coverage (advisory)

on:
  workflow_dispatch:
  # PR execution is the eventual blocking point. Keep the scrape scoped to
  # facade definitions, crates whose public members can flow through those
  # facades, the three compiled consumers, and the evidence implementation.
  pull_request:
    paths:
      - ".github/actions/rust-toolchain/**"
      - ".github/workflows/api-evidence.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/lash/**"
      - "crates/lash-core/**"
      - "crates/lash-http-transport/**"
      - "crates/lash-lashlang-runtime/**"
      - "crates/lash-plugin-tool-output-budget/**"
      - "crates/lash-protocol-rlm/**"
      - "crates/lash-restate/**"
      - "crates/lash-remote-protocol/**"
      - "crates/lash-rlm-types/**"
      - "crates/lash-sansio/**"
      - "crates/lash-tool-support/**"
      - "crates/lash-trace/**"
      - "crates/lash-typescript/**"
      - "crates/lashlang/**"
      - "examples/agent-service/**"
      - "examples/agent-workbench/**"
      - "examples/slack-clone/**"
      - "scripts/api_evidence.py"
      - "scripts/api_surface.py"
      - "scripts/rustdoc_json_cache.py"
  push:
    branches:
      - main
    paths:
      - ".github/actions/rust-toolchain/**"
      - ".github/workflows/api-evidence.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/lash/**"
      - "crates/lash-core/**"
      - "crates/lash-http-transport/**"
      - "crates/lash-lashlang-runtime/**"
      - "crates/lash-plugin-tool-output-budget/**"
      - "crates/lash-protocol-rlm/**"
      - "crates/lash-restate/**"
      - "crates/lash-remote-protocol/**"
      - "crates/lash-rlm-types/**"
      - "crates/lash-sansio/**"
      - "crates/lash-tool-support/**"
      - "crates/lash-trace/**"
      - "crates/lash-typescript/**"
      - "crates/lashlang/**"
      - "examples/agent-service/**"
      - "examples/agent-workbench/**"
      - "examples/slack-clone/**"
      - "scripts/api_evidence.py"
      - "scripts/api_surface.py"
      - "scripts/rustdoc_json_cache.py"

permissions:
  contents: read

concurrency:
  group: api-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-derived-call-index:
    name: Compiler-derived call index (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Residual direct-call gaps on current main keep this advisory. Remove this
    # and the evidence step's override only after the local check is clean.
    continue-on-error: true

    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch --tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Install stable Rust
        uses: ./.github/actions/rust-toolchain

      - name: Install nightly rustdoc
        run: rustup toolchain install nightly --profile minimal --no-self-update

      - name: Restore evidence cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: api-evidence

      - name: Derive compiled example call evidence
        id: evidence
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/api_evidence.py --check --all-gaps | tee api-evidence.txt

      - name: Publish advisory report
        if: always()
        run: |
          {
            if [[ -f api-evidence.txt ]]; then
              echo '```text'
              cat api-evidence.txt
              echo '```'
            else
              echo "The evidence command failed before producing a report."
            fi
            if [[ "${EVIDENCE_OUTCOME}" != "success" ]]; then
              echo
              echo "Advisory only: compiler-derived evidence has residual gaps or did not complete."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
        env:
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
