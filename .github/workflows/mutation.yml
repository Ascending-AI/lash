name: Mutation

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  LASH_CONFIDENCE_BOOTSTRAP: "1"
  LASH_CONFIDENCE_OUT_DIR: ${{ github.workspace }}/target/confidence

jobs:
  mutation:
    name: Core replay and commit mutations
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'mutation-requested') &&
       (github.event.action != 'labeled' || github.event.label.name == 'mutation-requested'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch \
            --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain


      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: true
          shared-key: confidence

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Run targeted mutation gate
        run: bash scripts/confidence-gate.sh mutation

      - name: Upload mutation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-replay-commit-mutation-attempt-${{ github.run_attempt }}
          path: target/confidence/mutation/**
