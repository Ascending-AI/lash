name: Dependency policy

on:
  pull_request:
    paths:
      - Cargo.lock
      - deny.toml
      - .github/workflows/deny.yml
  push:
    branches:
      - main
    paths:
      - Cargo.lock
      - deny.toml
      - .github/workflows/deny.yml
  # Advisories are time-varying: a RUSTSEC entry published against an
  # unchanged Cargo.lock would otherwise stay invisible until an unrelated
  # dependency bump surfaces it as a surprise failure on that PR.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git fetch --tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: Check dependency policy
        run: cargo deny check
