name: Dependency policy

on:
  pull_request:
    paths:
      - Cargo.lock
      - deny.toml
      - .github/workflows/deny.yml
  push:
    branches:
      - main
    paths:
      - Cargo.lock
      - deny.toml
      - .github/workflows/deny.yml
  # Advisories are time-varying: a RUSTSEC entry published against an
  # unchanged Cargo.lock would otherwise stay invisible until an unrelated
  # dependency bump surfaces it as a surprise failure on that PR.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: ./.github/actions/git-checkout
        with:
          tags: 'true'

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: Check dependency policy
        run: cargo deny check
