name: Version bumps

# The strict version-bump gate (FIG-4494) on main: a guarded shape that
# changes without its version constant bumping, a bump without its upgrade
# evidence, and a guard that cannot be evaluated all fail it. It has no
# report-only mode.
#
# Pull requests, merge groups and dispatches run the same gate as the
# `version-bumps` job of ci.yml, inside the required CI conclusion, and
# release.yml runs it before it publishes. This workflow covers what those
# cannot see: a commit pushed straight to main, compared with main's
# previous tip.

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version-bumps:
    name: Strict version-bump gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config gc.auto 0
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          # Bounded and retried: a fetch that hangs used to hold the runner until the
          # job timeout. CHECKOUT_TAGS=--tags on the step fetches tags as well.
          for attempt in 1 2 3; do
            if timeout --kill-after=10 180 git fetch "${CHECKOUT_TAGS:---no-tags}" --prune --depth=1 origin "${GITHUB_SHA}"; then
              break
            fi
            [ "${attempt}" -lt 3 ] || exit 1
            echo "::warning::git fetch attempt ${attempt} failed; retrying"
            sleep $((attempt * 5))
          done
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git checkout --detach --force FETCH_HEAD

      # The baseline is main's previous tip. A baseline that cannot be named
      # or fetched fails the job; the gate never guesses one.
      - name: Fetch the baseline
        id: baseline
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base_sha="${PUSH_BEFORE_SHA}"
          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            echo "::error::the event names no baseline commit"
            exit 1
          fi
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            fetch --no-tags --prune --depth=1 origin "${base_sha}"
          git rev-parse --verify "${base_sha}^{commit}" >/dev/null
          echo "sha=${base_sha}" >> "${GITHUB_OUTPUT}"

      # What each constant guards is derived from its root types. The gate
      # below fails on a reachable type it cannot resolve; this prints the
      # closures it compares, with their cycles and opaque types.
      - name: Report the derived guard sets
        run: python3 scripts/version_guard_closure.py >> "${GITHUB_STEP_SUMMARY}"

      - name: Check version bumps
        env:
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
        run: bash scripts/ci/version-bump-gate.sh "${GITHUB_SHA}" "${BASE_SHA}"
