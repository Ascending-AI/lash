name: Release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Commit on main to release (blank uses the current main head)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: lash-release-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-release:
    name: Prepare manual release
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
      release_tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Check out main with release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and validate release commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --force origin main --tags

          requested="${REQUESTED_SHA:-origin/main}"
          sha="$(git rev-parse "${requested}^{commit}")"
          if ! git merge-base --is-ancestor "${sha}" origin/main; then
            echo "Release commit ${sha} is not on main." >&2
            exit 1
          fi

          runs_file="$(mktemp)"
          gh run list --workflow ci.yml --commit "${sha}" --limit 20 \
            --json conclusion,databaseId,displayTitle,event,headSha,status,url,workflowName > "${runs_file}"
          python3 - "${sha}" "${runs_file}" <<'PY'
          import json
          import pathlib
          import sys

          sha = sys.argv[1]
          runs = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          matching = [
              run
              for run in runs
              if run.get("headSha") == sha
              and run.get("event") in ("push", "workflow_dispatch")
          ]
          if not matching:
              raise SystemExit(
                  f"release refused: no main CI run found for target {sha}"
              )
          run = matching[0]
          if (
              run.get("status") != "completed"
              or run.get("conclusion") != "success"
          ):
              state = (
                  run.get("conclusion")
                  if run.get("status") == "completed"
                  else run.get("status")
              )
              raise SystemExit(
                  "release refused: target "
                  f"{sha} has no successful main CI run; latest matching "
                  f"{run.get('workflowName', 'CI')} run {run.get('databaseId')} "
                  f"({run.get('displayTitle', 'untitled')}) is {state}: "
                  f"{run.get('url', 'URL unavailable')}"
              )
          PY

          git checkout --detach "${sha}"
          tag="$(git tag --points-at "${sha}" --list 'v*' --sort=-v:refname | head -n 1)"
          if [ -z "${tag}" ]; then
            python3 scripts/release_notes.py collect --require --end "${sha}" >/dev/null
            version="$(python3 scripts/release_version.py print-next)"
            tag="v${version}"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "Computed release tag ${tag} already exists on another commit." >&2
              exit 1
            fi
          fi

          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Validating ${sha} for ${tag}." >> "${GITHUB_STEP_SUMMARY}"

  validate-release-ref:
    name: Validate release ref
    runs-on: blacksmith-16vcpu-ubuntu-2404
    needs: prepare-release

    services:
      postgres:
        image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777 # postgres:16-alpine
        env:
          POSTGRES_USER: lash
          POSTGRES_PASSWORD: lash
          POSTGRES_DB: lash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lash -d lash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      LASH_POSTGRES_DATABASE_URL: postgres://lash:lash@localhost:5432/lash

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Restore cargo cache
        uses: useblacksmith/rust-cache@f53e7f127245d2a269b3d90879ccf259876842d5 # v3.0.1
        with:
          cache-bin: false
          # Restore-only against the release cache ci.yml warms on main.
          shared-key: linux-release
          save-if: false

      - name: Install protoc
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: protoc

      - name: Validate locked workspace metadata
        run: cargo metadata --format-version 1 --locked >/dev/null

      - name: Run full runtime performance checks
        run: |
          python3 scripts/profile_runtime.py --profile full --release --scenario all --enforce-budgets --out .benchmarks/perf-guard/runtime.json
          python3 scripts/profile_lashlang.py --iterations 2500 --profile-iterations 2500 --enforce-budgets --out .benchmarks/perf-guard/lashlang.json

      - name: Publish performance summaries
        run: |
          python3 scripts/perfreport.py .benchmarks/perf-guard/runtime.json >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/perfreport.py .benchmarks/perf-guard/lashlang.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload performance guard artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-perf-guard-${{ needs.prepare-release.outputs.release_tag }}-attempt-${{ github.run_attempt }}
          path: .benchmarks/perf-guard/*
          if-no-files-found: warn

  publish-crates:
    name: Publish crates to crates.io
    runs-on: ubuntu-latest
    needs: [prepare-release, validate-release-ref]
    # CARGO_REGISTRY_TOKEN lives in the `main` GitHub Environment; a job must
    # declare the environment to read its secrets.
    environment: main
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Validate immutable release source
        env:
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [ "${head_sha}" != "${RELEASE_SHA}" ]; then
            echo "Release checkout ${head_sha} does not match validated SHA ${RELEASE_SHA}." >&2
            exit 1
          fi

          git fetch --force origin --tags
          tag_sha="$(git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}" || true)"
          if [ -n "${tag_sha}" ] && [ "${tag_sha}" != "${RELEASE_SHA}" ]; then
            echo "Release tag ${RELEASE_TAG} points to ${tag_sha}, not validated SHA ${RELEASE_SHA}." >&2
            exit 1
          fi

      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          path: .release-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # Publishes every publishable workspace member in topological dependency
      # layers (crates within a layer publish concurrently under a conservative
      # cap; the publisher waits for crates.io API visibility once per layer).
      # publish=false crates are skipped; versions already visible on crates.io
      # are skipped, so reruns resume after partial publication.
      #
      # --version stamps the real release version into the validated checkout's
      # manifests + lockfile before reading the graph and publishing: `main`
      # carries the 0.0.0-dev placeholder, so this is what makes the published
      # crates pin the real version. The stamp runs the validated checkout's own
      # scripts/release_version.py (the publisher script itself is the pinned
      # `.release-tools` copy).
      #
      # --no-verify: skip redundant per-crate verify-builds. The release is cut
      # from a fully CI-tested `main`; the publisher packages and uploads that
      # already-tested code directly.
      #
      # Auth: a crates.io API token in the CARGO_REGISTRY_TOKEN secret. This is
      # required for the *first* publish of brand-new crates, because crates.io
      # Trusted Publishing can only be configured on a crate that already
      # exists. Once every crate has been published once and a trusted
      # publisher (repo + this workflow) is configured for each, switch to
      # OIDC by adding `id-token: write` to this job's permissions, a
      # `rust-lang/crates-io-auth-action@v1` step (id: auth), and setting
      # CARGO_REGISTRY_TOKEN to `${{ steps.auth.outputs.token }}` — then the
      # long-lived secret can be removed.
      - name: Publish workspace to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: python3 .release-tools/scripts/publish_workspace.py --version "${RELEASE_TAG#v}"


  publish:
    name: Publish SDK release
    runs-on: ubuntu-latest
    needs: [prepare-release, publish-crates]
    permissions:
      contents: write
      actions: write
    env:
      RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          # Full history + tags: release_notes.py walks previous-tag..tag to
          # assemble the curated release body.
          fetch-depth: 0
          fetch-tags: true

      # Curated notes from `Release-Notes:` commit sections become the release
      # body; the auto-generated commit list is appended below. Written
      # outside dist/ so it is not uploaded as an asset. prepare-release has
      # already required curated notes before creating a new tag.
      - name: Collect release notes
        run: python3 scripts/release_notes.py collect --end "${RELEASE_SHA}" --out "${{ runner.temp }}/RELEASE_NOTES.md"

      - name: Publish validated release tag
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [ "${head_sha}" != "${RELEASE_SHA}" ]; then
            echo "Release checkout ${head_sha} does not match validated SHA ${RELEASE_SHA}." >&2
            exit 1
          fi

          git fetch --force origin main --tags
          tag_sha="$(git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}" || true)"
          if [ -n "${tag_sha}" ]; then
            if [ "${tag_sha}" != "${RELEASE_SHA}" ]; then
              echo "Release tag ${RELEASE_TAG} points to ${tag_sha}, not validated SHA ${RELEASE_SHA}." >&2
              exit 1
            fi
            echo "Release tag ${RELEASE_TAG} already points to ${RELEASE_SHA}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${RELEASE_TAG}" "${RELEASE_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: ${{ runner.temp }}/RELEASE_NOTES.md
          generate_release_notes: true

      # The release is already public at this point. Keep the checked-in docs
      # pin synchronized without allowing a transient main-branch race (or any
      # other docs-bump failure) to turn a successful publish red.
      - name: Stamp published version into docs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'echo "::warning title=Docs pin bump failed::The release was published, but its automated docs pin bump failed. Update the docs pin manually."' ERR

          version="${RELEASE_TAG#v}"
          git fetch --force origin main --tags
          latest_tag="$(git tag --list 'v*' --sort=-v:refname | sed -n '1p')"
          if [ "${latest_tag}" != "${RELEASE_TAG}" ]; then
            echo "Skipping docs pin for superseded ${RELEASE_TAG}; newer release tag ${latest_tag} already exists."
            echo "Skipped docs pin for superseded ${RELEASE_TAG}; newer release ${latest_tag} exists." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          git checkout -B release-docs-pin origin/main
          python3 scripts/release_version.py stamp-docs "${version}"
          python3 scripts/lint_docs.py

          if [ -z "$(git status --short)" ]; then
            echo "Docs already reference ${version}; no commit needed."
            echo "Docs already reference ${version}; no commit was created." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit \
            -m "docs: stamp release ${version}" \
            -m "Release-Notes: Internal: Stamp documentation version pins for ${version}."

          max_attempts=3
          attempt=1
          while true; do
            echo "Pushing docs pin to main (attempt ${attempt}/${max_attempts})."
            if git push origin HEAD:main; then
              echo "Stamped docs for ${version} on main." >> "${GITHUB_STEP_SUMMARY}"
              git fetch --force origin main
              if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
                if gh workflow run ci.yml --ref main; then
                  echo "Dispatched CI for the docs pin commit." >> "${GITHUB_STEP_SUMMARY}"
                else
                  echo "::warning title=Docs pin CI dispatch failed::The docs pin reached main, but its CI run could not be dispatched."
                  echo "WARNING: CI was not dispatched for the docs pin commit." >> "${GITHUB_STEP_SUMMARY}"
                fi
              else
                echo "A newer main commit superseded the docs pin head and owns CI validation." >> "${GITHUB_STEP_SUMMARY}"
              fi
              exit 0
            fi

            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "::warning title=Docs pin push exhausted::The release was published, but the docs pin could not be pushed to main after ${max_attempts} attempts."
              echo "WARNING: docs pin for ${version} was not pushed after ${max_attempts} attempts; update it manually." >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi

            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::warning title=Docs pin rebase failed::The release was published, but the docs pin commit conflicted with main."
              echo "WARNING: docs pin for ${version} conflicted with main; update it manually." >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            attempt=$((attempt + 1))
          done
