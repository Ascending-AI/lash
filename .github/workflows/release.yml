name: Release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Commit on main to release (blank uses the current main head)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: lash-release-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-release:
    name: Prepare manual release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
      release_tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Check out main with release history
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          auth_config="${RUNNER_TEMP}/lash-git-auth-${GITHUB_JOB}.config"
          umask 077
          {
            printf '[http]\n'
            printf '\textraHeader = %s\n' "AUTHORIZATION: basic ${auth_header}"
          } > "${auth_config}"
          git config --local include.path "${auth_config}"
          git fetch --no-tags --prune origin "+refs/heads/main:refs/remotes/origin/main"
          git fetch --force --tags origin
          git checkout --force --detach origin/main

      - name: Resolve and validate release commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --force origin main --tags

          requested="${REQUESTED_SHA:-origin/main}"
          sha="$(git rev-parse "${requested}^{commit}")"
          if ! git merge-base --is-ancestor "${sha}" origin/main; then
            echo "Release commit ${sha} is not on main." >&2
            exit 1
          fi

          runs_file="$(mktemp)"
          gh run list --workflow ci.yml --commit "${sha}" --limit 20 \
            --json conclusion,databaseId,displayTitle,event,headSha,status,url,workflowName > "${runs_file}"
          python3 - "${sha}" "${runs_file}" <<'PY'
          import json
          import pathlib
          import sys

          sha = sys.argv[1]
          runs = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          # Push runs execute the lean CI profile (primary Postgres major
          # only, no workers E2E); only a workflow_dispatch run executes the
          # full profile, so it is the only run class that certifies a
          # release.
          matching = [
              run
              for run in runs
              if run.get("headSha") == sha
              and run.get("event") == "workflow_dispatch"
          ]
          if not matching:
              raise SystemExit(
                  "release refused: no full-profile (workflow_dispatch) CI "
                  f"run found for target {sha}; dispatch the CI workflow on "
                  "main at that commit and rerun once it is green"
              )
          run = matching[0]
          if (
              run.get("status") != "completed"
              or run.get("conclusion") != "success"
          ):
              state = (
                  run.get("conclusion")
                  if run.get("status") == "completed"
                  else run.get("status")
              )
              raise SystemExit(
                  "release refused: target "
                  f"{sha} has no successful main CI run; latest matching "
                  f"{run.get('workflowName', 'CI')} run {run.get('databaseId')} "
                  f"({run.get('displayTitle', 'untitled')}) is {state}: "
                  f"{run.get('url', 'URL unavailable')}"
              )
          PY

          git checkout --detach "${sha}"
          tag="$(git tag --points-at "${sha}" --list 'v*' --sort=-v:refname | head -n 1)"
          if [ -z "${tag}" ]; then
            version="$(python3 scripts/release_version.py print-next)"
            tag="v${version}"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "Computed release tag ${tag} already exists on another commit." >&2
              exit 1
            fi
          fi

          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Validating ${sha} for ${tag}." >> "${GITHUB_STEP_SUMMARY}"

  validate-release-ref:
    name: Validate release ref
    runs-on: ubuntu-24.04
    # Cold-cache mode: a release cut after a Cargo.lock bump misses the
    # linux-release cache and rebuilds the workspace in release profile
    # (~11m on this runner class) before profiling.
    timeout-minutes: 60
    needs: prepare-release

    services:
      postgres:
        image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777 # postgres:16-alpine
        env:
          POSTGRES_USER: lash
          POSTGRES_PASSWORD: lash
          POSTGRES_DB: lash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lash -d lash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      LASH_POSTGRES_DATABASE_URL: postgres://lash:lash@localhost:5432/lash
      # Required mode: a Postgres service that failed to start must fail this
      # leg rather than let its suites skip themselves green.
      LASH_REQUIRE_POSTGRES: "1"

    steps:
      - name: Check out repository
        # Equivalent to checkout ref: ${{ needs.prepare-release.outputs.release_sha }}.
        env:
          CHECKOUT_REF: ${{ needs.prepare-release.outputs.release_sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          auth_config="${RUNNER_TEMP}/lash-git-auth-${GITHUB_JOB}.config"
          umask 077
          {
            printf '[http]\n'
            printf '\textraHeader = %s\n' "AUTHORIZATION: basic ${auth_header}"
          } > "${auth_config}"
          git config --local include.path "${auth_config}"
          git fetch --no-tags --prune --depth=1 origin "${CHECKOUT_REF}"
          git checkout --force --detach FETCH_HEAD

      - name: Reclaim runner disk
        run: bash scripts/ci-reclaim-disk.sh

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          # Restore-only against the release cache ci.yml warms on main.
          shared-key: linux-release
          save-if: false

      - name: Install protoc
        uses: ./.github/actions/install-tools
        with:
          tool: protoc

      - name: Validate locked workspace metadata
        run: cargo metadata --format-version 1 --locked >/dev/null

      - name: Run full runtime performance checks
        run: |
          python3 scripts/profile_runtime.py --profile full --release --scenario all --enforce-budgets --out .benchmarks/perf-guard/runtime.json
          python3 scripts/profile_lashlang.py --iterations 2500 --profile-iterations 2500 --enforce-budgets --out .benchmarks/perf-guard/lashlang.json

      - name: Publish performance summaries
        run: |
          python3 scripts/perfreport.py .benchmarks/perf-guard/runtime.json >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/perfreport.py .benchmarks/perf-guard/lashlang.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload performance guard artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-perf-guard-${{ needs.prepare-release.outputs.release_tag }}-attempt-${{ github.run_attempt }}
          path: .benchmarks/perf-guard/*
          if-no-files-found: warn

  publish-crates:
    name: Publish crates to crates.io
    runs-on: ubuntu-latest
    # Per-layer crates.io index-visibility waits are externally paced.
    timeout-minutes: 20
    needs: [prepare-release, validate-release-ref]
    # CARGO_REGISTRY_TOKEN lives in the `main` GitHub Environment; a job must
    # declare the environment to read its secrets.
    environment: main
    permissions:
      contents: read

    steps:
      - name: Check out repository
        # Equivalent to checkout ref: ${{ needs.prepare-release.outputs.release_sha }}.
        env:
          CHECKOUT_REF: ${{ needs.prepare-release.outputs.release_sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          auth_config="${RUNNER_TEMP}/lash-git-auth-${GITHUB_JOB}.config"
          umask 077
          {
            printf '[http]\n'
            printf '\textraHeader = %s\n' "AUTHORIZATION: basic ${auth_header}"
          } > "${auth_config}"
          git config --local include.path "${auth_config}"
          git fetch --no-tags --prune --depth=1 origin "${CHECKOUT_REF}"
          git checkout --force --detach FETCH_HEAD

      - name: Validate immutable release source
        env:
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [ "${head_sha}" != "${RELEASE_SHA}" ]; then
            echo "Release checkout ${head_sha} does not match validated SHA ${RELEASE_SHA}." >&2
            exit 1
          fi

          git fetch --force origin --tags
          tag_sha="$(git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}" || true)"
          if [ -n "${tag_sha}" ] && [ "${tag_sha}" != "${RELEASE_SHA}" ]; then
            echo "Release tag ${RELEASE_TAG} points to ${tag_sha}, not validated SHA ${RELEASE_SHA}." >&2
            exit 1
          fi

      - name: Check out release tooling
        env:
          CHECKOUT_REF: ${{ needs.prepare-release.outputs.release_sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .release-tools
          git -C .release-tools remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          auth_config="${RUNNER_TEMP}/lash-git-auth-${GITHUB_JOB}.config"
          umask 077
          {
            printf '[http]\n'
            printf '\textraHeader = %s\n' "AUTHORIZATION: basic ${auth_header}"
          } > "${auth_config}"
          git -C .release-tools config --local include.path "${auth_config}"
          git -C .release-tools fetch --no-tags --prune --depth=1 origin "${CHECKOUT_REF}"
          git -C .release-tools checkout --force --detach FETCH_HEAD

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      # Publishes every publishable workspace member in topological dependency
      # layers (crates within a layer publish concurrently under a conservative
      # cap; the publisher waits for crates.io API visibility once per layer).
      # publish=false crates are skipped; versions already visible on crates.io
      # are skipped, so reruns resume after partial publication.
      #
      # --version stamps the real release version into the validated checkout's
      # manifests + lockfile before reading the graph and publishing: `main`
      # carries the 0.0.0-dev placeholder, so this is what makes the published
      # crates pin the real version. The stamp runs the validated checkout's own
      # scripts/release_version.py (the publisher script itself is the pinned
      # `.release-tools` copy).
      #
      # --no-verify: skip redundant per-crate verify-builds. The release is cut
      # from a fully CI-tested `main`; the publisher packages and uploads that
      # already-tested code directly.
      #
      # Auth: a crates.io API token in the CARGO_REGISTRY_TOKEN secret. This is
      # required for the *first* publish of brand-new crates, because crates.io
      # Trusted Publishing can only be configured on a crate that already
      # exists. Once every crate has been published once and a trusted
      # publisher (repo + this workflow) is configured for each, switch to
      # OIDC by adding `id-token: write` to this job's permissions, a
      # `rust-lang/crates-io-auth-action@v1` step (id: auth), and setting
      # CARGO_REGISTRY_TOKEN to `${{ steps.auth.outputs.token }}` — then the
      # long-lived secret can be removed.
      - name: Publish workspace to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: python3 .release-tools/scripts/publish_workspace.py --version "${RELEASE_TAG#v}"


  publish:
    name: Publish SDK release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [prepare-release, publish-crates]
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}

    steps:
      - name: Check out repository
        # Full history + tags: tag ancestry validation below needs them.
        # Equivalent to checkout ref: ${{ needs.prepare-release.outputs.release_sha }}.
        env:
          CHECKOUT_REF: ${{ needs.prepare-release.outputs.release_sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
          auth_config="${RUNNER_TEMP}/lash-git-auth-${GITHUB_JOB}.config"
          umask 077
          {
            printf '[http]\n'
            printf '\textraHeader = %s\n' "AUTHORIZATION: basic ${auth_header}"
          } > "${auth_config}"
          git config --local include.path "${auth_config}"
          git fetch --no-tags --prune origin "+refs/heads/*:refs/remotes/origin/*"
          git fetch --force --tags origin
          git fetch --no-tags origin "${CHECKOUT_REF}"
          git checkout --force --detach FETCH_HEAD

      - name: Publish validated release tag
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [ "${head_sha}" != "${RELEASE_SHA}" ]; then
            echo "Release checkout ${head_sha} does not match validated SHA ${RELEASE_SHA}." >&2
            exit 1
          fi

          git fetch --force origin main --tags
          tag_sha="$(git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}" || true)"
          if [ -n "${tag_sha}" ]; then
            if [ "${tag_sha}" != "${RELEASE_SHA}" ]; then
              echo "Release tag ${RELEASE_TAG} points to ${tag_sha}, not validated SHA ${RELEASE_SHA}." >&2
              exit 1
            fi
            echo "Release tag ${RELEASE_TAG} already points to ${RELEASE_SHA}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${RELEASE_TAG}" "${RELEASE_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        # Release notes are written manually: the release publishes with the
        # auto-generated commit list only, and a maintainer edits the release
        # body on GitHub afterward.
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
