# SPDX-License-Identifier: MIT
name: Setup mold
description: Install mold as the default linker without downloading a remote action package.

inputs:
  mold-version:
    description: The mold version to download.
    required: false
    default: 2.41.0
  make-default:
    description: Make mold the default linker.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install mold
      if: runner.os == 'Linux'
      shell: bash
      env:
        MOLD_VERSION: ${{ inputs.mold-version }}
        MAKE_DEFAULT: ${{ inputs.make-default }}
      run: |
        set -euo pipefail
        if [ "$(id -u)" -eq 0 ]; then
          sudo_cmd=()
        else
          sudo_cmd=(sudo)
        fi
        curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused \
          --location --silent --show-error --fail \
          "https://github.com/rui314/mold/releases/download/v${MOLD_VERSION}/mold-${MOLD_VERSION}-$(uname -m)-linux.tar.gz" \
          | "${sudo_cmd[@]}" tar -C /usr/local --strip-components=1 --no-overwrite-dir -xzf -
        if [ "${MAKE_DEFAULT}" = true ] && [ "$(realpath /usr/bin/ld)" != /usr/local/bin/mold ]; then
          "${sudo_cmd[@]}" ln -sf /usr/local/bin/mold "$(realpath /usr/bin/ld)"
        fi
