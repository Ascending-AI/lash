# Local composite action: authenticated shallow git fetch of the trigger
# commit, pinned detach. Replaces the copy-pasted inline checkout blocks
# (FIG-2809). The multi-fetch and deepen-loop variants in ci.yml (the lint,
# diff-hygiene and secret-scan jobs) stay hand-written: their extra fetches
# are the gate, not checkout ceremony.
name: Check out repository
description: Authenticated shallow git fetch of the trigger SHA, detach-pinned.

inputs:
  gc_auto_off:
    description: "'true' runs `git config gc.auto 0` first, so background gc cannot rewrite .git/shallow between the fetch and the checkout."
    required: false
    default: "false"
  tags:
    description: "'true' fetches --tags in addition to the trigger SHA, for gates that read tag metadata."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Check out repository
      shell: bash
      env:
        CHECKOUT_TOKEN: ${{ github.token }}
        GC_AUTO_OFF: ${{ inputs.gc_auto_off }}
        TAGS: ${{ inputs.tags }}
      run: |
        set -euo pipefail
        git init .
        if [ "${GC_AUTO_OFF}" = "true" ]; then
          git config gc.auto 0
        fi
        git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        auth_header="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w 0)"
        export GIT_CONFIG_COUNT=1
        export GIT_CONFIG_KEY_0=http.extraheader
        export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
        fetch_flags="--no-tags"
        if [ "${TAGS}" = "true" ]; then
          fetch_flags="--tags"
        fi
        git fetch ${fetch_flags} --prune --depth=1 origin "${GITHUB_SHA}"
        unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
        git checkout --detach --force "${GITHUB_SHA}"
