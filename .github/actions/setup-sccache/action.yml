name: Setup sccache
description: >-
  Install the workflow linker and an optional local compilation cache.
  Cross-run reuse belongs to bounded rust-cache target-directory writers;
  sccache never writes one GitHub cache entry per compilation object.

runs:
  using: composite
  steps:
    - name: Configure local compilation caching
      shell: bash
      run: |
        # Configure before installation: the install action's post hook can
        # start the server too. No remote cache credentials/backend are used.
        {
          echo "SCCACHE_GHA_ENABLED=false"
          echo "SCCACHE_DIR=${RUNNER_TEMP}/sccache"
          echo "SCCACHE_CACHE_SIZE=2G"
          echo "SCCACHE_LOG=warn"
          echo "SCCACHE_ERROR_LOG=${RUNNER_TEMP}/sccache-errors.log"
          echo "CARGO_INCREMENTAL=0"
          echo "RUSTC_WRAPPER=sccache"
        } >> "$GITHUB_ENV"
        echo "Compilation cache: local disk (2 GiB); cross-run dependencies: rust-cache"

    - name: Install sccache
      uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

    # RUSTFLAGS remains a workflow property, identical for producers/readers.
    - name: Install mold
      uses: ./.github/actions/setup-mold
