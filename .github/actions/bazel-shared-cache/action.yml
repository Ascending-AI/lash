name: Bazel shared cache
description: >-
  Installs the pinned Bazelisk, validates the shared pool configuration this
  job's `build-cache` environment supplies and writes the authenticated client
  credentials. Exports the resulting Bazel flags as BAZEL_SHARED_CACHE_FLAGS
  and the server's output base as BAZEL_OUTPUT_USER_ROOT, so every job on this
  runner issues one cache and execution configuration. Pass CACHE_ENDPOINT,
  CACHE_INSTANCE, KILN_EXECUTOR_RUNTIME, CACHE_CA, CACHE_CERT and CACHE_KEY in
  the calling step's `env`, and pair it with an `if: always()` step that
  removes "$RUNNER_TEMP/build-cache".

inputs:
  save-repository-cache:
    description: >-
      Whether this job uploads the Bazel repository cache it warmed. Every
      Bazel job restores it; exactly one saves it, so a cold key costs one
      upload rather than one per concurrent job.
    required: false
    default: "false"
  save-output-base:
    description: >-
      Whether this job uploads the Bazel output base it used. Every Bazel job
      restores it; exactly one saves it, so a cold key costs one upload rather
      than one per concurrent job.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install pinned Bazelisk
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --location --silent --show-error \
          https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64 \
          -o "$RUNNER_TEMP/bazel"
        printf '5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992  %s\n' \
          "$RUNNER_TEMP/bazel" | sha256sum -c -
        chmod +x "$RUNNER_TEMP/bazel"
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

    # Where the pool lives, which instance it serves and which runtime image it
    # pins are deployment facts that move when the pool is redeployed. They are
    # `build-cache` environment secrets written by the build-infra repository,
    # never literals in this repository. An empty one means the environment is
    # misconfigured, and a Bazel invocation missing an executor or advertising
    # the wrong runtime would either fail obscurely or quietly match nothing in
    # the pool, so fail here with the name that is missing.
    - name: Verify shared pool configuration
      id: pool
      shell: bash
      run: |
        set -euo pipefail
        missing=()
        for name in CACHE_ENDPOINT CACHE_INSTANCE KILN_EXECUTOR_RUNTIME \
          CACHE_CA CACHE_CERT CACHE_KEY; do
          if [ -z "${!name:-}" ]; then
            missing+=("${name}")
          fi
        done
        if [ "${#missing[@]}" -ne 0 ]; then
          echo "::error::the build-cache environment supplied no ${missing[*]};" \
            "the build-infra repository owns these secrets" >&2
          exit 1
        fi

        # A secret is stored as text and routinely arrives with a trailing
        # newline. Bazel would take one into the gRPC target and report only
        # "Invalid DNS name" against a masked value, so normalize first and
        # then check the shape rather than the value: an endpoint is the only
        # one whose syntax we can assert without printing it.
        endpoint="$(printf '%s' "${CACHE_ENDPOINT}" | tr -d '[:space:]')"
        instance="$(printf '%s' "${CACHE_INSTANCE}" | tr -d '[:space:]')"
        runtime="$(printf '%s' "${KILN_EXECUTOR_RUNTIME}" | tr -d '[:space:]')"
        echo "::add-mask::${endpoint}"
        echo "::add-mask::${instance}"
        echo "::add-mask::${runtime}"
        # Lengths are not secrets, and one failing run should tell whoever
        # writes these whether all three are wrong, not just the first.
        shape="endpoint ${#endpoint}, instance ${#instance}, runtime"
        shape="${shape} ${#runtime} characters after trimming whitespace"
        if ! [[ "${endpoint}" =~ ^grpcs?://[A-Za-z0-9.-]+:[0-9]+$ ]]; then
          echo "::error::CACHE_ENDPOINT is not grpc[s]://host:port (${shape})" >&2
          exit 1
        fi
        for pair in "CACHE_INSTANCE:${instance}" "KILN_EXECUTOR_RUNTIME:${runtime}"; do
          if [ -z "${pair#*:}" ]; then
            echo "::error::${pair%%:*} is whitespace only" >&2
            exit 1
          fi
        done
        {
          echo "endpoint=${endpoint}"
          echo "instance=${instance}"
          echo "runtime=${runtime}"
        } >> "$GITHUB_OUTPUT"

    # Bazel fetches the module graph and every crate repository before it can
    # analyse a single target. Measured on this workspace: a cold fetch plus
    # analysis is 72s and leaves a 637 MB repository cache; the same fetch with
    # that cache already present is 48s. CI wrote the cache under RUNNER_TEMP
    # and threw it away with the runner, so all three Bazel jobs paid the cold
    # price on every run. The cache is content-addressed by sha256, so a stale
    # restore can only miss, never serve wrong bytes: the restore key
    # deliberately falls back to an older lock file rather than refetch
    # everything when one pin moves.
    #
    # Exactly one job saves. The save half of `actions/cache` runs as a post
    # step, after this job's Bazel invocation has warmed the directory, which
    # is why the saving job uses the combined action rather than a save step
    # here: every step of a composite action runs before the caller's Bazel
    # command. Three concurrent jobs racing to upload the same 637 MB would
    # each spend a minute in their post step to have two of the three rejected
    # as a duplicate key.
    - name: Restore and save Bazel repository cache
      if: inputs.save-repository-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/bazel-repository
        key: >-
          bazel-repository-v1-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('MODULE.bazel.lock', 'MODULE.bazel', 'Cargo.lock') }}
        restore-keys: |
          bazel-repository-v1-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore Bazel repository cache
      if: inputs.save-repository-cache != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/bazel-repository
        key: >-
          bazel-repository-v1-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('MODULE.bazel.lock', 'MODULE.bazel', 'Cargo.lock') }}
        restore-keys: |
          bazel-repository-v1-${{ runner.os }}-${{ runner.arch }}-

    # The repository cache above only covers fetches. The output base holds the
    # server state CI throws away with the runner: the local action cache and
    # the already-materialised runfiles trees, which are most of the local
    # bookkeeping cost a merge-group run pays even at a high remote hit ratio.
    # Unlike the repository cache this content is not content-addressed, so a
    # restore CAN serve stale state; Bazel's own digest and input validation is
    # the correctness backstop, and the escape hatch is deleting the day's
    # cache entry. The key rotates daily so yesterday's base cannot pin the
    # workspace forever, and the restore prefix falls back to the previous day
    # when today's has not been written yet.
    - name: Output-base cache date bucket
      shell: bash
      run: echo "BAZEL_OUTPUT_BASE_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

    - name: Restore and save Bazel output base
      if: inputs.save-output-base == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/bazel-output
        key: >-
          bazel-output-v1-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('.bazelversion') }}-${{ env.BAZEL_OUTPUT_BASE_DATE }}
        restore-keys: |
          bazel-output-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion') }}-
          bazel-output-v1-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore Bazel output base
      if: inputs.save-output-base != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/bazel-output
        key: >-
          bazel-output-v1-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('.bazelversion') }}-${{ env.BAZEL_OUTPUT_BASE_DATE }}
        restore-keys: |
          bazel-output-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion') }}-
          bazel-output-v1-${{ runner.os }}-${{ runner.arch }}-

    - name: Configure authenticated cache
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        mkdir -p "$RUNNER_TEMP/build-cache"
        printf '%s' "$CACHE_CA" > "$RUNNER_TEMP/build-cache/ca.crt"
        printf '%s' "$CACHE_CERT" > "$RUNNER_TEMP/build-cache/client.crt"
        printf '%s' "$CACHE_KEY" > "$RUNNER_TEMP/build-cache/client.key"

    # The runner submits actions and waits: `--jobs` is a count of in-flight
    # remote actions, not of local cores, and the pool advertises eight
    # concurrent slots across two workers. `--remote_local_fallback=false`
    # keeps an unreachable pool a red job rather than a silent two-core
    # compile, which is the intended trust posture.
    # The caller passes the raw secrets in this action's step `env`, and a step
    # `env` outranks anything written to GITHUB_ENV, so the normalized values
    # travel as outputs of the step above rather than as re-exported variables.
    - name: Export shared cache flags
      shell: bash
      env:
        POOL_ENDPOINT: ${{ steps.pool.outputs.endpoint }}
        POOL_INSTANCE: ${{ steps.pool.outputs.instance }}
        POOL_RUNTIME: ${{ steps.pool.outputs.runtime }}
      run: |
        set -euo pipefail
        {
          echo "BAZEL_OUTPUT_USER_ROOT=$RUNNER_TEMP/bazel-output"
          echo "BAZEL_SHARED_CACHE_FLAGS<<EOF"
          echo "--repository_cache=$RUNNER_TEMP/bazel-repository"
          echo "--disk_cache="
          echo "--remote_executor=${POOL_ENDPOINT}"
          echo "--remote_cache=${POOL_ENDPOINT}"
          echo "--remote_instance_name=${POOL_INSTANCE}"
          echo "--tls_certificate=$RUNNER_TEMP/build-cache/ca.crt"
          echo "--tls_client_certificate=$RUNNER_TEMP/build-cache/client.crt"
          echo "--tls_client_key=$RUNNER_TEMP/build-cache/client.key"
          echo "--remote_default_exec_properties=kiln_executor_runtime=${POOL_RUNTIME}"
          echo "--remote_local_fallback=false"
          echo "--remote_download_outputs=toplevel"
          echo "--remote_timeout=600"
          echo "--jobs=32"
          echo "EOF"
        } >> "$GITHUB_ENV"
