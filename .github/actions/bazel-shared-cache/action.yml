name: Bazel shared cache
description: >-
  Installs the pinned Bazelisk, resolves the shared executor runtime and writes
  the authenticated client credentials. Exports the resulting Bazel flags as
  BAZEL_SHARED_CACHE_FLAGS and the server's output base as
  BAZEL_OUTPUT_USER_ROOT, so every job on this runner issues one cache and
  execution configuration. Pair it with an `if: always()` step that removes
  "$RUNNER_TEMP/build-cache".

runs:
  using: composite
  steps:
    - name: Install pinned Bazelisk
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --location --silent --show-error \
          https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64 \
          -o "$RUNNER_TEMP/bazel"
        printf '5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992  %s\n' \
          "$RUNNER_TEMP/bazel" | sha256sum -c -
        chmod +x "$RUNNER_TEMP/bazel"
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

    # CI submits its actions to the same execution pool a local fork uses, so
    # it must advertise the same runtime image: the scheduler matches
    # `kiln_executor_runtime` exactly. `.bazelrc` is the one place that value
    # lives and this step reads it from there;
    # `scripts/test_bazel_test_contract.py` refuses a second copy anywhere
    # under `.github/`.
    - name: Resolve shared executor runtime
      id: executor-runtime
      shell: bash
      run: |
        set -euo pipefail
        printf 'executor_runtime=%s\n' \
          "$(python3 scripts/bazel_executor_runtime.py)" >> "${GITHUB_OUTPUT}"

    - name: Configure authenticated cache
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        test -n "$CACHE_CA" && test -n "$CACHE_CERT" && test -n "$CACHE_KEY"
        mkdir -p "$RUNNER_TEMP/build-cache"
        printf '%s' "$CACHE_CA" > "$RUNNER_TEMP/build-cache/ca.crt"
        printf '%s' "$CACHE_CERT" > "$RUNNER_TEMP/build-cache/client.crt"
        printf '%s' "$CACHE_KEY" > "$RUNNER_TEMP/build-cache/client.key"

    # The runner submits actions and waits: `--jobs` is a count of in-flight
    # remote actions, not of local cores, and the pool advertises eight
    # concurrent slots across two workers. `--remote_local_fallback=false`
    # keeps an unreachable pool a red job rather than a silent two-core
    # compile, which is the intended trust posture.
    - name: Export shared cache flags
      shell: bash
      env:
        EXECUTOR_RUNTIME: ${{ steps.executor-runtime.outputs.executor_runtime }}
      run: |
        set -euo pipefail
        {
          echo "BAZEL_OUTPUT_USER_ROOT=$RUNNER_TEMP/bazel-output"
          echo "BAZEL_SHARED_CACHE_FLAGS<<EOF"
          echo "--repository_cache=$RUNNER_TEMP/bazel-repository"
          echo "--disk_cache="
          echo "--remote_executor=grpcs://178.105.21.6:8443"
          echo "--remote_cache=grpcs://178.105.21.6:8443"
          echo "--remote_instance_name=kiln"
          echo "--tls_certificate=$RUNNER_TEMP/build-cache/ca.crt"
          echo "--tls_client_certificate=$RUNNER_TEMP/build-cache/client.crt"
          echo "--tls_client_key=$RUNNER_TEMP/build-cache/client.key"
          echo "--remote_default_exec_properties=kiln_executor_runtime=${EXECUTOR_RUNTIME}"
          echo "--remote_default_exec_properties=cpu_count=4"
          echo "--remote_default_exec_properties=memory_kb=4194304"
          echo "--remote_local_fallback=false"
          echo "--remote_download_outputs=toplevel"
          echo "--remote_timeout=600"
          echo "--jobs=32"
          echo "EOF"
        } >> "$GITHUB_ENV"
