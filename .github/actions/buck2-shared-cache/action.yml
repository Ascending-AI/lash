name: Buck2 shared cache
description: >-
  Validates the shared pool configuration,
  writes authenticated client configuration, and installs the verified client.
  Pass CACHE_ENDPOINT, CACHE_INSTANCE, KILN_EXECUTOR_RUNTIME, CACHE_CA,
  CACHE_CERT and CACHE_KEY in the calling step's env. Pair it with an
  if-always cleanup step for $RUNNER_TEMP/build-cache.

runs:
  using: composite
  steps:
    - name: Verify shared pool configuration
      id: pool
      shell: bash
      run: |
        set -euo pipefail
        missing=()
        for name in CACHE_ENDPOINT CACHE_INSTANCE KILN_EXECUTOR_RUNTIME \
          CACHE_CA CACHE_CERT CACHE_KEY; do
          if [ -z "${!name:-}" ]; then
            missing+=("${name}")
          fi
        done
        if [ "${#missing[@]}" -ne 0 ]; then
          echo "::error::the build-cache environment supplied no ${missing[*]}; the build-infra repository owns these secrets" >&2
          exit 1
        fi
        endpoint="$(printf '%s' "${CACHE_ENDPOINT}" | tr -d '[:space:]')"
        instance="$(printf '%s' "${CACHE_INSTANCE}" | tr -d '[:space:]')"
        runtime="$(printf '%s' "${KILN_EXECUTOR_RUNTIME}" | tr -d '[:space:]')"
        echo "::add-mask::${endpoint}"
        echo "::add-mask::${instance}"
        echo "::add-mask::${runtime}"
        mask_multiline() {
          local name="$1" line
          while IFS= read -r line; do
            [ -z "$line" ] || echo "::add-mask::${line}"
          done <<< "${!name}"
        }
        mask_multiline CACHE_CA
        mask_multiline CACHE_CERT
        mask_multiline CACHE_KEY
        if ! [[ "${endpoint}" =~ ^grpcs://[A-Za-z0-9.-]+:[0-9]+$ ]]; then
          echo "::error::CACHE_ENDPOINT is not grpcs://host:port" >&2
          exit 1
        fi
        if [ -z "${instance}" ] || [ -z "${runtime}" ]; then
          echo "::error::CACHE_INSTANCE and KILN_EXECUTOR_RUNTIME must contain non-whitespace text" >&2
          exit 1
        fi
        {
          echo "address=${endpoint#*://}"
          echo "instance=${instance}"
          echo "runtime=${runtime}"
        } >> "$GITHUB_OUTPUT"

    - name: Configure authenticated Buck2 client
      shell: bash
      env:
        POOL_ADDRESS: ${{ steps.pool.outputs.address }}
        POOL_INSTANCE: ${{ steps.pool.outputs.instance }}
        POOL_RUNTIME: ${{ steps.pool.outputs.runtime }}
      run: |
        set -euo pipefail
        umask 077
        mkdir -p "$RUNNER_TEMP/build-cache"
        printf '%s' "$CACHE_CA" > "$RUNNER_TEMP/build-cache/ca.crt"
        {
          printf '%s\n' "$CACHE_CERT"
          printf '%s\n' "$CACHE_KEY"
        } > "$RUNNER_TEMP/build-cache/client.pem"
        # Copied verbatim from kiln_tag_value in the kiln CLI: a tag value
        # keeps only [A-Za-z0-9._-] and writes every other byte as %XX.
        tag_value() {
          local LC_ALL=C value=$1 out='' char i
          for (( i = 0; i < ${#value}; i++ )); do
            char=${value:i:1}
            case $char in
              [A-Za-z0-9._-]) out+=$char ;;
              *) printf -v char '%%%02X' "'$char"; out+=$char ;;
            esac
          done
          printf '%s' "$out"
        }
        identity="repo:$(tag_value lash)|lane:$(tag_value "${GITHUB_WORKFLOW}/${GITHUB_JOB}")|user:$(tag_value "${GITHUB_ACTOR}")|ci"
        cat > .buckconfig.local <<EOF
        [buck2_re_client]
        engine_address = ${POOL_ADDRESS}
        action_cache_address = ${POOL_ADDRESS}
        cas_address = ${POOL_ADDRESS}
        tls_ca_certs = $RUNNER_TEMP/build-cache/ca.crt
        tls_client_cert = $RUNNER_TEMP/build-cache/client.pem
        instance_name = ${POOL_INSTANCE}
        http_headers = baggage: enduser.id=${identity//%/%25}
        execution_concurrency_limit = 32
        [kiln]
        executor_runtime = ${POOL_RUNTIME}
        EOF

    - name: Install pinned Buck2 client and tools
      shell: bash
      run: |
        set -euo pipefail
        export KILN_REAL_CARGO="$(command -v cargo)"
        client="$(python3 tools/buck2/bootstrap.py)"
        test -x "$client"
        echo "$(dirname "$client")" >> "$GITHUB_PATH"
        echo "KILN_REAL_CARGO=${KILN_REAL_CARGO}" >> "$GITHUB_ENV"
