[package]
name = "lash-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lash-dialect-typescript = { path = "../crates/lash-dialect-typescript" }
lash-ext-helper-compiler = { path = "../crates/lash-ext-helper-compiler" }
lash-kernel-dialect = { path = "../crates/lash-kernel-dialect" }
lash-kernel-check = { path = "../crates/lash-kernel-check" }
arbitrary = "1"
lash-vocabulary = { package = "lash-internal-vocabulary", path = "../crates/lash-vocabulary" }
lash-kernel-doc = { path = "../crates/lash-kernel-doc" }
lash-kernel-state = { path = "../crates/lash-kernel-state" }
lash-checkpoint-encoder = { package = "lash-internal-checkpoint-encoder", path = "../crates/lash-checkpoint-encoder" }
lash-kernel-conformance = { path = "../crates/lash-kernel-conformance" }
lash-internal-protocol-types = { path = "../crates/lash-protocol-types", features = ["schema-validation"] }

[[bin]]
name = "attachment_metadata"
path = "fuzz_targets/attachment_metadata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kernel_tiers"
path = "fuzz_targets/kernel_tiers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "checkpoint_tokens"
path = "fuzz_targets/checkpoint_tokens.rs"
test = false
doc = false
bench = false

[[bin]]
name = "checkpoint_envelopes"
path = "fuzz_targets/checkpoint_envelopes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "typescript_admission"
path = "fuzz_targets/typescript_admission.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
