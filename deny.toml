    { crate = "windows_i686_gnu@0.48.5", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on windows targets 0.52" },
    { crate = "windows_i686_msvc@0.48.5", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on windows targets 0.52" },
    { crate = "windows_x86_64_gnu@0.48.5", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on windows targets 0.52" },
    { crate = "windows_x86_64_gnullvm@0.48.5", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on windows targets 0.52" },
    { crate = "windows_x86_64_msvc@0.48.5", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on windows targets 0.52" },
    # schemars 0.8.22 is the workspace API. Remove when rmcp supports the
    # workspace schemars major or the workspace can migrate without an API dance.
    { crate = "schemars@0.8.22", reason = "Lash workspace API remains on schemars 0.8 while rmcp 1.8.0 requires 1.2; remove after rmcp/workspace major convergence" },
    # syn 3.0.3 is pulled by rmcp's schemars 1.x derive stack. Remove when
    # that upstream stack no longer needs syn 3.
    { crate = "syn@3.0.3", reason = "rmcp 1.8.0 schemars 1.x derive stack requires syn 3; remove when upstream converges on syn 2" },
]
skip-tree = []

[licenses]
version = 2
# Explicitly permissive baseline for crates.io dependencies; add a narrowly
# scoped exception or clarification when a future crate uses another license.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# MIT No Attribution: borrow-or-share 0.2.4, pulled by fluent-uri through
# referencing for the jsonschema dev dependency. Scoped to that crate; a new
# MIT-0 dependent still fails until it is reviewed here.
exceptions = [
    { allow = ["MIT-0"], crate = "borrow-or-share" },
]
confidence-threshold = 0.8

[licenses.private]
# The local-only Restate worker runbook is not published and has no manifest
# license; its dependencies remain checked while the private root is ignored.
ignore = true

[sources]
# Git sources and other registries require explicit review.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# FIG-4906 (U02) removes this entry when a publishable crate replaces the git pin.
allow-git = ["https://github.com/SamGalanakis/sdk-rust"]
required-git-spec = "rev"
