# Dependency policy for the locked Lash workspace graph.

[advisories]
version = 2
# Current main carried RUSTSEC-2026-0258 (h2 0.4.15); Cargo.lock now moves to
# current main carries h2 0.4.15 and the quick-xml advisories below; all are
# recorded until their owning upstream dependency permits a patched version.
ignore = [
    { id = "RUSTSEC-2026-0258", reason = "h2 0.4.15 is selected by the current hyper graph; remove when the locked graph moves to the patched h2 version" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.39.4 is required by object_store 0.13.2; remove when object_store permits quick-xml 0.41 or newer" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.39.4 is required by object_store 0.13.2; remove when object_store permits quick-xml 0.41 or newer" },
]

[bans]
# New duplicate versions fail. The three existing, reviewed exceptions below
# remain visible in this file and must be removed when their owners converge.
multiple-versions = "deny"
wildcards = "allow"

skip = [
    # Existing transitive duplicate; revisit when jsonschema's dependency
    # graph converges on bit-set 0.8.
    { crate = "bit-set@0.5.3", reason = "jsonschema 0.18.3 retains bit-set 0.5; remove when its upstream graph converges" },
    { crate = "bit-vec@0.6.3", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on bit-vec 0.8" },
    { crate = "bitflags@1.3.2", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on bitflags 2" },
    { crate = "block-buffer@0.10.4", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on block-buffer 0.12" },
