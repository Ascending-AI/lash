    { crate = "windows_x86_64_msvc@0.48.5", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on windows targets 0.52" },
    # reqwest 0.12.28 is owned by object_store 0.13.2. Remove when
    # object_store supports the workspace reqwest 0.13 line.
    { crate = "reqwest@0.12.28", reason = "object_store 0.13.2 still requires reqwest 0.12; remove when object_store supports reqwest 0.13" },
    # schemars 0.8.22 is the workspace API. Remove when rmcp supports the
    # workspace schemars major or the workspace can migrate without an API dance.
    { crate = "schemars@0.8.22", reason = "Lash workspace API remains on schemars 0.8 while rmcp 1.8.0 requires 1.2; remove after rmcp/workspace major convergence" },
    # syn 3.0.3 is pulled by rmcp's schemars 1.x derive stack. Remove when
    # that upstream stack no longer needs syn 3.
    { crate = "syn@3.0.3", reason = "rmcp 1.8.0 schemars 1.x derive stack requires syn 3; remove when upstream converges on syn 2" },
]
skip-tree = []

[licenses]
version = 2
# Explicitly permissive baseline for crates.io dependencies; add a narrowly
# scoped exception or clarification when a future crate uses another license.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
# The local-only Restate worker runbook is not published and has no manifest
# license; its dependencies remain checked while the private root is ignored.
ignore = true

[sources]
# The workspace currently consumes registry crates from crates.io only. Git
# sources and any other registry must be reviewed explicitly before use.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
