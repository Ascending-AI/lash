# Dependency policy for the locked Lash workspace graph.

[advisories]
version = 2
# Current main carries h2 0.4.15; the ignore is recorded until its owning
# upstream dependency permits a patched version.
ignore = [
    { id = "RUSTSEC-2026-0258", reason = "h2 0.4.15 is selected by the current hyper graph; remove when the locked graph moves to the patched h2 version" },
]

[bans]
# New duplicate versions fail. The existing, reviewed exceptions below
# remain visible in this file and must be removed when their owners converge.
multiple-versions = "deny"
wildcards = "allow"

skip = [
    { crate = "base64@0.22.1", reason = "hyper-util 0.1.20 and jsonwebtoken 10.4.0 still require base64 0.22; remove when upstream dependency graph converges on base64 0.23" },
    { crate = "block-buffer@0.10.4", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on block-buffer 0.12" },
    { crate = "compact_str@0.7.1", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on compact_str 0.9" },
    { crate = "cpufeatures@0.2.17", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on cpufeatures 0.3" },
    { crate = "crypto-common@0.1.7", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on crypto-common 0.2" },
    { crate = "darling@0.20.11", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on darling 0.23" },
    { crate = "darling_core@0.20.11", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on darling_core 0.23" },
    { crate = "darling_macro@0.20.11", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on darling_macro 0.23" },
    { crate = "digest@0.10.7", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on digest 0.11" },
    { crate = "foldhash@0.1.5", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on foldhash 0.2" },
    { crate = "getrandom@0.2.17", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on getrandom 0.4" },
    { crate = "getrandom@0.3.4", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on getrandom 0.4" },
    { crate = "hashbrown@0.14.5", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on hashbrown 0.17" },
    { crate = "hashbrown@0.15.5", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on hashbrown 0.17" },
    { crate = "hashbrown@0.16.1", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on hashbrown 0.17" },
    { crate = "itertools@0.14.0", reason = "prost-derive 0.14.4 still requires itertools 0.14; remove when upstream dependency graph converges on itertools 0.15" },
    { crate = "md-5@0.10.6", reason = "sqlx-postgres 0.8.6 still requires md-5 0.10; remove when upstream dependency graph converges on md-5 0.11" },
    { crate = "phf@0.11.3", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on phf 0.12" },
    { crate = "phf_shared@0.11.3", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on phf_shared 0.12" },
    { crate = "r-efi@5.3.0", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on r-efi 6" },
    { crate = "rand@0.8.7", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on rand 0.10" },
    { crate = "rand@0.9.5", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on rand 0.10" },
    { crate = "rand_chacha@0.3.1", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on rand_chacha 0.9" },
    { crate = "rand_core@0.6.4", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on rand_core 0.10" },
    { crate = "rand_core@0.9.5", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on rand_core 0.10" },
    { crate = "redox_syscall@0.5.18", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on redox_syscall 0.9" },
    { crate = "regress@0.10.5", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on regress 0.11" },
    { crate = "schemars_derive@0.8.22", reason = "pre-existing transitive duplicate owned by the workspace schemars 0.8 and rmcp schemars 1.x stacks; remove after major convergence" },
    { crate = "serde_derive_internals@0.29.1", reason = "pre-existing transitive duplicate owned by the workspace schemars 0.8 and rmcp schemars 1.x stacks; remove after major convergence" },
    { crate = "sha2@0.10.9", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on sha2 0.11" },
    { crate = "siphasher@0.3.11", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on siphasher 1" },
    { crate = "strum@0.27.2", reason = "croner 3.0.1 and restate-sdk-shared-core 7.0.3 still require strum 0.27; remove when upstream dependency graph converges on strum 0.28" },
    { crate = "strum_macros@0.27.2", reason = "croner 3.0.1 and restate-sdk-shared-core 7.0.3 still require strum 0.27; remove when upstream dependency graph converges on strum 0.28" },
    { crate = "windows-sys@0.48.0", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on windows-sys 0.61" },
    { crate = "windows-sys@0.52.0", reason = "pre-existing transitive duplicate; remove when upstream dependency graph converges on windows-sys 0.61" },
